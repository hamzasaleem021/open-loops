      <button class="icon-btn" id="settings-btn" type="button" data-action="open-settings" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.4"/><path d="M12.5 8c0-.3 0-.7-.1-1l1.4-1.1-1-1.7-1.7.7c-.5-.4-1-.7-1.6-.9L9.2 2H6.8l-.3 2c-.6.2-1.1.5-1.6.9l-1.7-.7-1 1.7L3.6 7C3.5 7.3 3.5 7.7 3.5 8s0 .7.1 1l-1.4 1.1 1 1.7 1.7-.7c.5.4 1 .7 1.6.9l.3 2h2.4l.3-2c.6-.2 1.1-.5 1.6-.9l1.7.7 1-1.7L12.4 9c.1-.3.1-.7.1-1z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn" id="archive-btn" type="button" data-action="set-tab" data-tab="done" title="Archive" aria-label="Archive">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 4h10l-.7 8.5H3.7L3 4Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M2.5 4h11V2.7h-11V4ZM6 7.2h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="profile-btn idle" id="profile-btn" type="button" data-action="open-profile" title="Your head" aria-label="Your head and account">
        <span class="profile-face" aria-hidden="true"></span>
        <span class="profile-dot" aria-hidden="true"></span>
      </button>
    </div>
  </header>

  <div class="app-body">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="app-main"></main>
    <aside class="context-panel" id="context-panel"></aside>
  </div>
</div>

<nav class="bottom-nav" id="bottom-nav"></nav>

<div class="overlay-root" id="overlay-root"></div>
<div id="auth-gate-root"></div>
<div id="onboarding-root"></div>
<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<!-- Sync error banner (Morning Brief pattern) -->
<div class="sync-error-banner" id="sync-error-banner" style="display:none;">
  <div class="sync-error-msg">
    <strong>Still saving.</strong> Kept safely on this device.
  </div>
  <button class="sync-error-retry" data-action="sync-retry">Retry</button>
  <button class="sync-error-dismiss" data-action="dismiss-sync-banner">✕</button>
</div>

<script>
(() => {
  const CFG = window.OL_CONFIG || {};
  const STORAGE_KEY_BASE   = CFG.STORAGE_KEY ? CFG.STORAGE_KEY + '_v2'          : 'open_loops_data_v2';
  const ONBOARDING_KEY_BASE = CFG.STORAGE_KEY ? CFG.STORAGE_KEY + '_onboarded'  : 'open_loops_onboarded';
  const THEME_KEY      = CFG.STORAGE_KEY ? CFG.STORAGE_KEY + '_theme'      : 'open_loops_theme';
  const LOOP_CAP_KEY_BASE   = CFG.STORAGE_KEY ? CFG.STORAGE_KEY + '_cap'        : 'open_loops_cap';
  const REENTRY_KEY_BASE    = CFG.STORAGE_KEY ? CFG.STORAGE_KEY + '_reentry_dismissed' : 'open_loops_reentry_dismissed';
  // The account last signed in on this phone (its id only), so the first
  // frame can show its saved loops. Removed on sign-out.
  const LAST_USER_KEY       = CFG.STORAGE_KEY ? CFG.STORAGE_KEY + '_last_user'  : 'open_loops_last_user';
  // The tab for this sitting only (sessionStorage): a reload stays put, a
  // fresh open starts on Active.
  const TAB_KEY_BASE        = CFG.STORAGE_KEY ? CFG.STORAGE_KEY + '_tab'        : 'open_loops_tab';
  const LEGACY_STORAGE_KEY  = STORAGE_KEY_BASE;
  const LEGACY_STORAGE_QUARANTINE_KEY = `${STORAGE_KEY_BASE}_legacy_unscoped`;
  const IS_FILE = location.protocol === 'file:';

  // Shown in Settings so you can tell which version a phone is running.
  // Bump together with CACHE in open-loops-sw.js on every release.
  const APP_VERSION = { number: 28, date: '24 Oct 2026' };
  let swRegistration = null;
  let swState = 'pending';   // 'ready' once the service worker registers, 'failed' if it can’t

  // UX constraints
  const MAX_LOOP_TEXT_LEN = 500;
  const ALLOWED_LOOP_CAPS = [3, 5, 7];
  const DEFAULT_LOOP_CAP  = 5;
  const DEFAULT_TOAST_MS  = 4000;

  // Display labels — drive all user-visible copy from one map so they stay
  // consistent across tabs, empty states, and chips. Internal status keys
  // stay as 'inbox' / 'active' / 'waiting' / 'released' for backwards
  // compat with existing localStorage and the Supabase schema.
  const TAB_LABEL = {
    inbox:    'Inbox',
    active:   'Active',
    waiting:  'Parked',
    released: 'Closed',
  };

  function supabaseConfigIssue() {
    const url = String(CFG.SUPABASE_URL || '').trim();
    const key = String(CFG.SUPABASE_KEY || '').trim();
    const placeholders = ['YOUR_PROJECT', 'YOUR_PUBLISHABLE_KEY', 'YOUR_SUPABASE', 'YOUR_ANON_KEY'];

    if (!url || !key) return 'Supabase URL and publishable key are required before anyone can sign in.';
    if (placeholders.some(token => url.includes(token) || key.includes(token))) {
      return 'open-loops-config.js still contains placeholder Supabase values.';
    }

    try {
      const parsed = new URL(url);
      if (parsed.protocol !== 'https:' || !parsed.hostname.endsWith('.supabase.co')) {
        return 'Supabase URL should look like https://your-project.supabase.co.';
      }
    } catch (_) {
      return 'Supabase URL is not a valid URL.';
    }

    if (key.length < 20) return 'Supabase publishable key looks incomplete.';
    return null;
  }

  function hasSupabaseCfg() {
    return !supabaseConfigIssue();
  }

  // A sign-in email that didn’t go out, in plain words. The raw error goes
  // to the console.
  function linkErrorText(e) {
    console.warn('[open-loops] Sign-in link failed:', e);
    const raw = String((e && (e.message || e.code)) || '').toLowerCase();
    if (!navigator.onLine || /fetch|network/.test(raw)) return 'Couldn’t send the link. Check your internet connection and try again.';
    if (/rate|too many|seconds/.test(raw)) return 'Too many sign-in emails in a row. Wait a minute, then try again.';
    if (/valid|invalid|email/.test(raw) && !/sign-in/.test(raw)) return 'That email address doesn’t look right. Check it and try again.';
    if (/sign-in isn’t|couldn’t connect/i.test(String(e && e.message))) return e.message;
    return 'Couldn’t send the link. Try again in a minute.';
  }

  // What people see when sign-in can’t start. The technical reason goes to
  // the console for whoever runs this copy of the app.
  function supabaseClientIssue() {
    if (!hasSupabaseCfg()) {
      console.warn('[open-loops] Sign-in is not configured:', supabaseConfigIssue());
      return 'Sign-in isn’t available right now. Try again a little later.';
    }
    if (!window.supabase) return 'Open Loops couldn’t connect. Check your internet connection, then reload the page.';
    return null;
  }

  const VALID_KINDS = new Set(['do', 'decide', 'ask', 'schedule', 'let_go']);
  const VALID_STATUSES = new Set(['active', 'waiting', 'released', 'inbox']);

  const kindMeta = {
    do:       { label: 'Do',       action: 'Done',            question: 'What is the one next visible step?', helper: 'Concrete enough that you could start right now without planning.' },
    decide:   { label: 'Decide',   action: 'I decided',       question: 'What decision needs to be made?',    helper: 'Name the choice in one line.' },
    ask:      { label: 'Ask',      action: 'Reach out',       question: 'Who do you need something from?',    helper: 'One person, one ask. Nothing more.' },
    schedule: { label: 'Schedule', action: 'Add to calendar', question: 'What needs time on a calendar?',     helper: 'Give it a day and a time.' },
    let_go:   { label: 'Let go',   action: 'Let go',          question: 'What are you choosing to release?',  helper: 'Letting go counts as an ending.' },
    inbox:    { label: 'Inbox', action: 'Sort it',    question: '',                                   helper: '' }
  };

  function nowIso() { return new Date().toISOString(); }
  function uid(p) {
    if (window.crypto && typeof window.crypto.randomUUID === 'function') return `${p}-${window.crypto.randomUUID()}`;
    return `${p}-${Math.random().toString(36).slice(2,9)}-${Date.now().toString(36)}`;
  }
  // Position is a double precision ordering value: bigger = higher in the
  // list. New rows get the current epoch-seconds so they land at the top.
  // Reorder computes midpoints between neighbors, so we rarely need to
  // rebalance (at millisecond resolution, ~50 drops between the same two
  // items before we run out of float headroom — still fine in practice).
  function nowPosition() { return Date.now() / 1000; }

  function seedState() {
    return {
      version: 2,
      lastLoopId: null,
      activeTab: 'now',
      loops: []
    };
  }

  function mk(id, rawText, kind, status, promptAnswer) {
    const t = nowIso();
    return { id, rawText, kind, status, promptAnswer, position: nowPosition(), createdAt: t, updatedAt: t };
  }

  function sanitize(loop) {
    // Fall back to epoch-of-createdAt so existing localStorage data from
    // before the position column gets a deterministic order on first load.
    let pos = typeof loop.position === 'number' && isFinite(loop.position)
      ? loop.position
      : (loop.createdAt ? new Date(loop.createdAt).getTime() / 1000 : nowPosition());
    return {
      id: loop.id || uid('l'),
      rawText: (loop.rawText || 'Untitled').trim().slice(0, MAX_LOOP_TEXT_LEN),
      kind: VALID_KINDS.has(loop.kind) ? loop.kind : null,
      status: VALID_STATUSES.has(loop.status) ? loop.status : 'active',
      promptAnswer: (loop.promptAnswer || '').trim().slice(0, MAX_LOOP_TEXT_LEN),
      position: pos,
      createdAt: loop.createdAt || nowIso(),
      updatedAt: loop.updatedAt || nowIso(),
      completedAt: loop.completedAt || loop.completed_at || null,
      wakeAt: validIso(loop.wakeAt !== undefined ? loop.wakeAt : loop.wake_at),
      details: cleanDetails(loop.details)
    };
  }

  function validIso(value) {
    if (!value) return null;
    const t = new Date(value).getTime();
    return Number.isFinite(t) ? new Date(t).toISOString() : null;
  }

  // details: small, known facts about how a loop is moving or how it ended.
  //   sentAt   — an Ask was sent; it now waits on someone else
  //   sentText — the message as it was sent (follow-ups refer back to it)
  //   nudges   — follow-ups sent for that Ask
  //   steps    — next steps finished on a Do
  //   decision — what a Decide loop settled on
  //   outcome  — 'done' or 'let_go' once closed (rings vs pebbles)
  //   origin   — 'decision' when a Do was born from a decision
  //   at       — when a Schedule loop happens
  //   calAt    — when it was sent to a calendar (it then asks "On your calendar?")
  function cleanDetails(d) {
    const src = d && typeof d === 'object' && !Array.isArray(d) ? d : {};
    const out = {};
    const sentAt = validIso(src.sentAt);
    if (sentAt) out.sentAt = sentAt;
    if (sentAt && typeof src.sentText === 'string' && src.sentText.trim()) out.sentText = src.sentText.trim().slice(0, MAX_LOOP_TEXT_LEN);
    const nudges = parseInt(src.nudges, 10);
    if (nudges > 0) out.nudges = Math.min(nudges, 99);
    const steps = parseInt(src.steps, 10);
    if (steps > 0) out.steps = Math.min(steps, 999);
    if (typeof src.decision === 'string' && src.decision.trim()) out.decision = src.decision.trim().slice(0, MAX_LOOP_TEXT_LEN);
    if (src.outcome === 'done' || src.outcome === 'let_go') out.outcome = src.outcome;
    if (src.origin === 'decision') out.origin = 'decision';
    const at = validIso(src.at);
    if (at) out.at = at;
    const calAt = validIso(src.calAt);
    if (calAt) out.calAt = calAt;
    return out;
  }

  function isLetGo(loop) {
    if (!loop) return false;
    if (loop.details && loop.details.outcome) return loop.details.outcome === 'let_go';
    return loop.kind === 'let_go';
  }

  // ── SCHEDULE ──
  // A Schedule loop has one time: when it happens (details.at). Everything
  // else follows from it, and only schedulePatch() writes it:
  //   • the nudge goes out at exactly that time (wake_at = at), never before;
  //   • until then it waits in Parked, and at that moment it comes back to
  //     Up next together with the nudge;
  //   • once the time has passed, its card asks "Did it happen?".
  // "Not yet" on a Schedule loop means "it’s at a different time", so it
  // opens the same day-and-time picker, never quick presets.
  // Version 27 nudged 30 minutes early. Loops it set still carry that wake
  // time until the SQL moves it, so it’s still recognised (and still works).
  const LEGACY_EARLY_MIN = 30;
  function scheduleAt(loop) {
    const at = loop && loop.kind === 'schedule' && loop.details && loop.details.at;
    const t = at ? new Date(at).getTime() : NaN;
    return Number.isFinite(t) ? t : null;
  }
  // When a Schedule loop nudges: at its time, exactly. Null once it’s past.
  function scheduleNudgeFor(atMs, now = Date.now()) {
    return atMs > now ? new Date(atMs).toISOString() : null;
  }
  function schedulePassed(loop) { const t = scheduleAt(loop); return t !== null && t <= Date.now(); }
  // Was this loop’s wake time put there by its event time? (At the time, or
  // version 27's 30 minutes early.)
  function wakeIsScheduleNudge(loop) {
    const t = scheduleAt(loop);
    if (t === null || !loop.wakeAt) return false;
    const w = new Date(loop.wakeAt).getTime();
    return Math.abs(w - t) < 1000 || Math.abs(w - (t - LEGACY_EARLY_MIN * 60000)) < 1000;
  }
  // The one place a Schedule loop’s time is set. Returns the patch: the time,
  // the nudge (wake) time that follows from it, and where the loop waits.
  //   opts.status — a route the person chose (Define’s Up next / Park);
  //   otherwise: Parked until its time.
  function schedulePatch(loop, atIso, opts = {}) {
    const details = { ...((loop && loop.details) || {}) };
    if (atIso) {
      if (details.at !== atIso) delete details.calAt;   // a new time: the calendar has the old one
      details.at = atIso;
    } else {
      delete details.at;
      delete details.calAt;
    }
    delete details.outcome;
    const wakeAt = atIso ? scheduleNudgeFor(new Date(atIso).getTime()) : null;
    let status = opts.status || (atIso ? (wakeAt ? 'waiting' : 'active') : (loop && loop.status === 'waiting' ? 'waiting' : 'active'));
    if (status === 'waiting' && atIso && !wakeAt) status = 'active';   // its time has passed: nothing to wait for
    return { details: cleanDetails(details), wakeAt, status, completedAt: null };
  }
  // A day and a time, both required (no 9:00 filled in behind your back).
  function fromScheduleInputs(dateStr, timeStr) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(dateStr || '') || !/^\d{1,2}:\d{2}/.test(timeStr || '')) return null;
    return fromLocalInputs(dateStr, timeStr);
  }
  function readSchedulePick(prefix) {
    const d = fromScheduleInputs(document.getElementById(`${prefix}-date`)?.value, document.getElementById(`${prefix}-time`)?.value);
    if (!d) { toast('Pick a day and a time.'); return null; }
    if (d.getTime() <= Date.now()) { toast('Pick a time that is still ahead.'); return null; }
    return d.toISOString();
  }
  // The honest line under every Schedule picker: what will actually happen.
  function scheduleNoteText(atMs) {
    if (atMs === null || !Number.isFinite(atMs)) return 'Pick a day and a time. The nudge comes right then.';
    if (atMs <= Date.now()) return 'That time has already passed. Pick one that is still ahead.';
    const when = formatWake(new Date(atMs).toISOString());
    let nudges = false;
    try { nudges = nudgeState() === 'on' && Push.prefs().wakeups !== false; } catch (_) {}
    return nudges
      ? `The nudge comes right then: ${when}.`
      : `It comes back to Up next ${when}. Nudges are off on this phone, so turn them on in Settings to get a ping too.`;
  }
  // Day + time fields for a Schedule picker. Empty unless there’s a real
  // time to start from (one already set, or read from the note).
  function scheduleFieldsHtml(prefix, start, autofocus = false) {
    const af = autofocus ? '' : ' no-autofocus';
    const atMs = start ? start.getTime() : null;
    return `
      <div class="act-row">
        ${actField(`${prefix}-date`, 'Day', `<input class="big-input act-input sched-input${af}" id="${prefix}-date" type="date" value="${start ? localDateValue(start) : ''}" min="${localDateValue(new Date())}" data-sched="${prefix}">`)}
        ${actField(`${prefix}-time`, 'Time', `<input class="big-input act-input sched-input no-autofocus" id="${prefix}-time" type="time" value="${start ? localTimeValue(start) : ''}" data-sched="${prefix}">`)}
      </div>
      <p class="input-hint sched-note" id="${prefix}-note" aria-live="polite">${esc(scheduleNoteText(atMs))}</p>`;
  }
  function refreshScheduleNote(input) {
    const prefix = input && input.dataset.sched;
    if (!prefix) return;
    const d = fromScheduleInputs(document.getElementById(`${prefix}-date`)?.value, document.getElementById(`${prefix}-time`)?.value);
    const note = document.getElementById(`${prefix}-note`);
    if (note) note.textContent = scheduleNoteText(d ? d.getTime() : null);
  }

  // ── STATE ──
  let data = seedState();
  let view = {
    activeTab: 'now',
    overlay: null,
    highlightedId: null,
    reentryDismissedFor: null,
    expanded: false,
    syncStatus: 'idle',
    syncText: 'Sync',
    inlineEditId: null,
    draggingLoopId: null,
    // Auth gate state
    authGateSent: false,     // magic link sent confirmation
    authGateEmail: '',       // email being typed
    // Onboarding state
    onboardingStep: -1,      // -1 = hidden; 0-3 = active step
    // Theme: 'dark' | 'light'. Persisted in localStorage.
    theme: 'dark',
    // How many Active loops to show before "Show more". User-configurable.
    loopCap: DEFAULT_LOOP_CAP,
    // Element to restore focus to when current overlay closes.
    overlayOpenerEl: null,
  };
  let toastTimer = null;
  let fabTucked = false;   // the Capture button, tucked away while scrolling down
  let shownActiveIds = null; // Active loops last on screen (see noteHiddenActive)
  let deferredInstallPrompt = null; // set by 'beforeinstallprompt' event
  let currentLocalUserId = null;
  // Set to true once Sync.init() resolves so we don’t flash the lock screen
  // during the async auth check on cold start.
  let authReady = false;

  // ── BOOT ──
  // What the app knows about your loops right now. "Not loaded yet" is its
  // own state, never an empty list: nothing on screen may say a list is empty
  // until real data says so.
  //   starting    — which account is this? (splash)
  //   loading     — signed in, nothing saved on this phone yet (loop bars)
  //   cached      — showing the copy saved on this phone; the server is checking
  //   ready       — the server has answered (or nobody is signed in)
  //   unreachable — nothing saved here and the server couldn’t be reached
  // Loops that exist are always shown; only emptiness waits for the truth.
  let bootState = 'starting';
  function dataKnown() { return bootState === 'cached' || bootState === 'ready'; }
  function hideSplash() {
    const s = document.getElementById('boot-splash');
    if (!s || s.dataset.leaving) return;
    s.dataset.leaving = '1';
    s.classList.add('gone');
    setTimeout(() => s.remove(), 260);
  }
  function setBoot(state) {
    if (state !== 'starting') hideSplash();
    if (bootState === state) return;
    bootState = state;
    // Only the list, its counts and the header: an open sheet (someone typing
    // a capture while the first sync runs) must not be re-rendered.
    try { renderHeader(); renderBottomNav(); renderMain(); } catch (_) {}
  }
  // A saved copy with loops in it is real data; an empty one proves nothing
  // (it could have been saved before the first sync), so it waits for the server.
  // Always redraws: the saved copy may belong to a different account than the
  // one on screen, even when both boot states are the same.
  function bootFromSavedCopy() {
    const next = data.loops.length ? 'cached' : 'loading';
    if (bootState !== next) { setBoot(next); return; }
    hideSplash();
    try { renderHeader(); renderBottomNav(); renderMain(); } catch (_) {}
  }

  function rememberAccount(id) { try { if (id) localStorage.setItem(LAST_USER_KEY, id); } catch (_) {} }
  function forgetAccount() { try { localStorage.removeItem(LAST_USER_KEY); } catch (_) {} }
  function rememberedAccount() { try { return localStorage.getItem(LAST_USER_KEY) || null; } catch (_) { return null; } }
  // Arriving from a sign-in link: the link may be for a different account
  // than the one this phone remembers, so wait for the real session.
  function arrivedFromSignInLink() {
    try {
      if (/(^|[#&])(access_token|refresh_token|error)=/.test(location.hash.slice(1))) return true;
      const q = new URLSearchParams(location.search);
      return q.has('code') || q.has('token_hash') || q.has('error_description');
    } catch (_) { return false; }
  }
  // Magic-link cooldown: Supabase rate-limits magic link sends (3/hour/email
  // on free tier). A user tapping "Send link" repeatedly can lock themselves
  // out. Enforce a 60s client-side cooldown between sends.
  const MAGIC_LINK_COOLDOWN_MS = 60000;
  let lastMagicLinkAt = 0;

  // ── PERSIST ──
  function scopedKey(base, userId = currentLocalUserId) {
    return userId ? `${base}:${userId}` : null;
  }

  function setLocalUser(user) {
    currentLocalUserId = user && user.id ? user.id : null;
  }

  function resetLocalAppState() {
    data = seedState();
    view.activeTab = 'now';
    view.overlay = null;
    view.highlightedId = null;
    view.reentryDismissedFor = null;
    view.expanded = false;
    view.inlineEditId = null;
    view.draggingLoopId = null;
    view.overlayOpenerEl = null;
    view.onboardingStep = -1;
    view.loopCap = DEFAULT_LOOP_CAP;
  }

  function quarantineLegacyLocalData() {
    let moved = false;
    try {
      const raw = localStorage.getItem(LEGACY_STORAGE_KEY);
      if (!raw) return;
      const existing = localStorage.getItem(LEGACY_STORAGE_QUARANTINE_KEY);
      if (!existing) localStorage.setItem(LEGACY_STORAGE_QUARANTINE_KEY, raw);
      localStorage.removeItem(LEGACY_STORAGE_KEY);
      moved = true;
    } catch(e) {}
    return moved;
  }

  function hasLegacyQuarantinedData() {
    try {
      return !!(
        localStorage.getItem(LEGACY_STORAGE_QUARANTINE_KEY) ||
        localStorage.getItem(LEGACY_OFFLINE_QUEUE_QUARANTINE_KEY) ||
        localStorage.getItem(LEGACY_DEAD_QUEUE_QUARANTINE_KEY)
      );
    } catch(e) { return false; }
  }

  function load() {
    if (!currentLocalUserId) {
      resetLocalAppState();
      return;
    }
    resetLocalAppState();
    try {
      const raw = localStorage.getItem(scopedKey(STORAGE_KEY_BASE));
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.loops)) {
          data = { version: 2, lastLoopId: parsed.lastLoopId || null, activeTab: 'now', loops: parsed.loops.map(sanitize) };
        }
      }
    } catch(e) {}
    // A fresh open always starts on Active, the app’s home. Only a reload
    // within the same sitting (an update, a pull-to-refresh) keeps the tab.
    view.activeTab = sittingTab() || 'now';
    // Reentry dismissal (survives reload)
    try {
      const r = localStorage.getItem(scopedKey(REENTRY_KEY_BASE));
      if (r) view.reentryDismissedFor = r;
    } catch(e) {}
    // Loop cap
    try {
      const c = parseInt(localStorage.getItem(scopedKey(LOOP_CAP_KEY_BASE)) || '', 10);
      if (ALLOWED_LOOP_CAPS.includes(c)) view.loopCap = c;
    } catch(e) {}
  }

  function save() {
    const key = scopedKey(STORAGE_KEY_BASE);
    if (!key) return;
    try {
      localStorage.setItem(key, JSON.stringify({ version: 2, lastLoopId: data.lastLoopId, activeTab: view.activeTab, loops: data.loops }));
    } catch(e) { noteStorageFull(); }
    try { sessionStorage.setItem(scopedKey(TAB_KEY_BASE), view.activeTab); } catch(e) {}
  }

  // The browser refused to store anything more (its storage is full, or it
  // blocks storage for this site). Changes still go to the account while
  // the app is open; say once that this device can’t keep its own copy.
  let storageFullNoted = false;
  function noteStorageFull() {
    if (storageFullNoted) return;
    storageFullNoted = true;
    setTimeout(() => toast('This browser has no room to keep your loops offline. New changes still go to your account while the app is open.', { duration: 9000 }), 0);
  }

  const SITTING_TABS = new Set(['now', 'later', 'inbox', 'done']);
  function sittingTab() {
    try {
      const t = sessionStorage.getItem(scopedKey(TAB_KEY_BASE));
      return SITTING_TABS.has(t) ? t : null;
    } catch(e) { return null; }
  }

  function saveReentryDismissed(id) {
    view.reentryDismissedFor = id || null;
    const key = scopedKey(REENTRY_KEY_BASE);
    if (!key) return;
    try {
      if (id) localStorage.setItem(key, id);
      else    localStorage.removeItem(key);
    } catch(e) {}
  }

  function saveLoopCap(n) {
    if (!ALLOWED_LOOP_CAPS.includes(n)) return;
    view.loopCap = n;
    const key = scopedKey(LOOP_CAP_KEY_BASE);
    if (!key) return;
    try { localStorage.setItem(key, String(n)); } catch(e) {}
  }

  // ── QUERIES ──
  // Display order is position desc (highest = top). Array order in
  // data.loops is kept roughly in sync but realtime updates and createLoop
  // can reorder it; byStatus sorts defensively on every call so render
  // functions always see the same order.
  function byStatus(s) {
    return data.loops
      .filter(l => l.status === s)
      .sort((a, b) => (b.position || 0) - (a.position || 0));
  }
  function getLoop(id) { return data.loops.find(l => l.id === id) || null; }
  function suggested() {
    if (data.lastLoopId) {
      const l = getLoop(data.lastLoopId);
      if (l && l.status === 'active') return l;
    }
    return byStatus('active')[0] || null;
  }

  // ── MUTATIONS ──
  // Return a position value strictly greater than every existing loop’s
  // position — used when creating a new loop (it should land at the top).
  function topPosition() {
    if (!data.loops.length) return nowPosition();
    const max = data.loops.reduce((m, l) => (l.position > m ? l.position : m), -Infinity);
    // Step by 1s so newly-created loops within the same second don’t tie.
    return Math.max(max, nowPosition()) + 1;
  }

  function createLoop({rawText, kind, promptAnswer, status, details, wakeAt}) {
    const l = sanitize({
      id: uid('l'),
      rawText, kind, promptAnswer, status, details, wakeAt: wakeAt || null,
      position: topPosition(),
      createdAt: nowIso(),
      updatedAt: nowIso()
    });
    data.loops.unshift(l);
    if (l.status === 'active') data.lastLoopId = l.id;
    return l;
  }

  function updateLoop(id, patch) {
    const l = getLoop(id);
    if (!l) return null;
    const wasReleased = l.status === 'released';
    Object.assign(l, patch, { updatedAt: nowIso() });
    // A close made on this device adds a note to this sitting’s tune.
    if (!wasReleased && l.status === 'released' && !isLetGo(l)) Combo.hit(l.kind);
    // Warn rather than silently coerce: a bad value here usually means a
    // schema drift, a future feature flag, or a corrupted sync payload.
    if (l.kind !== null && l.kind !== undefined && !VALID_KINDS.has(l.kind)) {
      console.warn(`[open-loops] Coercing invalid kind "${l.kind}" to null on loop ${l.id}`);
      l.kind = null;
    }
    if (!VALID_STATUSES.has(l.status)) {
      console.warn(`[open-loops] Coercing invalid status "${l.status}" to "active" on loop ${l.id}`);
      l.status = 'active';
    }
    if (typeof l.rawText === 'string' && l.rawText.length > MAX_LOOP_TEXT_LEN) {
      l.rawText = l.rawText.slice(0, MAX_LOOP_TEXT_LEN);
    }
    if (l.status === 'active') data.lastLoopId = l.id;
    return l;
  }

  function removeLoop(id) {
    data.loops = data.loops.filter(l => l.id !== id);
    if (data.lastLoopId === id) data.lastLoopId = suggested()?.id || null;
  }

  // Move dragId to the slot occupied by targetId (among active loops, in
  // display order = position desc). Computes a new `position` for dragId as
  // the midpoint between its new neighbours so no other row needs to change.
  //
  // Returns { ok: true, newPosition } on success so the caller can sync a
  // single-row UPDATE for the moved loop. Returns { ok: false } if the move
  // is a no-op (same spot, missing ids, etc).
  //
  // Float-space rebalancing note: double precision gives us ~15-17 decimal
  // digits. If a user drags the *same* pair of neighbours repeatedly (which
  // halves the gap each time), we lose precision after ~50 drops. Detected
  // via an MIN_GAP threshold — below that we trigger a per-user rebalance
  // that spreads all active positions out evenly. Cheap, local, rare.
  const POSITION_MIN_GAP = 1e-9;

  // Loops entering Active (defined, reopened, or brought back from Parked)
  // land in "Up next", right under the Now card. Only the person promotes a
  // loop to Now, by reordering; nothing new takes the focus slot on its own.
  function upNextPosition(loopId) {
    const others = data.loops
      .filter(l => l.status === 'active' && l.id !== loopId)
      .sort((a, b) => (b.position || 0) - (a.position || 0));
    if (!others.length) return { position: topPosition(), rebalance: false };
    if (others.length === 1) return { position: (others[0].position || 0) - 1, rebalance: false };
    const a = others[0].position || 0, b = others[1].position || 0;
    return { position: (a + b) / 2, rebalance: (a - b) < 1e-4 };
  }

  function rebalanceActivePositions() {
    // Reassign positions on active loops in their current display order,
    // spaced by 1.0. Returns a list of { id, position } for sync.
    const active = data.loops
      .filter(l => l.status === 'active')
      .sort((a, b) => (b.position || 0) - (a.position || 0));
    const base = nowPosition();
    const changes = [];
    active.forEach((l, i) => {
      // Largest position at the top of the list → descending by index.
      const p = base + (active.length - i);
      if (l.position !== p) {
        l.position = p;
        l.updatedAt = nowIso();
        changes.push({ id: l.id, position: p });
      }
    });
    return changes;
  }

  function moveActiveLoop(dragId, targetId) {
    if (!dragId || !targetId || dragId === targetId) return { ok: false };
    // Build the active list in display order (highest position first).
    const active = data.loops
      .filter(l => l.status === 'active')
      .sort((a, b) => (b.position || 0) - (a.position || 0));
    const fromIdx = active.findIndex(l => l.id === dragId);
    const toIdx   = active.findIndex(l => l.id === targetId);
    if (fromIdx < 0 || toIdx < 0) return { ok: false };

    // Simulate the move to figure out dragId’s new neighbours.
    const reordered = active.slice();
    const [moved] = reordered.splice(fromIdx, 1);
    reordered.splice(toIdx, 0, moved);
    const newIdx = reordered.indexOf(moved);

    // Compute new position from neighbours (positions sort descending, so
    // "above" = higher position, "below" = lower position).
    const above = newIdx > 0 ? reordered[newIdx - 1].position : null;
    const below = newIdx < reordered.length - 1 ? reordered[newIdx + 1].position : null;

    let newPosition;
    if (above != null && below != null) {
      newPosition = (above + below) / 2;
    } else if (above != null) {
      // Dragged to the bottom (no neighbour below).
      newPosition = above - 1;
    } else if (below != null) {
      // Dragged to the top (no neighbour above).
      newPosition = below + 1;
    } else {
      newPosition = nowPosition();
    }

    // Detect float-precision exhaustion and rebalance if needed.
    const gapAbove = above != null ? Math.abs(above - newPosition) : Infinity;
    const gapBelow = below != null ? Math.abs(newPosition - below) : Infinity;
    if (gapAbove < POSITION_MIN_GAP || gapBelow < POSITION_MIN_GAP) {
      moved.position = newPosition; // apply the move first
      moved.updatedAt = nowIso();
      const changes = rebalanceActivePositions();
      data.lastLoopId = dragId;
      return { ok: true, rebalance: true, changes };
    }

    moved.position = newPosition;
    moved.updatedAt = nowIso();
    data.lastLoopId = dragId;
    return { ok: true, rebalance: false, changes: [{ id: dragId, position: newPosition }] };
  }

  function moveActiveLoopByOffset(loopId, offset) {
    if (!loopId || !offset) return { ok: false };
    const active = data.loops
      .filter(l => l.status === 'active')
      .sort((a, b) => (b.position || 0) - (a.position || 0));
    const idx = active.findIndex(l => l.id === loopId);
    const target = idx >= 0 ? active[idx + offset] : null;
    if (!target) return { ok: false };
    return moveActiveLoop(loopId, target.id);
  }

  function syncPositionChanges(result) {
    if (!result || !result.ok || !Array.isArray(result.changes)) return;
    for (const change of result.changes) {
      Sync.updateLoop(change.id, { position: change.position });
    }
  }

  // ── TIME ──
  // Wake times and calendar helpers. Choices are made in this device’s local
  // time; timestamps are stored as ISO strings so every device agrees.
  function atTime(d, h, m = 0) { const x = new Date(d); x.setHours(h, m, 0, 0); return x; }
  function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function isSameDay(a, b) {
    return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  }
  function clockText(d) { return d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }); }

  // "today 8:00 PM" · "tomorrow 9:00 AM" · "Sat 10:00 AM" · "Mon, Oct 26"
  function formatWake(value) {
    const d = new Date(value);
    if (Number.isNaN(d.getTime())) return '';
    const now = new Date();
    if (isSameDay(d, now)) return `today ${clockText(d)}`;
    if (isSameDay(d, addDays(now, 1))) return `tomorrow ${clockText(d)}`;
    const days = Math.round((atTime(d, 0) - atTime(now, 0)) / 86400000);
    if (days > 1 && days < 7) return `${d.toLocaleDateString(undefined, { weekday: 'short' })} ${clockText(d)}`;
    return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  }

  // When something happens: "today 3:00 PM" · "tomorrow 9:00 AM" ·
  // "Sat 10:00 AM" · "Mon, Oct 26, 3:00 PM". Unlike formatWake, always
  // keeps the time.
  function formatEvent(value) {
    const d = new Date(value);
    if (Number.isNaN(d.getTime())) return '';
    const days = Math.round((atTime(d, 0) - atTime(new Date(), 0)) / 86400000);
    const clock = clockText(d);
    if (days === 0) return `today ${clock}`;
    if (days === 1) return `tomorrow ${clock}`;
    if (days === -1) return `yesterday ${clock}`;
    if (days > 1 && days < 7) return `${d.toLocaleDateString(undefined, { weekday: 'short' })} ${clock}`;
    return `${d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' })}, ${clock}`;
  }

  // "today" · "yesterday" · "on Monday" · "on Oct 3"
  function relativeDay(value) {
    const d = new Date(value);
    if (Number.isNaN(d.getTime())) return '';
    const now = new Date();
    if (isSameDay(d, now)) return 'today';
    if (isSameDay(d, addDays(now, -1))) return 'yesterday';
    const days = Math.round((atTime(now, 0) - atTime(d, 0)) / 86400000);
    if (days > 1 && days < 7) return `on ${d.toLocaleDateString(undefined, { weekday: 'long' })}`;
    return `on ${d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}`;
  }

  // The next given weekday (0 = Sunday) at least minDays away, at that hour.
  function nextWeekday(now, dow, hour, minDays) {
    let n = (dow - now.getDay() + 7) % 7;
    while (n < minDays) n += 7;
    return atTime(addDays(now, n), hour);
  }

  // Choices for "When should it come back?". A loop lands in Up next then.
  function wakePresets(mode, now = new Date()) {
    if (mode === 'ask') {
      return [
        { label: 'Tomorrow',  when: atTime(addDays(now, 1), 9) },
        { label: 'In 3 days', when: atTime(addDays(now, 3), 9) },
        { label: 'Next week', when: atTime(addDays(now, 7), 9) }
      ];
    }
    // Each choice names its real day ("Saturday", "Next Monday") so no two
    // read alike, none lands in the middle of the night, and a choice within
    // three hours of an earlier one is left out.
    const list = [];
    const tonight = atTime(now, 20);
    if (tonight - now > 45 * 60000) list.push({ id: 'tonight', label: 'Tonight', when: tonight });
    else {
      const later = new Date(now.getTime() + 3 * 3600000);
      if (isSameDay(later, now) && later.getHours() >= 8 && later.getHours() < 22) list.push({ id: 'later', label: 'In 3 hours', when: later });
    }
    list.push({ id: 'morning', label: 'Tomorrow morning', when: atTime(addDays(now, 1), 9) });
    // On a weekend, "Saturday" means the next one, not today or tomorrow.
    const weekend = now.getDay() === 6 || now.getDay() === 0;
    const named = (when, day) => ((when - atTime(now, 0)) / 86400000 < 7 ? day : `Next ${day}`);
    const sat = nextWeekday(now, 6, 10, weekend ? 2 : 1);
    list.push({ id: 'weekend', label: named(sat, 'Saturday'), when: sat });
    const mon = nextWeekday(now, 1, 9, 1);
    list.push({ id: 'week', label: named(mon, 'Monday'), when: mon });
    return list.filter((p, i) => !list.slice(0, i).some(q => Math.abs(q.when - p.when) < 3 * 3600000))
      .sort((a, b) => a.when - b.when);
  }

  function localDateValue(d) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }
  function localTimeValue(d) {
    return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  }
  function fromLocalInputs(dateStr, timeStr) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateStr || '');
    if (!m) return null;
    const t = /^(\d{1,2}):(\d{2})/.exec(timeStr || '') || [null, '9', '00'];
    const d = new Date(+m[1], +m[2] - 1, +m[3], +t[1], +t[2], 0, 0);
    return Number.isNaN(d.getTime()) ? null : d;
  }

  // Reads a day and a time out of a note like "Saturday 10am" or
  // "Oct 24, 4:30pm". Returns { date, text } or null when it finds neither.
  // Numeric dates (10/24) are skipped on purpose: day/month vs month/day
  // is a coin flip, and a wrong guess is worse than no guess. A wrong guess
  // is also why ordinary words are left alone: "2 decks" isn’t December 2,
  // "sun cream" isn’t Sunday, "$15.00" isn’t 3 PM.
  const WEEKDAY_NAMES = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
  const MONTH_NAMES = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
  // Every spelling of each weekday, full name first. The short ones that are
  // also ordinary words count only when the note clearly means the day.
  const WEEKDAY_SPELLINGS = [
    ['sunday', 'sun'], ['monday', 'mon'], ['tuesday', 'tues', 'tue'], ['wednesday', 'weds', 'wed'],
    ['thursday', 'thurs', 'thur', 'thu'], ['friday', 'fri'], ['saturday', 'sat']
  ];
  const AMBIGUOUS_DAYS = new Set(['sun', 'sat', 'wed']);
  // How much of a note to read for a time: a date buried deep in a long
  // note is usually part of the story, not when to come back.
  const WHEN_READ_CHARS = 120;
  function findWeekday(t, i) {
    const re = new RegExp(`\\b(next\\s+)?(${WEEKDAY_SPELLINGS[i].join('|')})\\b`, 'g');
    let x;
    while ((x = re.exec(t))) {
      const word = x[2];
      const before = t.slice(0, x.index);
      if (/['’]$/.test(before)) continue;                     // c’mon
      if (AMBIGUOUS_DAYS.has(word) && !x[1]) {
        const after = t.slice(x.index + x[0].length);
        const clear = /\b(on|by|this|until|till|before|from|every|due|for)\s+$/.test(before) ||
          /^\s*(\d|noon\b|morning\b|afternoon\b|evening\b|night\b|at\b)/.test(after) ||
          /^[\s.!?]*$/.test(after);
        if (!clear) continue;
      }
      return x;
    }
    return null;
  }
  // "9.30" and "14:00" are times; "$15.00", "12.50%" and "2.10/mo" are not.
  function findClockTime(t) {
    const re = /\b([01]?\d|2[0-3])[:.]([0-5]\d)\b/g;
    let x;
    while ((x = re.exec(t))) {
      const before = t.slice(Math.max(0, x.index - 4), x.index);
      const after = t.slice(x.index + x[0].length, x.index + x[0].length + 2);
      if (/[$£€¥₹]\s*$|\b(rs|pkr|usd|eur|gbp)\.?\s*$|[\d.,]$/.test(before)) continue;
      if (/^\s*[%/]|^[.,]\d/.test(after)) continue;
      return x;
    }
    return null;
  }
  function parseWhen(text, now = new Date()) {
    const src = String(text || '').slice(0, WHEN_READ_CHARS);
    const t = src.toLowerCase();
    // A month only as a whole word: "dec", "dec.", "december", never "decks".
    const MON = '(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|june?|july?|aug(?:ust)?|sep(?:t(?:ember)?)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)\\.?(?![a-z])';
    let day = null, dayHit = null, kind = null, evening = false, m;

    let monthIdx = -1, dom = 0;
    if ((m = new RegExp(`\\b(\\d{1,2})(?:st|nd|rd|th)?\\s+${MON}`).exec(t))) {
      dom = +m[1]; monthIdx = MONTH_NAMES.indexOf(m[2].slice(0, 3)); dayHit = m;
    } else if ((m = new RegExp(`\\b${MON}\\s+(\\d{1,2})(?:st|nd|rd|th)?\\b`).exec(t))) {
      dom = +m[2]; monthIdx = MONTH_NAMES.indexOf(m[1].slice(0, 3)); dayHit = m;
    }
    if (dayHit) {
      const candidate = new Date(now.getFullYear(), monthIdx, dom);
      // Reject impossible dates like "31 Feb" instead of rolling them over.
      if (monthIdx >= 0 && dom >= 1 && candidate.getMonth() === monthIdx) { day = candidate; kind = 'date'; }
      else dayHit = null;
    }
    if (!day) {
      const rel = [
        { re: /\btoday\b/, offset: 0 },
        { re: /\btonight\b/, offset: 0, evening: true },
        { re: /\b(?:tomorrow|tmrw|tmr)\b/, offset: 1 }
      ];
      for (const r of rel) {
        const x = r.re.exec(t);
        if (x && (!dayHit || x.index < dayHit.index)) {
          day = atTime(addDays(now, r.offset), 0); dayHit = x; kind = 'relative'; evening = !!r.evening;
        }
      }
      WEEKDAY_NAMES.forEach((name, i) => {
        const x = findWeekday(t, i);
        if (x && (!dayHit || x.index < dayHit.index)) {
          let n = (i - now.getDay() + 7) % 7;
          if (x[1] && n === 0) n = 7; // "next Monday", said on a Monday
          day = atTime(addDays(now, n), 0); dayHit = x; kind = 'weekday'; evening = false;
        }
      });
    }

    let hour = null, minute = 0, timeHit = null;
    if ((m = /\b(\d{1,2})(?:[:.](\d{2}))?\s*(am|pm|a\.m\.|p\.m\.)/.exec(t))) {
      const h = +m[1];
      hour = h > 12 ? Math.min(h, 23) : (h % 12) + (m[3][0] === 'p' ? 12 : 0);
      minute = m[2] ? Math.min(+m[2], 59) : 0; timeHit = m;
    } else if ((m = findClockTime(t))) {
      hour = +m[1]; minute = +m[2]; timeHit = m;
    } else if ((m = /\bnoon\b/.exec(t))) { hour = 12; timeHit = m; }
    else if ((m = /\bmorning\b/.exec(t))) { hour = 9; timeHit = m; }
    else if ((m = /\bafternoon\b/.exec(t))) { hour = 14; timeHit = m; }
    else if ((m = /\bevening\b/.exec(t))) { hour = 18; timeHit = m; }

    if (!day && hour === null) return null;
    let date;
    if (day) {
      date = new Date(day);
      date.setHours(hour !== null ? hour : (evening ? 20 : 9), minute, 0, 0);
      if (kind === 'weekday' && date <= now) date = addDays(date, 7);
      if (kind === 'date' && date < atTime(now, 0)) date.setFullYear(date.getFullYear() + 1);
    } else {
      date = atTime(now, hour, minute);
      if (date <= now) date = addDays(date, 1);
    }
    const pick = x => src.substr(x.index, x[0].length).trim();
    const hits = [dayHit, timeHit].filter(Boolean).sort((a, b) => a.index - b.index);
    return { date, text: hits.map(pick).join(' ') };
  }

  // ── ASKS ──
  // Who an Ask is for, and what it asks, read from the note the way people
  // write it:
  //   "Bilal: can he start before the 15th?" · "Bilal - can he start…"
  //   "Priya, can she intro us to Sana?"     · "Ask Sam if he can review my PR"
  //   "Ask Sam to review my PR"              · "Ask mom for the recipe"
  //   "Bilal" (just the name; the loop’s own text says what for)
  // ask is written about them ("can he…"); askDraft turns it toward them.
  const ASK_OPENERS = /^(can|could|would|will|should|might|did|does|do|is|are|was|were|has|have|had|please|when|what|where|who|how|any|just|quick)\b/i;
  function parseAsk(text, nameAlone = true) {
    const s = String(text || '').trim();
    let m = /^([^:\n]{1,40}?)\s*(?::|\s[—–-]\s)\s*([\s\S]+)$/.exec(s);
    if (m && m[2].trim() && m[1].trim().split(/\s+/).length <= 4) return { who: m[1].trim(), ask: m[2].trim() };
    m = /^([^\s,:\d][^,:\n\d]{0,30}?),\s+([\s\S]+)$/.exec(s);
    if (m && m[1].trim().split(/\s+/).length <= 3 && ASK_OPENERS.test(m[2])) return { who: m[1].trim(), ask: m[2].trim() };
    m = /^(?:ask|check with|ping|text|email|message)\s+(\S+(?:\s+[A-Z]\S*)?)\s+(if|whether|to|for|about)\s+([\s\S]+)$/i.exec(s);
    if (m) {
      const who = m[1].replace(/[,.]$/, '');
      const rest = m[3].trim().replace(/[.?!]+$/, '');
      const how = m[2].toLowerCase();
      if (how === 'to') return { who, ask: `could you ${rest}?`, direct: true };
      if (how === 'for') return { who, ask: `could you send me ${rest}?`, direct: true };
      if (how === 'about') return { who, ask: `any news on ${rest}?`, direct: true };
      const q = /^(he|she|they)\s+(can|could|will|would|should|is|are|was|were|has|have|had|did|does|do)\b\s*([\s\S]*)$/i.exec(rest);
      return { who, ask: q ? `${q[2]} ${q[1]} ${q[3]}?`.replace(/\s+\?$/, '?') : `${rest}?` };
    }
    // Just a name: one word, or two or three capitalised ones. Only a note
    // can be just a name; a one-word loop ("Groceries") is not a person.
    const words = s.split(/\s+/);
    if (nameAlone && s && /^[\p{L}'’.-]+(?:\s+[\p{L}'’.-]+){0,2}$/u.test(s) &&
        (words.length === 1 || words.every(w => /^\p{Lu}/u.test(w)))) return { who: s, ask: '' };
    return { who: '', ask: s };
  }
  // The person and the ask for a loop: the note first, then the loop’s own
  // text ("Ask Bilal for the contract").
  function askOf(loop) {
    const note = parseAsk(loop && loop.promptAnswer);
    if (note.who && note.ask) return note;
    const raw = parseAsk(loop && loop.rawText, false);
    if (!note.who) return raw.who ? raw : { who: '', ask: note.ask || '' };
    if (raw.who && raw.who.toLowerCase() === note.who.toLowerCase()) return { ...raw, who: note.who };
    return { who: note.who, ask: '' };
  }

  // Notes are written about the person ("can she intro us to her fund?");
  // the message is written to them ("can you intro us to your fund?"). Once
  // the opening names them, the rest of the sentence follows.
  const OBJECT_FOLLOWERS = /^(to|for|about|at|on|in|with|by|from|and|or|if|when|that|a|an|the|this|these|those|back|know|up|out|again|now|today|tomorrow|soon|a\s+call|[.,!?;:]|$)/i;
  function toSecondPerson(text) {
    const opening = /^(can|could|would|will|should|might|did|is|are|was|were|does|do|has|have)\s+(he|she|they)\b/i.exec(text);
    if (!opening) return text;
    const aux = opening[1], pron = opening[2].toLowerCase();
    const cap = w => aux[0] === aux[0].toUpperCase() ? w.charAt(0).toUpperCase() + w.slice(1) : w;
    const AGREE = { is: 'are', was: 'were', does: 'do', has: 'have' };
    let out = cap(AGREE[aux.toLowerCase()] || aux.toLowerCase()) + ' you' + text.slice(opening[0].length);
    const forms = pron === 'she' ? { obj: 'her', poss: 'her', own: 'hers', self: 'herself' }
      : pron === 'he' ? { obj: 'him', poss: 'his', own: 'his', self: 'himself' }
      : { obj: 'them', poss: 'their', own: 'theirs', self: 'themselves' };
    out = out.replace(new RegExp(`\\b${pron}\\s+(is|was|has|does)\\b`, 'gi'), (m, v) => `you ${AGREE[v.toLowerCase()]}`)
      .replace(new RegExp(`\\b${pron}\\b`, 'gi'), 'you')
      .replace(new RegExp(`\\b${forms.self}\\b`, 'gi'), 'yourself');
    if (forms.own !== forms.poss) out = out.replace(new RegExp(`\\b${forms.own}\\b`, 'gi'), 'yours');
    out = out.replace(new RegExp(`\\b(${forms.poss}|${forms.obj})\\b(\\s*)`, 'gi'), (m, w, sp, at, all) => {
      const next = all.slice(at + m.length);
      if (w.toLowerCase() === forms.obj && forms.obj !== forms.poss) return 'you' + sp;
      return (OBJECT_FOLLOWERS.test(next) ? 'you' : 'your') + sp;
    });
    return out;
  }

  function askDraft(loop, nudge) {
    const { who, ask, direct } = askOf(loop);
    const d = (loop && loop.details) || {};
    if (nudge && who && d.sentText) {
      const when = d.sentAt && isSameDay(new Date(d.sentAt), new Date()) ? 'earlier today' : relativeDay(d.sentAt);
      return `Hi ${who}, just following up on my message ${when}.`;
    }
    let body = (ask || '').trim();
    if (who && body && !direct) body = toSecondPerson(body);
    if (!body) {
      // Only the name is known: the loop’s own text says what it’s about.
      body = String((loop && loop.rawText) || '').trim();
      const first = body.split(/\s+/)[0] || '';
      if (who && /^\p{Lu}\p{Ll}+$/u.test(first) && first.toLowerCase() !== who.split(/\s+/)[0].toLowerCase()) body = body.charAt(0).toLowerCase() + body.slice(1);
    }
    // Lowercase the first word only when it’s an ordinary word, so
    // "Can he start…" reads "Hi Bilal, can he start…" but names stay intact.
    const soft = ASK_OPENERS.test(body) || /^(could|any)\b/i.test(body) ? body.charAt(0).toLowerCase() + body.slice(1) : body;
    if (nudge) return who ? `Hi ${who}, just checking in on this: ${soft}` : `Just checking in on this: ${soft}`;
    return who ? `Hi ${who}, ${soft}` : body;
  }

  // Telling a friend. Asked once, when Active has just been cleared and only
  // after ten closes; either answer retires the question. Settings keeps a
  // quiet way to do it any time.
  const APP_LINK = 'https://openloops.auxila.cc';
  const SHARE_PROMPT_KEY = CFG.STORAGE_KEY ? CFG.STORAGE_KEY + '_share_prompt' : 'open_loops_share_prompt';
  function sharePromptHtml() {
    try { if (localStorage.getItem(SHARE_PROMPT_KEY)) return ''; } catch (_) { return ''; }
    if (data.loops.filter(l => l.status === 'released').length < 10) return '';
    return `<div class="share-nudge"><span>Know someone with a crowded head?</span><div class="share-nudge-row"><button type="button" class="btn btn-primary" data-action="share-app">Send them Open Loops</button><button type="button" class="btn btn-ghost" data-action="share-app-later">Not now</button></div></div>`;
  }
  async function shareApp() {
    const text = 'Open Loops: a calm place for unfinished things. It keeps only a few things in focus.';
    if (navigator.share) {
      try { await navigator.share({ title: 'Open Loops', text, url: APP_LINK }); return 'shared'; }
      catch (e) { if (e && e.name === 'AbortError') return 'cancelled'; }
    }
    try { await navigator.clipboard.writeText(`${text} ${APP_LINK}`); return 'copied'; }
    catch (_) { return 'failed'; }
  }

  // Native share sheet where there is one; otherwise copy the text.
  async function shareText(text) {
    if (navigator.share) {
      try { await navigator.share({ text }); return 'shared'; }
      catch (e) { if (e && e.name === 'AbortError') return 'cancelled'; }
    }
    try { await navigator.clipboard.writeText(text); return 'copied'; }
    catch (_) { return 'failed'; }
  }

  // ── DECISIONS ──
  // "Air 15 or X1, decide by Friday" → ['Air 15', 'X1']
  // "Stripe/Paddle" → ['Stripe', 'Paddle'], but "$19 or $29/mo" → ['$19', '$29/mo']:
  // a slash only separates choices when no "or" does, and never before a unit.
  const PER_UNIT = /^(mo|month|yr|year|wk|week|day|hr|hour|h|user|seat|person|head|unit|each|pp|night)\b/i;
  function decisionOptions(text) {
    const first = String(text || '').split(/[,;\n]|\.(?!\d)|\b(?:decide|by|before)\s+(?:mon|tue|wed|thu|fri|sat|sun|tomorrow|today|next)/i)[0] || '';
    const stripped = first.replace(/^[^:]{1,40}:\s*/, '').replace(/^(?:should i|do i|whether to|whether i|between|either)\s+/i, '');
    const byWord = /\s+(?:or|vs\.?|versus)\s+/i;
    let parts;
    if (byWord.test(stripped)) parts = stripped.split(byWord);
    else {
      parts = stripped.split(/\s*\/\s*/);
      if (parts.slice(1).some(p => PER_UNIT.test(p.trim()))) return [];
    }
    parts = parts.map(s => s.trim().replace(/[?!]+$/, '')).filter(Boolean);
    if (parts.length < 2 || parts.length > 4 || parts.some(p => p.length > 40)) return [];
    return parts;
  }

  // ── CALENDAR ──
  // No sign-in: a prefilled Google Calendar link, or an .ics file that Apple
  // Calendar, Outlook and most other calendars open.
  function gcalStamp(d) {
    const p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}T${p(d.getHours())}${p(d.getMinutes())}00`;
  }
  function googleCalendarUrl({ title, start, end, details }) {
    const params = new URLSearchParams({ action: 'TEMPLATE', text: title, dates: `${gcalStamp(start)}/${gcalStamp(end)}`, details });
    try {
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      if (tz) params.set('ctz', tz);
    } catch (_) {}
    return `https://calendar.google.com/calendar/render?${params.toString()}`;
  }
  function icsStamp(d) { return d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, ''); }
  function icsEscape(s) { return String(s).replace(/\\/g, '\\\\').replace(/\r?\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;'); }
  function icsFold(line) {
    // RFC 5545: lines longer than 75 octets continue on the next line after a space.
    const out = [];
    let rest = line;
    while (new TextEncoder().encode(rest).length > 74) {
      let cut = 74;
      while (new TextEncoder().encode(rest.slice(0, cut)).length > 74) cut--;
      out.push(rest.slice(0, cut));
      rest = ' ' + rest.slice(cut);
    }
    out.push(rest);
    return out.join('\r\n');
  }
  function icsText({ uidValue, title, start, end, details }) {
    return [
      'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Open Loops//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
      'BEGIN:VEVENT',
      `UID:${uidValue}@open-loops`,
      `DTSTAMP:${icsStamp(new Date())}`,
      `DTSTART:${icsStamp(start)}`,
      `DTEND:${icsStamp(end)}`,
      `SUMMARY:${icsEscape(title)}`,
      details ? `DESCRIPTION:${icsEscape(details)}` : null,
      'END:VEVENT', 'END:VCALENDAR'
    ].filter(Boolean).map(icsFold).join('\r\n') + '\r\n';
  }
  function downloadIcs(text, name) {
    const blob = new Blob([text], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }
  function fileSlug(s) {
    return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
  }

  // ── WAKE-UPS ──
  // A parked loop with a wake time comes back on its own: into Up next,
  // never straight into Now. Runs when the app opens, when it returns to the
  // foreground, and once a minute while it’s open.
  function wakeDueLoops(opts = {}) {
    if (!Sync.isLoggedIn()) return [];
    const now = Date.now();
    // Latest first, so the earliest-due loop ends up right under Now.
    const due = data.loops
      .filter(l => l.status === 'waiting' && l.wakeAt && new Date(l.wakeAt).getTime() <= now)
      .sort((a, b) => new Date(b.wakeAt) - new Date(a.wakeAt));
    if (!due.length) return [];
    const patches = [];
    let rebalance = false;
    for (const l of due) {
      const upNext = upNextPosition(l.id);
      const patch = { status: 'active', position: upNext.position };
      updateLoop(l.id, patch);
      patches.push([l.id, patch]);
      if (upNext.rebalance) rebalance = true;
    }
    const positionChanges = rebalance ? rebalanceActivePositions() : null;
    save();
    renderAll();
    patches.forEach(([id, patch]) => Sync.updateLoop(id, patch));
    if (positionChanges) syncPositionChanges({ ok: true, changes: positionChanges });
    // On Active the sweep banner already says what woke up.
    const bannerSaysIt = view.activeTab === 'now' && sweepBannerItems().length > 0;
    if (!opts.quiet && !bannerSaysIt) {
      const firstLoop = due[due.length - 1];
      const first = firstLoop.rawText || '';
      const short = first.length > 42 ? first.slice(0, 40).trimEnd() + '…' : first;
      const schedAt = scheduleAt(firstLoop);
      toast(due.length !== 1 ? `${due.length} loops woke up. They’re in Up next.`
        : schedAt !== null && schedAt > now ? `Coming up at ${clockText(new Date(schedAt))}: ${short}`
        : schedAt !== null && now - schedAt < 15 * 60000 ? `It’s time: ${short}`
        : `Back in Up next: ${short}`);
    }
    return due;
  }

  // ── TOAST ──
  function toast(msg, opts) {
    const el = document.getElementById('toast');
    if (!el) return;
    el.textContent = '';
    el.classList.remove('has-action');
    const span = document.createElement('span');
    span.textContent = msg;
    el.appendChild(span);
    const dur = (opts && opts.duration) || DEFAULT_TOAST_MS;
    // A tip gives way as soon as a sheet opens, so it never covers a flow.
    if (opts && opts.tip) el.dataset.tip = '1'; else delete el.dataset.tip;
    if (opts && opts.action && typeof opts.onAction === 'function') {
      el.classList.add('has-action');
      const btn = document.createElement('button');
      btn.className = 'toast-action';
      btn.type = 'button';
      btn.textContent = opts.action;
      btn.addEventListener('click', () => {
        clearTimeout(toastTimer);
        el.classList.remove('visible');
        el.classList.remove('has-action');
        try { opts.onAction(); } catch(e) {}
      });
      el.appendChild(btn);
    }
    el.classList.add('visible');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      el.classList.remove('visible');
      el.classList.remove('has-action');
    }, dur);
  }

  // Screen-reader-only announcement for changes the motion already shows.
  function announce(msg) {
    let el = document.getElementById('sr-announce');
    if (!el) {
      el = document.createElement('div');
      el.id = 'sr-announce';
      el.className = 'sr-only';
      el.setAttribute('role', 'status');
      el.setAttribute('aria-live', 'polite');
      document.body.appendChild(el);
    }
    el.textContent = '';
    setTimeout(() => { el.textContent = msg; }, 30);
  }

  // ── ESCAPE HTML ──
  // Escape all five XML special chars (incl. both quote types) for safe
  // interpolation into attributes or text. Defensive: current callers use
  // double-quoted attrs, but escaping ' too lets us relax that if we ever
  // switch to single-quoted attributes.
  function esc(s) {
    return String(s||'')
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#39;');
  }

  // ── KIND CHIP HTML ──
  function formatLoopDate(value) {
    if (!value) return '';
    const d = new Date(value);
    if (Number.isNaN(d.getTime())) return '';
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }

  // Dates only on the Closed shelf, where "when" is the point. Elsewhere a
  // card’s age shows only once it matters ("Untouched 12 days").
  function loopMetaHtml(loop) {
    if (loop.status !== 'released') return '';
    const captured = formatLoopDate(loop.createdAt);
    const closed = formatLoopDate(loop.completedAt);
    const parts = [];
    if (captured) parts.push(`<span>Captured ${esc(captured)}</span>`);
    if (closed) parts.push(`<span>${isLetGo(loop) ? 'Let go' : 'Closed'} ${esc(closed)}</span>`);
    return parts.length ? `<div class="loop-meta">${parts.join('')}</div>` : '';
  }

  // ── REASONS ──
  // A small label on a card that says why it is where it is.
  const REASON_ICON = {
    sun:    '<path d="M3 11.5h10M5 11.5a3 3 0 0 1 6 0M8 3.5v2M3.8 6.3l1.2 1.1M12.2 6.3 11 7.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>',
    person: '<circle cx="8" cy="5.5" r="2.5" stroke="currentColor" stroke-width="1.4"/><path d="M3 13.5a5 5 0 0 1 10 0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>',
    fork:   '<path d="M8 2v4M8 6 4 10v4M8 6l4 4v4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>',
    dry:    '<path d="M8 2.5a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11ZM8 5.2V8l2 1.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>',
    cal:    '<rect x="2.5" y="3.5" width="11" height="10" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M2.5 6.8h11M5.5 2v3M10.5 2v3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>'
  };
  function reasonFor(loop) {
    const d = loop.details || {};
    const wake = loop.wakeAt ? new Date(loop.wakeAt).getTime() : null;
    const isSentAsk = loop.kind === 'ask' && !!d.sentAt;
    // A timed Schedule loop: say when it comes back (the nudge) or starts.
    const schedAt = scheduleAt(loop);
    if (schedAt !== null && (loop.status === 'waiting' || loop.status === 'active') && schedAt > Date.now()) {
      if (wakeIsScheduleNudge(loop) && wake > Date.now()) {
        return { icon: 'cal', text: `Nudge ${formatWake(loop.wakeAt)}` };
      }
      return { icon: 'cal', text: `Starts ${formatEvent(new Date(schedAt).toISOString())}` };
    }
    if (loop.status === 'waiting') {
      if (isSentAsk) {
        const who = askOf(loop).who || 'them';
        return { icon: 'person', text: wake ? `Waiting on ${who} · back ${formatWake(loop.wakeAt)}` : `Waiting on ${who}` };
      }
      if (wake) return { icon: 'sun', text: `Wakes ${formatWake(loop.wakeAt)}` };
      return dryReason(loop) || { text: 'No wake time', quiet: true };
    }
    if (loop.status === 'active') {
      if (isSentAsk) return { icon: 'person', text: wake && wake <= Date.now() ? 'Checking back' : `Sent ${relativeDay(d.sentAt)}` };
      if (wake && wake <= Date.now() && isSameDay(new Date(wake), new Date())) return { icon: 'sun', text: 'Woke today' };
      if (loop.kind === 'schedule' && d.calAt) return { icon: 'cal', text: 'Sent to your calendar' };
      if (d.origin === 'decision') return { icon: 'fork', text: 'From your decision' };
      return dryReason(loop);
    }
    return null;
  }
  function reasonHtml(loop) {
    const r = reasonFor(loop);
    if (!r) return '';
    const icon = REASON_ICON[r.icon] ? `<svg viewBox="0 0 16 16" fill="none" aria-hidden="true">${REASON_ICON[r.icon]}</svg>` : '';
    return `<span class="loop-reason${r.quiet ? ' quiet' : ''}${r.dry ? ' dry' : ''}">${icon}<span>${esc(r.text)}</span></span>`;
  }

  // ── DRYING CLAY ──
  // Clay dries out when nobody touches it. Ten days untouched and a card
  // starts to dry; after three weeks it cracks and asks "Still yours?".
  // Touching it (keeping it, editing it, moving it) makes it fresh again.
  // Parked loops with a wake time are asleep on purpose, so they never dry.
  const DRY_DAYS = 10;
  const CRACK_DAYS = 21;
  function untouchedDays(loop) {
    const t = new Date(loop.updatedAt || loop.createdAt).getTime();
    return Number.isFinite(t) ? Math.max(0, Math.floor((Date.now() - t) / 86400000)) : 0;
  }
  function dryness(loop) {
    if (!loop || (loop.status !== 'active' && loop.status !== 'waiting')) return null;
    if (loop.status === 'waiting' && loop.wakeAt) return null;
    // Waiting for its date is not neglect.
    const schedAt = scheduleAt(loop);
    if (schedAt !== null && schedAt > Date.now()) return null;
    const days = untouchedDays(loop);
    if (days >= CRACK_DAYS) return { level: 'cracked', days };
    if (days >= DRY_DAYS) return { level: 'drying', days };
    return null;
  }
  function dryReason(loop) {
    const dry = dryness(loop);
    if (!dry) return null;
    return { icon: 'dry', dry: dry.level, text: dry.level === 'cracked' ? `Untouched ${dry.days} days · cracking` : `Untouched ${dry.days} days` };
  }
  function dryClass(loop) {
    const dry = dryness(loop);
    return dry ? ` is-${dry.level}` : '';
  }
  function stillYoursBtn(loop) {
    const dry = dryness(loop);
    return dry && dry.level === 'cracked'
      ? `<button class="btn-action still-yours-btn" data-action="open-still-yours" data-loop-id="${esc(loop.id)}">Still yours?</button>`
      : '';
  }
  function shortText(text, max = 48) {
    const s = String(text || '').replace(/\s+/g, ' ').trim();
    return s.length > max ? s.slice(0, max - 1).trimEnd() + '…' : s;
  }

  // ── MASCOT ──
  // The open C from the logo, in the same clay, with a face. All it wants is
  // to close. Moods: sleepy · awake · curious · cheeky · proud · calm.
  let mascotSeq = 0;
  function clayFilterDefs(id, blur = 5, surface = 5) {
    return `<filter id="${id}" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="${blur}" result="b"/>
        <feDiffuseLighting in="b" surfaceScale="${surface}" diffuseConstant="1.05" lighting-color="#fff" result="d"><feDistantLight azimuth="235" elevation="48"/></feDiffuseLighting>
        <feComposite in="SourceGraphic" in2="d" operator="arithmetic" k1="1.05" result="lit"/>
        <feSpecularLighting in="b" surfaceScale="${surface}" specularConstant="0.55" specularExponent="16" lighting-color="#fff" result="s"><feDistantLight azimuth="235" elevation="55"/></feSpecularLighting>
        <feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/>
        <feComposite in="lit" in2="s2" operator="arithmetic" k2="1" k3="0.6" result="o"/>
        <feComposite in="o" in2="SourceAlpha" operator="in"/>
      </filter>
      <filter id="${id}-sh" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>`;
  }
  function mascotSvg(mood = 'awake', opts = {}) {
    const id = `ol-mascot-${++mascotSeq}`;
    const w = opts.width || 200;
    // mark: a square crop for small places (the header, the sign-in screen),
    // with a bigger face so it still reads at 30px.
    const mark = !!opts.mark;
    const h = mark ? w : Math.round(w * 220 / 300);
    const ink = '#0a0a0a';
    const C = '<path d="M 196 72 A 58 58 0 1 0 200 150" fill="none" stroke="#ffb084" stroke-width="32" stroke-linecap="round"/>';
    const dot = '<circle cx="236" cy="104" r="10" fill="#ff4d8b"/>';
    const eye = (cx, cy, rx = 6, ry = 8) => `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${ink}"/>`;
    const line = (d, sw = 4) => `<path d="${d}" fill="none" stroke="${ink}" stroke-width="${sw}" stroke-linecap="round"/>`;
    const spark = (x, y, s, fill) => `<path d="M${x} ${y - s}l${s * 0.4} ${s * 0.6}l${s * 0.6} ${s * 0.4}l-${s * 0.6} ${s * 0.4}l-${s * 0.4} ${s * 0.6}l-${s * 0.4} -${s * 0.6}l-${s * 0.6} -${s * 0.4}l${s * 0.6} -${s * 0.4}Z" fill="${fill}"/>`;
    let clay = C + dot;
    let face = '';
    let extra = '';
    let tilt = '';
    if (mood === 'sleepy') {
      face = line('M128 54 Q136 60 144 54') + line('M156 54 Q164 60 172 54') + line('M144 66 Q150 69 156 66', 3);
      extra = '<text class="mascot-z" x="214" y="50" font-size="26" font-weight="700">z</text><text class="mascot-z" x="236" y="28" font-size="18" font-weight="700">z</text>';
    } else if (mood === 'curious') {
      tilt = 'transform="rotate(-8 150 112)"';
      face = eye(136, 51, 8, 10) + eye(166, 51, 8, 10) + '<circle cx="139" cy="47" r="3" fill="#fff"/><circle cx="169" cy="47" r="3" fill="#fff"/>' + `<circle cx="151" cy="66" r="4" fill="${ink}"/>`;
    } else if (mood === 'cheeky') {
      face = eye(136, 52) + line('M157 53 Q164 47 171 53') + line('M140 63 Q152 69 161 60', 3.5);
    } else if (mood === 'proud') {
      clay = '<circle class="mascot-seal" cx="150" cy="112" r="58" fill="none" stroke="#ffb084" stroke-width="32" stroke-linecap="round" stroke-dasharray="364.4" transform="rotate(39 150 112)"/>';
      face = line('M129 56 Q136 46 143 56', 4.5) + line('M157 56 Q164 46 171 56', 4.5) + line('M139 63 Q150 73 161 63', 3.5);
      extra = spark(242, 50, 12, '#e8b94a') + spark(62, 58, 8, '#b8a4ed');
    } else if (mood === 'calm') {
      clay = C + '<ellipse cx="248" cy="58" rx="12" ry="9" fill="#ffb084"/>';
      face = line('M129 52 Q136 57 143 52') + line('M157 52 Q164 57 171 52') + line('M142 63 Q150 68 158 63', 3);
    } else {
      face = `<g class="mascot-eyes">${eye(136, 52)}${eye(164, 52)}</g>` + line('M141 63 Q150 69 159 63', 3);
    }
    const a11y = opts.label ? `role="img" aria-label="${esc(opts.label)}"` : 'aria-hidden="true" focusable="false"';
    const scale = opts.faceScale || (mark ? 1.4 : 1);
    const faceHtml = scale === 1 ? face : `<g transform="translate(150 58) scale(${scale}) translate(-150 -58)">${face}</g>`;
    return `<svg class="mascot mascot-${mood}${opts.className ? ' ' + opts.className : ''}" width="${w}" height="${h}" viewBox="${mark ? '71 22 180 180' : '0 0 300 220'}" ${a11y}>
      <defs>${clayFilterDefs(id)}</defs>
      ${mark ? '' : `<ellipse cx="150" cy="196" rx="90" ry="10" fill="#3a2a10" opacity=".13" filter="url(#${id}-sh)"/>`}
      <g class="mascot-body" ${tilt}><g filter="url(#${id})">${clay}</g>${faceHtml}${mark ? '' : extra}</g>
    </svg>`;
  }

  // The header logo is the mascot. It blinks, closes into a ring when you
  // close a loop, goes calm when you let one go, and looks up when you
  // capture something.
  const BrandMascot = (() => {
    let timer = null;
    function draw(mood, cls) {
      const box = document.querySelector('.topbar .brand-mark');
      if (box) box.innerHTML = mascotSvg(mood, { mark: true, width: 30, className: cls || '' });
    }
    return {
      init() { draw('awake'); },
      react(mood, ms = 2400) {
        clearTimeout(timer);
        draw(mood, `mascot-hop${mood === 'proud' ? ' mascot-sealing' : ''}`);
        timer = setTimeout(() => draw('awake'), ms);
      }
    };
  })();

  // ── SWEEP ──
  // The daily ritual. Loops that woke up since your last sweep, plus any that
  // have dried out, one card at a time: make it Now, keep it in Up next, park
  // it again, or let it go. About thirty seconds. Nothing else moves.
  const SWEEP_KEY_BASE = CFG.STORAGE_KEY ? CFG.STORAGE_KEY + '_sweep' : 'open_loops_sweep';
  function sweepState() {
    const key = scopedKey(SWEEP_KEY_BASE);
    if (!key) return {};
    try {
      const v = JSON.parse(localStorage.getItem(key) || '{}');
      return v && typeof v === 'object' ? v : {};
    } catch (_) { return {}; }
  }
  function saveSweepState(patch) {
    const key = scopedKey(SWEEP_KEY_BASE);
    if (!key) return;
    try { localStorage.setItem(key, JSON.stringify({ ...sweepState(), ...patch })); } catch (_) {}
  }
  function sweepItems() {
    const now = Date.now();
    const st = sweepState();
    const since = st.sweptAt ? new Date(st.sweptAt).getTime() : now - 36 * 3600000;
    const woke = data.loops
      .filter(l => l.status === 'active' && l.wakeAt)
      .filter(l => { const t = new Date(l.wakeAt).getTime(); return t <= now && t > since; })
      .sort((a, b) => new Date(a.wakeAt) - new Date(b.wakeAt));
    const seen = new Set(woke.map(l => l.id));
    const dry = data.loops
      .filter(l => !seen.has(l.id) && (dryness(l) || {}).level === 'cracked')
      .sort((a, b) => new Date(a.updatedAt) - new Date(b.updatedAt))
      .slice(0, 3);
    return woke.map(l => ({ id: l.id, why: 'woke' }))
      .concat(dry.map(l => ({ id: l.id, why: 'dry' })))
      .slice(0, 6);
  }
  // The banner stays while there’s something to sweep, unless you said
  // "Later" today and nothing new has turned up since.
  function sweepBannerItems() {
    const items = sweepItems();
    if (!items.length) return [];
    const st = sweepState();
    if (st.laterOn !== localDateValue(new Date())) return items;
    const snoozed = new Set(st.laterIds || []);
    return items.some(it => !snoozed.has(it.id)) ? items : [];
  }
  function greeting() {
    const h = new Date().getHours();
    return h < 12 ? 'Good morning.' : h < 17 ? 'Good afternoon.' : 'Good evening.';
  }
  function sweepHeadline(items) {
    const woke = items.filter(i => i.why === 'woke').length;
    const dry = items.length - woke;
    if (woke && dry) return `${woke} woke up, ${dry} drying out.`;
    if (woke) return woke === 1 ? '1 loop woke up.' : `${woke} loops woke up.`;
    return dry === 1 ? '1 loop is drying out.' : `${dry} loops are drying out.`;
  }
  function sweepBannerHtml(items) {
    const woke = items.some(i => i.why === 'woke');
    return `
      <section class="sweep-banner" aria-label="Sweep">
        <span class="sweep-banner-art">${mascotSvg(woke ? 'awake' : 'cheeky', { width: 76 })}</span>
        <div class="sweep-banner-text">
          <span class="sweep-banner-hello">${greeting()}</span>
          <strong>${esc(sweepHeadline(items))}</strong>
          <span class="sweep-banner-sub">Sort ${items.length > 1 ? 'them' : 'it'} in about 30 seconds.</span>
        </div>
        <div class="sweep-banner-actions">
          <button type="button" class="btn btn-primary" data-action="open-sweep">Sweep</button>
          <button type="button" class="sweep-banner-later" data-action="sweep-later" title="Later" aria-label="Later. Hide this until something new comes up.">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
        </div>
      </section>`;
  }
  function sweepable(item) {
    const l = item && getLoop(item.id);
    return !!(l && (l.status === 'active' || l.status === 'waiting'));
  }
  function renderSweep(ov) {
    const items = ov.items || [];
    const sheet = (body) => `
      <div class="overlay-card sweep-sheet" role="dialog" aria-modal="true" aria-labelledby="sweep-title">
        <div class="overlay-header">
          <div class="overlay-meta"><div class="overlay-eyebrow">Sweep</div></div>
          ${SHEET_CLOSE}
        </div>
        ${body}
      </div>`;
    if (ov.step === 'intro') {
      return sheet(`
        <div class="sweep-hero">
          ${mascotSvg(ov.awake ? 'awake' : 'sleepy', { width: 210, className: 'mascot-bob sweep-mascot', label: ov.awake ? 'The Open Loops mascot, just awake' : 'The Open Loops mascot, waking up' })}
          <h2 class="sweep-h" id="sweep-title">${greeting()}<br>${esc(sweepHeadline(items))}</h2>
          <p class="sweep-p">Decide where each one goes. About 30 seconds.</p>
          <button type="button" class="btn btn-primary sweep-go" data-action="sweep-start">Start the sweep</button>
          <button type="button" class="btn btn-ghost sweep-later-btn" data-action="sweep-later">Later</button>
        </div>`);
    }
    if (ov.step === 'done') {
      const count = k => ov.picks.filter(p => p === k).length;
      const nowLoop = ov.nowId ? getLoop(ov.nowId) : null;
      const line = nowLoop && nowLoop.status === 'active'
        ? `Your Now is “${esc(shortText(nowLoop.rawText, 60))}”. Everything else knows where it lives.`
        : 'Everything knows where it lives.';
      const chips = [['now', 'Now'], ['next', 'Up next'], ['park', 'Parked'], ['go', 'Let go']]
        .filter(([k]) => count(k))
        .map(([k, label]) => `<span class="sweep-chip">${label}: ${count(k)}</span>`).join('');
      return sheet(`
        <div class="sweep-hero">
          ${mascotSvg('proud', { width: 210, className: 'mascot-sealing', label: 'The mascot, proud, closed into a ring' })}
          <h2 class="sweep-h rise" id="sweep-title">Swept.</h2>
          <p class="sweep-p rise">${line}</p>
          <div class="sweep-chips rise">${chips}</div>
          <button type="button" class="btn btn-primary sweep-go rise" data-action="sweep-finish">Go to Active</button>

    }
