    const dots = items.map((_, i) => `<span class="sweep-dot${i < ov.idx ? ' done' : i === ov.idx ? ' on' : ''}"></span>`).join('');
    const progress = `<div class="sweep-dots" role="img" aria-label="Loop ${ov.idx + 1} of ${items.length}">${dots}</div>`;
    if (ov.step === 'park' && loop.kind === 'schedule') {
      // It moved: when is it now? A day and a time, no presets.
      const at = scheduleAt(loop);
      return sheet(`
        ${progress}
        <h2 class="sweep-h small" id="sweep-title">When is “${esc(shortText(loop.rawText, 40))}” now?</h2>
        ${scheduleFieldsHtml('sweep-sched', at !== null && at > Date.now() ? new Date(at) : null)}
        <div class="act-list">
          ${actBtn({ action: 'sweep-park', label: 'Save the time', primary: true, loopId: loop.id, attrs: 'data-when="schedule"', icon: ACT_ICON.clock })}
          ${actBtn({ action: 'sweep-park', label: 'Not sure yet', sub: 'It waits in Parked until you bring it back', loopId: loop.id, attrs: 'data-when=""', icon: ACT_ICON.next })}
        </div>
        <button type="button" class="btn btn-ghost sweep-back" data-action="sweep-back">Back</button>`);
    }
    if (ov.step === 'park') {
      const presets = wakePresets('park')
        .filter(p => p.id !== 'tonight' && p.id !== 'later')
        .map(p => actBtn({
          action: 'sweep-park', label: p.label, sub: formatEvent(p.when.toISOString()), loopId: loop.id,
          attrs: `data-when="${p.when.toISOString()}"`, icon: ACT_ICON.clock
        })).join('');
      return sheet(`
        ${progress}
        <h2 class="sweep-h small" id="sweep-title">When should “${esc(shortText(loop.rawText, 40))}” come back?</h2>
        <div class="act-list">
          ${presets}
          ${actBtn({ action: 'sweep-park', label: 'No date', sub: 'It waits in Parked until you bring it back', loopId: loop.id, attrs: 'data-when=""', icon: ACT_ICON.next })}
        </div>
        <button type="button" class="btn btn-ghost sweep-back" data-action="sweep-back">Back</button>`);
    }
    let reason;
    if (it.why === 'woke') {
      const d = loop.details || {};
      const schedAt = scheduleAt(loop);
      reason = loop.kind === 'ask' && d.sentAt
        ? { icon: 'person', text: `Checking back on ${askOf(loop).who || 'them'}` }
        : schedAt !== null
          ? { icon: 'cal', text: `${schedAt > Date.now() ? 'Starts' : Date.now() - schedAt < 15 * 60000 ? 'It’s time:' : 'Was'} ${formatEvent(new Date(schedAt).toISOString())}` }
          : { icon: 'sun', text: `You parked it until ${formatWake(loop.wakeAt)}` };
    } else {
      reason = { icon: 'dry', text: `Untouched ${untouchedDays(loop)} days. Still yours?` };
    }
    const detail = loop.promptAnswer ? `<p class="sweep-loop-next"><span>Next</span>${esc(loop.promptAnswer)}</p>` : '';
    const nowLoop = byStatus('active')[0];
    const hasOtherNow = !!(nowLoop && nowLoop.id !== loop.id);
    const dry = it.why === 'dry';
    return sheet(`
        ${progress}
        <h2 class="sr-only" id="sweep-title">Where does this one go?</h2>
        <article class="sweep-loop kind-${loop.kind || 'inbox'}">
          <div class="sweep-loop-top">${chipHtml(loop.kind)}<span class="sweep-count">${ov.idx + 1} of ${items.length}</span></div>
          <div class="sweep-reason"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true">${REASON_ICON[reason.icon]}</svg><span>${esc(reason.text)}</span></div>
          <h3 class="sweep-loop-title">${esc(loop.rawText)}</h3>
          ${detail}
        </article>
        <div class="sweep-grid">
          <button type="button" class="btn btn-primary" data-action="sweep-pick" data-pick="now">Make it Now</button>
          <button type="button" class="btn btn-ghost" data-action="sweep-pick" data-pick="next">${dry ? 'Keep it' : 'Up next'}</button>
          <button type="button" class="btn btn-ghost" data-action="sweep-pick" data-pick="park">${dry ? 'Park it' : loop.kind === 'schedule' ? 'Move it' : 'Park again'}</button>
          <button type="button" class="btn btn-ghost" data-action="sweep-pick" data-pick="go">Let go</button>
        </div>
        <p class="sweep-note">${hasOtherNow ? 'Make it Now puts it above your current Now. Up next leaves your Now as it is.' : 'Make it Now puts it at the top of Active.'}</p>`);
  }
  // The sweep starts with the mascot still asleep; it wakes up as you arrive.
  function wakeSweepMascot(ov) {
    setTimeout(() => {
      if (view.overlay !== ov || ov.step !== 'intro' || ov.awake) return;
      ov.awake = true;
      const old = document.querySelector('#overlay-root .sweep-mascot');
      if (!old) return;
      old.outerHTML = mascotSvg('awake', { width: 210, className: 'mascot-bob sweep-mascot mascot-hop', label: 'The Open Loops mascot, just awake' });
      Sound.play('wake');
    }, 900);
  }
  // One card’s choice, applied to the loop. Returns what to sync.
  function sweepApply(loop, pick, wakeAt, schedIso) {
    const top = byStatus('active')[0];
    const isNow = !!(top && top.id === loop.id);
    let patch;
    let rebalance = false;
    if (pick === 'now') {
      patch = isNow ? { position: loop.position } : { status: 'active', position: topPosition() };
    } else if (pick === 'next') {
      if (isNow) patch = { position: loop.position };
      else { const up = upNextPosition(loop.id); patch = { status: 'active', position: up.position }; rebalance = up.rebalance; }
    } else if (pick === 'park' && loop.kind === 'schedule') {
      // Moved to a new time (or no time yet): where it waits follows from it.
      patch = schedulePatch(loop, schedIso || null, schedIso ? {} : { status: 'waiting' });
      if (patch.status === 'active') { const up = upNextPosition(loop.id); patch.position = up.position; rebalance = up.rebalance; }
    } else if (pick === 'park') {
      patch = { status: 'waiting', wakeAt: wakeAt || null };
    } else {
      patch = { status: 'released', completedAt: nowIso(), details: cleanDetails({ ...loop.details, outcome: 'let_go' }) };
    }
    updateLoop(loop.id, patch);
    return { patch, positionChanges: rebalance ? rebalanceActivePositions() : null };
  }

  // "Still yours?" for one cracked loop.
  function renderStillYours(loop) {
    if (!loop) return '';
    const days = untouchedDays(loop);
    return `
      <div class="overlay-card still-sheet" role="dialog" aria-modal="true" aria-labelledby="still-title">
        <div class="overlay-header">
          <div class="still-art">${mascotSvg('cheeky', { width: 88 })}</div>
          ${SHEET_CLOSE}
        </div>
        <h2 class="overlay-title" id="still-title">Still yours?</h2>
        <p class="overlay-subtitle">“${esc(shortText(loop.rawText, 80))}” hasn’t been touched in ${days} days.</p>
        <div class="still-actions">
          <button type="button" class="btn btn-primary" data-action="still-keep" data-loop-id="${esc(loop.id)}">Yes, keep it</button>
          <button type="button" class="btn btn-ghost" data-action="open-when" data-loop-id="${esc(loop.id)}">Park it until…</button>
          <button type="button" class="btn btn-ghost" data-action="still-let-go" data-loop-id="${esc(loop.id)}">Let it go</button>
        </div>
      </div>`;
  }

  // ── MUSIC THAT BUILDS ──
  // Every loop you close in one sitting adds a note to the landing chord; a
  // sitting ends after half an hour without a close. Clearing Active after
  // two or more closes plays the whole chord.
  const Combo = (() => {
    const SITTING_MS = 30 * 60000;
    let kinds = [];
    let lastAt = 0;
    const live = () => Date.now() - lastAt <= SITTING_MS;
    return {
      hit(kind) { if (!live()) kinds = []; kinds.push(kind || 'inbox'); lastAt = Date.now(); },
      count() { return live() ? kinds.length : 0; },
      kinds() { return live() ? kinds.slice() : []; },
      fresh() { return Date.now() - lastAt < 4000; }
    };
  })();
  // ── YOUR HEAD ──
  // A look back, built only from loops you’ve already closed: your shelf,
  // how long things take, and what you decided. Nothing here leaves the app.
  const KIND_PLURAL = { do: 'Do loops', decide: 'Decisions', ask: 'Asks', schedule: 'Schedules' };
  const SHARE_ICON = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 10V2.5M8 2.5 5 5.5M8 2.5l3 3M3 9v3.5A1.5 1.5 0 0 0 4.5 14h7a1.5 1.5 0 0 0 1.5-1.5V9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  function monthYear(t) { return new Date(t).toLocaleDateString(undefined, { month: 'long', year: 'numeric' }); }
  function dayMonth(v) { return new Date(v).toLocaleDateString(undefined, { day: 'numeric', month: 'short' }); }
  function daysText(d) {
    if (d < 1) return 'under a day';
    const n = Math.round(d);
    return n === 1 ? '1 day' : `${n} days`;
  }
  function heldDays(l) { return Math.max(0, (new Date(l.completedAt) - new Date(l.createdAt)) / 86400000); }
  function headStats() {
    const closed = data.loops
      .filter(l => l.status === 'released' && l.completedAt)
      .sort((a, b) => new Date(a.completedAt) - new Date(b.completedAt));
    const done = closed.filter(l => !isLetGo(l));
    const letGo = closed.filter(isLetGo);
    const open = data.loops.filter(l => l.status !== 'released').length;
    let first = Infinity;
    data.loops.forEach(l => { const t = new Date(l.createdAt).getTime(); if (Number.isFinite(t) && t < first) first = t; });
    const longest = done.reduce((best, l) => (!best || heldDays(l) > heldDays(best) ? l : best), null);
    const speeds = ['schedule', 'ask', 'do', 'decide'].map(kind => {
      const ds = done.filter(l => l.kind === kind).map(heldDays).sort((a, b) => a - b);
      if (ds.length < 2) return null;
      const mid = Math.floor(ds.length / 2);
      return { kind, days: ds.length % 2 ? ds[mid] : (ds[mid - 1] + ds[mid]) / 2 };
    }).filter(Boolean);
    const decisions = done.filter(l => l.details && l.details.decision).slice(-6).reverse();
    return { closed, done, letGo, open, first, longest, speeds, decisions };
  }
  function renderProfile() {
    const s = headStats();
    const since = Number.isFinite(s.first) ? `Emptying it since ${monthYear(s.first)}` : 'Nothing here yet';
    let body = `
        <div class="head-hero">
          ${mascotSvg(s.closed.length ? 'proud' : 'curious', { width: 104 })}
          <div><h2 class="overlay-title head-title" id="head-title">Your head</h2><p class="head-since">${esc(since)}</p></div>
        </div>
        ${accountHtml()}
        <div class="head-tiles">
          <div class="head-tile t-done"><b>${s.done.length}</b><span>closed</span></div>
          <div class="head-tile t-letgo"><b>${s.letGo.length}</b><span>let go</span></div>
          <div class="head-tile t-open"><b>${s.open}</b><span>open now</span></div>
        </div>`;
    if (!s.closed.length) {
      body += `<div class="empty-state head-empty"><strong>Nothing on your shelf yet.</strong>Close a loop and it lands here as a ring. Let one go and it becomes a pebble.</div>`;
    } else {
      const shelfItems = s.closed.slice(-210);
      const more = s.closed.length - shelfItems.length;
      body += `
        <div class="head-label"><span>Your shelf</span><span class="head-hint">Rings closed, pebbles let go</span></div>
        <div class="head-shelf" role="img" aria-label="${s.done.length} rings and ${s.letGo.length} pebbles">${shelfItems.map(shelfItemHtml).join('')}${more ? `<span class="head-more">+${more}</span>` : ''}</div>`;
      if (s.longest) {
        body += `
        <div class="head-label"><span>Longest held, finally closed</span></div>
        <div class="head-card head-longest">${clayRingHtml(s.longest.kind)}<div><b>${esc(s.longest.rawText)}</b><span>Open ${daysText(heldDays(s.longest))} · closed ${esc(dayMonth(s.longest.completedAt))}</span></div></div>`;
      }
      if (s.speeds.length) {
        const max = Math.max(...s.speeds.map(x => x.days), 0.5);
        const rows = s.speeds.map(x => `
          <div class="head-speed"><span class="head-speed-kind">${esc(kindMeta[x.kind].label)}</span><span class="head-bar"><span style="width:${Math.max(4, Math.round(x.days / max * 100))}%;background:var(--${x.kind})"></span></span><span class="head-speed-days">${daysText(x.days)}</span></div>`).join('');
        let insight = '';
        if (s.speeds.length >= 2) {
          const slow = s.speeds.reduce((a, b) => (b.days > a.days ? b : a));
          const fast = s.speeds.reduce((a, b) => (b.days < a.days ? b : a));
          if (slow.days - fast.days >= 1) insight = `<p class="head-insight">${KIND_PLURAL[slow.kind]} sit longest. ${KIND_PLURAL[fast.kind]} close fastest.</p>`;
        }
        body += `
        <div class="head-label"><span>How fast you close</span><span class="head-hint">Typical time</span></div>
        <div class="head-card head-speeds">${rows}</div>${insight}`;
      }
      if (s.decisions.length) {
        body += `
        <div class="head-label"><span>Decisions you made</span></div>
        <div class="head-card head-list">${s.decisions.map(l => `<div class="head-row"><span>${esc(l.details.decision)}</span><span class="head-date">${esc(dayMonth(l.completedAt))}</span></div>`).join('')}</div>`;
      }
    }
    const monthName = new Date().toLocaleDateString(undefined, { month: 'long' });
    body += monthCloses().length
      ? `<button type="button" class="btn btn-primary head-share no-autofocus" data-action="open-share">${SHARE_ICON}Share your ${esc(monthName)}</button>
         <p class="head-fine">The card shows colors and counts. Never what your loops say.</p>`

  // ── DEEP LINKS ──
  // Notifications open the app at the right place:

  function takeDeepLink(search) {
    let params;

    const sweep = params.has('sweep');
    const profile = params.has('profile');
    const loopId = params.get('loop');
    if (!sweep && !profile && !loopId) return;
    if (search === location.search) {
      try { history.replaceState({}, document.title, location.pathname); } catch (_) {}
    }
    if (!Sync.isLoggedIn() || view.onboardingStep >= 0) return;
    if (sweep) {
      const items = sweepItems();
      if (!items.length) { toast('All swept. Nothing is waiting.'); return; }
      view.overlay = { type: 'sweep', step: 'intro', items, idx: 0, picks: [] };

    const draggable = dragEnabled ? ' draggable="true" data-draggable-loop="1"' : '';
    const handle = dragHandleHtml(dragEnabled);
    const canMoveUp = dragEnabled && idx > 0;
    const canMoveDown = dragEnabled && idx < (opts.total || 0) - 1;
    const reorderControls = dragEnabled ? `
      <span class="reorder-controls" aria-label="Reorder loop">
        <button class="reorder-btn" type="button" data-action="move-loop-up" data-loop-id="${esc(loop.id)}" title="Move up" aria-label="Move loop up" ${canMoveUp ? '' : 'disabled'}>
          <svg viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M7 3.2 3.8 6.4M7 3.2l3.2 3.2M7 3.2v7.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="reorder-btn" type="button" data-action="move-loop-down" data-loop-id="${esc(loop.id)}" title="Move down" aria-label="Move loop down" ${canMoveDown ? '' : 'disabled'}>
          <svg viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M7 10.8 3.8 7.6M7 10.8l3.2-3.2M7 10.8V3.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </span>` : '';

    if (isEditing) {
      const editLen = (loop.rawText || '').length;
      const editCounterClass = editLen >= MAX_LOOP_TEXT_LEN
        ? ' at-limit'
        : editLen >= MAX_LOOP_TEXT_LEN - 50 ? ' near-limit' : '';
      return `
        <article class="loop-card kind-${loop.kind || 'inbox'}${hl}" style="${delay}" data-loop-id="${esc(loop.id)}"${draggable}>
          <div class="loop-card-top">
            <div class="loop-card-top-left">${handle}${chipHtml(loop.kind)}</div>
            <div class="loop-card-tools">
              <button class="card-overflow" data-action="open-menu" data-loop-id="${esc(loop.id)}" title="More" aria-label="More options">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><circle cx="3" cy="7" r="1.2" fill="currentColor"/><circle cx="7" cy="7" r="1.2" fill="currentColor"/><circle cx="11" cy="7" r="1.2" fill="currentColor"/></svg>
              </button>
            </div>
          </div>
          <textarea class="inline-edit-input" id="inline-edit-${esc(loop.id)}" rows="2" maxlength="${MAX_LOOP_TEXT_LEN}">${esc(loop.rawText)}</textarea>
          <div class="inline-edit-meta">
            <span class="char-counter${editCounterClass}" id="inline-edit-counter-${esc(loop.id)}" aria-live="polite">${editLen}/${MAX_LOOP_TEXT_LEN}</span>
          </div>
          <div class="loop-card-bottom">
            <button class="btn-action btn btn-sm" data-action="inline-edit-save" data-loop-id="${esc(loop.id)}">Save</button>
            <button class="btn-ghost btn btn-sm" data-action="inline-edit-cancel">Cancel</button>
          </div>
        </article>`;
    }

    const focus = opts.focus ? ' is-focus' : '';
    return `
      <article class="loop-card kind-${loop.kind || 'inbox'}${hl}${focus}${dryClass(loop)}" style="${delay}" data-loop-id="${esc(loop.id)}"${draggable}>
        ${opts.focus ? `<div class="focus-eyebrow">Now</div>` : ''}
        <div class="loop-card-top">
          <div class="loop-card-top-left">${handle}${chipHtml(loop.kind)}${reasonHtml(loop)}</div>
          <div class="loop-card-tools">
            ${reorderControls}
            <button class="card-overflow" data-action="open-menu" data-loop-id="${esc(loop.id)}" title="More" aria-label="More options">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><circle cx="3" cy="7" r="1.2" fill="currentColor"/><circle cx="7" cy="7" r="1.2" fill="currentColor"/><circle cx="11" cy="7" r="1.2" fill="currentColor"/></svg>
            </button>
          </div>
        </div>
        <p class="loop-title" data-action="inline-edit-start" data-loop-id="${esc(loop.id)}" title="Click to edit" style="cursor:text">${esc(loop.rawText)}</p>
        ${nextLineHtml(loop)}
        ${loopMetaHtml(loop)}
        <div class="loop-card-bottom">
          <button class="btn-action kind-${loop.kind || 'inbox'}" data-action="primary-action" data-loop-id="${esc(loop.id)}">${esc(actionLabel(loop))}</button>
          ${stillYoursBtn(loop)}
        </div>
      </article>`;
  }

  // Where an empty list would go while the app doesn’t know yet: loop bars,
  // or, when nothing is saved here and the server can’t be reached, say so.
  function notKnownYetHtml() {
    if (bootState === 'unreachable') {
      return `<div class="empty-state">${mascotSvg('sleepy', { width: 170 })}<strong>Can’t reach your loops right now.</strong>They’re safe in your account. Check your connection, then try again.<div><button class="btn btn-ghost" type="button" data-action="boot-retry">Try again</button></div></div>`;
    }
    return `<div class="loop-bars" role="status" aria-label="Loading your loops"><span></span><span></span><span></span></div>`;
  }

  // ── HOME RENDER ──
  function renderHome() {
    const active = byStatus('active');
    const cap = view.loopCap || DEFAULT_LOOP_CAP;
    const visible = view.expanded ? active : active.slice(0, cap);
    const waiting = byStatus('waiting');
    const released = byStatus('released');
    const inbox = byStatus('inbox');
    const hidden = Math.max(0, active.length - visible.length);

    let html = '';

    const HEAD = {
      now:   { title: TAB_LABEL.active,   sub: 'Only a few things, on purpose.' },
      later: { title: TAB_LABEL.waiting,  sub: 'Set aside for later.' },
      inbox: { title: TAB_LABEL.inbox,    sub: 'New thoughts, not sorted yet.' },
      done:  { title: TAB_LABEL.released, sub: 'Done or let go.' }
    };
    const tabKey = view.activeTab === 'waiting' ? 'later' : view.activeTab === 'released' ? 'done' : view.activeTab;
    const head = HEAD[tabKey] || HEAD.now;
    let meter = '';
    const known = dataKnown();
    // Counts are claims too: "0" while loading is as false as an empty state.
    const count = n => known ? ` <span class="tab-count">${n}</span>` : '';
    if (tabKey === 'now' && known) {
      const used = Math.min(active.length, cap);
      const dots = Array.from({ length: cap }, (_, i) => `<span class="cap-meter-dot${i < used ? ' on' : ''}"></span>`).join('');
      const over = active.length > cap ? ` · +${active.length - cap} waiting` : '';
      meter = `<div class="cap-meter" title="Focus cap"><div class="cap-meter-dots">${dots}</div><div class="cap-meter-label">${used} of ${cap} focus slots${over}</div></div>`;
    }
    if (tabKey === 'done' && known) {
      const week = closedThisWeek();
      if (week.length) {
        const shown = week.slice(-21);
        const letGoCount = week.filter(isLetGo).length;
        const doneCount = week.length - letGoCount;
        const label = letGoCount ? `${doneCount} closed · ${letGoCount} let go this week` : `${doneCount} closed this week`;
        meter = `<button type="button" class="cap-meter closed-shelf" data-action="open-profile" title="See your whole shelf"><div class="ring-shelf" role="img" aria-label="${esc(label)}">${shown.map(shelfItemHtml).join('')}</div><div class="cap-meter-label">${esc(label)} <span class="shelf-more">Your head →</span></div></button>`;
      }
    }
    html += `
      <header class="page-head">
        <div>
          <h1 class="page-title">${head.title}</h1>
          <p class="page-sub">${head.sub}</p>
        </div>
        ${meter}
      </header>`;

    html += `
      <div class="tabs">
        <button class="tab ${view.activeTab === 'now' ? 'active' : ''}" data-action="set-tab" data-tab="now">
          ${TAB_LABEL.active}${count(active.length)}
        </button>
        <button class="tab ${view.activeTab === 'later' ? 'active' : ''}" data-action="set-tab" data-tab="later">
          ${TAB_LABEL.waiting}${count(waiting.length)}
        </button>
        <button class="tab ${view.activeTab === 'inbox' ? 'active' : ''}" data-action="set-tab" data-tab="inbox">
          ${TAB_LABEL.inbox}${count(inbox.length)}
        </button>
      </div>`;

    if (view.activeTab === 'now') {
      html += `<div class="tab-panel active" id="tab-now">`;
      const sweepNow = sweepBannerItems();
      if (sweepNow.length) html += sweepBannerHtml(sweepNow);
      noteHiddenActive(visible, known);
      if (visible.length) {
        html += `<div class="loop-stack" data-active-stack="1">${visible.map((l,i) => (i === 1 ? `<div class="up-next-label">Up next</div>` : '') + cardHtml(l,i, { draggable: true, total: visible.length, focus: i === 0 })).join('')}</div>`;
        if (hidden > 0 && !view.expanded) {
          html += `<button class="show-more" data-action="show-more">Show ${hidden} more loop${hidden > 1 ? 's' : ''}</button>`;
        }
      } else if (!known) {
        html += notKnownYetHtml();
      } else if (Combo.count() >= 2) {
        const n = Combo.count();
        html += `<div class="empty-state cleared">${mascotSvg('proud', { width: 210, className: Combo.fresh() ? 'mascot-sealing' : '', label: 'The mascot, proud, closed into a ring' })}<strong>Active is clear.</strong>${n} closes, one full chord.${sharePromptHtml()}</div>`;
      } else if (inbox.length) {
        // Unsorted captures are still open loops, so the head isn’t clear.
        html += `<div class="empty-state">${mascotSvg('calm', { width: 190 })}<strong>Active is clear.</strong>${inbox.length} in Inbox to sort.<div><button class="btn btn-ghost" type="button" data-action="set-tab" data-tab="inbox">Sort Inbox</button></div></div>`;
      } else {
        html += `<div class="empty-state">${mascotSvg('calm', { width: 190 })}<strong>Your head is clear.</strong>Capture a loop, then sort it when you’re ready.</div>`;
      }
      html += `</div>`;
    }

    if (view.activeTab === 'later' || view.activeTab === 'waiting') {
      html += `<div class="tab-panel active" id="tab-later">`;
      if (waiting.length) {
        html += `<div class="loop-stack">`;
        // Soonest wake time first; loops with no wake time keep their order at the end.
        const byWake = waiting.slice().sort((a, b) => {
          const wa = a.wakeAt ? new Date(a.wakeAt).getTime() : Infinity;
          const wb = b.wakeAt ? new Date(b.wakeAt).getTime() : Infinity;
          return wa !== wb ? wa - wb : (b.position || 0) - (a.position || 0);
        });
        byWake.forEach((loop, i) => {
          html += `
            <article class="loop-card kind-${loop.kind || 'inbox'}${dryClass(loop)}" data-loop-id="${esc(loop.id)}" style="animation-delay:${i*0.04}s">
              <div class="loop-card-top"><div class="loop-card-top-left">${chipHtml(loop.kind)}${reasonHtml(loop)}</div><button class="card-overflow" data-action="open-menu" data-loop-id="${esc(loop.id)}" title="More" aria-label="More options"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><circle cx="3" cy="7" r="1.2" fill="currentColor"/><circle cx="7" cy="7" r="1.2" fill="currentColor"/><circle cx="11" cy="7" r="1.2" fill="currentColor"/></svg></button></div>
              <p class="loop-title">${esc(loop.rawText)}</p>
              ${nextLineHtml(loop, 'Note', '-')}
              ${loopMetaHtml(loop)}
              <div class="loop-card-bottom">
                <button class="btn-action" data-action="restore-active" data-loop-id="${esc(loop.id)}">Make active</button>
                <button class="btn-action" data-action="open-when" data-loop-id="${esc(loop.id)}">${loop.wakeAt ? 'Change time' : 'Set a time'}</button>
                ${stillYoursBtn(loop)}
              </div>
            </article>`;
        });
        html += `</div>`;
      } else if (!known) {
        html += notKnownYetHtml();
      } else {
        html += `<div class="empty-state">${mascotSvg('sleepy', { width: 190 })}<strong>Nothing parked.</strong>Park loops here when the next move isn’t yours yet.</div>`;
      }
      html += `</div>`;
    }

    if (view.activeTab === 'done' || view.activeTab === 'released') {
      html += `<div class="tab-panel active" id="tab-done">`;
      if (released.length) {
        html += `<div class="loop-stack">`;
        released.forEach((loop, i) => {
          html += `
            <article class="loop-card kind-${loop.kind || 'inbox'}" data-loop-id="${esc(loop.id)}" style="animation-delay:${i*0.04}s;opacity:0.72">
              <div class="loop-card-top">${chipHtml(loop.kind)}<button class="card-overflow" data-action="open-menu" data-loop-id="${esc(loop.id)}" title="More" aria-label="More options"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><circle cx="3" cy="7" r="1.2" fill="currentColor"/><circle cx="7" cy="7" r="1.2" fill="currentColor"/><circle cx="11" cy="7" r="1.2" fill="currentColor"/></svg></button></div>
              <p class="loop-title" style="text-decoration:line-through;color:var(--text-2)">${esc(loop.rawText)}</p>
              ${loop.details && loop.details.decision
                ? `<div class="loop-next"><span class="loop-next-label">Decided</span><span>${esc(loop.details.decision)}</span></div>`
                : `<div class="loop-next"><span class="loop-next-label">Note</span><span>${esc(loop.promptAnswer || '-')}</span></div>`}
              ${loopMetaHtml(loop)}
              <div class="loop-card-bottom">
                <button class="btn-action" data-action="restore-active" data-loop-id="${esc(loop.id)}">Reopen</button>
              </div>
            </article>`;
        });
        html += `</div>`;
      } else if (!known) {
        html += notKnownYetHtml();
      } else {
        html += `<div class="empty-state">${mascotSvg('curious', { width: 190 })}<strong>Nothing closed yet.</strong>When a loop is done, close it here.</div>`;
      }
      html += `</div>`;
    }

    if (view.activeTab === 'inbox') {
      html += `<div class="tab-panel active" id="tab-inbox">`;
      if (inbox.length) {
        html += `<div class="loop-stack">`;
        inbox.forEach((loop, i) => {
          html += `
            <article class="loop-card kind-${loop.kind || 'inbox'}" data-loop-id="${esc(loop.id)}" style="animation-delay:${i*0.04}s">
              <div class="loop-card-top">${chipHtml(loop.kind || 'inbox')}<button class="card-overflow" data-action="open-menu" data-loop-id="${esc(loop.id)}" title="More" aria-label="More options"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><circle cx="3" cy="7" r="1.2" fill="currentColor"/><circle cx="7" cy="7" r="1.2" fill="currentColor"/><circle cx="11" cy="7" r="1.2" fill="currentColor"/></svg></button></div>
              <p class="loop-title">${esc(loop.rawText)}</p>
              ${loopMetaHtml(loop)}
              <div class="loop-card-bottom">
                <button class="btn-action" data-action="define-raw" data-loop-id="${esc(loop.id)}">Sort it</button>
              </div>
            </article>`;
        });
        html += `</div>`;
      } else if (!known) {
        html += notKnownYetHtml();
      } else {
        html += `<div class="empty-state">${mascotSvg('cheeky', { width: 190 })}<strong>Inbox zero.</strong>New loops wait here until you sort them.</div>`;
      }
      html += `</div>`;
    }

    html += `
      <button class="fab${fabTucked ? ' tucked' : ''}" data-action="open-capture" type="button">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><line x1="7" y1="2" x2="7" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="2" y1="7" x2="12" y2="7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Capture
      </button>`;

    return html;
  }
  // ── CAPTURE ──
  // Capture is only about getting it out of your head. Kind is optional.
  // Enter adds and keeps the sheet open for the next one (brain-dump mode).
  function renderCapture(ov) {
    if (!ov) return '';
    const closeBtn = `<button class="overlay-close" data-action="close-overlay" title="Close" aria-label="Close"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><line x1="4" y1="4" x2="12" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="12" y1="4" x2="4" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>`;
    const len = (ov.rawText || '').length;
    const added = ov.added || 0;
    const chips = ['do','decide','ask','schedule','let_go'].map(k => `
      <button type="button" class="kind-pick ${k}${ov.kind === k ? ' on' : ''}" data-action="pick-raw-kind" data-kind="${k}" aria-pressed="${ov.kind === k}"><span class="kind-dot"></span>${kindMeta[k].label}</button>`).join('');
    const hasText = !!(ov.rawText || '').trim();
    return `
      <div class="overlay-card capture-card" role="dialog" aria-modal="true" aria-labelledby="capture-title">
        <div class="overlay-header">
          <div class="overlay-meta"><div class="overlay-eyebrow">New loop</div></div>
          ${closeBtn}
        </div>
        <h2 class="overlay-title" id="capture-title">Get it out of your head.</h2>
        <p class="overlay-subtitle">It lands in Inbox. Sort it later.</p>
        <textarea class="big-input capture-input" id="capture-input" rows="2" placeholder="One unfinished thing…" maxlength="${MAX_LOOP_TEXT_LEN}" aria-describedby="capture-hint" enterkeyhint="next">${esc(ov.rawText)}</textarea>
        <div class="input-hint-row">
          <p class="input-hint" id="capture-hint">${added ? `<b class="capture-added">${added} added.</b> ` : ''}Press Enter to add it and write the next one.</p>
          <span class="char-counter" id="capture-counter" aria-live="polite">${len}/${MAX_LOOP_TEXT_LEN}</span>
        </div>
        <div class="capture-when" id="capture-when" aria-live="polite">${captureWhenHtml(ov)}</div>
        <div class="capture-kinds">
          <div class="capture-kinds-label">Already know the kind? <span>Optional</span></div>
          <div class="kind-picks" role="group" aria-label="Kind (optional)">${chips}</div>
        </div>
        <div class="overlay-actions">
          <button class="btn btn-ghost" data-action="close-overlay">${added ? 'Done' : 'Cancel'}</button>
          <button class="btn btn-primary" data-action="save-raw-loop" ${hasText ? '' : 'disabled'}>${esc(captureSaveLabel(ov))}</button>
        </div>
      </div>`;
  }

  // A day or time typed into a new loop ("call the bank friday") becomes an
  // offer, never an automatic change: "Wake it Fri 9:00 AM?". Accepting it
  // parks the loop until then instead of adding it to Inbox.
  function captureWhen(ov) {
    // A Schedule loop’s time is when it happens, not when to bring it back.
    if (!ov || ov.kind === 'schedule') return null;
    const text = (ov.rawText || '').trim();
    if (!text) return null;
    const hit = parseWhen(text);
    if (!hit || !hit.date || hit.date.getTime() <= Date.now() + 60000) return null;
    return hit.date;
  }
  function captureWakeOn(ov) {
    const d = captureWhen(ov);
    return !!(d && ov.wakeFor && ov.wakeFor === d.toISOString());
  }
  function captureWhenHtml(ov) {
    const d = captureWhen(ov);
    if (!d) return '';
    const on = captureWakeOn(ov);
    const label = formatWake(d.toISOString());
    const icon = on
      ? '<path d="M3.5 8.5 6.5 11.5 12.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>'
      : REASON_ICON.sun;
    return `
      <button type="button" class="when-chip${on ? ' on' : ''}" data-action="capture-when-toggle" aria-pressed="${on}">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">${icon}</svg><span>${on ? `Wakes ${esc(label)}` : `Wake it ${esc(label)}?`}</span>
      </button>
      <span class="when-chip-hint">${on ? 'It goes to Parked until then. Tap to undo.' : 'Back in Up next then, instead of Inbox.'}</span>`;
  }
  function captureSaveLabel(ov) {
    if (!captureWakeOn(ov)) return 'Add to Inbox';
    const d = captureWhen(ov);
    return `Park until ${formatWake(d.toISOString())}`;
  }
  function refreshCaptureWhen(ov) {
    const box = document.getElementById('capture-when');
    if (box) {
      const html = captureWhenHtml(ov);
      const sig = html.replace(/\s+/g, ' ');
      if (box.dataset.sig !== sig) { box.innerHTML = html; box.dataset.sig = sig; }
    }
    const btn = document.querySelector('#overlay-root [data-action="save-raw-loop"]');
    if (btn) btn.textContent = captureSaveLabel(ov);
  }

  // ── DEFINE AND ROUTE ──
  // Three short steps, one question each:
  //   1. What kind of attention?  (tap = next)
  //   2. The kind’s own next-step question  (the part that quiets the loop)
  //   3. Where does it go?  (tap = done)
  const DEFINE_Q = {
    do:       { q: "What’s the very next step you can see?", ph: 'e.g. Open the doc and write the first line' },
    decide:   { q: 'What exactly are you deciding?',          ph: 'e.g. Air 15 or X1, decide by Friday' },
    ask:      { q: 'Who do you need, and for what?',          ph: 'e.g. Bilal: can he start before the 15th?' },
    schedule: { q: 'When will it happen?',                    ph: 'e.g. Saturday 10am, book it on Thursday' },
    let_go:   { q: 'What are you letting go of?',             ph: 'Optional' }
  };
  const KIND_HINT = {
    do: 'A concrete action you can start now',
    decide: "A choice you’re holding open",
    ask: 'Something you need from someone',
    schedule: 'Needs a real time on the calendar',
    let_go: 'Choose to release it'
  };

  // Where Define’s "When is it?" starts: the time already picked, else what
  // the note says, else empty. Never an invented default: a "tomorrow 9:00"
  // you didn’t choose is a false answer one tap away from being saved.
  function defineWhen(loop, ov) {
    const picked = ov.at ? new Date(ov.at) : (loop.details && loop.details.at ? new Date(loop.details.at) : null);
    if (picked && !Number.isNaN(picked.getTime())) return { date: picked, readFrom: null };
    const parsed = parseWhen(ov.rawText ?? loop.rawText) || parseWhen(loop.promptAnswer);
    if (parsed && parsed.date.getTime() > Date.now()) return { date: parsed.date, readFrom: parsed.text };
    return { date: null, readFrom: null };
  }

  function renderDefineRaw(loop) {
    if (!loop) return '';
    const ov = view.overlay || {};
    const step = ov.step || 1;
    const kind = ov.kind || null;
    const rawText = ov.rawText ?? loop.rawText;
    const close = `<button class="overlay-close" data-action="close-overlay" title="Close" aria-label="Close"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><line x1="4" y1="4" x2="12" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="12" y1="4" x2="4" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>`;
    const back = step > 1
      ? `<button class="overlay-close define-back" data-action="define-back" title="Back" aria-label="Back"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3.5 5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`
      : '';
    const bars = [1, 2, 3].map(i => `<span class="${i <= step ? 'on' : ''}"></span>`).join('');
    const kindChip = kind
      ? `<button type="button" class="kind-chip ${kind} define-kind-chip" data-action="define-change-kind" title="Change kind"><span class="kind-dot"></span>${kindMeta[kind].label}<span class="define-chip-edit">Change</span></button>`
      : '';

    let body = '';
    if (step === 1) {
      const tiles = ['do','decide','ask','schedule','let_go'].map(k => `
        <button type="button" class="kind-tile ${k}${kind === k ? ' on' : ''}" data-action="define-pick-kind" data-kind="${k}" aria-pressed="${kind === k}">
          <span class="kind-tile-dot"></span>
          <span class="kind-tile-label">${kindMeta[k].label}</span>
          <span class="kind-tile-hint">${KIND_HINT[k]}</span>
        </button>`).join('');
      body = `
        <h3 class="step-q" id="define-step-q">What kind of attention does this need?</h3>
        <div class="kind-tiles" role="group" aria-labelledby="define-step-q">${tiles}</div>`;
    } else if (step === 2 && kind === 'schedule') {
      const when = defineWhen(loop, ov);
      body = `
        <div class="step-kind">${kindChip}</div>
        <h3 class="step-q" id="define-when-q">When is it?</h3>
        <div class="define-when" role="group" aria-labelledby="define-when-q">
          ${scheduleFieldsHtml('define', when.date, true)}
        </div>
        ${when.readFrom ? `<p class="input-hint">Read from your note: “${esc(when.readFrom)}”. Change it if that’s wrong.</p>` : ''}
        <div class="overlay-actions">
          <button class="btn btn-ghost" data-action="define-next" data-skip="1">Not sure yet</button>
          <button class="btn btn-primary" data-action="define-next">Next</button>
        </div>`;
    } else if (step === 2) {
      const q = DEFINE_Q[kind] || DEFINE_Q.do;
      const ans = ov.promptAnswer || '';
      body = `
        <div class="step-kind">${kindChip}</div>
        <h3 class="step-q"><label for="define-detail-input">${q.q}</label></h3>
        <textarea class="big-input" id="define-detail-input" rows="2" placeholder="${esc(q.ph)}" maxlength="${MAX_LOOP_TEXT_LEN}" enterkeyhint="next" aria-describedby="define-detail-hint">${esc(ans)}</textarea>
        <div class="input-hint-row">
          <p class="input-hint" id="define-detail-hint">One sentence is enough.</p>
          <span class="char-counter" id="define-detail-counter" aria-live="polite">${ans.length}/${MAX_LOOP_TEXT_LEN}</span>
        </div>
        <div class="overlay-actions">
          <button class="btn btn-ghost" data-action="define-next" data-skip="1">Skip</button>
          <button class="btn btn-primary" data-action="define-next">Next</button>
        </div>`;
    } else {
      const active = data.loops.filter(l => l.status === 'active' && l.id !== loop.id).length;
      const cap = view.loopCap || DEFAULT_LOOP_CAP;
      const full = active >= cap;
      const wasActive = loop.status === 'active';
      // A timed Schedule loop is out of your head until just before it
      // happens, so Park is the natural home and says when it comes back.
      const schedAt = kind === 'schedule' && ov.at ? new Date(ov.at).getTime() : null;
      const schedNudge = schedAt ? scheduleNudgeFor(schedAt) : null;
      const nudgeWhen = schedNudge ? formatWake(schedNudge) : '';
      const suggest = kind === 'let_go' ? 'released' : schedNudge ? 'waiting' : (full && !wasActive ? 'waiting' : 'active');
      const activeHint = schedNudge
        ? `${wasActive ? 'Stays in Active' : 'Into Active now'}, with a nudge ${nudgeWhen}.`
        : wasActive ? 'Stays where it is in Active.' : 'Into Active, right under your Now card.';
      const parkHint = schedNudge
        ? `Out of your head until ${nudgeWhen}, then back with a nudge.`
        : 'Not now. It waits in Parked.';
      const routes = [
        { key: 'active',   title: wasActive ? 'Keep in Active' : 'Up next', hint: activeHint },
        { key: 'waiting',  title: 'Park',  hint: parkHint },
        { key: 'released', title: 'Close', hint: kind === 'let_go' ? 'Let it go. It lands on your shelf.' : 'Already done. It lands on your shelf.' }
      ].map(r => `
        <button type="button" class="route-big ${r.key}${suggest === r.key ? ' suggested' : ''}" data-action="finish-define-raw" data-status="${r.key}" data-loop-id="${esc(loop.id)}">
          <span class="route-big-title">${r.title}${suggest === r.key ? '<span class="route-suggest">Suggested</span>' : ''}</span>
          <span class="route-big-hint">${r.hint}</span>
        </button>`).join('');
      body = `
        <div class="step-kind">${kindChip}</div>
        ${kind === 'schedule' && ov.at ? `<p class="step-note define-when-note"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true">${REASON_ICON.cal}</svg><span>${esc(formatEvent(ov.at))}</span></p>` : ''}
        <h3 class="step-q" id="define-route-q">Where does it go?</h3>
        ${full && !wasActive && kind !== 'let_go' ? `<p class="step-note">Active is full (${active} of ${cap}). Parking keeps your focus clear.</p>` : ''}
        <div class="route-bigs" role="group" aria-labelledby="define-route-q">${routes}</div>`;
    }

    return `
      <div class="overlay-card define-card" role="dialog" aria-modal="true" aria-labelledby="define-title-label">
        <div class="define-top">
          ${back}
          <div class="define-progress" aria-hidden="true">${bars}</div>
          <span class="define-stepcount" id="define-title-label">Sort · ${step} of 3</span>
          ${close}
        </div>
        <textarea class="define-title-input" id="define-raw-input" rows="1" maxlength="${MAX_LOOP_TEXT_LEN}" aria-label="Loop text" enterkeyhint="done">${esc(rawText)}</textarea>
        <div class="define-body" data-step="${step}">${body}</div>
      </div>`;
  }

  // Grow a textarea to fit its text (no inner scrollbar for short loops).
  function autoGrow(el) {
    if (!el) return;
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  }

  // Move the define sheet to another step: the body slides sideways and the
  // sheet eases to its new height instead of jumping.
  function goDefineStep(step, dir) {
    const ov = view.overlay;
    if (!ov || ov.type !== 'define-raw') return;
    const card = document.querySelector('#overlay-root .define-card');
    const h0 = card ? card.getBoundingClientRect().height : 0;
    ov.step = step;
    renderOverlay();
    const card2 = document.querySelector('#overlay-root .define-card');
    const body = card2 && card2.querySelector('.define-body');
    autoGrow(document.getElementById('define-raw-input'));
    const calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (card2 && h0 && !calm) {
      const h1 = card2.getBoundingClientRect().height;
      if (Math.abs(h1 - h0) > 2) card2.animate([{ height: h0 + 'px' }, { height: h1 + 'px' }], { duration: 260, easing: 'cubic-bezier(.2,.8,.2,1)' });
    }
    if (body && !calm) {
      body.animate([
        { transform: `translateX(${dir > 0 ? 28 : -28}px)`, opacity: 0 },
        { transform: 'none', opacity: 1 }
      ], { duration: 260, easing: 'cubic-bezier(.2,.8,.2,1)' });
    }
    if (step === 2) setTimeout(() => {
      const d = document.getElementById('define-detail-input');
      if (d) { d.focus(); d.selectionStart = d.selectionEnd = d.value.length; autoGrow(d); }
    }, 120);
    else {
      const first = card2 && (card2.querySelector('.kind-tile.on') || card2.querySelector('.kind-tile') || card2.querySelector('.route-big.suggested'));
      if (first) setTimeout(() => first.focus({ preventScroll: true }), 60);
    }
  }

  // Reordering from the menu: the way to do it on a phone, where cards can’t
  // be dragged and carry no arrows.
  function activeOrderItems(loop) {
    if (loop.status !== 'active') return '';
    const order = data.loops.filter(l => l.status === 'active').sort((a, b) => (b.position || 0) - (a.position || 0));
    const i = order.findIndex(l => l.id === loop.id);
    if (i < 0 || order.length < 2) return '';
    const item = (action, label, path) => `<button class="menu-item" data-action="${action}" data-loop-id="${esc(loop.id)}">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="${path}" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            ${label}
          </button>`;
    return (i > 0 ? item('make-now', 'Make it Now', 'M3 3h8M7 11V5.5M4.5 8 7 5.5 9.5 8') : '') +
      (i > 1 ? item('move-loop-up', 'Move up', 'M7 11V3M4 6l3-3 3 3') : '') +
      (i < order.length - 1 ? item('move-loop-down', 'Move down', 'M7 3v8M4 8l3 3 3-3') : '');
  }

            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.2"/><path d="M7 4v3l2 2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>

            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 7h8M8 4l3 3-3 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>

          ${active || waiting ? `<button class="menu-item" data-action="complete-done" data-loop-id="${esc(loop.id)}">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2.8 7.4 5.6 10.2 11.2 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>

            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 11.5V4.5M7 4.5 4.5 7M7 4.5 9.5 7M3.5 2.5h7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>

  function renderChangekind(loop) {

  function renderSync() {
    const loggedIn = Sync.isLoggedIn();
    const hasError = view.syncStatus === 'error';
    const isSyncing = view.syncStatus === 'syncing';
    const clientIssue = supabaseClientIssue();
    return `
      <div class="overlay-card" role="dialog" aria-modal="true" aria-labelledby="sync-title">
        <div class="overlay-header">
          <div class="overlay-meta"><div class="overlay-eyebrow">Your devices</div></div>
          <button class="overlay-close" data-action="close-overlay" title="Close" aria-label="Close"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><line x1="4" y1="4" x2="12" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="12" y1="4" x2="4" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
        </div>
        <h2 class="overlay-title" id="sync-title">Keep loops everywhere.</h2>
        <p class="overlay-subtitle">Sign in with your email. Your loops will sync automatically across devices.</p>
        ${clientIssue ? `

        ` : loggedIn ? `
          ${hasError ? `
            <div class="sync-info" style="color:#f88;border-color:rgba(255,68,119,0.15);background:rgba(255,68,119,0.06)">Your latest changes haven’t reached your other devices yet. They’re safe on this one.</div>
            <div class="overlay-actions" style="margin-top:0;margin-bottom:12px">

            <button class="btn btn-primary" data-action="send-magic-link">Send link</button>

  // ── AUTH GATE ──
  // Settings stay behind the sign-in gate because the app is sync-first.
  // ── WHY OPEN LOOPS ──
  // Opened from the header mark ("the mast") and from Settings.
  // ── WHY STORY ──
  // Five short animated scenes: half picture, half text. Auto-advances;
  // tap the picture or use Next/Back. Scenes are plain SVG with CSS motion.
  const WHY_SCENES = [
    { h: 'Your head is full of open loops.', p: 'Every unfinished thing keeps pulling at you.' },
    { h: 'One next step quiets a loop.', p: 'Studies show a plan calms the nagging, even before it’s done.', cite: 'Masicampo & Baumeister, 2011' },
    { h: 'Catch it. Sort it. Focus.', p: 'Drop it in Inbox, give it one next step, do one at a time.' },
    { h: 'Close it. Let it go.', p: 'Every closed loop lands on your shelf, and out of your head.' },
    { h: 'Made for crowded heads.', p: 'If your mind keeps saying “I still need to…”, this is for you.' }
  ];

  // Story soundtrack: one mood per scene, same instrument and scale as the
  // app’s sounds. Plays when Sounds are on. The voice is opt-in per sheet.
  const StoryAudio = (() => {
    let ctx = null, master = null, group = null;
    const N = { A2: 110, D3: 146.83, A3: 220, D4: 293.66, E4: 329.63, Fs4: 369.99, A4: 440, B4: 493.88, D5: 587.33, E5: 659.25, Fs5: 739.99, A5: 880, B5: 987.77 };
    function ensure() {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC();
        const comp = ctx.createDynamicsCompressor();
        master = ctx.createGain(); master.gain.value = 0.26;
        master.connect(comp); comp.connect(ctx.destination);
      }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    }
    function newGroup() {
      const c = ensure(); if (!c) return null;
      if (group) {
        const old = group;
        old.gain.cancelScheduledValues(c.currentTime);
        old.gain.setValueAtTime(old.gain.value, c.currentTime);
        old.gain.linearRampToValueAtTime(0, c.currentTime + 0.35);
        setTimeout(() => { try { old.disconnect(); } catch (_) {} }, 500);
      }
      group = c.createGain(); group.gain.value = 1; group.connect(master);
      return group;
    }
    function env(g, t, peak, a, d) {
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + a);
      g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
    }
    function pluck(f, at, vel = 0.6, decay = 1.2, detune = 0) {
      const c = ctx, t = c.currentTime + at, out = group;
      const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = f; o.detune.value = detune;
      const o2 = c.createOscillator(); o2.type = 'sine'; o2.frequency.value = f * 5.4;
      const g = c.createGain(), g2 = c.createGain();
      env(g, t, 0.5 * vel, 0.006, decay); env(g2, t, 0.09 * vel, 0.003, 0.09);
      o.connect(g); o2.connect(g2); g.connect(out); g2.connect(out);
      o.start(t); o2.start(t); o.stop(t + decay + 0.1); o2.stop(t + 0.15);
    }
    function pad(freqs, at, dur, vel = 0.12) {
      const c = ctx, t = c.currentTime + at, out = group;
      const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1100; f.connect(out);
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vel, t + 1.2);
      g.gain.setValueAtTime(vel, t + Math.max(1.3, dur - 1.6));
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      g.connect(f);
      freqs.forEach(fr => [-6, 6].forEach(dt => {
        const o = c.createOscillator(); o.type = 'triangle'; o.frequency.value = fr; o.detune.value = dt;
        o.connect(g); o.start(t); o.stop(t + dur + 0.1);
      }));
    }
    function thud(at, vel = 0.4) {
      const c = ctx, t = c.currentTime + at;
      const o = c.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(55, t + 0.13);
      const g = c.createGain(); env(g, t, vel, 0.005, 0.16);
      o.connect(g); g.connect(group); o.start(t); o.stop(t + 0.25);
    }

    // ── voice clips ──
    const VOICE_URL = i => `./why-voice-${i + 1}.mp3`;
    const clipCache = {}, clipPending = {};
    let clipQueue = Promise.resolve(), clipSrc = null, clipEl = null, voiceOut = null, voiceTicket = 0;
    function decode(ab) {
      return new Promise((res, rej) => {
        try { const r = ctx.decodeAudioData(ab, res, rej); if (r && r.then) r.then(res, rej); } catch (e) { rej(e); }
      });
    }
    function loadClip(i) {
      if (clipCache[i]) return Promise.resolve(clipCache[i]);
      if (clipPending[i]) return clipPending[i];
      if (!ensure()) return Promise.resolve(null);
      clipPending[i] = clipQueue = clipQueue
        .then(() => clipCache[i] || fetch(VOICE_URL(i)).then(r => { if (!r.ok) throw new Error('clip'); return r.arrayBuffer(); }).then(decode))
        .then(b => { clipCache[i] = b; return b; })
        .catch(() => null)
        .finally(() => { delete clipPending[i]; });
      return clipPending[i];
    }
    function stopClip() {
      if (clipSrc) { try { clipSrc.onended = null; clipSrc.stop(); } catch (_) {} clipSrc = null; }
      if (clipEl) { try { clipEl.onended = null; clipEl.pause(); } catch (_) {} clipEl = null; }
    }
    function elementClip(i, onEnd) {
      clipEl = new Audio(VOICE_URL(i));
      let done = false; const fin = () => { if (!done) { done = true; clipEl = null; onEnd(); } };
      clipEl.onended = fin; clipEl.onerror = fin; setTimeout(fin, 12000);
      const pr = clipEl.play(); if (pr && pr.catch) pr.catch(fin);
    }
    function sayClip(i, onEnd) {
      const my = ++voiceTicket;
      stopClip();
      if (!ensure()) { onEnd(); return; }
      let settled = false;
      // Never stall: if the clip isn’t decoded in 4s, play it the plain way.
      const fallback = setTimeout(() => { if (settled || my !== voiceTicket) return; settled = true; elementClip(i, onEnd); }, 4000);
      loadClip(i).then(buf => {
        if (settled || my !== voiceTicket) return;
        settled = true; clearTimeout(fallback);
        if (!buf) { elementClip(i, onEnd); return; }
        if (ctx.state === 'suspended') ctx.resume();
        if (!voiceOut) { voiceOut = ctx.createGain(); voiceOut.gain.value = 1; voiceOut.connect(ctx.destination); }
        clipSrc = ctx.createBufferSource(); clipSrc.buffer = buf; clipSrc.connect(voiceOut);
        clipSrc.onended = () => { clipSrc = null; if (my === voiceTicket) onEnd(); };
        clipSrc.start();
      });
    }
    const scenes = [
      // 1 · tugging: scattered, overlapping, never settling
      () => {
        const pool = [N.E4, N.A4, N.B4, N.E5, N.Fs4, N.B5];
        let t = 0.05;
        while (t < 5.0) {
          pluck(pool[Math.floor(Math.random() * pool.length)], t, 0.28 + Math.random() * 0.18, 0.6, (Math.random() - 0.5) * 24);
          t += 0.14 + Math.random() * 0.22;
        }
        pad([N.A2, N.E4], 0, 5.2, 0.05);
      },
      // 2 · a next step: scatter thins, chime with the tag, one note holds
      () => {
        const pool = [N.E4, N.A4, N.B4, N.E5];
        let t = 0.05, gap = 0.18;
        while (t < 1.5) { pluck(pool[Math.floor(Math.random() * pool.length)], t, 0.26, 0.6, (Math.random() - 0.5) * 20); t += gap; gap += 0.05; }
        pluck(N.D5, 1.62, 0.5, 2.2); pluck(N.A5, 1.68, 0.3, 2.4);
        pad([N.D3, N.A3, N.Fs4], 1.6, 3.6, 0.07);
        pluck(N.A4, 3.0, 0.3, 1.8); pluck(N.A4, 4.2, 0.22, 1.6);
      },
      // 3 · capture, define, focus: drops, a rising run, a steady pulse
      () => {
        pluck(N.D4, 0.62, 0.5, 0.9); pluck(N.Fs4, 0.88, 0.5, 0.9); pluck(N.A4, 1.13, 0.5, 0.9);
        pad([N.D3, N.A3], 1.5, 3.7, 0.06);
        pluck(N.A4, 1.95, 0.45, 0.7); pluck(N.D5, 2.12, 0.45, 0.7); pluck(N.Fs5, 2.3, 0.45, 1.4);
        [3.1, 3.9, 4.7].forEach(t => pluck(N.D4, t, 0.25, 0.9));
      },
      // 4 · close: the app’s own closing sound, suspended then resolved
      () => {
        pluck(N.E4, 0.5, 0.55, 1.0); pluck(N.A4, 0.57, 0.55, 1.2);
        thud(1.9, 0.38); pluck(N.D4, 1.91, 0.65, 1.8); pluck(N.Fs4, 1.94, 0.5, 1.8); pluck(N.D5, 1.97, 0.55, 2.0);
        pad([N.D3, N.Fs4, N.A4], 1.9, 3.3, 0.08);
      },
      // 5 · crowded heads: warm chord and a slow lullaby
      () => {
        pad([N.D3, N.A3, N.D4, N.Fs4], 0, 7.5, 0.1);
        [[N.Fs5, 0.6], [N.E5, 1.5], [N.D5, 2.4], [N.A4, 3.6], [N.D5, 5.0]].forEach(([f, t]) => pluck(f, t, 0.38, 2.4));
      }
    ];
    function duck(on) {
      if (!ctx) return;
      const t = ctx.currentTime;
      master.gain.cancelScheduledValues(t);
      master.gain.setValueAtTime(master.gain.value, t);
      master.gain.linearRampToValueAtTime(on ? 0.1 : 0.26, t + (on ? 0.25 : 0.8));
    }
    return {
      duck,
      ctx: () => ensure(),
      start() { return !!ensure(); },
      music(i) { if (!ensure()) return; if (!newGroup()) return; try { scenes[i](); } catch (_) {} },
      stopMusic() { if (ctx) newGroup(); },
      // Voice-over: five short recorded clips (Kokoro "Heart" voice).
      say(i, onEnd) { sayClip(i, onEnd); },
      stopVoice() { voiceTicket++; stopClip(); },
      preloadVoice() { for (let i = 0; i < 5; i++) loadClip(i); },
      stopAll() { voiceTicket++; stopClip(); if (ctx) newGroup(); duck(false); }
    };
  })();

  let whyTimer = null;
  let whyToken = 0;
  const WHY_MS = 5200;
  // Read lazily: SOUND_KEY is defined further down the file.
  const whyVoiceKey = () => SOUND_KEY + '_why_voice';
  function whyVoiceOn() { try { return localStorage.getItem(whyVoiceKey()) === 'on'; } catch (_) { return false; } }
  function setWhyVoice(on) { try { localStorage.setItem(whyVoiceKey(), on ? 'on' : 'off'); } catch (_) {} }

  function whyShow(i, dir = 1) {
    const story = document.querySelector('#overlay-root .why-story');
    if (!story) { clearTimeout(whyTimer); StoryAudio.stopAll(); return; }
    const n = WHY_SCENES.length;
    i = Math.max(0, Math.min(n - 1, i));
    story.dataset.scene = String(i);
    const scene = story.querySelector('.why-scene');
    scene.innerHTML = whySceneSvg(i);
    scene.classList.remove('play'); void scene.getBoundingClientRect(); scene.classList.add('play');
    const s = WHY_SCENES[i];
    const text = story.querySelector('.why-text');
    text.querySelector('.why-h1').textContent = s.h;
    text.querySelector('.why-p').textContent = s.p;
    text.querySelector('.why-cite').textContent = s.cite || '';
    const calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!calm && dir) text.animate([{ opacity: 0, transform: `translateX(${dir * 16}px)` }, { opacity: 1, transform: 'none' }], { duration: 280, easing: 'cubic-bezier(.2,.8,.2,1)' });
    const voice = whyVoiceOn();
    story.querySelectorAll('.why-bars span').forEach((b, k) => {
      b.classList.toggle('done', k < i);
      b.classList.toggle('now', k === i);
      const fill = b.querySelector('i');
      fill.getAnimations().forEach(a => a.cancel());
      if (k === i && !calm && i < n - 1) fill.animate([{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { duration: voice ? WHY_MS + 1800 : WHY_MS, easing: 'linear', fill: 'forwards' });
    });
    story.querySelector('.why-back').hidden = i === 0;
    const go = story.querySelector('.why-go');
    const last = i === n - 1;
    go.textContent = last ? 'Got it' : 'Next';
    go.dataset.action = last ? 'close-overlay' : 'why-next';

    // Sound: music follows the Sounds setting; the voice is opt-in.
    if (Sound.enabled) StoryAudio.music(i); else StoryAudio.stopMusic();
    clearTimeout(whyTimer);
    const token = ++whyToken;
    let minDone = false, voiceDone = !voice;
    const advance = () => {
      if (token !== whyToken || !minDone || !voiceDone || calm || last) return;
      whyTimer = setTimeout(() => { if (token === whyToken) whyShow(i + 1, 1); }, voice ? 700 : 0);
    };
    whyTimer = setTimeout(() => { minDone = true; advance(); }, voice ? WHY_MS - 700 : WHY_MS);
    if (voice) {
      StoryAudio.stopVoice();
      StoryAudio.duck(true);
      setTimeout(() => {
        if (token !== whyToken) return;
        StoryAudio.say(i, () => { if (token !== whyToken) return; StoryAudio.duck(false); voiceDone = true; advance(); });
      }, 450);
    } else { StoryAudio.stopVoice(); StoryAudio.duck(false); }
  }
  function whyStep(delta) {
    const story = document.querySelector('#overlay-root .why-story');
    if (!story) return;
    whyShow(Number(story.dataset.scene || 0) + delta, delta);
  }

        <div class="onboarding-visual" style="text-align:center;padding:18px 20px;">
          <div style="font-size:13px;color:var(--text-2);line-height:1.7;">Parked loops sit quietly, then come back<br>to Up next on the day you picked.</div>
        </div>`,
      next: 'Next',
    },
    {
      eyebrow: '4 of 4',
      title: 'Close.',
      body: 'When a loop is done, or you decide to let it go, close it.',
      visual: `
        <div class="onboarding-visual" style="text-align:center;padding:18px 20px;">
          <div style="font-size:13px;color:var(--text-2);line-height:1.7;">Closed loops stay on your shelf.<br>You can always look back.</div>
        </div>`,
      next: 'Start capturing',
    },
  ];

  function renderOnboarding() {
    const root = document.getElementById('onboarding-root');
    if (!root) return;

    const step = view.onboardingStep;
    if (step < 0 || step >= ONBOARDING_STEPS.length) {
      root.innerHTML = '';
      return;
    }

    const s = ONBOARDING_STEPS[step];
    const dots = ONBOARDING_STEPS.map((_, i) => {
      const cls = i < step ? 'done' : i === step ? 'active' : '';
      return `<div class="onboarding-dot ${cls}"></div>`;
    }).join('');

    const isLast = step === ONBOARDING_STEPS.length - 1;

    const content = `
          <div class="onboarding-step-indicator">${dots}</div>
          <div class="onboarding-eyebrow">${s.eyebrow}</div>
          <h2 class="onboarding-title">${s.title}</h2>
          <p class="onboarding-body">${s.body}</p>
          ${s.visual}
          <div class="onboarding-actions">
            <button class="onboarding-btn-primary" data-action="onboarding-next">${s.next}</button>
            ${step > 0 ? `<button class="onboarding-btn-ghost" data-action="onboarding-prev">Back</button>` : ''}
          </div>
          ${!isLast ? `<div class="onboarding-skip"><button type="button" class="inline-link" data-action="onboarding-skip">Skip tutorial</button></div>` : ''}`;
    const existing = root.querySelector('.onboarding-card');
    if (existing) {
      // Already open: never replay the card’s entrance. A new step slides in.
      const prevStep = Number(existing.dataset.step);
      existing.style.animation = 'none';
      if (prevStep === step) return;
      existing.dataset.step = String(step);
      existing.innerHTML = content;
      const calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!calm) {
        const dir = step > prevStep ? 1 : -1;
        Array.from(existing.children).slice(1).forEach(c => c.animate([
          { transform: `translateX(${dir * 24}px)`, opacity: 0 },
          { transform: 'none', opacity: 1 }
        ], { duration: 240, easing: 'cubic-bezier(.2,.8,.2,1)' }));
      }
      return;
    }

    root.innerHTML = `
      <div class="onboarding-overlay">
        <div class="onboarding-card" data-step="${step}">
          <div class="onboarding-step-indicator">${dots}</div>
          <div class="onboarding-eyebrow">${s.eyebrow}</div>
          <h2 class="onboarding-title">${s.title}</h2>
          <p class="onboarding-body">${s.body}</p>
          ${s.visual}
          <div class="onboarding-actions">
            <button class="onboarding-btn-primary" data-action="onboarding-next">${s.next}</button>
            ${step > 0 ? `<button class="onboarding-btn-ghost" data-action="onboarding-prev">Back</button>` : ''}
          </div>
          ${!isLast ? `<div class="onboarding-skip"><button type="button" class="inline-link" data-action="onboarding-skip">Skip tutorial</button></div>` : ''}
        </div>
      </div>`;
  }

  function hasCompletedOnboarding() {
    const key = scopedKey(ONBOARDING_KEY_BASE);
    if (!key) return false;
    try { return !!localStorage.getItem(key); } catch(e) { return false; }
  }

  function markOnboardingComplete() {
    const key = scopedKey(ONBOARDING_KEY_BASE);
    try { if (key) localStorage.setItem(key, '1'); } catch(e) {}
    view.onboardingStep = -1;
    renderOnboarding();
    // Open capture overlay to prompt first loop
    view.overlay = { type: 'capture', step: 'capture', rawText: '', kind: null, promptAnswer: '', sourceId: null };
    renderOverlay();
  }

  function startOnboarding() {
    view.onboardingStep = 0;
    renderOnboarding();
  }

  // ── PRIMARY ACTIONS ──
  // Each kind’s button does what it says, and every "not yet" asks "when?".
  //   Do       → step done (set the next one) or all done
  //   Decide   → name the decision, optionally start the next Do
  //   Ask      → send it, then park it until it’s time to check back;
  //              when it wakes: did they reply?
  //   Schedule → a real calendar event (Google link or .ics file), then close
  //   Let go   → let it go
  const ACT_ICON = {
    ring:  '<svg class="act-btn-icon" viewBox="0 0 18 18" fill="none" aria-hidden="true"><circle cx="9" cy="9" r="5.5" stroke="currentColor" stroke-width="2.2"/></svg>',
    next:  '<svg class="act-btn-icon" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M7 4.5 11.5 9 7 13.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    clock: '<svg class="act-btn-icon" viewBox="0 0 18 18" fill="none" aria-hidden="true"><circle cx="9" cy="9" r="5.5" stroke="currentColor" stroke-width="1.5"/><path d="M9 6.8v2.6l1.7 1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
    send:  '<svg class="act-btn-icon" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M15.5 2.5 8 10M15.5 2.5l-5 13L8 10 2.5 7.5l13-5Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    cal:   '<svg class="act-btn-icon" viewBox="0 0 18 18" fill="none" aria-hidden="true"><rect x="3" y="4" width="12" height="11" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M3 7.5h12M6.5 2.5v3M11.5 2.5v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
    file:  '<svg class="act-btn-icon" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M9 3v8m0 0-3-3m3 3 3-3M4 14.5h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    drift: '<svg class="act-btn-icon" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M9 14V5.5M9 5.5 6 8.5M9 5.5l3 3M4.5 3h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  };
  const SHEET_CLOSE = `<button class="overlay-close" data-action="close-overlay" title="Close" aria-label="Close"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><line x1="4" y1="4" x2="12" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="12" y1="4" x2="4" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>`;

  function actBtn({ action, label, sub, primary, loopId, attrs = '', icon = '' }) {
    return `<button type="button" class="act-btn${primary ? ' primary' : ''}" data-action="${action}" data-loop-id="${esc(loopId)}" ${attrs}>
      <span class="act-btn-text"><span class="act-btn-label">${esc(label)}</span>${sub ? `<span class="act-btn-sub">${esc(sub)}</span>` : ''}</span>${icon}
    </button>`;
  }
  function notYetBtn(loop, label = 'Not yet') {
    return actBtn({ action: 'open-when', label, sub: 'Pick when it comes back', loopId: loop.id, icon: ACT_ICON.clock });
  }
  function actLoopBox(rawText, line) {
    return `<div class="act-loop"><div class="act-loop-title">${esc(rawText)}</div>${line ? `<div class="act-loop-line">${esc(line)}</div>` : ''}</div>`;
  }
  function actField(id, label, control) {
    return `<div class="act-field"><label class="act-label" for="${id}">${esc(label)}</label>${control}</div>`;
  }
  function actSheet({ kind, eyebrow, titleId, title, sub, step, body }) {
    return `
      <div class="overlay-card act-card" role="dialog" aria-modal="true" aria-labelledby="${titleId}">
        <div class="overlay-header">
          <div class="overlay-meta">${kind !== undefined ? chipHtml(kind) : `<div class="overlay-eyebrow">${esc(eyebrow || '')}</div>`}</div>
          ${SHEET_CLOSE}
        </div>
        <div class="act-body" data-step="${esc(step || '')}">
          <h2 class="overlay-title act-title" id="${titleId}">${esc(title)}</h2>
          ${sub ? `<p class="overlay-subtitle act-sub">${esc(sub)}</p>` : ''}
          ${body}
        </div>
      </div>`;
  }

  // Default start for a Schedule event: what you typed here, else the time
  // picked in Define, else what the note says, else tomorrow 9:00.
  function scheduleStart(loop, ov) {
    const typed = fromLocalInputs(ov.calDate, ov.calTime);
    if (typed) return { start: typed, parsed: null, saved: false };
    const at = loop.details && loop.details.at ? new Date(loop.details.at) : null;
    if (at && !Number.isNaN(at.getTime())) return { start: at, parsed: null, saved: true };
    const parsed = parseWhen(loop.promptAnswer) || parseWhen(loop.rawText);
    return { start: parsed ? parsed.date : atTime(addDays(new Date(), 1), 9), parsed, saved: false };
  }

  function renderPrimaryAction(loop) {
    if (!loop) return '';
    const ov = view.overlay || {};
    const kind = loop.kind || 'do';
    const d = loop.details || {};
    const id = loop.id;
    const sentAsk = kind === 'ask' && !!d.sentAt && loop.status === 'active';
    // Sent to a calendar already: the first question is whether it made it.
    const sentToCal = kind === 'schedule' && !!d.calAt && loop.status === 'active';
    // Its time has come and gone: the only question left is whether it happened.
    const happened = kind === 'schedule' && schedulePassed(loop);
    const step = ov.step || (sentAsk ? 'reply' : happened ? 'happened' : sentToCal ? 'confirm' : 'main');
    const editLink = `<button type="button" class="act-link" data-action="complete-update" data-loop-id="${esc(id)}">Edit the note</button>`;
    let title = '', sub = '', body = '';

    if (kind === 'decide') {
      if (step === 'next') {
        const spawn = (ov.spawnText || '').trim();
        title = `${ov.decision}. Good.`;
        sub = 'Does it need a next step?';
        body = actField('act-spawn', 'New Do (optional)',
            `<textarea class="big-input act-input" id="act-spawn" rows="1" maxlength="${MAX_LOOP_TEXT_LEN}" placeholder="The first thing to do about it" enterkeyhint="done">${esc(ov.spawnText || '')}</textarea>`) + `
          <div class="act-list">
            ${actBtn({ action: 'decide-close', label: 'Close it and add the Do', sub: 'The Do lands in Up next', primary: true, loopId: id, attrs: `data-spawn="1" ${spawn ? '' : 'disabled'}`, icon: ACT_ICON.ring })}
            ${actBtn({ action: 'decide-close', label: 'No next step, just close it', loopId: id, icon: ACT_ICON.ring })}
          </div>
          <button type="button" class="act-link" data-action="act-step" data-step="main">Back</button>`;
      } else {
        const options = decisionOptions(loop.promptAnswer);
        const chips = options.length
          ? `<div class="choice-chips" role="group" aria-label="Your options">${options.map(o =>
              `<button type="button" class="choice-chip${ov.decision === o ? ' on' : ''}" data-action="decide-pick" data-choice="${esc(o)}" aria-pressed="${ov.decision === o}">${esc(o)}</button>`).join('')}</div>`
          : '';
        title = 'What did you decide?';
        sub = 'Name it in a line, so future you knows what you chose.';
        body = actLoopBox(loop.rawText, loop.promptAnswer) + chips +
          actField('act-decision', 'Your decision',
            `<textarea class="big-input act-input${options.length ? ' no-autofocus' : ''}" id="act-decision" rows="1" maxlength="${MAX_LOOP_TEXT_LEN}" placeholder="e.g. Go with the first one" enterkeyhint="next">${esc(ov.decision || '')}</textarea>`) + `
          <div class="act-list">
            ${actBtn({ action: 'decide-confirm', label: "That’s my decision", primary: true, loopId: id, icon: ACT_ICON.next })}
            ${notYetBtn(loop, 'Still deciding')}
          </div>${editLink}`;
      }
    } else if (kind === 'ask') {
      const { who, ask } = askOf(loop);
      const them = who || 'them';
      if (step === 'reply') {
        title = who ? `Did ${who} reply?` : 'Did they reply?';
        sub = `You asked ${relativeDay(d.sentAt)}${d.nudges ? ` and nudged ${d.nudges === 1 ? 'once' : d.nudges + ' times'}` : ''}.`;
        body = actLoopBox(loop.rawText, d.sentText ? `You sent: ${d.sentText}` : ask) + `
          <div class="act-list">
            ${actBtn({ action: 'complete-done', label: 'Got it, close it', primary: true, loopId: id, icon: ACT_ICON.ring })}
            ${actBtn({ action: 'ask-nudge', label: `Nudge ${them}`, sub: 'A short follow-up, ready to send', loopId: id, icon: ACT_ICON.send })}
            ${actBtn({ action: 'act-step', label: 'Wait longer', sub: 'Pick when to check back', loopId: id, attrs: 'data-step="sent" data-wait="1"', icon: ACT_ICON.clock })}
          </div>`;
      } else if (step === 'sent') {
        title = ov.waitOnly ? 'When should you check back?' : `Sent. Now it’s on ${them}.`;
        sub = 'An Ask closes when they answer, not when you hit send.';
        const presets = wakePresets('ask').map(p => actBtn({
          action: 'ask-park', label: p.label, sub: formatEvent(p.when.toISOString()), loopId: id,
          attrs: `data-when="${p.when.toISOString()}"`, icon: ACT_ICON.clock
        })).join('');
        body = `<div class="act-list">${presets}
          ${ov.waitOnly ? '' : actBtn({ action: 'complete-done', label: 'They already answered', sub: 'Close it now', loopId: id, icon: ACT_ICON.ring })}
        </div>`;
      } else {
        const msg = ov.message != null ? ov.message : askDraft(loop, !!ov.nudge);
        title = ov.nudge ? 'A gentle nudge' : (who ? `Reach out to ${who}` : 'Reach out');
        sub = 'Your ask, ready to send. Change anything.';
        body = actField('act-msg', who ? `Message to ${who}` : 'Message',
            `<textarea class="big-input act-input act-msg no-autofocus" id="act-msg" rows="3" maxlength="1000">${esc(msg)}</textarea>`) + `
          <div class="act-list">
            ${actBtn({ action: 'ask-share', label: 'Send…', sub: 'Opens your share sheet, or copies the text', primary: true, loopId: id, icon: ACT_ICON.send })}
            ${actBtn({ action: 'act-step', label: 'I already asked', sub: 'In person, or somewhere else', loopId: id, attrs: 'data-step="sent"', icon: ACT_ICON.next })}
            ${ov.nudge ? '' : notYetBtn(loop)}
          </div>${ov.nudge ? '' : editLink}`;
      }
    } else if (kind === 'schedule') {
      const atMs = scheduleAt(loop);
      const upcoming = atMs !== null && atMs > Date.now();
      const { start, parsed, saved } = scheduleStart(loop, ov);
      if (step === 'happened') {
        title = 'Did it happen?';
        sub = atMs !== null ? `It was ${formatEvent(new Date(atMs).toISOString())}.` : '';
        body = actLoopBox(loop.rawText, loop.promptAnswer) + `
          <div class="act-list">
            ${actBtn({ action: 'complete-done', label: 'Yes, close it', primary: true, loopId: id, icon: ACT_ICON.ring })}
            ${actBtn({ action: 'act-step', label: 'It moved', sub: 'Pick its new day and time', loopId: id, attrs: 'data-step="main"', icon: ACT_ICON.clock })}
            ${actBtn({ action: 'move-released', label: 'It isn’t happening', sub: 'Let it go', loopId: id, icon: ACT_ICON.drift })}
          </div>`;
      } else if (step === 'main') {
        // The time is the whole job: pick it (or change it), and the app
        // brings it back before it happens. A calendar is optional.
        const typed = fromScheduleInputs(ov.schedDate, ov.schedTime);
        const pickStart = typed || (upcoming ? new Date(atMs) : null);
        title = upcoming ? 'Change the time' : 'When is it?';
        body = actLoopBox(loop.rawText, loop.promptAnswer) + scheduleFieldsHtml('sched', pickStart) + `
          <div class="act-list">
            ${actBtn({ action: 'sched-save', label: 'Save the time', primary: true, loopId: id, icon: ACT_ICON.clock })}
            ${upcoming ? actBtn({ action: 'act-step', label: 'Put it on my calendar too', sub: 'Google, Apple, Outlook or other', loopId: id, attrs: 'data-step="cal"', icon: ACT_ICON.cal }) : ''}
            ${actBtn({ action: 'complete-done', label: 'It’s done', sub: 'Close it now', loopId: id, icon: ACT_ICON.ring })}
          </div>${editLink}`;
      } else if (step === 'confirm') {
        title = 'On your calendar?';
        sub = 'Once it’s saved there, your calendar holds it and this loop can close.';
        const when = `${start.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' })}, ${clockText(start)}`;
        body = actLoopBox(ov.calTitle || loop.rawText, when) + `
          <div class="act-list">
            ${actBtn({ action: 'complete-done', label: 'Yes, close it', primary: true, loopId: id, icon: ACT_ICON.ring })}
            ${actBtn({ action: 'act-step', label: "It didn’t save. Try again", loopId: id, attrs: 'data-step="main"', icon: ACT_ICON.cal })}
            ${notYetBtn(loop)}
          </div>`;
      } else {
        title = 'Add to calendar';
        sub = saved ? 'Check the time, then pick a calendar.' : parsed ? `Read from your note: “${parsed.text}”. Check it, then pick a calendar.` : 'Pick a day and time, then a calendar.';
        body = actField('cal-title', 'Event',
            `<input class="big-input act-input no-autofocus" id="cal-title" type="text" maxlength="200" value="${esc(ov.calTitle != null ? ov.calTitle : loop.rawText)}">`) + `
          <div class="act-row">
            ${actField('cal-date', 'Day', `<input class="big-input act-input no-autofocus" id="cal-date" type="date" value="${localDateValue(start)}">`)}
            ${actField('cal-time', 'Time', `<input class="big-input act-input no-autofocus" id="cal-time" type="time" value="${localTimeValue(start)}">`)}
          </div>
          <div class="act-list">
            ${actBtn({ action: 'cal-google', label: 'Google Calendar', sub: 'Opens a ready-made event, 30 minutes', primary: true, loopId: id, icon: ACT_ICON.cal })}
            ${actBtn({ action: 'cal-ics', label: 'Apple, Outlook or other', sub: 'Downloads an event file', loopId: id, icon: ACT_ICON.file })}
            ${actBtn({ action: 'complete-done', label: 'It’s already on my calendar', sub: 'Close it now', loopId: id, icon: ACT_ICON.ring })}
