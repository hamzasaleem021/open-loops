<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Open Loops">
<meta name="theme-color" content="#fffaf0">
<meta name="description" content="A calm place for unfinished things.">
<title>Open Loops</title>
<link rel="manifest" href="./open-loops-manifest.json">
<link rel="icon" href="./open-loops-icon-192-v3.png">
<link rel="apple-touch-icon" href="./open-loops-icon-192-v3.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="./open-loops-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.103.3/dist/umd/supabase.js"
  integrity="sha384-hCWGwlkWlatZlBB+xRL7caQ0wei4AIvA80dQT3CEhafaMinAJQdfdb99y48Oai+Q"
  crossorigin="anonymous"></script>
<style>
/* ══════════════════════════════════════════════════════════════
   CLAY DESIGN SYSTEM
   Cream canvas #fffaf0 × near-black ink × saturated kind cards.
   Inter throughout (Plain Black substitute: Inter 500, tight tracking).
   Kinds map onto the six-card palette:
     do → teal · decide → ochre · ask → pink · schedule → lavender
     let_go → peach · inbox → cream
   ══════════════════════════════════════════════════════════════ */

:root, :root[data-theme="light"] {
  --bg: #fffaf0;
  --surface: #fffdf8;
  --surface-2: #faf5e8;
  --surface-3: #f5f0e0;
  --surface-strong: #ebe6d6;
  --border: #e8e2d2;
  --border-soft: #f0ebdd;
  --text: #0a0a0a;
  --text-2: #3a3a3a;
  --text-3: #8a857a;
  --accent: #0a0a0a;
  --accent-hot: #1f1f1f;
  --accent-deep: #000;
  --accent-ink: #ffffff;
  --accent-dim: rgba(10,10,10,0.06);
  --accent-glow: rgba(10,10,10,0.05);
  --focus-ring: rgba(10,10,10,0.14);

  /* kind palette (fills) */
  --do: #1a3a3a;       --do-ink: #ffffff;   --do-dim: #d9e6e2;
  --decide: #e8b94a;   --decide-ink: #0a0a0a; --decide-dim: #f7e7bd;
  --ask: #ff4d8b;      --ask-ink: #ffffff;  --ask-dim: #ffd6e5;
  --schedule: #b8a4ed; --schedule-ink: #0a0a0a; --schedule-dim: #e6def9;
  --let_go: #ffb084;   --let_go-ink: #0a0a0a; --let_go-dim: #ffe2d1;
  --inbox: #f5f0e0;    --inbox-ink: #0a0a0a;

  --success: #22c55e;
  --warning: #f59e0b;
  --error: #ef4444;

  --r-xs: 6px;
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --r-xl: 24px;
  --r-pill: 9999px;

  --mono: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --display: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  color-scheme: light;
}

/* Night: Clay's surface-dark (teal-black). Kind fills stay saturated. */
:root[data-theme="dark"] {
  --bg: #0a1a1a;
  --surface: #11221f;
  --surface-2: #1a2a2a;
  --surface-3: #22342f;
  --surface-strong: #2b3d39;
  --border: rgba(255,250,240,0.10);
  --border-soft: rgba(255,250,240,0.06);
  --text: #fffaf0;
  --text-2: rgba(255,250,240,0.72);
  --text-3: rgba(255,250,240,0.42);
  --accent: #fffaf0;
  --accent-hot: #ffffff;
  --accent-ink: #0a0a0a;
  --accent-dim: rgba(255,250,240,0.08);
  --accent-glow: rgba(255,250,240,0.06);
  --focus-ring: rgba(255,250,240,0.2);
  --do: #a4d4c5; --do-ink: #0a1a1a; --do-dim: rgba(164,212,197,0.16);
  --decide-dim: rgba(232,185,74,0.16);
  --ask-dim: rgba(255,77,139,0.16);
  --schedule-dim: rgba(184,164,237,0.16);
  --let_go-dim: rgba(255,176,132,0.16);
  --inbox: #22342f; --inbox-ink: #fffaf0;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--sans);
  font-size: 15px;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  transition: background-color 0.2s ease, color 0.2s ease;
}


button, input, textarea { font: inherit; }
button { cursor: pointer; border: none; background: none; color: inherit; }
a { color: inherit; text-decoration: none; }

/* ── LAYOUT ── */
.app {
  min-height: 100vh;
  display: grid;
  grid-template-rows: auto 1fr;
}

.app-body {
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.sidebar { display: none; }
.context-panel { display: none !important; }

@media (min-width: 768px) {
  .app-body { flex-direction: column; align-items: center; }
  .main { max-width: 720px; padding: 0 24px 112px; }
}

@media (min-width: 1024px) {
  .main { max-width: 760px; padding: 0 28px 112px; }
}

/* ── TOPBAR ── */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border-soft);
  position: sticky;
  top: 0;
  z-index: 10;
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  backdrop-filter: blur(16px);
  gap: 12px;
}

/* ── BRAND ── */
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-mark {
  width: 30px;
  height: 30px;
  display: flex;
  flex-shrink: 0;
}

.brand-name {
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--text);
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ── PILL BUTTON (sync status) ── */
.pill-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 10px;
  border-radius: var(--r-sm);
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 400;
  letter-spacing: 0.06em;
  border: 1px solid var(--border);
  color: var(--text-3);
  transition: all 0.15s;
  background: transparent;
}
.pill-btn:hover { border-color: var(--border); color: var(--text-2); }
.pill-btn.synced { color: var(--do); border-color: var(--border); }
.pill-btn.syncing { color: var(--accent); border-color: var(--focus-ring); }
.pill-btn.offline { color: var(--ask); border-color: rgba(10,132,255,0.22); }
.pill-btn.error { color: var(--accent); border-color: var(--focus-ring); }
/* idle = signed-out / pre-auth state. Same neutral look as the default. */
.pill-btn.idle { color: var(--text-3); border-color: var(--border); }

/* ── ICON BUTTON ── */
.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: var(--r-sm);
  border: 1px solid var(--border);
  color: var(--text-3);
  background: transparent;
  transition: all 0.15s;
  padding: 0;
}
.icon-btn:hover {
  border-color: var(--border);
  color: var(--text-2);
  background: var(--surface-2);
}
.icon-btn.active {
  color: var(--accent);
  border-color: var(--focus-ring);
  background: var(--accent-dim);
}
.icon-btn svg { width: 14px; height: 14px; }
#install-btn[hidden] { display: none !important; }

.dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: currentColor;
  flex-shrink: 0;
}

/* ── MAIN ── */
.main {
  padding: 0 18px 100px;
  max-width: 680px;
  margin: 0 auto;
  width: 100%;
}

/* ── TABS ── */
.tabs {
  display: none;
  border-bottom: 1px solid var(--border-soft);
  margin-bottom: 0;
  gap: 0;
}

.tab {
  padding: 10px 14px 12px;
  font-family: var(--mono);
  font-size: 9.5px;
  font-weight: 400;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-3);
  position: relative;
  transition: color 0.15s;
  cursor: pointer;
}
.tab:hover { color: var(--text-2); }
.tab.active {
  color: var(--accent);
  font-weight: 500;
}
.tab.active::after {
  content: "";
  position: absolute;
  bottom: -1px;
  left: 0;
  right: 0;
  height: 1.5px;
  background: var(--accent);
}

.tab-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  border-radius: 3px;
  font-size: 9px;
  font-weight: 600;
  background: var(--surface-3);
  color: var(--text-3);
  margin-left: 5px;
  vertical-align: middle;
  font-family: var(--mono);
}
.tab.active .tab-count {
  background: var(--accent-dim);
  color: var(--accent);
}

/* ── REENTRY ── */
.reentry {
  background: var(--surface);
  border: 1px solid var(--border);
  border-right: 3px solid var(--accent);
  border-radius: var(--r-lg);
  padding: 18px 20px;
  margin-bottom: 14px;
  position: relative;
  overflow: hidden;
  animation: fadeSlideDown 0.25s ease;
}

.reentry::before {
  content: "";
  position: absolute;
  top: 0; right: 0;
  width: 200px;
  height: 100%;
  background: linear-gradient(90deg, transparent, var(--accent-glow));
  pointer-events: none;
}

.reentry-eyebrow {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 6px;
  font-weight: 500;
}

.reentry-title {
  font-size: 1.4rem;
  font-weight: 600;
  line-height: 1.2;
  margin: 0 0 8px;
  letter-spacing: -0.02em;
  color: var(--text);
}

.reentry-note {
  font-size: 13px;
  color: var(--text-2);
  line-height: 1.6;
  margin: 0 0 14px;
}

.reentry-actions {
  display: flex;
  gap: 8px;
}

/* ── INBOX NOTICE ── */
.inbox-notice {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 14px;
  border-radius: var(--r-md);
  border: 1px solid var(--border);
  background: var(--surface);
  margin-bottom: 14px;
  animation: fadeSlideDown 0.2s ease;
}

.inbox-notice-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.inbox-badge {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  border-radius: var(--r-sm);
  background: var(--surface-3);
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  color: var(--text-2);
}

.inbox-text {
  font-size: 12.5px;
  color: var(--text-2);
}

/* ── SECTION ── */
.section-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 10px;
}

.section-label {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-3);
  font-weight: 400;
}

.section-count {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-3);
}

/* ── LOOP CARD ── */
.loop-stack {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.loop-card {
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-right: 2.5px solid var(--border);
  border-radius: var(--r-md);
  padding: 14px 16px 13px 15px;
  transition: border-color 0.18s, background 0.18s, transform 0.18s, box-shadow 0.18s;
  animation: fadeSlideDown 0.22s ease backwards;
  cursor: default;
  position: relative;
}

.loop-card::before {
  content: '';
  position: absolute;
  top: 0; right: -2.5px; bottom: 0;
  width: 2.5px;
  border-radius: 0 var(--r-md) var(--r-md) 0;
}

.loop-card.kind-do    { border-right-color: var(--do); }
.loop-card.kind-decide{ border-right-color: var(--decide); }
.loop-card.kind-ask   { border-right-color: var(--ask); }
.loop-card.kind-schedule { border-right-color: var(--schedule); }
.loop-card.kind-let_go   { border-right-color: var(--let_go); }
.loop-card.kind-inbox    { border-right-color: var(--border); }

.loop-card:hover {
  border-color: rgba(255,255,255,0.08);
  background: var(--surface-2);
  transform: translateY(-1px);
  box-shadow: 0 12px 32px rgba(0,0,0,0.2);
}

.loop-card.highlighted {
  border-color: var(--focus-ring);
  background: var(--surface-2);
  box-shadow: 0 0 0 2px var(--accent-glow);
}

.loop-card[draggable="true"] { cursor: grab; }
.loop-card.dragging { opacity: 0.48; transform: scale(0.982); }
.loop-card.drag-over {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-glow);
}

.drag-handle {
  width: 26px;
  height: 26px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--text-3);
  border-radius: var(--r-sm);
  flex-shrink: 0;
  cursor: grab;
}
.drag-handle:hover { background: var(--surface-3); color: var(--text-2); }

.loop-card-top-left {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
}

.loop-card-tools {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  flex-shrink: 0;
}

.reorder-controls {
  display: inline-flex;
  align-items: center;
  gap: 1px;
  padding: 2px;
  border: 1px solid var(--border-soft);
  border-radius: 7px;
  background: var(--surface-2);
}

.reorder-btn {
  width: 24px;
  height: 24px;
  border-radius: 5px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--text-3);
  transition: color 0.15s, background 0.15s, opacity 0.15s;
}
.reorder-btn:hover:not(:disabled) { background: var(--surface-3); color: var(--text); }
.reorder-btn:disabled { opacity: 0.22; cursor: not-allowed; }
.reorder-btn svg { width: 12px; height: 12px; }

/* ── CAPACITY PANEL ── */
.active-cap-panel {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  padding: 12px 14px;
  margin-bottom: 12px;
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: var(--r-md);
  animation: fadeSlideDown 0.18s ease;
}

.active-cap-copy { min-width: 0; }

.active-cap-label {
  font-family: var(--mono);
  font-size: 8.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-3);
  font-weight: 400;
  margin-bottom: 4px;
}

.active-cap-main {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.2;
  letter-spacing: -0.02em;
}

.active-cap-controls {
  display: inline-flex;
  gap: 3px;
  padding: 3px;
  border-radius: 8px;
  background: var(--surface-2);
  border: 1px solid var(--border-soft);
  flex-shrink: 0;
}

.active-cap-btn {
  min-width: 30px;
  padding: 5px 8px;
  border-radius: 5px;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  color: var(--text-3);
  transition: all 0.15s;
}
.active-cap-btn:hover { color: var(--text); background: var(--surface-3); }
.active-cap-btn.active {
  color: var(--accent);
  background: var(--accent-dim);
  font-weight: 600;
}

/* ── ROUTE GRID ── */
.route-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
  margin: 14px 0 18px;
}

.route-option {
  border: 1px solid var(--border-soft);
  background: var(--surface-2);
  color: var(--text-2);
  border-radius: var(--r-md);
  padding: 11px 10px;
  text-align: left;
  transition: all 0.15s;
}
.route-option:hover { border-color: var(--border); color: var(--text); }
.route-option.selected {
  border-color: var(--accent);
  color: var(--text);
  background: var(--accent-dim);
}
.route-option strong {
  display: block;
  font-size: 12.5px;
  font-weight: 600;
  margin-bottom: 2px;
  color: inherit;
}
.route-option span {
  display: block;
  font-family: var(--mono);
  font-size: 9.5px;
  line-height: 1.35;
  color: var(--text-3);
  letter-spacing: 0.04em;
}

/* ── LOOP CARD INTERNALS ── */
.loop-card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 7px;
}

/* ── KIND CHIP ── */
.kind-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 8px;
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  flex-shrink: 0;
}

.kind-chip.do     { background: var(--do-dim);       color: var(--do); }
.kind-chip.decide { background: var(--decide-dim);    color: var(--decide); }
.kind-chip.ask    { background: var(--ask-dim);       color: var(--ask); }
.kind-chip.schedule { background: var(--schedule-dim); color: var(--schedule); }
.kind-chip.let_go { background: var(--let_go-dim);   color: var(--let_go); }
.kind-chip.inbox  { background: var(--surface-3);     color: var(--text-3); }

.kind-dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: currentColor;
  flex-shrink: 0;
}

.card-overflow {
  width: 26px;
  height: 26px;
  border-radius: var(--r-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-3);
  transition: all 0.15s;
  flex-shrink: 0;
}
.card-overflow:hover { background: var(--surface-3); color: var(--text-2); }

.loop-title {
  font-size: 14.5px;
  font-weight: 400;
  color: var(--text);
  line-height: 1.5;
  margin: 0 0 6px;
  letter-spacing: -0.01em;
  text-wrap: pretty;
}

.loop-next {
  font-size: 11.5px;
  color: var(--text-2);
  line-height: 1.5;
  display: flex;
  gap: 6px;
  align-items: baseline;
}

.loop-next-label {
  font-family: var(--mono);
  font-size: 8.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-3);
  flex-shrink: 0;
}

.loop-meta {
  margin-top: 9px;
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.04em;
  color: var(--text-3);
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.loop-meta span {
  display: inline-flex;
  align-items: center;
  padding: 3px 5px;
  border: 1px solid var(--border-soft);
  border-radius: 5px;
  background: var(--surface-2);
}

.loop-card-bottom {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 6px;
  margin-top: 10px;
}

/* ── BUTTONS ── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 7px 14px;
  border-radius: var(--r-sm);
  font-size: 12.5px;
  font-weight: 600;
  transition: all 0.15s;
  cursor: pointer;
  border: none;
  letter-spacing: 0.01em;
}

.btn-ghost {
  background: transparent;
  color: var(--text-2);
  border: 1px solid var(--border);
}
.btn-ghost:hover { background: var(--surface-2); color: var(--text); border-color: var(--border); }

.btn-primary {
  background: var(--accent);
  color: var(--accent-ink);
  font-weight: 700;
  box-shadow: 0 6px 18px var(--focus-ring);
}
.btn-primary:hover {
  transform: translateY(-1px);
  background: var(--accent-hot);
  box-shadow: 0 8px 24px var(--focus-ring);
}
.btn-primary:disabled { opacity: 0.38; cursor: not-allowed; transform: none; box-shadow: none; }

.btn-subtle {
  background: var(--surface-2);
  color: var(--text-2);
  border: 1px solid var(--border);
}
.btn-subtle:hover { background: var(--surface-3); color: var(--text); }

.btn-sm {
  padding: 4px 9px;
  font-size: 11.5px;
  border-radius: 5px;
}

.btn-action {
  background: var(--surface-3);
  color: var(--text-2);
  border: 1px solid var(--border);
  padding: 5px 11px;
  font-size: 11.5px;
  font-weight: 600;
  border-radius: var(--r-sm);
  font-family: var(--mono);
  letter-spacing: 0.04em;
}
.btn-action:hover { color: var(--text); border-color: var(--border); }
.btn-action.btn-primary {
  background: var(--accent);
  color: var(--accent-ink);
  border-color: transparent;
}
.btn-action.btn-primary:hover {
  background: var(--accent-hot);
  box-shadow: 0 6px 18px var(--focus-ring);
}
.btn-action.kind-do:hover    { color: var(--do);       border-color: var(--border);   background: var(--do-dim); }
.btn-action.kind-decide:hover{ color: var(--decide);   border-color: var(--border);  background: var(--decide-dim); }
.btn-action.kind-ask:hover   { color: var(--ask);      border-color: var(--border);  background: var(--ask-dim); }
.btn-action.kind-schedule:hover { color: var(--schedule); border-color: var(--border); background: var(--schedule-dim); }
.btn-action.kind-let_go:hover   { color: var(--text);  background: var(--surface-3); }

/* ── SHOW MORE ── */
.show-more {
  width: 100%;
  padding: 9px;
  text-align: center;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-top: 2px;
  border-radius: var(--r-md);
  transition: all 0.15s;
}
.show-more:hover { color: var(--text-2); background: var(--surface); }

/* ── STATUS STRIP ── */
.status-strip {
  display: flex;
  gap: 8px;
  margin-top: 28px;
}

.strip-btn {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 11px 13px;
  border-radius: var(--r-md);
  border: 1px solid var(--border-soft);
  background: var(--surface);
  font-size: 12.5px;
  color: var(--text-2);
  transition: all 0.15s;
}
.strip-btn:hover { border-color: var(--border); color: var(--text); background: var(--surface-2); }

.strip-badge {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 20px;
  height: 20px;
  border-radius: 4px;
  background: var(--surface-3);
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  color: var(--text-3);
}

/* ── FAB ── */
.fab {
  position: fixed;
  bottom: calc(68px + env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 22px;
  border-radius: var(--r-md);
  background: var(--accent);
  color: var(--accent-ink);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.02em;
  box-shadow: 0 4px 6px rgba(0,0,0,0.3), 0 12px 30px var(--focus-ring);
  z-index: 5;
  transition: all 0.2s;
  white-space: nowrap;
}
.fab:hover {
  transform: translateX(-50%) translateY(-2px);
  background: var(--accent-hot);
  box-shadow: 0 6px 8px rgba(0,0,0,0.3), 0 16px 40px var(--focus-ring);
}
.fab:active { transform: translateX(-50%) translateY(0); }

/* ── BOTTOM NAV ── */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 9;
  display: flex;
  background: color-mix(in srgb, var(--bg) 94%, transparent);
  backdrop-filter: blur(16px);
  border-top: 1px solid var(--border-soft);
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
}

.bottom-nav-btn {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  color: var(--text-3);
  padding: 7px 4px;
  font-family: var(--mono);
  font-size: 8.5px;
  letter-spacing: 0.06em;
  position: relative;
}

.bottom-nav-btn.active { color: var(--accent); }

.bottom-nav-icon { width: 18px; height: 18px; }

.bottom-nav-badge {
  position: absolute;
  top: 5px;
  right: calc(50% - 22px);
  min-width: 14px;
  height: 14px;
  border-radius: 3px;
  background: var(--accent);
  color: #fff;
  font-family: var(--mono);
  font-size: 8px;
  font-weight: 700;
  line-height: 14px;
  padding: 0 3px;
}

/* ── OVERLAY ── */
.overlay-root {
  position: fixed;
  inset: 0;
  z-index: 50;
  pointer-events: none;
}

.overlay-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(6px);
  pointer-events: auto;
  animation: fadeIn 0.2s ease;
}

.overlay-panel {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  pointer-events: none;
}

.overlay-card {
  width: min(100%, 540px);
  max-height: calc(100vh - 40px);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  padding: 22px;
  pointer-events: auto;
  animation: slideUp 0.25s cubic-bezier(0.16,1,0.3,1);
  position: relative;
}

.overlay-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}

.overlay-meta {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.overlay-eyebrow {
  font-family: var(--mono);
  font-size: 8.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 500;
}

.overlay-step {
  font-size: 11.5px;
  color: var(--text-3);
  font-family: var(--mono);
}

.overlay-close {
  width: 30px;
  height: 30px;
  border-radius: var(--r-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-3);
  transition: all 0.15s;
}
.overlay-close:hover { background: var(--surface-3); color: var(--text); }

.overlay-title {
  font-size: clamp(1.3rem, 4vw, 1.75rem);
  font-weight: 700;
  margin: 0 0 6px;
  line-height: 1.15;
  letter-spacing: -0.03em;
  color: var(--text);
}

.overlay-subtitle {
  font-size: 13px;
  color: var(--text-2);
  line-height: 1.6;
  margin: 0 0 18px;
}

/* ── TEXTAREA ── */
.big-input {
  width: 100%;
  min-height: 110px;
  padding: 12px 14px;
  border-radius: var(--r-md);
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text);
  font-size: 14.5px;
  line-height: 1.6;
  resize: none;
  transition: border-color 0.15s;
  font-family: var(--sans);
}
.big-input:focus {
  outline: none;
  border-color: var(--focus-ring);
  box-shadow: 0 0 0 2px var(--accent-glow);
}
.big-input::placeholder { color: var(--text-3); }

.input-hint {
  font-size: 11.5px;
  color: var(--text-3);
  margin-top: 7px;
  line-height: 1.5;
}

.input-hint-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}
.input-hint-row .input-hint { margin-top: 7px; flex: 1; }

.char-counter {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
  margin-top: 7px;
  flex-shrink: 0;
}
.char-counter.near-limit { color: var(--decide); }
.char-counter.at-limit { color: var(--accent); }

.inline-edit-meta {
  display: flex;
  justify-content: flex-end;
  margin-top: 5px;
}

/* ── KIND CHOICES ── */
.kind-grid {
  display: flex;
  flex-direction: column;
  gap: 7px;
  margin-bottom: 18px;
}

.kind-option {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  padding: 12px 14px;
  border-radius: var(--r-md);
  border: 1px solid var(--border-soft);
  background: var(--surface-2);
  text-align: left;
  width: 100%;
  transition: all 0.15s;
}
.kind-option:hover { border-color: var(--border); background: var(--surface-3); }
.kind-option.selected { border-color: currentColor; }
.kind-option.selected.do       { color: var(--do);       background: var(--do-dim); }
.kind-option.selected.decide   { color: var(--decide);   background: var(--decide-dim); }
.kind-option.selected.ask      { color: var(--ask);      background: var(--ask-dim); }
.kind-option.selected.schedule { color: var(--schedule); background: var(--schedule-dim); }
.kind-option.selected.let_go   { background: var(--let_go-dim); border-color: var(--let_go); }

.kind-option-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  border: 1.5px solid currentColor;
  margin-top: 3px;
  flex-shrink: 0;
  transition: background 0.15s;
}
.kind-option.selected .kind-option-dot { background: currentColor; }

.kind-option-label { font-size: 13px; font-weight: 600; color: var(--text); display: block; margin-bottom: 1px; }
.kind-option.selected .kind-option-label { color: inherit; }
.kind-option-desc { font-size: 11.5px; color: var(--text-2); line-height: 1.5; }
.kind-option.selected .kind-option-desc { color: inherit; opacity: 0.72; }

/* ── PREVIEW CARD ── */
.preview-loop {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 14px;
  margin-bottom: 18px;
}

.preview-loop-title {
  font-size: 14px;
  font-weight: 400;
  color: var(--text);
  margin: 6px 0 5px;
  line-height: 1.4;
}

/* ── DRAWER ── */
.drawer-list {
  display: flex;
  flex-direction: column;
  gap: 7px;
  max-height: 55vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  margin-bottom: 14px;
}

.drawer-item {
  background: var(--surface-2);
  border: 1px solid var(--border-soft);
  border-radius: var(--r-md);
  padding: 11px 13px;
}

.drawer-item-title {
  font-size: 13px;
  color: var(--text);
  margin-bottom: 3px;
  line-height: 1.4;
}

.drawer-item-note {
  font-size: 11.5px;
  color: var(--text-2);
  line-height: 1.5;
}

.drawer-item-actions {
  display: flex;
  gap: 6px;
  margin-top: 9px;
}

/* ── MENU ── */
.menu-list {
  display: flex;
  flex-direction: column;
  gap: 3px;
  margin-bottom: 14px;
}

.menu-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 9px 11px;
  border-radius: var(--r-sm);
  font-size: 13px;
  color: var(--text-2);
  transition: all 0.15s;
  text-align: left;
  width: 100%;
  border: 1px solid transparent;
}
.menu-item:hover { background: var(--surface-2); color: var(--text); }
.menu-item.danger:hover { background: var(--focus-ring); color: var(--accent); border-color: var(--focus-ring); }

/* ── SYNC ── */
.sync-info {
  background: var(--surface-2);
  border: 1px solid var(--border-soft);
  border-radius: var(--r-md);
  padding: 11px 13px;
  font-size: 12px;
  color: var(--text-2);
  line-height: 1.6;
  margin-bottom: 14px;
}

.email-row {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}

.email-input {
  flex: 1;
  padding: 9px 12px;
  border-radius: var(--r-sm);
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text);
  font-size: 13px;
  transition: border-color 0.15s;
}
.email-input:focus { outline: none; border-color: var(--focus-ring); }
.email-input::placeholder { color: var(--text-3); }

/* ── SETTINGS ROWS ── */
.settings-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  padding: 14px 0;
  border-top: 1px solid var(--border-soft);
}
.settings-row:first-of-type { border-top: none; }
.settings-row-label { flex: 1; min-width: 0; }
.settings-row-title {
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 3px;
}
.settings-row-help {
  font-size: 11.5px;
  color: var(--text-2);
  line-height: 1.5;
}
.settings-cap-group {
  display: inline-flex;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  overflow: hidden;
  flex-shrink: 0;
}
.settings-cap-btn {
  padding: 6px 13px;
  background: transparent;
  color: var(--text-2);
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 500;
  border: none;
  border-right: 1px solid var(--border);
  transition: all 0.15s;
}
.settings-cap-btn:last-child { border-right: none; }
.settings-cap-btn:hover { color: var(--text); background: var(--surface-2); }
.settings-cap-btn.selected {
  background: var(--accent);
  color: #fff;
  font-weight: 700;
}
.settings-cap-btn.selected:hover { background: var(--accent-hot); }

.settings-section {
  padding: 14px 0;
  border-top: 1px solid var(--border-soft);
}
.settings-section:first-of-type { border-top: none; }
.settings-label {
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 5px;
}
.settings-helper {
  font-size: 11.5px;
  color: var(--text-2);
  line-height: 1.5;
  margin: 0 0 10px;
}
.seg-row {
  display: flex;
  gap: 3px;
  background: var(--surface-2);
  padding: 3px;
  border-radius: var(--r-sm);
}
.seg-row button {
  flex: 1;
  padding: 7px 10px;
  border-radius: 4px;
  background: transparent;
  color: var(--text-3);
  border: none;
  font-size: 12.5px;
  font-weight: 500;
  transition: all 0.15s;
}
.seg-row button.active {
  background: var(--surface);
  color: var(--text);
  box-shadow: 0 1px 2px rgba(0,0,0,0.2);
}
.seg-row button:hover:not(.active) { color: var(--text-2); }

/* ── EMPTY STATE ── */
.empty-state {
  padding: 44px 20px;
  text-align: center;
  color: var(--text-3);
  font-size: 12.5px;
  line-height: 1.7;
  border: 1px dashed var(--border-soft);
  border-radius: var(--r-lg);
}
.empty-state strong {
  display: block;
  color: var(--text-2);
  margin-bottom: 3px;
  font-weight: 600;
}

/* ── TAB PANELS ── */
.tab-panel { display: none; }
.tab-panel.active { display: block; animation: fadeIn 0.15s ease; }

/* ── NOTICE BANNER ── */
.notice-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 9px 13px;
  border-radius: var(--r-md);
  background: var(--focus-ring);
  border: 1px solid var(--focus-ring);
  margin-bottom: 10px;
  font-size: 12px;
  color: var(--error);
}

/* ── INLINE EDIT ── */
.inline-edit-input {
  width: 100%;
  background: var(--surface-2);
  border: 1px solid var(--focus-ring);
  border-radius: 5px;
  padding: 6px 8px;
  font-size: 14px;
  color: var(--text);
  line-height: 1.5;
  resize: none;
  box-shadow: 0 0 0 2px var(--accent-glow);
}
.inline-edit-input:focus { outline: none; }

/* ── TOAST ── */
.toast {
  position: fixed;
  bottom: calc(80px + env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: var(--surface-3);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 9px 16px;
  border-radius: var(--r-sm);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.04em;
  opacity: 0;
  pointer-events: none;
  transition: all 0.2s;
  z-index: 100;
  white-space: nowrap;
}
.toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.has-action.visible { pointer-events: auto; }
.toast-action {
  margin-left: 10px;
  color: var(--accent);
  font-weight: 600;
  font-size: 11px;
  padding: 1px 5px;
  border-radius: 3px;
  transition: background 0.15s;
}
.toast-action:hover { background: var(--accent-dim); }

/* ── ANIMATIONS ── */
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes fadeSlideDown {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* ── OVERLAY ACTIONS ── */
.overlay-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 18px;
}

/* ── MOBILE ── */
@media (max-width: 767px) {
  .main { padding: 0 14px 100px; }
  .active-cap-panel { align-items: flex-start; flex-direction: column; }
  .route-grid { grid-template-columns: 1fr; }
  .topbar { padding: 12px 16px; }
  .reentry-title { font-size: 1.25rem; }
  .overlay-panel { padding: 12px; align-items: flex-end; }
  .overlay-card { width: 100%; max-height: 86vh; border-radius: 16px 16px 0 0; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

/* ── SYNC ERROR BANNER ── */
.sync-error-banner {
  position: fixed;
  top: 66px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--focus-ring);
  border: 1px solid var(--focus-ring);
  padding: 9px 14px;
  border-radius: var(--r-md);
  display: flex;
  align-items: center;
  gap: 10px;
  z-index: 999;
  max-width: 90%;
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  animation: slideDown 0.3s ease;
}

@keyframes slideDown {
  from { opacity: 0; transform: translateX(-50%) translateY(-10px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

.sync-error-msg {
  flex: 1;
  font-size: 12.5px;
  color: var(--text);
}
.sync-error-msg strong { color: var(--accent); font-weight: 700; }

.sync-error-retry {
  padding: 5px 11px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 5px;
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.04em;
  cursor: pointer;
  transition: all 0.15s;
}
.sync-error-retry:hover { background: var(--accent-hot); transform: translateY(-1px); }

.sync-error-dismiss {
  padding: 4px 7px;
  background: transparent;
  color: var(--text-3);
  border: none;
  font-size: 15px;
  cursor: pointer;
  transition: color 0.15s;
}
.sync-error-dismiss:hover { color: var(--text); }

@media (max-width: 600px) {
  .sync-error-banner { top: 58px; max-width: 95%; }
}

/* ── SIDEBAR ── */
.sidebar-section {
  padding: 18px 14px;
  border-bottom: 1px solid var(--border-soft);
}
.sidebar-section:last-child { border-bottom: none; flex: 1; }
.sidebar-title {
  font-family: var(--mono);
  font-size: 8.5px;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--text-3);
  margin-bottom: 10px;
  font-weight: 400;
}
.sidebar-stats { display: flex; flex-direction: column; gap: 6px; }
.stat-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 7px 9px;
  border-radius: var(--r-sm);
  font-size: 12.5px;
  transition: background 0.15s;
}
.stat-row:hover { background: var(--surface); }
.stat-label {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text-2);
}
.stat-badge { width: 5px; height: 5px; border-radius: 50%; }
.stat-count { color: var(--text); font-weight: 600; font-size: 13px; }
.sidebar-tabs { display: flex; flex-direction: column; gap: 3px; }
.sidebar-tab {
  padding: 9px 11px;
  border-radius: var(--r-sm);
  font-size: 12.5px;
  color: var(--text-2);
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: all 0.15s;
  cursor: pointer;
}
.sidebar-tab:hover { background: var(--surface); color: var(--text); }
.sidebar-tab.active { background: var(--surface-2); color: var(--text); font-weight: 600; }
.sidebar-tab .tab-count {
  background: var(--surface-3);
  color: var(--text-3);
  min-width: 18px;
  height: 18px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 3px;
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 600;
  padding: 0 5px;
}
.sidebar-tab.active .tab-count { background: var(--accent-dim); color: var(--accent); }
.sidebar-actions { padding: 10px; }
.sidebar-capture-btn {
  width: 100%;
  padding: 11px;
  background: var(--accent);
  color: #fff;
  border-radius: var(--r-md);
  font-weight: 700;
  font-size: 12.5px;
  letter-spacing: 0.02em;
  transition: all 0.2s;
  box-shadow: 0 6px 18px var(--focus-ring);
}
.sidebar-capture-btn:hover {
  background: var(--accent-hot);
  transform: translateY(-1px);
  box-shadow: 0 8px 22px var(--focus-ring);
}

/* ── CONTEXT PANEL ── */
.context-panel-section { margin-bottom: 20px; }
.context-panel-section:last-child { margin-bottom: 0; }
.context-panel-title {
  font-family: var(--mono);
  font-size: 8.5px;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--text-3);
  margin-bottom: 10px;
  font-weight: 400;
}
.quick-action-btn {
  width: 100%;
  padding: 11px 14px;
  border-radius: var(--r-md);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 12.5px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all 0.15s;
  margin-bottom: 7px;
  text-align: left;
}
.quick-action-btn:hover { border-color: var(--border); background: var(--surface-2); transform: translateY(-1px); }
.quick-action-btn .shortcut {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-3);
  padding: 2px 5px;
  border-radius: 3px;
  background: var(--surface-3);
}

@media (min-width: 768px) {
  .tabs { display: none; }
}

/* ── AUTH GATE ── */
.auth-gate {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.auth-gate-card {
  width: 100%;
  max-width: 400px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  padding: 36px 32px 32px;
  display: flex;
  flex-direction: column;
  gap: 0;
}

.auth-gate-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 28px;
}

.auth-gate-logo-mark {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 2px solid var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 0 0 4px var(--accent-glow);
  position: relative;
}
.auth-gate-logo-mark::before {
  content: '';
  position: absolute;
  inset: 5px;
  border-radius: 50%;
  border: 1.5px solid var(--focus-ring);
}

.auth-gate-logo-name {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.01em;
}

.auth-gate-headline {
  font-size: 1.9rem;
  font-weight: 700;
  color: var(--text);
  line-height: 1.15;
  margin: 0 0 10px;
  letter-spacing: -0.03em;
}

.auth-gate-sub {
  font-size: 13.5px;
  color: var(--text-2);
  line-height: 1.6;
  margin: 0 0 24px;
}

.auth-gate-email-row {
  display: flex;
  flex-direction: column;
  gap: 9px;
  margin-bottom: 14px;
}

.auth-gate-input {
  width: 100%;
  padding: 12px 14px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  color: var(--text);
  font-size: 14.5px;
  outline: none;
  transition: border-color 0.15s;
  font-family: var(--sans);
}
.auth-gate-input:focus { border-color: var(--focus-ring); }

.auth-gate-btn {
  width: 100%;
  padding: 12px 14px;
  background: var(--accent);
  color: #fff;
  border-radius: var(--r-md);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  border: none;
  transition: all 0.15s;
  box-shadow: 0 6px 20px var(--focus-ring);
}
.auth-gate-btn:hover { background: var(--accent-hot); transform: translateY(-1px); }
.auth-gate-btn:disabled { opacity: 0.45; cursor: not-allowed; }

.auth-gate-hint {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--text-3);
  text-align: center;
  margin-top: 10px;
  line-height: 1.5;
  letter-spacing: 0.04em;
}

.auth-gate-sent {
  text-align: center;
  padding: 18px 0;
}

.auth-gate-sent-icon { font-size: 2.2rem; margin-bottom: 10px; }

.auth-gate-sent-title {
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 6px;
  letter-spacing: -0.02em;
}

.auth-gate-sent-body {
  font-size: 13px;
  color: var(--text-2);
  line-height: 1.6;
}

.auth-gate-features {
  display: flex;
  flex-direction: column;
  gap: 7px;
  margin-bottom: 24px;
}

.auth-gate-feature {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  font-size: 13px;
  color: var(--text-2);
  line-height: 1.5;
}

.auth-gate-feature-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--accent);
  margin-top: 5px;
  flex-shrink: 0;
}

/* ── ONBOARDING ── */
.onboarding-overlay {
  position: fixed;
  inset: 0;
  z-index: 300;
  background: rgba(0,0,0,0.8);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.onboarding-card {
  width: 100%;
  max-width: 460px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  padding: 36px 32px 32px;
  position: relative;
  animation: onboarding-in 0.3s ease;
}

@keyframes onboarding-in {
  from { opacity: 0; transform: translateY(14px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.onboarding-step-indicator {
  display: flex;
  gap: 5px;
  margin-bottom: 24px;
}

.onboarding-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--border);
  transition: background 0.2s, transform 0.2s;
}
.onboarding-dot.active { background: var(--accent); transform: scale(1.35); }
.onboarding-dot.done { background: var(--focus-ring); }

.onboarding-eyebrow {
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 8px;
}

.onboarding-title {
  font-size: 1.65rem;
  font-weight: 700;
  color: var(--text);
  line-height: 1.15;
  margin: 0 0 12px;
  letter-spacing: -0.03em;
}

.onboarding-body {
  font-size: 13.5px;
  color: var(--text-2);
  line-height: 1.7;
  margin: 0 0 22px;
}

.onboarding-visual {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 14px 16px;
  margin-bottom: 24px;
  font-size: 12.5px;
  color: var(--text-2);
}

.onboarding-visual-row {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 0;
  border-bottom: 1px solid var(--border-soft);
  color: var(--text);
  font-size: 12.5px;
}
.onboarding-visual-row:last-child { border-bottom: none; }

.onboarding-actions {
  display: flex;
  gap: 9px;
  align-items: center;
}

.onboarding-btn-primary {
  flex: 1;
  padding: 12px 14px;
  background: var(--accent);
  color: #fff;
  border-radius: var(--r-md);
  font-size: 13.5px;
  font-weight: 700;
  cursor: pointer;
  border: none;
  transition: all 0.15s;
  box-shadow: 0 6px 18px var(--focus-ring);
}
.onboarding-btn-primary:hover { background: var(--accent-hot); transform: translateY(-1px); }

.onboarding-btn-ghost {
  padding: 12px 14px;
  background: none;
  color: var(--text-2);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  font-size: 13.5px;
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
}
.onboarding-btn-ghost:hover { color: var(--text); border-color: var(--border); }

.onboarding-skip {
  text-align: center;
  margin-top: 14px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.06em;
  color: var(--text-3);
}

.inline-link {
  background: none;
  border: none;
  padding: 2px 3px;
  color: var(--text-2);
  text-decoration: underline;
  font: inherit;
  cursor: pointer;
  border-radius: 3px;
}
.inline-link:hover { color: var(--text); }
.inline-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ── APP LOCKED STATE ── */
.app-locked .app-body {
  pointer-events: none;
  filter: blur(2px);
  opacity: 0.2;
  user-select: none;
}
.app-locked .topbar-right {
  pointer-events: none;
  opacity: 0.2;
}

/* ══ CLAY COMPONENT LAYER ══
   Component treatments for the Clay system. Kept as one layer so the
   base structure above stays readable; tokens live at the top. */
body {
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.55;
  background: var(--bg);
  background-image: none;
  font-feature-settings: "cv11", "ss01";
}
:root[data-theme="light"] body { background-image: none; }

/* ── TOPBAR ── */
.topbar {
  height: 64px;
  padding: 0 20px;
  border-bottom: none;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
}
.brand { gap: 10px; }
.brand-name {
  font-family: var(--display);
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.03em;
}

.icon-btn {
  width: 36px; height: 36px;
  border-radius: var(--r-pill);
  border: none;
  color: var(--text-2);
}
.icon-btn:hover { background: var(--surface-3); color: var(--text); border: none; }
.icon-btn.active { background: var(--text); color: var(--bg); border: none; }
.icon-btn svg { width: 16px; height: 16px; }

.pill-btn {
  height: 32px;
  padding: 0 12px;
  border-radius: var(--r-pill);
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0;
  border: none;
  background: var(--surface-3);
  color: var(--text-2);
}
.pill-btn:hover { border: none; color: var(--text); background: var(--surface-strong); }
.pill-btn .dot { width: 7px; height: 7px; }
.pill-btn.synced  { color: var(--text); border: none; }
.pill-btn.synced .dot  { background: var(--success); }
.pill-btn.syncing { color: var(--text); border: none; }
.pill-btn.syncing .dot { background: var(--warning); }
.pill-btn.offline { color: var(--text); border: none; }
.pill-btn.offline .dot { background: var(--schedule); }
.pill-btn.error   { color: #fff; background: var(--error); border: none; }
.pill-btn.idle    { color: var(--text-2); border: none; }

/* ── PAGE HEAD (new) ── */
.page-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  padding: 28px 2px 20px;
}
.page-eyebrow {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 8px;
}
.page-title {
  font-family: var(--display);
  font-size: 40px;
  font-weight: 500;
  line-height: 1.05;
  letter-spacing: -0.045em;
  margin: 0;
  color: var(--text);
}
.page-sub {
  margin: 8px 0 0;
  font-size: 15px;
  color: var(--text-2);
}
.cap-meter {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
  flex-shrink: 0;
}
.cap-meter-dots { display: flex; gap: 5px; }
.cap-meter-dot {
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--surface-strong);
}
.cap-meter-dot.on { background: var(--text); }
.cap-meter-label { font-size: 13px; font-weight: 500; color: var(--text-3); white-space: nowrap; }

/* ── TABS → Clay category pills (desktop) ── */
@media (min-width: 768px) {
  .tabs {
    display: inline-flex !important;
    gap: 4px;
    border-bottom: none;
    padding: 4px;
    background: transparent;
    margin-top: 12px;
  }
  .bottom-nav { display: none; }
  .fab { bottom: 32px; }
  .toast { bottom: 100px; }
}
.tab {
  padding: 8px 16px;
  border-radius: var(--r-pill);
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0;
  text-transform: none;
  color: var(--text-3);
}
.tab:hover { color: var(--text); }
.tab.active { background: var(--surface-3); color: var(--text); font-weight: 600; }
.tab.active::after { display: none; }
.tab-count {
  min-width: 20px; height: 20px;
  border-radius: var(--r-pill);
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 600;
  background: transparent;
  color: inherit;
  opacity: .55;
  margin-left: 2px;
}
.tab.active .tab-count { background: var(--text); color: var(--bg); opacity: 1; }

/* ── LOOP STACK / CARDS ── */
.loop-stack { gap: 12px; }
.loop-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-right: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 20px 20px 18px;
}
.loop-card::before { display: none; }
.loop-card.kind-do, .loop-card.kind-decide, .loop-card.kind-ask,
.loop-card.kind-schedule, .loop-card.kind-let_go, .loop-card.kind-inbox { border-right-color: var(--border); }
.loop-card:hover {
  border-color: var(--border);
  background: var(--surface);
  transform: none;
  box-shadow: 0 6px 24px rgba(60,45,10,0.06);
}
:root[data-theme="dark"] .loop-card:hover { box-shadow: 0 6px 24px rgba(0,0,0,0.25); }
.loop-card.highlighted { border-color: var(--text); box-shadow: 0 0 0 3px var(--focus-ring); background: var(--surface); }
.loop-card.drag-over { border-color: var(--text); box-shadow: 0 0 0 3px var(--focus-ring); }

.loop-card-top { margin-bottom: 12px; align-items: center; }
.loop-title {
  font-size: 18px;
  font-weight: 600;
  line-height: 1.35;
  letter-spacing: -0.015em;
  margin: 0 0 8px;
}
.loop-next {
  font-size: 15px;
  color: var(--text-2);
  gap: 8px;
}
.loop-next-label {
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1.2px;
  color: var(--text-3);
}
.loop-meta {
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0;
  margin-top: 14px;
}
.loop-meta span { padding: 0; border: none; background: none; }
.loop-meta span + span::before { content: "·"; margin-right: 6px; }
.loop-card-bottom { margin-top: 16px; justify-content: flex-start; }
.loop-card-top-left { gap: 8px; }

/* ── KIND CHIP → filled badge pill ── */
.kind-chip {
  padding: 5px 12px 5px 10px;
  border-radius: var(--r-pill);
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0;
  text-transform: none;
  gap: 7px;
}
.kind-dot { width: 7px; height: 7px; }
.kind-chip.do       { background: var(--do-dim);       color: var(--text); }
.kind-chip.decide   { background: var(--decide-dim);   color: var(--text); }
.kind-chip.ask      { background: var(--ask-dim);      color: var(--text); }
.kind-chip.schedule { background: var(--schedule-dim); color: var(--text); }
.kind-chip.let_go   { background: var(--let_go-dim);   color: var(--text); }
.kind-chip.inbox    { background: var(--surface-3);    color: var(--text-2); }
.kind-chip.do .kind-dot       { background: var(--do); }
.kind-chip.decide .kind-dot   { background: var(--decide); }
.kind-chip.ask .kind-dot      { background: var(--ask); }
.kind-chip.schedule .kind-dot { background: var(--schedule); }
.kind-chip.let_go .kind-dot   { background: var(--let_go); }
.kind-chip.inbox .kind-dot    { background: var(--text-3); }

/* ── FOCUS CARD (new): the top Active loop becomes a saturated feature card ── */
.loop-card.is-focus {
  border: none;
  border-radius: var(--r-xl);
  padding: 28px 28px 26px;
  box-shadow: none;
}
.loop-card.is-focus:hover { box-shadow: none; }
.loop-card.is-focus.kind-do       { background: var(--do);       color: var(--do-ink); }
.loop-card.is-focus.kind-decide   { background: var(--decide);   color: var(--decide-ink); }
.loop-card.is-focus.kind-ask      { background: var(--ask);      color: var(--ask-ink); }
.loop-card.is-focus.kind-schedule { background: var(--schedule); color: var(--schedule-ink); }
.loop-card.is-focus.kind-let_go   { background: var(--let_go);   color: var(--let_go-ink); }
.loop-card.is-focus.kind-inbox    { background: var(--inbox);    color: var(--inbox-ink); }
.loop-card.is-focus .loop-title {
  color: inherit;
  font-family: var(--display);
  font-size: 30px;
  font-weight: 500;
  line-height: 1.12;
  letter-spacing: -0.035em;
  margin: 6px 0 12px;
}
.loop-card.is-focus .loop-next,
.loop-card.is-focus .loop-meta { color: inherit; opacity: .82; }
.loop-card.is-focus .loop-next-label { color: inherit; opacity: .7; }
.loop-card.is-focus .kind-chip { background: rgba(255,255,255,0.22); color: inherit; }
.loop-card.is-focus.kind-decide .kind-chip,
.loop-card.is-focus.kind-schedule .kind-chip,
.loop-card.is-focus.kind-let_go .kind-chip { background: rgba(10,10,10,0.1); }
.loop-card.is-focus .kind-dot { background: currentColor !important; }
.loop-card.is-focus .card-overflow,
.loop-card.is-focus .drag-handle,
.loop-card.is-focus .reorder-btn { color: inherit; opacity: .8; }
.loop-card.is-focus .reorder-controls { background: rgba(255,255,255,0.14); border: none; }
.loop-card.is-focus.kind-decide .reorder-controls,
.loop-card.is-focus.kind-schedule .reorder-controls,
.loop-card.is-focus.kind-let_go .reorder-controls { background: rgba(10,10,10,0.07); }
.focus-eyebrow {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  opacity: .75;
}
.loop-card.is-focus .btn-action {
  background: #fffaf0;
  color: #0a0a0a;
  border: none;
}
.loop-card.is-focus .btn-action:hover { background: #fff; color: #0a0a0a; }
.up-next-label {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-3);
  margin: 12px 2px 0;
}

/* ── CARD CONTROLS ── */
.card-overflow { width: 32px; height: 32px; border-radius: var(--r-pill); }
.card-overflow:hover { background: var(--surface-3); color: var(--text); }
.loop-card.is-focus .card-overflow:hover { background: rgba(255,255,255,0.2); color: inherit; }
.drag-handle { border-radius: var(--r-pill); }
.drag-handle:hover { background: var(--surface-3); }
.reorder-controls { border: none; background: var(--surface-2); border-radius: var(--r-pill); padding: 2px; }
.reorder-btn { width: 28px; height: 28px; border-radius: var(--r-pill); }
.reorder-btn:hover:not(:disabled) { background: var(--surface-3); }

/* ── BUTTONS ── */
.btn {
  height: 44px;
  padding: 0 20px;
  border-radius: var(--r-md);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0;
}
.btn-sm { height: 36px; padding: 0 14px; font-size: 13px; border-radius: var(--r-md); }
.btn-primary {
  background: var(--accent);
  color: var(--accent-ink);
  font-weight: 600;
  box-shadow: none;
}
.btn-primary:hover { background: var(--accent-hot); transform: none; box-shadow: none; }
.btn-primary:disabled { background: var(--surface-strong); color: var(--text-3); opacity: 1; }
.btn-ghost { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
.btn-ghost:hover { background: var(--surface-2); color: var(--text); border-color: var(--border); }
.btn-subtle { background: var(--surface-3); border: none; color: var(--text); }
.btn-action {
  height: 38px;
  padding: 0 16px;
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0;
  border-radius: var(--r-md);
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-action:hover { border-color: var(--text); color: var(--text); background: var(--bg); }
.btn-action.btn-primary { background: var(--accent); color: var(--accent-ink); border: none; }
.btn-action.btn-primary:hover { background: var(--accent-hot); box-shadow: none; }
.btn-action.kind-do:hover, .btn-action.kind-decide:hover, .btn-action.kind-ask:hover,
.btn-action.kind-schedule:hover, .btn-action.kind-let_go:hover {
  color: var(--text); background: var(--bg); border-color: var(--text);
}

.show-more {
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0;
  text-transform: none;
  color: var(--text-2);
  padding: 14px;
  margin-top: 4px;
  border: 1px dashed var(--border);
  border-radius: var(--r-lg);
}
.show-more:hover { background: var(--surface-2); color: var(--text); }

/* ── FAB ── */
.fab {
  height: 52px;
  padding: 0 24px;
  border-radius: var(--r-md);
  background: var(--accent);
  color: var(--accent-ink);
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0;
  box-shadow: 0 10px 30px rgba(40,30,10,0.22);
  bottom: calc(84px + env(safe-area-inset-bottom));
}
.fab:hover { background: var(--accent-hot); box-shadow: 0 12px 34px rgba(40,30,10,0.28); }
:root[data-theme="dark"] .fab { box-shadow: 0 10px 30px rgba(0,0,0,0.4); }

/* ── BOTTOM NAV (mobile) ── */
.bottom-nav {
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  border-top: 1px solid var(--border-soft);
  padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
  gap: 6px;
}
.bottom-nav-btn {
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0;
  color: var(--text-3);
  border-radius: var(--r-md);
  padding: 8px 4px;
}
.bottom-nav-btn.active { color: var(--text); background: var(--surface-3); font-weight: 600; }
.bottom-nav-icon { width: 20px; height: 20px; }
.bottom-nav-badge {
  top: 4px;
  right: calc(50% - 24px);
  min-width: 18px; height: 18px;
  border-radius: var(--r-pill);
  background: var(--text);
  color: var(--bg);
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 600;
  line-height: 18px;
  padding: 0 5px;
}

/* ── OVERLAYS ── */
.overlay-backdrop { background: rgba(40,32,15,0.28); backdrop-filter: blur(4px); }
:root[data-theme="dark"] .overlay-backdrop { background: rgba(0,10,10,0.6); }
.overlay-card {
  background: var(--bg);
  border: none;
  border-radius: var(--r-xl);
  padding: 32px;
  box-shadow: 0 30px 80px rgba(40,30,10,0.18);
}
:root[data-theme="dark"] .overlay-card { background: var(--surface-2); box-shadow: 0 30px 80px rgba(0,0,0,0.5); }
.overlay-eyebrow {
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1.5px;
  color: var(--text-3);
}
.overlay-step { font-family: var(--sans); font-size: 13px; color: var(--text-3); }
.overlay-close { border-radius: var(--r-pill); width: 36px; height: 36px; }
.overlay-close:hover { background: var(--surface-3); }
.overlay-title {
  font-family: var(--display);
  font-size: clamp(1.75rem, 5vw, 2.25rem);
  font-weight: 500;
  letter-spacing: -0.04em;
  line-height: 1.08;
  margin-bottom: 10px;
}
.overlay-subtitle { font-size: 15px; color: var(--text-2); line-height: 1.55; }

.big-input, .email-input, .auth-gate-input, .inline-edit-input {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  color: var(--text);
  font-family: var(--sans);
  box-shadow: none;
}
.big-input { font-size: 17px; padding: 14px 16px; }
.big-input:focus, .email-input:focus, .auth-gate-input:focus, .inline-edit-input:focus {
  outline: none;
  border-color: var(--text);
  box-shadow: 0 0 0 3px var(--focus-ring);
}
.inline-edit-input { border-color: var(--text); box-shadow: 0 0 0 3px var(--focus-ring); font-size: 17px; }
.input-hint { font-size: 13px; }
.char-counter { font-family: var(--sans); font-size: 12px; font-weight: 500; }
.char-counter.at-limit { color: var(--error); }
.char-counter.near-limit { color: var(--warning); }

/* kind picker */
.kind-grid { gap: 8px; }
.kind-option {
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: var(--r-lg);
  padding: 14px 16px;
  gap: 14px;
  align-items: center;
}
.kind-option:hover { border-color: var(--text-3); background: var(--surface); }
.kind-option-dot { width: 14px; height: 14px; border: none; margin-top: 0; }
.kind-option[data-kind="do"] .kind-option-dot       { background: var(--do); }
.kind-option[data-kind="decide"] .kind-option-dot   { background: var(--decide); }
.kind-option[data-kind="ask"] .kind-option-dot      { background: var(--ask); }
.kind-option[data-kind="schedule"] .kind-option-dot { background: var(--schedule); }
.kind-option[data-kind="let_go"] .kind-option-dot   { background: var(--let_go); }
.kind-option-label { font-size: 16px; }
.kind-option-desc { font-size: 14px; }
.kind-option.selected { border-color: transparent; }
.kind-option.selected.do       { background: var(--do);       color: var(--do-ink); }
.kind-option.selected.decide   { background: var(--decide);   color: var(--decide-ink); }
.kind-option.selected.ask      { background: var(--ask);      color: var(--ask-ink); }
.kind-option.selected.schedule { background: var(--schedule); color: var(--schedule-ink); }
.kind-option.selected.let_go   { background: var(--let_go);   color: var(--let_go-ink); border-color: transparent; }
.kind-option.selected .kind-option-dot { background: currentColor !important; box-shadow: 0 0 0 3px rgba(255,255,255,0.35); }
.kind-option.selected .kind-option-desc { opacity: .85; }

.route-option { border: 1px solid var(--border); background: var(--surface); border-radius: var(--r-lg); padding: 14px; }
.route-option.selected { border-color: var(--text); background: var(--surface); box-shadow: 0 0 0 3px var(--focus-ring); }
.route-option strong { font-size: 15px; }
.route-option span { font-family: var(--sans); font-size: 13px; letter-spacing: 0; }

.preview-loop, .drawer-item, .sync-info {
  background: var(--surface-3);
  border: none;
  border-radius: var(--r-lg);
}

/* menu */
.menu-list { gap: 2px; }
.menu-item { border-radius: var(--r-md); padding: 12px 14px; font-size: 15px; color: var(--text); }
.menu-item:hover { background: var(--surface-3); }
.menu-item.danger { color: var(--error); }
.menu-item.danger:hover { background: rgba(239,68,68,0.08); color: var(--error); border-color: transparent; }

/* settings */
.settings-label, .settings-row-title { font-size: 16px; }
.settings-helper, .settings-row-help { font-size: 14px; }
.seg-row { background: var(--surface-3); border-radius: var(--r-pill); padding: 4px; }
.seg-row button { border-radius: var(--r-pill); font-size: 14px; padding: 8px 12px; color: var(--text-2); }
.seg-row button.active { background: var(--text); color: var(--bg); box-shadow: none; }
.settings-cap-group { border: none; background: var(--surface-3); border-radius: var(--r-pill); padding: 4px; gap: 2px; }
.settings-cap-btn { border: none; border-radius: var(--r-pill); font-family: var(--sans); font-size: 14px; padding: 7px 16px; }
.settings-cap-btn.selected { background: var(--text); color: var(--bg); }
.settings-cap-btn.selected:hover { background: var(--text); }
.active-cap-btn { font-family: var(--sans); border-radius: var(--r-pill); }
.active-cap-btn.active { background: var(--text); color: var(--bg); }

/* ── EMPTY STATE with clay illustration ── */
.empty-state {
  border: none;
  background: var(--surface-2);
  border-radius: var(--r-xl);
  padding: 20px 24px 40px;
  font-size: 15px;
  color: var(--text-2);
}
.empty-state strong {
  font-family: var(--display);
  font-size: 26px;
  font-weight: 500;
  letter-spacing: -0.035em;
  color: var(--text);
  margin-bottom: 6px;
  line-height: 1.15;
}
.ol-mark { width: 100%; height: 100%; display: block; }
.brand-mark svg.ol-mark, .auth-gate-logo-mark svg.ol-mark { width: 30px; height: 30px; }
.clay-art { display: block; margin: 0 auto 4px; width: 220px; height: auto; }

/* ── TOAST ── */
.toast {
  background: var(--text);
  color: var(--bg);
  border: none;
  border-radius: var(--r-md);
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0;
  padding: 12px 18px;
}
.toast-action { color: var(--bg); text-decoration: underline; font-size: 14px; }
.toast-action:hover { background: rgba(255,255,255,0.12); }

/* ── SYNC BANNER ── */
.sync-error-banner { background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: 0 12px 30px rgba(40,30,10,0.14); top: 72px; }
.sync-error-msg strong { color: var(--error); }
.sync-error-retry { background: var(--accent); color: var(--accent-ink); font-family: var(--sans); font-size: 13px; border-radius: var(--r-sm); }

/* ── AUTH GATE ── */
.auth-gate { background: var(--bg); background-image: none; }
.auth-gate-card {
  max-width: 440px;
  background: transparent;
  border: none;
  padding: 8px 8px;
  text-align: left;
}
.auth-gate-card .clay-art { width: 260px; margin: 0 0 8px -18px; }
.auth-gate-logo { margin-bottom: 20px; }
.auth-gate-logo-mark { border: none; box-shadow: none; width: 30px; height: 30px; }
.auth-gate-logo-mark::before { display: none; }
.auth-gate-logo-name { font-size: 17px; font-weight: 600; letter-spacing: -0.03em; }
.auth-gate-headline {
  font-family: var(--display);
  font-size: 44px;
  font-weight: 500;
  letter-spacing: -0.05em;
  line-height: 1.02;
  margin-bottom: 14px;
}
.auth-gate-sub { font-size: 16px; line-height: 1.55; }
.auth-gate-input { height: 48px; font-size: 16px; }
.auth-gate-btn {
  height: 48px;
  background: var(--accent);
  color: var(--accent-ink);
  border-radius: var(--r-md);
  font-size: 15px;
  font-weight: 600;
  box-shadow: none;
}
.auth-gate-btn:hover { background: var(--accent-hot); transform: none; }
.auth-gate-hint { font-family: var(--sans); font-size: 13px; letter-spacing: 0; text-align: left; }
.auth-gate-sent { text-align: left; }
.auth-gate-sent-title { font-family: var(--display); font-size: 28px; font-weight: 500; letter-spacing: -0.04em; }
.auth-gate-sent-body { font-size: 15px; }

/* ── ONBOARDING ── */
.onboarding-overlay { background: rgba(40,32,15,0.3); }
:root[data-theme="dark"] .onboarding-overlay { background: rgba(0,10,10,0.6); }
.onboarding-card { background: var(--bg); border: none; border-radius: var(--r-xl); padding: 36px; box-shadow: 0 30px 80px rgba(40,30,10,0.18); }
:root[data-theme="dark"] .onboarding-card { background: var(--surface-2); }
.onboarding-dot { width: 8px; height: 8px; background: var(--surface-strong); }
.onboarding-dot.active { background: var(--text); transform: none; width: 24px; border-radius: 4px; }
.onboarding-dot.done { background: var(--text-3); }
.onboarding-eyebrow { font-family: var(--sans); font-size: 12px; font-weight: 600; letter-spacing: 1.5px; color: var(--text-3); }
.onboarding-title { font-family: var(--display); font-size: 34px; font-weight: 500; letter-spacing: -0.045em; line-height: 1.06; }
.onboarding-body { font-size: 16px; line-height: 1.55; }
.onboarding-visual { background: var(--surface-3); border: none; border-radius: var(--r-lg); padding: 10px 18px; font-size: 15px; }
.onboarding-visual-row { font-size: 15px; padding: 10px 0; border-bottom-color: var(--border); }
.onboarding-btn-primary { height: 48px; background: var(--accent); color: var(--accent-ink); border-radius: var(--r-md); font-size: 15px; font-weight: 600; box-shadow: none; }
.onboarding-btn-primary:hover { background: var(--accent-hot); transform: none; }
.onboarding-btn-ghost { height: 48px; border-radius: var(--r-md); color: var(--text); border-color: var(--border); background: var(--bg); }
.onboarding-skip { font-family: var(--sans); font-size: 13px; letter-spacing: 0; }

.inline-link:focus-visible { outline-color: var(--text); }
.app-locked .app-body { opacity: 0.12; }

/* ── MOBILE ── */
@media (max-width: 767px) {
  .page-head { padding: 20px 2px 16px; }
  .page-title { font-size: 34px; }
  .page-sub { font-size: 14px; }
  .loop-card { padding: 18px; }
  .loop-card.is-focus { padding: 24px 22px 22px; }
  .loop-card.is-focus .loop-title { font-size: 26px; }
  .overlay-card { border-radius: var(--r-xl) var(--r-xl) 0 0; padding: 24px 20px; }
  .auth-gate-headline { font-size: 38px; }
  .topbar { padding: 0 14px; height: 60px; }
}
@media (max-width: 767px) {
  .page-head { flex-direction: column; align-items: flex-start; gap: 14px; }
  .cap-meter { flex-direction: row; align-items: center; gap: 10px; }
}
.loop-card.is-focus .focus-eyebrow { margin-bottom: 10px; }

/* ── MOTION LAYER ── */
.motion-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.motion-layer > * { pointer-events: none; }
.motion-backdrop { position: fixed; inset: 0; background: rgba(40,32,15,0.28); }
:root[data-theme="dark"] .motion-backdrop { background: rgba(0,10,10,0.6); }
.motion-sheet { position: fixed; margin: 0; max-height: none; overflow: hidden; animation: none; transform-origin: center; }
.motion-ghost { position: fixed; margin: 0; transform-origin: center; box-shadow: 0 18px 40px rgba(40,30,10,0.12); }
.motion-token {
  position: fixed;
  left: 0; top: 0;
  border-radius: 50%;
  background:
    radial-gradient(circle at 32% 28%, rgba(255,255,255,0.75), rgba(255,255,255,0) 40%),
    radial-gradient(circle at 65% 72%, rgba(0,0,0,0.2), rgba(0,0,0,0) 60%),
    var(--tok);
  box-shadow: 0 6px 14px rgba(40,30,10,0.22);
  will-change: transform;
}
.motion-ring { position: fixed; left: 0; top: 0; will-change: transform; filter: drop-shadow(0 8px 10px rgba(40,30,10,0.18)); }
.motion-ring svg { display: block; overflow: visible; }

/* Closed archive in the header: the "mast" loops land in */
#archive-btn { position: relative; overflow: visible; }
.archive-count { display: none; }
#archive-btn.has-count {
  width: auto;
  padding: 0 11px 0 10px;
  gap: 6px;
}
#archive-btn.has-count .archive-count {
  display: inline-block;
  font-size: 13px;
  font-weight: 600;
  line-height: 1;
  color: var(--text-2);
  font-variant-numeric: tabular-nums;
  pointer-events: none;
}
#archive-btn.active .archive-count { color: inherit; }

/* Closed shelf: one clay ring per loop closed this week */
.closed-shelf { max-width: 300px; }
.ring-shelf { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; }
.clay-ring { width: 24px; height: 24px; display: block; overflow: visible; filter: drop-shadow(0 2px 2px rgba(40,30,10,0.18)); }
@media (max-width: 767px) {
  .closed-shelf { flex-direction: column; align-items: flex-start; max-width: 100%; }
  .ring-shelf { justify-content: flex-start; }
}

/* Kind picker: color fills in instead of snapping */
.kind-option { transition: background-color .24s ease, color .24s ease, border-color .24s ease, transform .12s ease; }
.kind-option:active { transform: scale(.985); }
.btn-action:active, .btn:active, .fab:active { transform: scale(.97); }
.fab:active { transform: translateX(-50%) scale(.97); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* Why: the mast opens it */
button.brand { background: none; border: none; padding: 4px 8px 4px 2px; margin-left: -2px; border-radius: var(--r-pill); color: inherit; cursor: pointer; }
button.brand:hover .brand-why { background: var(--surface-strong); color: var(--text); }
button.brand:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
.brand-why { font-size: 12px; font-weight: 600; color: var(--text-2); background: var(--surface-3); border-radius: var(--r-pill); padding: 3px 9px; margin-left: 2px; transition: background .15s, color .15s; }
.why-card .clay-art { width: 170px; margin: -6px 0 2px -12px; }
.why-section { display: grid; gap: 8px; padding: 16px 0 4px; }
.why-section p { margin: 0; font-size: 15px; line-height: 1.6; color: var(--text-2); }
.why-h { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-3); }
.why-steps { margin: 0; padding-left: 22px; display: grid; gap: 8px; font-size: 15px; line-height: 1.5; color: var(--text-2); }
.why-steps b { color: var(--text); font-weight: 600; }
.why-steps li::marker { color: var(--text-3); font-weight: 600; }
.why-source { margin: 18px 0 0; font-size: 12px; line-height: 1.5; color: var(--text-3); }
@media (max-width: 420px) {
  .brand-name { font-size: 16px; }
  .topbar-right { gap: 2px; }
  #sync-pill { padding: 0 10px; }
}
.brand-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
/* The page column can never be widened by its content (a wide header used
   to stretch the whole layout past the screen edge on phones). */
.app { grid-template-columns: minmax(0, 1fr); }
.topbar { min-width: 0; }
button.brand { min-width: 0; flex: 0 1 auto; overflow: hidden; }
.topbar-right { flex-shrink: 0; }
@media (max-width: 480px) {
  /* Theme and Install live in Settings on phones; sync shows as a dot with
     its status in the label and title. The header needs the room. */
  #theme-toggle, #install-btn { display: none !important; }
  #sync-label { display: none; }
  #sync-pill { width: 32px; padding: 0; justify-content: center; }
  #sync-pill.error { width: auto; padding: 0 10px; }
  #sync-pill.error #sync-label { display: inline; }
}
@media (max-width: 350px) {
  .brand-why { display: none; }
}
.toast { max-width: calc(100vw - 32px); white-space: normal; text-align: center; }

/* ── SHEETS: in-place updates never replay the entrance ── */
.overlay-card.no-enter { animation: none; }

/* ── CAPTURE ── */
.capture-input { min-height: 64px; resize: none; overflow: hidden; }
.capture-added { color: var(--text); font-weight: 600; }
.capture-kinds { margin-top: 18px; display: grid; gap: 10px; }
.capture-kinds-label { font-size: 13px; font-weight: 600; color: var(--text-2); }
.capture-kinds-label span { font-weight: 500; color: var(--text-3); margin-left: 4px; }
.kind-picks { display: flex; flex-wrap: wrap; gap: 8px; }
.kind-pick {
  display: inline-flex; align-items: center; gap: 7px;
  height: 36px; padding: 0 14px 0 12px;
  border-radius: var(--r-pill);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 14px; font-weight: 600;
  transition: background-color .2s ease, color .2s ease, border-color .2s ease, transform .12s ease;
}
.kind-pick:active { transform: scale(.96); }
.kind-pick .kind-dot { width: 8px; height: 8px; }
.kind-pick.do .kind-dot { background: var(--do); } .kind-pick.decide .kind-dot { background: var(--decide); }
.kind-pick.ask .kind-dot { background: var(--ask); } .kind-pick.schedule .kind-dot { background: var(--schedule); }
.kind-pick.let_go .kind-dot { background: var(--let_go); }
.kind-pick.on { border-color: transparent; }
.kind-pick.do.on { background: var(--do); color: var(--do-ink); }
.kind-pick.decide.on { background: var(--decide); color: var(--decide-ink); }
.kind-pick.ask.on { background: var(--ask); color: var(--ask-ink); }
.kind-pick.schedule.on { background: var(--schedule); color: var(--schedule-ink); }
.kind-pick.let_go.on { background: var(--let_go); color: var(--let_go-ink); }
.kind-pick.on .kind-dot { background: currentColor; }

/* ── DEFINE ── */
.define-card { overflow-x: hidden; }
.define-top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.define-back { margin-left: -8px; }
.define-progress { display: flex; gap: 4px; width: 72px; flex-shrink: 0; }
.define-progress span { flex: 1; height: 4px; border-radius: 2px; background: var(--surface-strong); transition: background-color .25s ease; }
.define-progress span.on { background: var(--text); }
.define-stepcount { flex: 1; font-size: 12px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: var(--text-3); }
.define-title-input {
  width: 100%;
  resize: none;
  overflow: hidden;
  border: none;
  border-bottom: 1px dashed transparent;
  border-radius: 0;
  background: transparent;
  color: var(--text);
  font-family: var(--display);
  font-size: 24px;
  font-weight: 500;
  letter-spacing: -0.03em;
  line-height: 1.2;
  padding: 2px 0 8px;
  margin: 0 0 6px;
}
.define-title-input:hover { border-bottom-color: var(--border); }
.define-title-input:focus { outline: none; border-bottom-color: var(--text-3); }
.define-body { display: grid; gap: 12px; }
.step-q { margin: 6px 0 2px; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; color: var(--text); line-height: 1.35; }
.step-kind { display: flex; }
.step-note { margin: -4px 0 0; font-size: 14px; color: var(--text-2); }
.define-kind-chip { cursor: pointer; border: none; }
.define-chip-edit { font-weight: 500; opacity: .6; margin-left: 4px; font-size: 12px; }
.define-body .overlay-actions { margin-top: 4px; }
#define-detail-input { min-height: 64px; resize: none; overflow: hidden; }

.kind-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.kind-tile {
  display: grid;
  grid-template-columns: auto 1fr;
  column-gap: 10px;
  row-gap: 3px;
  align-items: center;
  text-align: left;
  padding: 14px;
  border-radius: var(--r-lg);
  border: 1px solid transparent;
  color: var(--text);
  transition: background-color .2s ease, color .2s ease, transform .12s ease;
}
.kind-tile:active { transform: scale(.97); }
.kind-tile:last-child:nth-child(odd) { grid-column: 1 / -1; }
.kind-tile-dot { width: 12px; height: 12px; border-radius: 50%; }
.kind-tile-label { font-size: 16px; font-weight: 600; }
.kind-tile-hint { grid-column: 1 / -1; font-size: 13px; line-height: 1.35; color: var(--text-2); }
.kind-tile.do { background: var(--do-dim); } .kind-tile.do .kind-tile-dot { background: var(--do); }
.kind-tile.decide { background: var(--decide-dim); } .kind-tile.decide .kind-tile-dot { background: var(--decide); }
.kind-tile.ask { background: var(--ask-dim); } .kind-tile.ask .kind-tile-dot { background: var(--ask); }
.kind-tile.schedule { background: var(--schedule-dim); } .kind-tile.schedule .kind-tile-dot { background: var(--schedule); }
.kind-tile.let_go { background: var(--let_go-dim); } .kind-tile.let_go .kind-tile-dot { background: var(--let_go); }
.kind-tile.on { border-color: var(--text); }
.kind-tile:focus-visible, .route-big:focus-visible, .kind-pick:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

.route-bigs { display: grid; gap: 8px; }
.route-big {
  display: grid; gap: 3px; text-align: left;
  padding: 16px 18px;
  border-radius: var(--r-lg);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  transition: border-color .15s ease, transform .12s ease, background-color .15s ease;
}
.route-big:hover { border-color: var(--text-3); }
.route-big:active { transform: scale(.98); }
.route-big.suggested { border-color: var(--text); box-shadow: 0 0 0 3px var(--focus-ring); }
.route-big-title { font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.route-big-hint { font-size: 14px; color: var(--text-2); }
.route-suggest { font-size: 11px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; padding: 3px 8px; border-radius: var(--r-pill); background: var(--text); color: var(--bg); }
@media (max-width: 360px) {
  .kind-tiles { grid-template-columns: 1fr; }
  .kind-tile:last-child:nth-child(odd) { grid-column: auto; }
}

.overlay-card.swap-enter { animation: sheetSwap .18s ease-out; }
@keyframes sheetSwap { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ── WHY STORY: half picture, half text ── */
.why-sheet { max-width: 460px; }
.why-story { display: grid; gap: 14px; }
.why-bars { display: flex; gap: 4px; }
.why-bars span { flex: 1; height: 3px; border-radius: 2px; background: var(--surface-strong); overflow: hidden; }
.why-bars i { display: block; height: 100%; background: var(--text); transform: scaleX(0); transform-origin: left center; }
.why-bars span.done i { transform: scaleX(1); }
.why-story[data-scene="4"] .why-bars span.now i { transform: scaleX(1); }
@media (prefers-reduced-motion: reduce) { .why-bars span.now i { transform: scaleX(1); } }
