          </div>
          <button type="button" class="act-link" data-action="act-step" data-step="main">Back</button>`;
      }
    } else if (kind === 'let_go') {
      title = 'Ready to let it go?';
      sub = 'Letting go is a choice, not a failure. It leaves your head, not your history.';
      body = `<div class="act-mascot">${mascotSvg('calm', { width: 132 })}</div>` + actLoopBox(loop.rawText, loop.promptAnswer ? `Letting go of: ${loop.promptAnswer}` : '') + `
        <div class="act-list">
          ${actBtn({ action: 'complete-done', label: 'Let it go', primary: true, loopId: id, icon: ACT_ICON.drift })}
          ${notYetBtn(loop)}
        </div>`;
    } else {
      // Do (and any loop without a kind yet).
      if (step === 'next') {
        const typed = (ov.nextText || '').trim();
        title = "Nice. What’s next?";
        sub = 'Concrete enough that you could start right now without planning.';
        body = actField('act-next', 'Next visible step',
            `<textarea class="big-input act-input" id="act-next" rows="2" maxlength="${MAX_LOOP_TEXT_LEN}" placeholder="e.g. Draft the three key messages" enterkeyhint="done">${esc(ov.nextText || '')}</textarea>`) + `
          <div class="overlay-actions">
            <button class="btn btn-ghost" type="button" data-action="act-step" data-step="main">Back</button>
            <button class="btn btn-primary" type="button" data-action="do-save-step" data-loop-id="${esc(id)}" ${typed ? '' : 'disabled'}>Save next step</button>
          </div>`;
      } else {
        title = 'How did it go?';
        sub = "A Do holds your next step. Finishing the step isn’t always finishing the loop.";
        body = actLoopBox(loop.rawText, loop.promptAnswer ? `Next: ${loop.promptAnswer}` : '') + `
          <div class="act-list">
            ${actBtn({ action: 'complete-done', label: 'All done, close it', primary: true, loopId: id, icon: ACT_ICON.ring })}
            ${actBtn({ action: 'act-step', label: loop.promptAnswer ? 'Did the step, set the next one' : 'Set the next step', loopId: id, attrs: 'data-step="next"', icon: ACT_ICON.next })}
            ${notYetBtn(loop)}
          </div>${editLink}`;
      }
    }

    return actSheet({ kind: loop.kind, titleId: 'act-title', title, sub, step, body });
  }

  // ── NOT YET → WHEN? ──
  // Every way of parking a loop asks when it should come back. "No date" is
  // still allowed; it just means checking Parked yourself.
  function renderWhen(loop) {
    if (!loop) return '';
    const ov = view.overlay || {};
    if ((ov.define ? ov.define.kind : loop.kind) === 'schedule') return renderScheduleWhen(loop);
    const rawText = ov.define ? ov.define.rawText : loop.rawText;
    const current = loop.status === 'waiting' && loop.wakeAt ? ` Right now it’s set for ${formatWake(loop.wakeAt)}.` : '';
    const presets = wakePresets('park').map(p => actBtn({
      action: 'park-until', label: p.label, sub: formatEvent(p.when.toISOString()), loopId: loop.id,
      attrs: `data-when="${p.when.toISOString()}"`, icon: ACT_ICON.clock
    })).join('');
    const def = ov.pickDate ? new Date(ov.pickDate) : atTime(addDays(new Date(), 2), 9);
    const pick = ov.pickOpen
      ? `<div class="act-pick">
          <div class="act-row">
            ${actField('when-date', 'Day', `<input class="big-input act-input no-autofocus" id="when-date" type="date" value="${localDateValue(def)}" min="${localDateValue(new Date())}">`)}
            ${actField('when-time', 'Time', `<input class="big-input act-input no-autofocus" id="when-time" type="time" value="${localTimeValue(def)}">`)}
          </div>
          <button type="button" class="btn btn-primary act-pick-go" data-action="park-until" data-when="pick" data-loop-id="${esc(loop.id)}">Park until then</button>
        </div>`
      : actBtn({ action: 'when-pick-open', label: 'Pick a day and time', loopId: loop.id, icon: ACT_ICON.cal });
    const body = actLoopBox(rawText, '') + `
      <div class="act-list">
        ${presets}
        ${pick}
        ${actBtn({ action: 'park-until', label: 'No date', sub: 'It waits in Parked until you bring it back', loopId: loop.id, attrs: 'data-when=""', icon: ACT_ICON.next })}
      </div>`;
    return actSheet({
      eyebrow: 'Not yet', titleId: 'when-title', step: 'when',
      title: 'When should it come back?',
      sub: `It returns to Up next at that time, never straight to Now.${current}`,
      body
    });
  }

  // "Not yet" for a Schedule loop: it’s happening at a different time, so
  // the only question is when. A day and a time, no quick presets.
  function renderScheduleWhen(loop) {
    const at = scheduleAt(loop);
    const start = at !== null && at > Date.now() ? new Date(at) : null;
    const body = actLoopBox(loop.rawText, at !== null ? `${at > Date.now() ? 'Now' : 'Was'} ${formatEvent(new Date(at).toISOString())}` : '') + `
      <div class="act-pick">
        ${scheduleFieldsHtml('when-sched', start)}
        <button type="button" class="btn btn-primary act-pick-go" data-action="park-until" data-when="schedule" data-loop-id="${esc(loop.id)}">Save the time</button>
      </div>
      <button type="button" class="act-link" data-action="park-until" data-when="schedule-clear" data-loop-id="${esc(loop.id)}">Not sure yet</button>`;
    return actSheet({
      kind: 'schedule', titleId: 'when-title', step: 'when',
      title: at !== null ? 'When is it now?' : 'When is it?',
      body
    });
  }

  // Keep what the person typed when the sheet changes step.
  function readActInputs(ov) {
    const val = id => { const el = document.getElementById(id); return el ? el.value : null; };
    const map = { 'act-next': 'nextText', 'act-decision': 'decision', 'act-spawn': 'spawnText', 'act-msg': 'message', 'cal-title': 'calTitle', 'cal-date': 'calDate', 'cal-time': 'calTime', 'sched-date': 'schedDate', 'sched-time': 'schedTime' };
    Object.keys(map).forEach(id => { const v = val(id); if (v !== null) ov[map[id]] = v; });
  }

  function syncChoiceChips(ov) {
    document.querySelectorAll('#overlay-root .choice-chip').forEach(b => {
      const on = b.dataset.choice === (ov.decision || '').trim();
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', String(on));
    });
  }

  function updateActButtons(ov) {
    const save = document.querySelector('#overlay-root [data-action="do-save-step"]');
    if (save) save.disabled = !(ov.nextText || '').trim();
    const spawn = document.querySelector('#overlay-root [data-action="decide-close"][data-spawn]');
    if (spawn) spawn.disabled = !(ov.spawnText || '').trim();
  }

  // Move the action sheet to another step: the body slides in and the sheet
  // eases to its new height, like the define sheet.
  function renderActStep() {
    const root = document.getElementById('overlay-root');
    const card = root && root.querySelector('.act-card');
    const h0 = card ? card.getBoundingClientRect().height : 0;
    renderOverlay();
    const card2 = root && root.querySelector('.act-card');
    if (!card2) return;
    card2.querySelectorAll('textarea.act-input').forEach(autoGrow);
    const calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (h0 && !calm) {
      const h1 = card2.getBoundingClientRect().height;
      if (Math.abs(h1 - h0) > 2) card2.animate([{ height: h0 + 'px' }, { height: h1 + 'px' }], { duration: 240, easing: 'cubic-bezier(.2,.8,.2,1)' });
    }
    const body = card2.querySelector('.act-body');
    if (body && !calm) {
      body.animate([{ transform: 'translateX(24px)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 240, easing: 'cubic-bezier(.2,.8,.2,1)' });
    }
    const first = card2.querySelector('.act-input:not(.no-autofocus)') || card2.querySelector('.act-btn:not([disabled]), .btn-primary:not([disabled])');
    if (first) setTimeout(() => {
      first.focus({ preventScroll: true });
      if (first.tagName === 'TEXTAREA') first.selectionStart = first.selectionEnd = first.value.length;
    }, 60);
  }

  function renderConfirmDelete(loop) {
    if (!loop) return '';
    return `
      <div class="overlay-card" role="dialog" aria-modal="true" aria-labelledby="confirm-delete-title">
        <div class="overlay-header">
          <div class="overlay-meta"><div class="overlay-eyebrow">Delete loop</div></div>
          <button class="overlay-close" data-action="close-overlay" title="Close" aria-label="Close"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><line x1="4" y1="4" x2="12" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="12" y1="4" x2="4" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
        </div>
        <h2 class="overlay-title" id="confirm-delete-title" style="font-size:1.4rem">Delete this loop?</h2>
        <p class="overlay-subtitle">You can undo for a few seconds after. If you’d rather keep it archived, close it instead.</p>
        <p style="font-size:13px;color:var(--text-2);margin:0 0 20px;padding:10px 12px;background:var(--surface-2);border-radius:8px;line-height:1.5">${esc(loop.rawText)}</p>
        <div class="overlay-actions">
          <button class="btn btn-ghost" data-action="close-overlay">Cancel</button>
          <button class="btn btn-primary" data-action="confirm-delete" data-loop-id="${esc(loop.id)}" style="background:var(--error);color:#fff">Delete</button>
        </div>
      </div>`;
  }

  // ── RENDER SIDEBAR ──
  // The sidebar element is hidden via CSS (display:none) on every viewport.
  // Kept as a no-op so renderAll() doesn’t need a special case; if a sidebar
  // is reintroduced, this is the place to wire it.
  function renderSidebar() {
    const sidebar = document.getElementById('sidebar');
    if (sidebar) sidebar.innerHTML = '';
  }

  function renderBottomNav() {
    const nav = document.getElementById('bottom-nav');
    if (!nav) return;
      const counts = {
        now: byStatus('active').length,
        later: byStatus('waiting').length,
        inbox: byStatus('inbox').length
      };
    const items = [
      { key: 'now',   label: TAB_LABEL.active,   icon: '<path d="M13.6 5.2A6 6 0 1 0 14 12.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="9" cy="9" r="2" fill="currentColor"/>' },
      { key: 'later', label: TAB_LABEL.waiting,  icon: '<circle cx="9" cy="9" r="5.5" stroke="currentColor" stroke-width="1.5"/><path d="M9 6.8v2.6l1.7 1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>' },
      { key: 'inbox', label: TAB_LABEL.inbox,    icon: '<path d="M3.5 5.5h11l-1 7h-9l-1-7Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M6.5 8.8h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>' }
    ];
    nav.innerHTML = items.map(item => `
      <button class="bottom-nav-btn ${view.activeTab === item.key ? 'active' : ''}" type="button" data-action="set-tab" data-tab="${item.key}">
        ${counts[item.key] && dataKnown() ? `<span class="bottom-nav-badge">${counts[item.key]}</span>` : ''}
        <svg class="bottom-nav-icon" viewBox="0 0 18 18" fill="none" aria-hidden="true">${item.icon}</svg>
        <span>${item.label}</span>
      </button>
    `).join('');
  }

  // ── RENDER CONTEXT PANEL ──
  // The context panel previously showed keyboard shortcuts. With shortcuts
  // removed it has no content, and its container is hidden via CSS.
  function renderContextPanel() {
    const panel = document.getElementById('context-panel');
    if (panel) panel.innerHTML = '';
  }

  // ── SOUND ──
  // Tiny synthesized sounds (Web Audio), no audio files. One soft kalimba-like
  // instrument, every note from D major pentatonic so all cues sit together.
  // An open loop is an unresolved chord; closing it resolves to D major.
  const SOUND_KEY = CFG.STORAGE_KEY ? CFG.STORAGE_KEY + '_sound' : 'open_loops_sound';
  const SOUND_HINT_KEY = SOUND_KEY + '_hinted';

  const Sound = (() => {
    let ctx = null;
    let out = null;
    let enabled = true;
    let hinted = false;
    try {
      enabled = localStorage.getItem(SOUND_KEY) !== 'off';
      hinted = localStorage.getItem(SOUND_HINT_KEY) === '1';
    } catch (_) {}

    const N = { A3: 220, D4: 293.66, E4: 329.63, Fs4: 369.99, A4: 440, B4: 493.88, D5: 587.33, E5: 659.25, Fs5: 739.99 };

    // Create/resume the audio context. Called synchronously inside a click so
    // iOS Safari allows playback.
    function unlock() {
      if (!enabled) return null;
      try {
        if (!ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          ctx = new AC();
          const comp = ctx.createDynamicsCompressor();
          out = ctx.createGain();
          out.gain.value = 0.3;
          out.connect(comp);
          comp.connect(ctx.destination);
        }
        if (ctx.state === 'suspended') ctx.resume();
      } catch (_) { return null; }
      return ctx;
    }

    function env(g, t, peak, attack, decay) {
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + attack);
      g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
    }

    // Kalimba-ish pluck: sine body + short inharmonic "tine" overtone.
    function pluck(freq, at = 0, vel = 1, decay = 1.1) {
      const c = unlock(); if (!c) return;
      const t = c.currentTime + at;
      const body = c.createOscillator(); body.type = 'sine'; body.frequency.value = freq;
      const tine = c.createOscillator(); tine.type = 'sine'; tine.frequency.value = freq * 5.4;
      const gb = c.createGain(); const gt = c.createGain();
      env(gb, t, 0.5 * vel, 0.006, decay);
      env(gt, t, 0.1 * vel, 0.003, 0.09);
      body.connect(gb); tine.connect(gt); gb.connect(out); gt.connect(out);
      body.start(t); tine.start(t);
      body.stop(t + decay + 0.1); tine.stop(t + 0.15);
    }

    function noise(at, dur, opts = {}) {
      const c = unlock(); if (!c) return;
      const { type = 'lowpass', from = 400, to = 400, q = 0.8, vel = 0.2, attack = 0.004 } = opts;
      const t = c.currentTime + at;
      const len = Math.max(1, Math.ceil(c.sampleRate * dur));
      const buf = c.createBuffer(1, len, c.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = c.createBufferSource(); src.buffer = buf;
      const f = c.createBiquadFilter(); f.type = type; f.Q.value = q;
      f.frequency.setValueAtTime(from, t);
      f.frequency.exponentialRampToValueAtTime(to, t + dur);
      const g = c.createGain();
      env(g, t, vel, attack, Math.max(0.02, dur - attack));
      src.connect(f); f.connect(g); g.connect(out);
      src.start(t); src.stop(t + dur + 0.05);
    }

    // Soft clay "thunk": falling sine plus a puff of filtered noise.
    function thud(at = 0, vel = 0.5) {
      const c = unlock(); if (!c) return;
      const t = c.currentTime + at;
      const o = c.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(150, t);
      o.frequency.exponentialRampToValueAtTime(55, t + 0.13);
      const g = c.createGain();
      env(g, t, vel, 0.005, 0.16);
      o.connect(g); g.connect(out);
      o.start(t); o.stop(t + 0.25);
      noise(at, 0.06, { from: 900, to: 280, vel: vel * 0.22 });
    }

    const cues = {
      // pebble dropping into the Inbox jar
      capture:  () => { thud(0, 0.32); pluck(N.A3, 0.012, 0.75, 0.8); },
      // two notes up: into focus
      up:       () => { pluck(N.A4, 0, 0.65, 0.7); pluck(N.D5, 0.085, 0.65, 0.9); },
      // two notes down: set aside
      down:     () => { pluck(N.D5, 0, 0.5, 0.6); pluck(N.A4, 0.09, 0.45, 0.8); },
      // back from Parked
      wake:     () => { pluck(N.A4, 0, 0.55); pluck(N.D5, 0.08, 0.55); pluck(N.Fs5, 0.16, 0.4, 1.4); },
      // the loop seals: a suspended interval, still unresolved
      seal:     () => { pluck(N.E4, 0, 0.6, 1.0); pluck(N.A4, 0.075, 0.6, 1.2); },
      // it lands in Closed: resolves to D major
      land:     () => { thud(0, 0.42); pluck(N.D4, 0.01, 0.7, 1.6); pluck(N.Fs4, 0.035, 0.55, 1.6); pluck(N.D5, 0.06, 0.6, 1.9); },
      // let go: an exhale, no resolution
      release:  () => { noise(0, 0.75, { type: 'bandpass', from: 650, to: 2600, q: 1.1, vel: 0.07, attack: 0.28 }); pluck(N.E5, 0.14, 0.3, 1.4); },
      quickLand: () => { thud(0, 0.3); pluck(N.D5, 0.01, 0.45, 1.0); pluck(N.Fs4, 0.03, 0.3, 1.0); },
      softLand: () => { pluck(N.B4, 0, 0.32, 1.6); pluck(N.Fs5, 0.07, 0.22, 1.8); },
      // reopen: the closing chord, backwards
      reopen:   () => { pluck(N.D5, 0, 0.5, 0.6); pluck(N.A4, 0.07, 0.45, 0.6); pluck(N.E4, 0.14, 0.5, 1.0); },
      // Music that builds: the nth close in a sitting adds the nth note on
      // top of the landing chord. Clearing Active plays the whole chord.
      comboNote: (step) => { const n = COMBO_LADDER[Math.min(step, COMBO_LADDER.length - 1)]; if (n) pluck(n, 0.12, 0.55, 1.4); },
      cleared:  () => { pluck(N.D4, 0, 0.5, 2.8); pluck(N.D5, 0.04, 0.8, 2.6); pluck(N.Fs5, 0.09, 0.55, 2.6); pluck(880, 0.14, 0.45, 2.8); },
      // The sweep: each card placed plays the next note up; the last one resolves.
      sweepNote: (i) => { pluck(SWEEP_LADDER[Math.min(i || 0, SWEEP_LADDER.length - 1)], 0, 0.8, 1.2); },
      sweepDone: () => { pluck(N.D5, 0, 0.9, 2); pluck(N.Fs5, 0.03, 0.5, 2); pluck(880, 0.06, 0.35, 2.2); },
      // "Yes, keep it": wet clay again
      fresh:    () => { pluck(N.D5, 0, 0.6, 0.7); pluck(N.Fs5, 0.1, 0.5, 1.0); },
      // a small "hm?" for a sheet that asks something
      ask:      () => { pluck(N.B4, 0, 0.35, 0.4); },
    };
    const COMBO_LADDER = [null, N.E5, N.Fs5, 880, 987.77, 1174.66];
    const SWEEP_LADDER = [N.D4, N.Fs4, N.A4, N.B4, N.D5, N.E5];

    function hint() {
      if (hinted) return;
      hinted = true;
      try { localStorage.setItem(SOUND_HINT_KEY, '1'); } catch (_) {}
      // Wait until no sheet is open, so the hint never covers a flow.
      let tries = 0;
      const show = () => {
        if (view.overlay && tries++ < 20) { setTimeout(show, 1000); return; }
        toast('Sound is on. You can turn it off in Settings.', { tip: true });
      };
      setTimeout(show, 1700);
    }

    // A light tap on phones that support it, on the same moments as the
    // sounds. Follows the Sounds setting.
    const TAPS = { capture: 8, up: 5, down: 5, wake: 8, seal: 10, land: [8, 40, 14], quickLand: [8, 30, 10], softLand: 6, reopen: 5, release: 6, ask: 4, cleared: [10, 50, 10, 50, 20], sweepNote: 5, sweepDone: [10, 50, 18], fresh: 8 };
    function tap(name) {
      const p = TAPS[name];
      if (!p || typeof navigator.vibrate !== 'function') return;
      try { navigator.vibrate(p); } catch (_) {}
    }

    return {
      get enabled() { return enabled; },
      set(on) {
        enabled = !!on;
        hinted = true;
        try {
          localStorage.setItem(SOUND_KEY, on ? 'on' : 'off');
          localStorage.setItem(SOUND_HINT_KEY, '1');
        } catch (_) {}
      },
      unlock,
      play(name, arg) {
        if (!enabled) return;
        tap(name);
        const fn = cues[name];
        if (!fn) return;
        try { fn(arg); } catch (_) {}
        hint();
      }
    };
  })();

  // ── MOTION ──
  // Every move shows where the loop went. Data is saved first; motion only
  // replays the change. Flights and sounds run only for this device’s own
  // taps, never for realtime updates arriving from another device.
  const Motion = (() => {
    const EASE = 'cubic-bezier(.2,.8,.2,1)';
    const MUTATING = new Set([
      'save-raw-loop', 'finish-define-raw', 'complete-done',
      'move-released', 'restore-active', 'confirm-delete', 'set-kind-direct',
      'park-until', 'ask-park', 'do-save-step', 'decide-close',
      'still-keep', 'still-let-go'
    ]);
    let layer = null;
    let gesture = null;
    let lastTab = null;
    let lastStatuses = null;

    const reduced = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    const isLocal = () => !!gesture && performance.now() - gesture.t < 1800;

    function ensureLayer() {
      if (layer && document.body.contains(layer)) return layer;
      layer = document.createElement('div');
      layer.className = 'motion-layer';
      layer.setAttribute('aria-hidden', 'true');
      document.body.appendChild(layer);
      return layer;
    }

    function kindColor(kind) {
      const v = getComputedStyle(document.documentElement).getPropertyValue(`--${kind || 'inbox'}`).trim();
      return v || '#ffb084';
    }

    function place(el, x, y, w, h) {
      Object.assign(el.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
    }

    function fadeOut(el, ms = 200) {
      const a = el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: ms, easing: 'ease-out', fill: 'forwards' });
      a.onfinish = () => el.remove();
    }

    function bump(el) {
      if (!el) return;
      el.animate([
        { transform: 'scale(1)' },
        { transform: 'scale(1.22, .84)', offset: 0.3 },
        { transform: 'scale(.94, 1.07)', offset: 0.62 },
        { transform: 'scale(1)' }
      ], { duration: 460, easing: 'ease-out' });
    }

    // Quadratic arc from (x0,y0) to (x1,y1), lifted above both ends.
    function arc(x0, y0, x1, y1, lift, steps, frame) {
      const cx = (x0 + x1) / 2;
      const cy = Math.min(y0, y1) - lift;
      const out = [];
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const x = (1 - t) * (1 - t) * x0 + 2 * (1 - t) * t * cx + t * t * x1;
        const y = (1 - t) * (1 - t) * y0 + 2 * (1 - t) * t * cy + t * t * y1;
        out.push(Object.assign({ offset: t }, frame(t, x, y)));
      }
      return out;
    }

    function tabTarget(tab) {
      if (tab === 'done') return document.getElementById('archive-btn');
      const els = Array.from(document.querySelectorAll(`[data-action="set-tab"][data-tab="${tab}"]`));
      return els.find(e => {
        const r = e.getBoundingClientRect();
        return r.width > 0 && r.height > 0 && getComputedStyle(e).visibility !== 'hidden';
      }) || null;
    }
    const tabFor = s => s === 'active' ? 'now' : s === 'waiting' ? 'later' : s === 'inbox' ? 'inbox' : 'done';

    // A ball of clay in the loop’s kind color.
    function token(color, size) {
      const t = document.createElement('div');
      t.className = 'motion-token';
      t.style.setProperty('--tok', color);
      t.style.width = t.style.height = size + 'px';
      ensureLayer().appendChild(t);
      return t;
    }

    function ghostOf(b) {
      const g = b.el.cloneNode(true);
      g.querySelectorAll('[id]').forEach(n => n.removeAttribute('id'));
      g.removeAttribute('draggable');
      g.classList.add('motion-ghost');
      g.style.animation = 'none';
      g.style.opacity = '';
      place(g, b.rect.left, b.rect.top, b.rect.width, b.rect.height);
      ensureLayer().appendChild(g);
      return g;
    }

    function hideContents(g, ms = 150) {
      Array.from(g.children).forEach(c => c.animate([{ opacity: 1 }, { opacity: 0 }], { duration: ms, fill: 'forwards' }));
    }

    // Sheet leaves smoothly instead of vanishing; for Capture it shrinks
    // into the pellet that then drops into Inbox.
    let lastExitAt = 0;
    function exitSheet(ov, toPellet) {
      lastExitAt = performance.now();
      const r = ov.getBoundingClientRect();
      const L = ensureLayer();
      const g = ov.cloneNode(true);
      const srcFields = ov.querySelectorAll('textarea, input');
      g.querySelectorAll('textarea, input').forEach((f, i) => { if (srcFields[i]) f.value = srcFields[i].value; });
      g.querySelectorAll('[id]').forEach(n => n.removeAttribute('id'));
      g.removeAttribute('id');
      g.classList.add('motion-sheet');
      place(g, r.left, r.top, r.width, r.height);
      const bd = document.createElement('div');
      bd.className = 'motion-backdrop';
      L.append(bd, g);
      bd.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 280, easing: 'ease-out', fill: 'forwards' }).onfinish = () => bd.remove();
      if (reduced()) { fadeOut(g, 160); return; }
      const a = toPellet
        ? g.animate([
            { transform: 'none', opacity: 1, borderRadius: '24px' },
            { transform: 'scale(.06)', opacity: 0, borderRadius: '50%' }
          ], { duration: 340, easing: 'cubic-bezier(.55,0,.75,.1)', fill: 'forwards' })
        : g.animate([
            { transform: 'none', opacity: 1 },
            { transform: 'translateY(22px)', opacity: 0 }
          ], { duration: 220, easing: 'ease-in', fill: 'forwards' });
      a.onfinish = () => g.remove();
    }

    function onGesture(e) {
      const el = e.target.closest && e.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action;
      Sound.unlock();
      const ov = document.querySelector('#overlay-root .overlay-card');
      gesture = {
        t: performance.now(),
        action,
        loopId: el.dataset.loopId || (view.overlay && view.overlay.loopId) || null,
        overlayRect: ov ? ov.getBoundingClientRect() : null
      };
      // Parking from the define sheet opens "when?" instead of closing it.
      const swapsSheet = action === 'finish-define-raw' && el.dataset.status === 'waiting';
      if (ov && MUTATING.has(action) && !swapsSheet) exitSheet(ov, action === 'save-raw-loop');
    }

    // Which single loop changed because of this tap, and how.
    function pickCue(prev, now) {
      const ids = [];
      if (gesture && gesture.loopId) ids.push(gesture.loopId);
      now.forEach((v, id) => { if (!prev.has(id)) ids.push(id); });
      prev.forEach((v, id) => { if (!now.has(id) || now.get(id).status !== v.status) ids.push(id); });
      for (const id of ids) {
        const p = prev.get(id), n = now.get(id);
        if (p && !n) return { id, from: p.status, to: null, kind: p.kind, letGo: p.letGo };
        if (n && !p) return { id, from: null, to: n.status, kind: n.kind, letGo: n.letGo };
        if (n && p && n.status !== p.status) return { id, from: p.status, to: n.status, kind: n.kind, letGo: n.letGo };
      }
      return null;
    }

    function snapshot(main) {
      const cards = new Map();
      main.querySelectorAll('.loop-card[data-loop-id]').forEach(el => {
        const r = el.getBoundingClientRect();
        if (!r.width) return;
        const cs = getComputedStyle(el);
        cards.set(el.dataset.loopId, {
          el, rect: r, focus: el.classList.contains('is-focus'), bg: cs.backgroundColor, color: cs.color
        });
      });
      const label = main.querySelector('.up-next-label');
      return { tab: lastTab, statuses: lastStatuses, cards, labelRect: label ? label.getBoundingClientRect() : null, dots: main.querySelectorAll('.cap-meter-dot.on').length };
    }

    // Focus card promotion: the kind color floods in.
    function flood(el, b, delay) {
      const cs = getComputedStyle(el);
      el.animate([
        { backgroundColor: b.bg, color: b.color },
        { backgroundColor: cs.backgroundColor, color: cs.color }
      ], { duration: 560, delay, easing: 'ease-out', fill: 'backwards' });
      const eb = el.querySelector('.focus-eyebrow');
      if (eb) eb.animate([{ opacity: 0, transform: 'translateY(4px)' }, { opacity: 0.75, transform: 'none' }], { duration: 320, delay: delay + 260, fill: 'backwards' });
    }

    function poof(g) {
      g.animate([
        { opacity: 1, transform: 'none', filter: 'blur(0)' },
        { opacity: 0, transform: 'scale(.94)', filter: 'blur(6px)' }
      ], { duration: 300, easing: 'ease-in', fill: 'forwards' }).onfinish = () => g.remove();
    }

    // Card condenses into a clay ball that arcs to the tab it now lives in.
    function flyToTab(g, rect, tab, kind, sound) {
      const target = tabTarget(tab);
      g.animate([{ transform: 'none', opacity: 1 }, { transform: 'scale(.9)', opacity: 0 }], { duration: 240, easing: 'ease-in', fill: 'forwards' }).onfinish = () => g.remove();
      if (!target) { if (sound) Sound.play(sound); return; }
      const tr = target.getBoundingClientRect();
      const S = 34;
      const x0 = rect.left + rect.width / 2 - S / 2, y0 = rect.top + rect.height / 2 - S / 2;
      const x1 = tr.left + tr.width / 2 - S / 2, y1 = tr.top + tr.height / 2 - S / 2;
      const t = token(kindColor(kind), S);
      place(t, 0, 0, S, S);
      const lift = Math.max(70, Math.min(150, Math.hypot(x1 - x0, y1 - y0) * 0.3));
      const kf = arc(x0, y0, x1, y1, lift, 14, (p, x, y) => {
        const s = p < 0.15 ? 0.3 + (p / 0.15) * 0.75 : 1.05 - 0.5 * ((p - 0.15) / 0.85);
        return { transform: `translate(${x}px, ${y}px) scale(${s})`, opacity: p > 0.92 ? 0.4 : 1 };
      });
      if (sound) Sound.play(sound);
      t.animate(kf, { duration: 640, easing: 'cubic-bezier(.45,0,.25,1)', fill: 'forwards' }).onfinish = () => {
        t.remove();
        bump(target);
      };
    }

    // Something new landed: the capture sound, and the mascot looks up.
    function captured() {
      Sound.play('capture');
      BrandMascot.react('curious', 1600);
    }

    // Brain-dump capture: a pellet leaves the text box for the Inbox tab.
    function pelletToInbox(kind, tab = 'inbox') {
      const src = document.getElementById('capture-input');
      const target = tabTarget(tab);
      if (!src || reduced()) { captured(); return; }
      const r = src.getBoundingClientRect();
      const S = 22;
      const x0 = r.left + 28, y0 = r.top + 22;
      let x1, y1;
      if (target) { const tr = target.getBoundingClientRect(); x1 = tr.left + tr.width / 2 - S / 2; y1 = tr.top + tr.height / 2 - S / 2; }
      else { x1 = x0; y1 = y0 - 120; }
      const t = token(kindColor(kind), S);
      place(t, 0, 0, S, S);
      const kf = arc(x0, y0, x1, y1, 90, 12, (p, x, y) => ({
        transform: `translate(${x}px, ${y}px) scale(${p < 0.15 ? 0.3 + p * 4.6 : 1 - 0.35 * p})`,
        opacity: target ? 1 : 1 - p
      }));
      t.animate(kf, { duration: 560, easing: 'cubic-bezier(.45,0,.25,1)', fill: 'forwards' }).onfinish = () => {
        t.remove();
        captured();
        if (target) bump(target);
      };
    }

    // Capture: the sheet’s pellet drops onto the new Inbox card.
    function landCapture(el, fromRect, kind) {
      el.style.animation = 'none';
      if (!fromRect || reduced()) { captured(); return; }
      const r = el.getBoundingClientRect();
      const S = 26;
      const x0 = fromRect.left + fromRect.width / 2 - S / 2, y0 = fromRect.top + fromRect.height / 2 - S / 2;
      const x1 = r.left + 34 - S / 2, y1 = r.top + 34 - S / 2;
      el.style.opacity = '0';
      const t = token(kindColor(kind), S);
      place(t, 0, 0, S, S);
      const kf = arc(x0, y0, x1, y1, 60, 12, (p, x, y) => ({
        transform: `translate(${x}px, ${y}px) scale(${p < 0.2 ? 0.2 + p * 4 : 1})`
      }));
      t.animate(kf, { duration: 520, delay: 180, easing: 'cubic-bezier(.5,0,.3,1)', fill: 'both' }).onfinish = () => {
        captured();
        t.animate([
          { transform: `translate(${x1}px, ${y1}px) scale(1.25, .7)`, opacity: 1 },
          { transform: `translate(${x1}px, ${y1}px) scale(.2)`, opacity: 0 }
        ], { duration: 200, easing: 'ease-out', fill: 'forwards' }).onfinish = () => t.remove();
        el.style.opacity = '';
        el.animate([
          { opacity: 0, transform: 'translateY(-8px) scale(.97)' },
          { opacity: 1, transform: 'none' }
        ], { duration: 300, easing: EASE });
      };
    }

    // Parked: the card tucks into the Parked tab like a note slid into a
    // pocket. Different gesture from the clay ball, because parking is
    // "set aside", not "raw thought".
    function tuckAway(g, rect, tab, sound) {
      const target = tabTarget(tab);
      if (sound) Sound.play(sound);
      if (!target) { fadeOut(g, 220); return; }
      const tr = target.getBoundingClientRect();
      const dx = (tr.left + tr.width / 2) - (rect.left + rect.width / 2);
      const dy = (tr.top + tr.height / 2) - (rect.top + rect.height / 2);
      const sx = Math.max(0.12, (tr.width * 0.9) / rect.width);
      const sy = Math.max(0.04, 10 / rect.height);
      hideContents(g, 180);
      g.animate([
        { transform: 'translate(0,0) scale(1)', opacity: 1, borderRadius: '16px' },
        { transform: 'translate(0,-6px) scale(1.01)', opacity: 1, offset: 0.18 },
        { transform: `translate(${dx * 0.55}px, ${dy * 0.55}px) scale(${0.5 + sx * 0.5}, 0.35)`, opacity: 1, borderRadius: '12px', offset: 0.6 },
        { transform: `translate(${dx}px, ${dy}px) scale(${sx}, ${sy})`, opacity: 0, borderRadius: '8px' }
      ], { duration: 560, easing: 'cubic-bezier(.5,0,.3,1)', fill: 'forwards' }).onfinish = () => {
        g.remove();
        // The tab takes it in: a short downward squash, like a pocket closing.
        target.animate([
          { transform: 'scale(1)' },
          { transform: 'scale(1.08, .86) translateY(2px)', offset: 0.35 },
          { transform: 'scale(1)' }
        ], { duration: 360, easing: 'ease-out' });
      };
    }

    // The signature moment: the card seals into a clay ring, which flies up
    // into the Closed archive in the header and resolves the chord.
    // quick = another loop was closed moments ago: same ring, half the time.
    let lastCloseAt = 0;
    function closeCeremony(g, rect, kind, letGoFlag) {
      const nowT = performance.now();
      const quick = nowT - lastCloseAt < 3000;
      lastCloseAt = nowT;
      const letGo = letGoFlag !== undefined ? !!letGoFlag : kind === 'let_go';
      const color = kindColor(kind);
      const L = ensureLayer();
      const S = 72, R = 24;
      const C = 2 * Math.PI * R;
      const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
      const archive = document.getElementById('archive-btn');
      const count = archive && archive.querySelector('.archive-count');
      const finalCount = count ? count.textContent : '';
      if (count) {
        const n = parseInt(finalCount, 10) || 0;
        count.textContent = String(Math.max(0, n - 1));
        archive.classList.toggle('has-count', n - 1 > 0);
      }

      // Timeline (ms): condense, seal, fly, land.
      const T = quick
        ? { condense: 260, ringIn: 60, sealAt: 140, seal: 160, flyAt: 330, fly: 420 }
        : letGo
          ? { condense: 440, ringIn: 140, sealAt: 300, seal: 700, flyAt: 380, fly: 1000 }
          : { condense: 440, ringIn: 140, sealAt: 380, seal: 300, flyAt: 700, fly: 560 };

      const ring = document.createElement('div');
      ring.className = 'motion-ring';
      ring.innerHTML = `<svg viewBox="0 0 ${S} ${S}" width="${S}" height="${S}"><g filter="url(#ol-clay-sm)"><circle cx="${S / 2}" cy="${S / 2}" r="${R}" fill="none" stroke-width="13" stroke-linecap="round" transform="rotate(14 ${S / 2} ${S / 2})"/></g></svg>`;
      const stroke = ring.querySelector('circle');
      stroke.style.stroke = color;
      stroke.style.strokeDasharray = `${C * 0.76} ${C}`;
      place(ring, 0, 0, S, S);
      const at = `translate(${cx - S / 2}px, ${cy - S / 2}px)`;
      ring.style.transform = at;
      L.appendChild(ring);

      // 1 · the card condenses into the ring
      if (g) {
        hideContents(g, quick ? 100 : 160);
        g.animate([
          { transform: 'none', opacity: 1, borderRadius: '24px' },
          { transform: `scale(${S / rect.width}, ${S / rect.height})`, opacity: 0, borderRadius: '50%' }
        ], { duration: T.condense, easing: 'cubic-bezier(.6,0,.2,1)', fill: 'forwards' }).onfinish = () => g.remove();
      }
      ring.animate([
        { transform: `${at} scale(.3)`, opacity: 0 },
        { transform: `${at} scale(1.06)`, opacity: 1, offset: 0.7 },
        { transform: `${at} scale(1)`, opacity: 1 }
      ], { duration: quick ? 220 : 380, delay: T.ringIn, easing: 'ease-out', fill: 'backwards' });

      // 2 · seal the gap (Done) or let it quietly loosen (Let go)
      if (!letGo) {
        stroke.animate([{ strokeDasharray: `${C * 0.76} ${C}` }, { strokeDasharray: `${C} ${C}` }],
          { duration: T.seal, delay: T.sealAt, easing: 'cubic-bezier(.3,0,.2,1)', fill: 'forwards' });
        if (!quick) {
          ring.animate([
            { transform: `${at} scale(1)` }, { transform: `${at} scale(1.12)`, offset: 0.45 }, { transform: `${at} scale(1)` }
          ], { duration: 260, delay: T.sealAt + T.seal - 20, easing: 'ease-out' });
          setTimeout(() => Sound.play('seal'), T.sealAt);
        }
      } else {
        stroke.animate([{ strokeDasharray: `${C * 0.76} ${C}` }, { strokeDasharray: `${C * 0.5} ${C}` }],
          { duration: T.seal, delay: T.sealAt, easing: 'ease-out', fill: 'forwards' });
        if (!quick) setTimeout(() => Sound.play('release'), 240);
      }

      // 3 · home to the Closed archive, 4 · land
      setTimeout(() => {
        if (!archive) { fadeOut(ring, 200); return; }
        const tr = archive.getBoundingClientRect();
        const x0 = cx - S / 2, y0 = cy - S / 2;
        const x1 = tr.left + tr.width / 2 - S / 2, y1 = tr.top + tr.height / 2 - S / 2;
        let kf;
        if (letGo && !quick) {
          // Calm release: rise straight up first, then drift home, fading.
          const rise = Math.min(90, Math.max(40, (y0 - y1) * 0.25));
          const steps = 16;
          kf = [];
          for (let i = 0; i <= steps; i++) {
            const p = i / steps;
            const up = Math.min(1, p / 0.45);
            const home = p <= 0.45 ? 0 : (p - 0.45) / 0.55;
            const e = home * home * (3 - 2 * home);
            const x = x0 + (x1 - x0) * e;
            const y = (y0 - rise * (up * (2 - up))) + ((y1) - (y0 - rise)) * e;
            kf.push({ offset: p, transform: `translate(${x}px, ${y}px) scale(${1 - 0.7 * p}) rotate(${30 * p}deg)`, opacity: 1 - 0.8 * p });
          }
        } else {
          const lift = Math.min(160, Math.hypot(x1 - x0, y1 - y0) * (quick ? 0.18 : 0.28));
          kf = arc(x0, y0, x1, y1, lift, 18, (p, x, y) => ({
            transform: `translate(${x}px, ${y}px) scale(${1 - 0.72 * p}) rotate(${(quick ? 180 : 300) * p}deg)`,
            opacity: letGo ? 1 - 0.7 * p : (p > 0.94 ? 0.5 : 1)
          }));
        }
        ring.animate(kf, {
          duration: T.fly,
          easing: letGo && !quick ? 'cubic-bezier(.35,0,.45,1)' : 'cubic-bezier(.5,0,.25,1)',
          fill: 'forwards'
        }).onfinish = () => {
          ring.remove();
          landSound(letGo, quick);
          if (letGo) {
            archive.animate([{ opacity: 1 }, { opacity: 0.55 }, { opacity: 1 }], { duration: 420, easing: 'ease-in-out' });
          } else {
            bump(archive);
            archive.animate([
              { boxShadow: `0 0 0 0 ${color}` },
              { boxShadow: `0 0 0 10px transparent` }
            ], { duration: 520, easing: 'ease-out' });
          }
          if (count) {
            count.textContent = finalCount;
            archive.classList.toggle('has-count', parseInt(finalCount, 10) > 0);
            count.animate([
              { transform: 'translateY(6px)', opacity: 0 }, { transform: 'none', opacity: 1 }
            ], { duration: 320, easing: 'cubic-bezier(.2,.8,.2,1)' });
          }
        };
      }, T.flyAt);
    }

    // A close lands with its chord; in a sitting of several closes the chord
    // gains a note each time, and clearing Active plays the whole thing.
    function landSound(letGo, quick) {
      BrandMascot.react(letGo ? 'calm' : 'proud');
      Sound.play(letGo ? 'softLand' : quick ? 'quickLand' : 'land');
      if (letGo) return;
      const step = Combo.count() - 1;
      if (step > 0) Sound.play('comboNote', step);
      if (Combo.count() >= 2 && !data.loops.some(l => l.status === 'active')) setTimeout(() => Sound.play('cleared'), 380);
    }

    function soundFor(cue) {
      const { from, to } = cue;
      if (to === null || to === 'released') return null;       // delete is silent; closing scores itself
      if (from === null) return gesture && /^save-raw-loop/.test(gesture.action || '') ? null : 'up';
      if (from === 'released') return 'reopen';
      if (to === 'active') return from === 'waiting' ? 'wake' : 'up';
      return 'down';
    }

    function play(main, snap) {
      const now = new Map(data.loops.map(l => [l.id, { status: l.status, kind: l.kind, letGo: isLetGo(l) }]));
      const prevTab = snap.tab;
      lastTab = view.activeTab;
      lastStatuses = now;
      if (!snap.statuses) return;

      const local = isLocal();
      const calm = reduced();
      const tabChanged = prevTab !== view.activeTab;
      const cue = local ? pickCue(snap.statuses, now) : null;
      const gAction = gesture && gesture.action;
      let sound = cue ? soundFor(cue) : null;
      if (cue) gesture = null;   // one gesture, one cue
      if (cue && cue.from === null && gAction === 'save-raw-loop-more') {
        pelletToInbox(cue.kind, cue.to === 'waiting' ? 'later' : 'inbox');
        sound = null;
      }
      let ceremony = false;

      // The panel’s fade-in is for switching tabs only. Re-renders within the
      // same view (reorder, close, park) must not flash the whole list.
      if (!tabChanged) main.querySelectorAll('.tab-panel').forEach(el => { el.style.animation = 'none'; });

      const after = new Map();
      main.querySelectorAll('.loop-card[data-loop-id]').forEach(el => after.set(el.dataset.loopId, el));

      // Cards present before and after: glide from old spot to new.
      after.forEach((el, id) => {
        const b = snap.cards.get(id);
        if (!b) {
          if (cue && cue.id === id && cue.from === null && sound === null) {
            landCapture(el, snap.overlayRect, cue.kind);
          }
          return;
        }
        el.style.animation = 'none';
        if (calm) return;
        const a = el.getBoundingClientRect();
        const dx = b.rect.left - a.left, dy = b.rect.top - a.top;
        const moved = cue && cue.id === id && tabChanged;
        if (moved) {
          const sx = b.rect.width / a.width, sy = b.rect.height / a.height;
          el.style.transformOrigin = 'top left';
          el.animate([{ transform: `translate(${dx}px, ${dy}px) scale(${sx}, ${sy})` }, { transform: 'none' }], { duration: 560, easing: EASE });
          if (el.classList.contains('is-focus') && !b.focus) flood(el, b, 140);
          return;
        }
        if (tabChanged) return;
        // Same view: glide position, height and color together, so a card
        // that gains or loses the Now slot morphs instead of snapping.
        const cs = getComputedStyle(el);
        const shifted = Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5;
        const resized = Math.abs(b.rect.height - a.height) > 1;
        const recolored = b.bg !== cs.backgroundColor || b.color !== cs.color;
        if (!shifted && !resized && !recolored) return;
        const closing = cue && cue.to === 'released';
        const hold = closing ? (performance.now() - lastCloseAt < 3000 ? 300 : 650) : 0;
        const lifted = local && gesture && gesture.loopId === id && /^move-loop-/.test(gesture.action || '');
        const from = { transform: `translate(${dx}px, ${dy}px)` };
        const to = { transform: 'none' };
        if (resized) { from.height = b.rect.height + 'px'; to.height = a.height + 'px'; }
        if (recolored) { from.backgroundColor = b.bg; to.backgroundColor = cs.backgroundColor; from.color = b.color; to.color = cs.color; }
        if (lifted) { from.boxShadow = '0 16px 36px rgba(40,30,10,0.16)'; to.boxShadow = cs.boxShadow === 'none' ? '0 0 0 rgba(0,0,0,0)' : cs.boxShadow; el.style.zIndex = '2'; }
        if (resized) el.style.overflow = 'hidden';
        // While a closing ring is still on screen, hold the promotion so the
        // two moments don’t compete.
        const anim = el.animate([from, to], { duration: closing ? 460 : 420, delay: hold, easing: EASE, fill: 'backwards' });
        anim.onfinish = anim.oncancel = () => { el.style.overflow = ''; el.style.zIndex = ''; };
        const eb = el.querySelector('.focus-eyebrow');
        if (eb && !b.focus) eb.animate([{ opacity: 0, transform: 'translateY(4px)' }, { opacity: 0.75, transform: 'none' }], { duration: 300, delay: hold + 180, fill: 'backwards' });
      });

      const label = main.querySelector('.up-next-label');
      if (label && snap.labelRect && !tabChanged && !calm) {
        const ly = snap.labelRect.top - label.getBoundingClientRect().top;
        if (Math.abs(ly) > 0.5) label.animate([{ transform: `translateY(${ly}px)` }, { transform: 'none' }], { duration: 420, delay: cue && cue.to === 'released' ? (performance.now() - lastCloseAt < 3000 ? 300 : 650) : 0, easing: EASE, fill: 'backwards' });
      }

      // The focus meter fills or empties a slot with the move, instead of snapping.
      const dots = main.querySelectorAll('.cap-meter-dot');
      const dotsOn = main.querySelectorAll('.cap-meter-dot.on').length;
      if (dots.length && !tabChanged && !calm && dotsOn !== snap.dots) {
        const ink = getComputedStyle(document.documentElement).getPropertyValue('--text').trim();
        const wait = cue && cue.to === 'released' ? (performance.now() - lastCloseAt < 3000 ? 300 : 650) : 140;
        for (let i = Math.min(dotsOn, snap.dots); i < Math.max(dotsOn, snap.dots) && i < dots.length; i++) {
          const d = dots[i];
          if (dotsOn > snap.dots) d.animate([{ transform: 'scale(.3)' }, { transform: 'scale(1.3)', offset: 0.6 }, { transform: 'none' }], { duration: 380, delay: wait, easing: 'ease-out', fill: 'backwards' });
          else d.animate([{ backgroundColor: ink, transform: 'none' }, { transform: 'scale(.7)', offset: 0.5 }, { backgroundColor: getComputedStyle(d).backgroundColor, transform: 'none' }], { duration: 420, delay: wait, easing: 'ease-out', fill: 'backwards' });
        }
      }

      // Cards that left this view: follow them to where they went.
      snap.cards.forEach((b, id) => {
        if (after.has(id)) return;
        const isCue = cue && cue.id === id;
        if (tabChanged && !isCue) return;
        const g = ghostOf(b);
        if (!local || calm) {
          fadeOut(g, 180);
          if (isCue && cue.to === 'released') landSound(cue.letGo, false);
          return;
        }
        const n = now.get(id), p = snap.statuses.get(id);
        if (!n) { poof(g); return; }
        if (n.status === 'released' && p && p.status !== 'released') { ceremony = true; closeCeremony(g, b.rect, n.kind, n.letGo); return; }
        if (p && n.status !== p.status) {
          if (n.status === 'waiting') tuckAway(g, b.rect, 'later', isCue ? sound : null);
          else flyToTab(g, b.rect, tabFor(n.status), n.kind, isCue ? sound : null);
          if (isCue) sound = null;
          return;
        }
        fadeOut(g, 200);
      });

      // Closed without a visible card (e.g. from a hidden row): still land it.
      if (cue && cue.to === 'released' && !ceremony && !calm) {
        const vw = window.innerWidth, vh = window.innerHeight;
        closeCeremony(null, { left: vw / 2 - 1, top: vh / 2 - 1, width: 2, height: 2 }, cue.kind, cue.letGo);
      } else if (cue && cue.to === 'released' && calm && !ceremony) {
        landSound(cue.letGo, false);
      }
      if (sound) Sound.play(sound);
    }

    return {
      // Any sheet that closes without its own exit (Cancel, ✕, backdrop,
      // Escape) slides away instead of vanishing in one frame.
      dismissSheet() {
        if (performance.now() - lastExitAt < 80) return;
        const ov = document.querySelector('#overlay-root .overlay-card');
        if (ov) exitSheet(ov, false);
      },
      init() {
        ensureLayer();
        document.addEventListener('click', onGesture, true);
      },
      // The sweep plays its own notes; skip the flight and cue for its taps.
      forget() { gesture = null; },
      snapshot(main) {
        const s = snapshot(main);
        s.overlayRect = gesture ? gesture.overlayRect : null;
        return s;
      },
      play
    };
  })();

  // Clay ring for the Closed shelf (one per loop closed this week).
  function clayRingHtml(kind) {
    return `<svg class="clay-ring" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7" fill="none" stroke-width="5" filter="url(#ol-clay-xs)" style="stroke:var(--${kind || 'inbox'})"/></svg>`;
  }

  // Finished loops sit on the shelf as rings; loops you let go of sit there
  // as pebbles. Letting go isn’t finishing, so it shouldn’t look the same.
  function shelfItemHtml(loop) {
    if (isLetGo(loop)) {
      return `<svg class="clay-ring clay-pebble" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="14" rx="7.5" ry="5.5" filter="url(#ol-clay-xs)" style="fill:var(--let_go)"/></svg>`;
    }
    return clayRingHtml(loop.kind);
  }

  function closedThisWeek() {
    const weekAgo = Date.now() - 7 * 86400000;
    return data.loops
      .filter(l => l.status === 'released' && l.completedAt && new Date(l.completedAt).getTime() >= weekAgo)
      .sort((a, b) => new Date(a.completedAt) - new Date(b.completedAt));
  }

  // ── RENDER MAIN ──
  function renderMain() {
    const main = document.getElementById('app-main');
    if (!main) return;
    const snap = Motion.snapshot(main);
    main.innerHTML = renderHome();
    Motion.play(main, snap);
    focusInlineEdit();
  }

  function focusInlineEdit() {
    if (view.inlineEditId) {
      const el = document.getElementById(`inline-edit-${view.inlineEditId}`);
      if (el) { el.focus(); el.selectionStart = el.selectionEnd = el.value.length; }
    }
  }

  function renderOverlay() {
    const root = document.getElementById('overlay-root');
    if (!root) return;
    const ov = view.overlay;
    if (!ov) { root.innerHTML = ''; delete root.dataset.sheet; return; }
    const tipEl = document.getElementById('toast');
    if (tipEl && tipEl.dataset.tip) { clearTimeout(toastTimer); tipEl.classList.remove('visible'); delete tipEl.dataset.tip; }

    let inner = '';
    if      (ov.type === 'capture')        inner = renderCapture(ov);
    else if (ov.type === 'define-raw')     inner = renderDefineRaw(getLoop(ov.loopId));
    else if (ov.type === 'menu')           inner = renderMenu(getLoop(ov.loopId));
    else if (ov.type === 'change-kind')    inner = renderChangekind(getLoop(ov.loopId));
    else if (ov.type === 'sync')           inner = renderSync();
    else if (ov.type === 'settings')       inner = renderSettings();
    else if (ov.type === 'why')            inner = renderWhy();
    else if (ov.type === 'primary-action') inner = renderPrimaryAction(getLoop(ov.loopId));
    else if (ov.type === 'when')           inner = renderWhen(getLoop(ov.loopId));
    else if (ov.type === 'confirm-delete') inner = renderConfirmDelete(getLoop(ov.loopId));
    else if (ov.type === 'still')          inner = renderStillYours(getLoop(ov.loopId));
    else if (ov.type === 'sweep')          inner = renderSweep(ov);
    else if (ov.type === 'profile')        inner = renderProfile();
    else if (ov.type === 'share')          inner = renderShare(ov);
    if (!inner) { view.overlay = null; root.innerHTML = ''; delete root.dataset.sheet; return; }

    const key = `${ov.type}:${ov.loopId || ''}`;
    const panel = root.querySelector('.overlay-panel');
    if (panel && root.dataset.sheet === key) {
      // Same sheet, new state: swap contents in place. No replayed slide-up,
      // no focus jump, no keyboard popping back open.
      const scroller = panel.querySelector('.overlay-card');
      const scrollTop = scroller ? scroller.scrollTop : 0;
      panel.innerHTML = inner;
      const card = panel.querySelector('.overlay-card');
      if (card) { card.classList.add('no-enter'); card.scrollTop = scrollTop; }
      return;
    }
    const switching = !!(panel && root.querySelector('.overlay-backdrop'));
    root.dataset.sheet = key;
    if (switching) {
      // One sheet replacing another (menu → delete, action → define): keep
      // the backdrop as is and swap the card with a short crossfade instead
      // of flashing the backdrop and sliding up from scratch.
      panel.innerHTML = inner;
      const card = panel.querySelector('.overlay-card');
      if (card) card.classList.add('swap-enter');
    } else {
      root.innerHTML = `
        <div class="overlay-backdrop" data-action="close-overlay"></div>
        <div class="overlay-panel">${inner}</div>`;
    }
    autoGrow(document.getElementById('define-raw-input'));

    // Focus first input/button so keyboard users don’t have to hunt.
    // Define’s title is editable but not the first job, so skip it.
    const firstInput = root.querySelector('textarea:not(#define-raw-input):not(.no-autofocus), input[type="email"], input[type="text"]:not(.no-autofocus)');
    if (firstInput) {
      setTimeout(() => firstInput.focus(), 50);
    } else {
      // No text input — focus the first actionable button instead.
      // Long reading sheets (Your head) start at the top: focus the close
      // button instead of a button at the bottom that would scroll the sheet.
      const firstBtn = root.querySelector('.overlay-card button:not([data-action="close-overlay"]):not([disabled]):not(.no-autofocus)')
        || root.querySelector('.overlay-card .overlay-close');
      if (firstBtn) setTimeout(() => firstBtn.focus(), 50);
    }
  }

  const PERSON_ICON = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="5.5" r="2.5" stroke="currentColor" stroke-width="1.4"/><path d="M3 13.5a5 5 0 0 1 10 0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>';
  function renderHeader() {
    // One button for Your head and the account: your initial, with the sync
    // status as a small dot (green synced, amber syncing, red stuck).
    const prof = document.getElementById('profile-btn');
    if (prof) {
      let initial = '';
      let signedIn = false;
      try { signedIn = Sync.isLoggedIn(); initial = signedIn ? accountInitial() : ''; } catch (_) {}
      prof.className = `profile-btn ${view.syncStatus || 'idle'}`;
      const face = prof.querySelector('.profile-face');
      if (face && face.dataset.initial !== (initial || '-')) {
        face.dataset.initial = initial || '-';
        face.innerHTML = initial ? esc(initial) : PERSON_ICON;
      }
      prof.title = signedIn ? `Your head · ${view.syncText}` : 'Your head';
      prof.setAttribute('aria-label', signedIn ? `Your head and account. Sync: ${view.syncText}.` : 'Your head and account');
    }
    const archive = document.getElementById('archive-btn');
    if (archive) {
      archive.classList.toggle('active', view.activeTab === 'done' || view.activeTab === 'released');
      let badge = archive.querySelector('.archive-count');
      if (!badge) {
        badge = document.createElement('span');
        badge.className = 'archive-count';
        archive.appendChild(badge);
      }
      const n = dataKnown() ? closedThisWeek().length : 0;
      badge.textContent = String(n);
      archive.classList.toggle('has-count', n > 0);
      archive.setAttribute('aria-label', n ? `Closed loops, ${n} this week` : 'Closed loops');
      archive.title = n ? `${n} closed this week` : 'Closed';
    }
  }

  function renderAll() {
    renderHeader();
    renderSidebar();
    renderBottomNav();
    renderMain();
    renderContextPanel();
    renderOverlay();
    if (authReady && !Sync.isLoggedIn()) {
      renderAuthGate();
    } else if (authReady) {
      hideAuthGate();
    }
    if (view.onboardingStep >= 0) renderOnboarding();
  }

  // ── ACTIONS ──
  // Signed-in local cache + re-render. Supabase remains the source of truth;
  // localStorage only keeps the UI fast and protects queued offline writes.
  function persistAndRender() {
    save();
    renderAll();
  }

  function closeOverlay() {
    const opener = view.overlayOpenerEl;
    if (view.overlay) Motion.dismissSheet();
    if (view.overlay && view.overlay.type === 'why') { clearTimeout(whyTimer); whyToken++; StoryAudio.stopAll(); }
    view.overlay = null;
    renderOverlay();
    view.overlayOpenerEl = null;
    if (opener && document.contains(opener)) {
      setTimeout(() => {
        if (document.contains(opener)) opener.focus();
      }, 0);
    }
  }

  function rememberOverlayOpener(el) {
    if (!view.overlay && el && typeof el.focus === 'function') {
      view.overlayOpenerEl = el;
    }
  }

  // ── MUTATION GUARD ──
  // Sign-in is required to capture or modify loops. Unauthenticated users
  // see the auth gate and cannot mutate state.
  function requireLogin() {
    if (Sync.isLoggedIn()) return false;
    // Showing this phone’s saved loops while the sign-in check finishes:
    // you are signed in, the app just hasn’t confirmed it yet.
    if (!authReady && currentLocalUserId) { toast('Still opening. One moment.'); return true; }
    toast('Sign in to save your loops.');
    if (authReady) renderAuthGate();
    return true;
  }

  // Save a Schedule loop’s time from any picker (Not yet, the card’s sheet):
  // schedulePatch() decides where it waits, then the usual save and sync.
  async function saveScheduleTime(target, atIso, opts = {}, extra = null) {
    const base = extra ? { ...target, ...extra, kind: 'schedule' } : target;
    const patch = schedulePatch(base, atIso, opts);
    if (extra) Object.assign(patch, extra);
    const up = patch.status === 'active' && target.status !== 'active' ? upNextPosition(target.id) : null;
    if (up) patch.position = up.position;
    updateLoop(target.id, patch);
    const positionChanges = up && up.rebalance ? rebalanceActivePositions() : null;
    view.activeTab = patch.status === 'waiting' ? 'later' : 'now';
    view.highlightedId = target.id;
    saveReentryDismissed(null);
    closeOverlay();
    await persistAndRender();
    Sync.updateLoop(target.id, patch);
    if (positionChanges) syncPositionChanges({ ok: true, changes: positionChanges });
    announce(!atIso ? 'Parked, no time yet.'
      : patch.status === 'waiting' && patch.wakeAt ? `Parked. Back with a nudge ${formatWake(patch.wakeAt)}.`
      : patch.wakeAt ? `In Up next. Nudge ${formatWake(patch.wakeAt)}.`
      : 'In Up next.');
  }

  // ── EVENT DELEGATION ──
  document.addEventListener('click', async e => {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const action = el.dataset.action;
    const loopId = el.dataset.loopId || null;

    // Overlay management
    if (action === 'close-overlay') { closeOverlay(); return; }

    // ── AUTH GATE ACTIONS ──
    if (action === 'auth-gate-send') {
      const input = document.getElementById('auth-gate-email');
      const email = input ? input.value.trim() : view.authGateEmail;
      if (!email) { toast('Enter your email.'); return; }
      const sinceLast = Date.now() - lastMagicLinkAt;
      if (sinceLast < MAGIC_LINK_COOLDOWN_MS) {
        const wait = Math.ceil((MAGIC_LINK_COOLDOWN_MS - sinceLast) / 1000);
        toast(`Please wait ${wait}s before requesting another link.`);
        return;
      }
      view.authGateEmail = email;
      const btn = document.getElementById('auth-gate-btn');
      if (btn) { btn.disabled = true; btn.textContent = 'Sending…'; }
      try {
        await Sync.sendMagicLink(email);
        lastMagicLinkAt = Date.now();
        view.authGateSent = true;
        renderAuthGate();
      } catch(err) {
        // Keep label consistent with initial state ("Send link") so repeated
        // attempts don’t look like a different button.
        if (btn) { btn.disabled = false; btn.textContent = 'Send link'; }
        toast(linkErrorText(err));
      }
      return;
    }
    if (action === 'auth-gate-reset') {
      view.authGateSent = false;
      view.authGateEmail = '';
      renderAuthGate();
      return;
    }

    // ── ONBOARDING ACTIONS ──
    if (action === 'onboarding-next') {
      const isLast = view.onboardingStep === ONBOARDING_STEPS.length - 1;
      if (isLast) { markOnboardingComplete(); }
      else { view.onboardingStep++; renderOnboarding(); }
      return;
    }
    if (action === 'onboarding-prev') {
      if (view.onboardingStep > 0) { view.onboardingStep--; renderOnboarding(); }
      return;
    }
    if (action === 'onboarding-skip') {
      markOnboardingComplete();
      return;
    }

    // Overlay management

    // Tabs
    if (action === 'boot-retry') {
      setBoot('loading');
      Sync.retry();
      return;
    }
    if (action === 'set-tab') {
      view.activeTab = el.dataset.tab;
      if (view.activeTab === 'done') view.expanded = false;
      save();
      renderHeader();
      renderMain();
      renderSidebar();
      renderBottomNav();
      return;
    }

    // FAB
    if (action === 'open-capture') {
      if (requireLogin()) return;
      rememberOverlayOpener(el);
      view.overlay = { type: 'capture', step: 'capture', rawText: '', kind: null, promptAnswer: '', sourceId: null };
      renderOverlay();
      return;
    }

    if (action === 'define-raw') {
      const target = getLoop(loopId);
      if (target) {
        rememberOverlayOpener(el);
        const status = target.status === 'inbox'
          ? (target.kind === 'let_go' ? 'released' : 'active')
          : target.status;
        view.overlay = { type: 'define-raw', loopId, rawText: target.rawText, kind: target.kind || null, promptAnswer: target.promptAnswer || '', status, step: target.kind ? 2 : 1 };
        renderOverlay();
      }
      return;
    }

    // Capture flow
    if (action === 'pick-raw-kind') {
      const ov = view.overlay;
      if (ov?.type === 'capture') {
        // Optional: tap again to clear. Update the chips in place only.
        ov.kind = ov.kind === el.dataset.kind ? null : el.dataset.kind;
        document.querySelectorAll('#overlay-root .kind-pick').forEach(b => {
          const on = b.dataset.kind === ov.kind;
          b.classList.toggle('on', on);
          b.setAttribute('aria-pressed', String(on));
        });
        refreshCaptureWhen(ov);
      }
      return;
    }
    if (action === 'save-raw-loop' || action === 'save-raw-loop-more') {
      if (requireLogin()) return;
      const ov = view.overlay;
      if (!ov || ov.type !== 'capture') return;
      const input = document.getElementById('capture-input');
      const raw = (input ? input.value : ov.rawText || '').trim();
      if (!raw) return;
      ov.rawText = raw;
      const wake = captureWakeOn(ov) ? captureWhen(ov) : null;
      const l = createLoop({
        rawText: raw, kind: ov.kind || null, promptAnswer: '',
        status: wake ? 'waiting' : 'inbox', wakeAt: wake ? wake.toISOString() : null
      });
      const parkedNote = wake ? `Parked until ${formatWake(wake.toISOString())}.` : '';
      if (action === 'save-raw-loop-more') {
        // Brain-dump mode: keep the sheet, clear the text, count it.
        ov.rawText = '';
        ov.kind = null;
        ov.wakeFor = null;
        ov.added = (ov.added || 0) + 1;
        persistAndRender();
        Sync.createLoop(l);
        const again = document.getElementById('capture-input');
        if (again) again.focus();
        if (parkedNote) announce(parkedNote);
        return;
      }
      view.activeTab = wake ? 'later' : 'inbox';
      const n = (ov.added || 0) + 1;
      closeOverlay();
      await persistAndRender();
      Sync.createLoop(l);
      if (wake) toast(parkedNote);
      else announce(n > 1 ? `${n} loops added to Inbox.` : 'Added to Inbox.');
      return;
    }
    if (action === 'capture-when-toggle') {
      const ov = view.overlay;
      if (!ov || ov.type !== 'capture') return;
      const d = captureWhen(ov);
      if (!d) return;
      const on = captureWakeOn(ov);
      ov.wakeFor = on ? null : d.toISOString();
      Sound.play(on ? 'down' : 'ask');
      refreshCaptureWhen(ov);
      return;
    }
    if (action === 'define-pick-kind') {
      const ov = view.overlay;
      if (ov?.type === 'define-raw') {
        ov.kind = el.dataset.kind;
        // Let go skips the next-step question: releasing is the whole move.
        goDefineStep(ov.kind === 'let_go' ? 3 : 2, 1);
      }
      return;
    }
    if (action === 'define-next') {
      const ov = view.overlay;
      if (ov?.type === 'define-raw') {
        if (ov.kind === 'schedule') {
          if (el.dataset.skip) {
            ov.at = null;
            ov.atCleared = true;
          } else {
            const picked = fromScheduleInputs(document.getElementById('define-date')?.value, document.getElementById('define-time')?.value);
            if (!picked) { toast('Pick a day and a time, or tap Not sure yet.'); return; }
            if (picked.getTime() <= Date.now()) { toast('Pick a time that is still ahead.'); return; }
            ov.at = picked.toISOString();
            ov.atCleared = false;
          }
        } else {
          const d = document.getElementById('define-detail-input');
          if (el.dataset.skip) ov.promptAnswer = ov.promptAnswer || '';
          else if (d) ov.promptAnswer = d.value;
        }
        goDefineStep(3, 1);
      }
      return;
    }
    if (action === 'define-back') {
      const ov = view.overlay;
      if (ov?.type === 'define-raw') {
        const prev = ov.step === 3 && ov.kind !== 'let_go' ? 2 : 1;
        goDefineStep(prev, -1);
      }
      return;
    }
    if (action === 'define-change-kind') {
      if (view.overlay?.type === 'define-raw') goDefineStep(1, -1);
      return;
    }
    if (action === 'finish-define-raw') {
      if (requireLogin()) return;
      const ov = view.overlay;
      if (!ov || ov.type !== 'define-raw' || !ov.kind) return;
      const raw = (document.getElementById('define-raw-input')?.value || ov.rawText || '').trim() || getLoop(ov.loopId)?.rawText || '';
      const ans = (ov.promptAnswer || '').trim();
      const status = el.dataset.status || ov.status || (ov.kind === 'let_go' ? 'released' : 'active');
      const prevLoop = getLoop(ov.loopId);
      // A new note means a new ask: forget that the old one was sent.
      const details = { ...((prevLoop && prevLoop.details) || {}) };
      if (prevLoop && ans !== (prevLoop.promptAnswer || '')) { delete details.sentAt; delete details.nudges; delete details.sentText; }
      // A Schedule loop’s time decides where it waits and when it comes back,
      // so it never goes through the "when should it come back?" presets:
      // schedulePatch() works it out. Every other kind drops the Schedule
      // time, along with any heads-up that time had set.
      let sched = null;
      if (ov.kind === 'schedule') {
        const atIso = ov.at || (ov.atCleared ? null : (details.at || null));
        if (status === 'released') {
          if (atIso) { if (details.at !== atIso) delete details.calAt; details.at = atIso; }
          else { delete details.at; delete details.calAt; }
        } else {
          sched = schedulePatch({ ...(prevLoop || {}), kind: 'schedule', details }, atIso, { status });
        }
      } else {
        delete details.at;
        delete details.calAt;
      }
      if (status === 'waiting' && !sched) {
        // Parking asks "when?" first; the define choices are applied then.
        view.overlay = { type: 'when', loopId: ov.loopId, define: { rawText: raw, kind: ov.kind, promptAnswer: ans, details: cleanDetails(details) } };
        renderOverlay();
        return;
      }
      if (status === 'released') details.outcome = ov.kind === 'let_go' ? 'let_go' : 'done';
      else delete details.outcome;
      const patch = { rawText: raw, kind: ov.kind, promptAnswer: ans, status, completedAt: status === 'released' ? nowIso() : null, details: cleanDetails(details) };
      if (sched) {
        Object.assign(patch, { status: sched.status, details: sched.details, wakeAt: sched.wakeAt });
      } else if (prevLoop && wakeIsScheduleNudge(prevLoop)) {
        // No longer a timed Schedule: its heads-up would nudge for nothing.
        patch.wakeAt = null;
      } else if (status === 'active' && prevLoop && prevLoop.wakeAt && new Date(prevLoop.wakeAt).getTime() > Date.now()) {
        // In Active now: a wake time still ahead would only send a nudge for nothing.
        patch.wakeAt = null;
      }
      const finalStatus = patch.status;
      const prevStatus = prevLoop?.status;
      const upNext = finalStatus === 'active' && prevStatus !== 'active' ? upNextPosition(ov.loopId) : null;
      if (upNext) patch.position = upNext.position;
      updateLoop(ov.loopId, patch);
      const positionChanges = upNext && upNext.rebalance ? rebalanceActivePositions() : null;
      view.highlightedId = finalStatus === 'active' ? ov.loopId : null;
      // Closing stays on the current view so the loop visibly lands in the
      // Closed archive in the header instead of jumping tabs.
      if (finalStatus !== 'released') view.activeTab = finalStatus === 'waiting' ? 'later' : 'now';
      saveReentryDismissed(null);
      closeOverlay();
      await persistAndRender();
      Sync.updateLoop(ov.loopId, patch);
      if (positionChanges) syncPositionChanges({ ok: true, changes: positionChanges });
      if (sched && sched.wakeAt) {
        const when = formatWake(sched.wakeAt);
        announce(finalStatus === 'waiting' ? `Parked. Back with a nudge ${when}.` : `In Up next. Nudge ${when}.`);
      } else {
        announce(finalStatus === 'active' ? 'Sorted. Now in Up next.' : finalStatus === 'waiting' ? 'Sorted and parked.' : 'Sorted and closed.');
      }
      return;
    }

    // Show more
    if (action === 'show-more') { view.expanded = true; renderMain(); return; }

    // Menu open
    if (action === 'open-menu') {
      rememberOverlayOpener(el);
      view.overlay = { type: 'menu', loopId };
      renderOverlay();
      return;
    }

    // Primary action
    if (action === 'primary-action') {
      const target = getLoop(loopId);
      if (!target) return;
      rememberOverlayOpener(el);
      // A loop with no kind yet has nothing to act on: define it first.
      view.overlay = target.kind
        ? { type: 'primary-action', loopId }
        : { type: 'define-raw', loopId, rawText: target.rawText, kind: null, promptAnswer: target.promptAnswer || '', status: target.status, step: 1 };
      renderOverlay();
      return;
    }

    // Primary action outcomes
    if (action === 'complete-done') {
      if (requireLogin()) return;
      const target = getLoop(loopId);
      if (!target) { closeOverlay(); return; }
      const letGo = target.kind === 'let_go';
      const patch = { status: 'released', completedAt: nowIso(), details: cleanDetails({ ...target.details, outcome: letGo ? 'let_go' : 'done' }) };
      updateLoop(loopId, patch);
      closeOverlay();
      view.activeTab = 'now';
      await persistAndRender();
      Sync.updateLoop(loopId, patch);
      announce(letGo ? 'Let go.' : 'Closed.');
      return;
    }

    // ── Action sheet steps ──
    if (action === 'act-step') {
      const ov = view.overlay;
      if (!ov || ov.type !== 'primary-action') return;
      readActInputs(ov);
      ov.step = el.dataset.step || 'main';
      ov.waitOnly = el.dataset.wait === '1';
      renderActStep();
      return;
    }
    if (action === 'do-save-step') {
      if (requireLogin()) return;
      const ov = view.overlay;
      const target = getLoop(loopId);
      if (!ov || !target) { closeOverlay(); return; }
      readActInputs(ov);
      const val = (ov.nextText || '').trim().slice(0, MAX_LOOP_TEXT_LEN);
      if (!val) return;
      const patch = { promptAnswer: val, details: cleanDetails({ ...target.details, steps: ((target.details && target.details.steps) || 0) + 1 }) };
      updateLoop(target.id, patch);
      // Quiet feedback: the card lights up with its new next step.
      view.highlightedId = target.id;
      closeOverlay();
      await persistAndRender();
      Sync.updateLoop(target.id, patch);
      Sound.play('up');
      announce('Next step saved. The loop stays open.');
      setTimeout(() => {
        if (view.highlightedId === target.id) { view.highlightedId = null; renderMain(); }
      }, 1800);
      return;
    }
    if (action === 'decide-pick') {
      const ov = view.overlay;
      if (!ov || ov.type !== 'primary-action') return;
      ov.decision = el.dataset.choice || '';
      const input = document.getElementById('act-decision');
      if (input) { input.value = ov.decision; autoGrow(input); }
      syncChoiceChips(ov);
      return;
    }
    if (action === 'decide-confirm') {
      const ov = view.overlay;
      if (!ov || ov.type !== 'primary-action') return;
      readActInputs(ov);
      ov.decision = (ov.decision || '').trim();
      if (!ov.decision) {
        toast('Write the decision in a line first.');
        document.getElementById('act-decision')?.focus();
        return;
      }
      ov.step = 'next';
      renderActStep();
      return;
    }
    if (action === 'decide-close') {
      if (requireLogin()) return;
      const ov = view.overlay;
      const target = getLoop(loopId);
      if (!ov || !target) { closeOverlay(); return; }
      readActInputs(ov);
      const decision = (ov.decision || '').trim();
      const spawnText = el.dataset.spawn ? (ov.spawnText || '').trim().slice(0, MAX_LOOP_TEXT_LEN) : '';
      const patch = { status: 'released', completedAt: nowIso(), details: cleanDetails({ ...target.details, decision, outcome: 'done' }) };
      updateLoop(target.id, patch);
      let spawned = null;
      let positionChanges = null;
      if (spawnText) {
        spawned = createLoop({ rawText: spawnText, kind: 'do', promptAnswer: '', status: 'active', details: { origin: 'decision' } });
        const upNext = upNextPosition(spawned.id);
        spawned.position = upNext.position;
        if (upNext.rebalance) positionChanges = rebalanceActivePositions().filter(c => c.id !== spawned.id);
      }
      closeOverlay();
      view.activeTab = 'now';
      await persistAndRender();
      Sync.updateLoop(target.id, patch);
      if (spawned) Sync.createLoop(spawned);
      if (positionChanges && positionChanges.length) syncPositionChanges({ ok: true, changes: positionChanges });
      announce(spawned ? 'Decided and closed. The new Do is in Up next.' : 'Decided and closed.');
      return;
    }
    if (action === 'ask-share') {
      const ov = view.overlay;
      if (!ov || ov.type !== 'primary-action') return;
      readActInputs(ov);
      const msg = (ov.message || '').trim();
      if (!msg) { toast('Write the message first.'); return; }
      const result = await shareText(msg);
      if (result === 'cancelled') return;
      if (result === 'failed') { toast("Couldn’t open sharing here. Copy the text and send it yourself."); return; }
      if (result === 'copied') toast('Copied. Paste it wherever you talk to them.');
      if (view.overlay !== ov) return;
      if (!ov.nudge) ov.sentText = msg;
      ov.step = 'sent';
      ov.waitOnly = false;
      renderActStep();
      return;
    }
    if (action === 'ask-nudge') {
      const ov = view.overlay;
      if (!ov || ov.type !== 'primary-action') return;
      ov.nudge = true;
      ov.message = null;
      ov.step = 'draft';
      renderActStep();
      return;
    }
    if (action === 'ask-park') {
      if (requireLogin()) return;
      const ov = view.overlay;
      const target = getLoop(loopId);
      if (!ov || !target) { closeOverlay(); return; }
      const wakeAt = validIso(el.dataset.when);
      const details = { ...target.details };
      // sentAt is the first time it was sent; nudges count the follow-ups.
      if (!details.sentAt) details.sentAt = nowIso();
      if (ov.nudge) details.nudges = (details.nudges || 0) + 1;
      else if (ov.sentText) details.sentText = ov.sentText;
      const patch = { status: 'waiting', wakeAt, details: cleanDetails(details) };
      updateLoop(target.id, patch);
      closeOverlay();
      await persistAndRender();
      Sync.updateLoop(target.id, patch);
      const who = askOf(target).who || 'them';
      announce(`Parked. Checking back with ${who} ${formatWake(wakeAt)}.`);
      return;
    }
    if (action === 'sched-save') {
      if (requireLogin()) return;
      const target = getLoop(loopId);
      if (!target) { closeOverlay(); return; }
      const atIso = readSchedulePick('sched');
      if (!atIso) return;
      await saveScheduleTime(target, atIso);
      return;
    }
    if (action === 'cal-google' || action === 'cal-ics') {
      const ov = view.overlay;
      const target = getLoop(loopId);
      if (!ov || !target) return;
      readActInputs(ov);
      const { start } = scheduleStart(target, ov);
      const end = new Date(start.getTime() + 30 * 60000);
      const title = ((ov.calTitle != null ? ov.calTitle : target.rawText) || 'Open Loops').trim();
      const details = target.promptAnswer ? `${target.promptAnswer}\n\nAdded from Open Loops` : 'Added from Open Loops';
      if (action === 'cal-google') {
        window.open(googleCalendarUrl({ title, start, end, details }), '_blank', 'noopener');
      } else {
        downloadIcs(icsText({ uidValue: target.id, title, start, end, details }), `${fileSlug(title) || 'open-loops-event'}.ics`);
      }
      // Remember it went to a calendar: the card asks "On your calendar?",
      // and so does the app when you come back, even if this sheet is gone.
      // The time may have been changed here, so it goes through
      // schedulePatch() like every other time, keeping the loop where it is.
      const sched = schedulePatch(target, start.toISOString(), { status: target.status === 'waiting' ? 'waiting' : 'active' });
      const patch = { details: cleanDetails({ ...sched.details, calAt: nowIso() }), wakeAt: sched.wakeAt };
      updateLoop(target.id, patch);
      save();
      Sync.updateLoop(target.id, patch);
      askedCal.add(target.id);
      ov.calDate = localDateValue(start);
      ov.calTime = localTimeValue(start);
      ov.calTitle = title;
      ov.step = 'confirm';
      renderMain();
      renderActStep();
      return;
    }

    // ── Not yet → when? ──
    if (action === 'open-when' || action === 'move-waiting') {
      const target = getLoop(loopId || (view.overlay && view.overlay.loopId));
      if (!target) { closeOverlay(); return; }
      if (requireLogin()) return;
      if (!view.overlay) rememberOverlayOpener(el);
      view.overlay = { type: 'when', loopId: target.id };
      renderOverlay();
      return;
    }
    if (action === 'when-pick-open') {
      const ov = view.overlay;
      if (!ov || ov.type !== 'when') return;
      ov.pickOpen = true;
      renderOverlay();
      setTimeout(() => document.getElementById('when-date')?.focus(), 40);
      return;
    }
    if (action === 'park-until') {
      if (requireLogin()) return;
      const ov = view.overlay;
      if (!ov || ov.type !== 'when') return;
      const target = getLoop(ov.loopId);
      if (!target) { closeOverlay(); return; }
      if (el.dataset.when === 'schedule' || el.dataset.when === 'schedule-clear') {
        // A Schedule loop’s new time: where it waits follows from it.
        const atIso = el.dataset.when === 'schedule' ? readSchedulePick('when-sched') : null;
        if (el.dataset.when === 'schedule' && !atIso) return;
        const extra = ov.define ? { rawText: ov.define.rawText, kind: ov.define.kind, promptAnswer: ov.define.promptAnswer } : null;
        await saveScheduleTime(target, atIso, atIso ? {} : { status: 'waiting' }, extra);
        return;
      }
      let wakeAt = null;
      if (el.dataset.when === 'pick') {
