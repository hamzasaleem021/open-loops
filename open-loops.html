      ? `<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13 9.5A5.5 5.5 0 0 1 6.5 3a5.5 5.5 0 1 0 6.5 6.5z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`
      : `<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8h1.5M13 8h1.5M3.2 3.2l1.05 1.05M11.75 11.75l1.05 1.05M3.2 12.8l1.05-1.05M11.75 4.25l1.05-1.05" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`;
    btn.setAttribute('aria-label', isDark ? 'Switch to light theme' : 'Switch to dark theme');
    btn.setAttribute('title', isDark ? 'Switch to light theme' : 'Switch to dark theme');
  }

  // ── PWA INSTALL PROMPT ──
  // Chromium fires this when the app is installable; we stash the event and
  // reveal the install button so the user can trigger it intentionally.
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredInstallPrompt = e;
    const btn = document.getElementById('install-btn');
    if (btn) btn.hidden = false;
  });

  window.addEventListener('appinstalled', () => {
    deferredInstallPrompt = null;
    const btn = document.getElementById('install-btn');
    if (btn) btn.hidden = true;
    toast('Installed!');
  });

  // ── INIT ──
  loadTheme();
  Motion.init();
  BrandMascot.init();

  // First frame: if this phone remembers who was signed in, show their saved
  // loops right away instead of waiting for the sign-in check (which can wait
  // on the network when the app sat closed for a while). Sync.init() confirms
  // the session a moment later, and takes them down if nobody, or someone
  // else, turns out to be signed in. Not when arriving from a sign-in link:
  // that link may be for another account.
  const remembered = hasSupabaseCfg() && !arrivedFromSignInLink() ? rememberedAccount() : null;
  if (remembered) {
    setLocalUser({ id: remembered });
    load();
    bootState = data.loops.length ? 'cached' : 'loading';
    hideSplash();
  }
  renderAll(); // First paint

  // Kick off auth check. Sign-in is required because Supabase is the
  // cross-device source of truth for loop data.
  if (!hasSupabaseCfg()) {
    setTimeout(() => {
      authReady = true;
      bootState = 'ready';
      renderAuthGate();
    }, 0);
  } else {
    Sync.init();
  }

  // ── DEBUG HELPERS ──
  // Exposed on window for troubleshooting from the browser console.
  // Not used by the app itself.
  //   window.openLoopsDebug.queue()      → show pending (not-yet-synced) ops
  //   window.openLoopsDebug.dead()       → show ops that failed > 5 times
  //   window.openLoopsDebug.clearDead()  → clear the dead-letter queue
  //   window.openLoopsDebug.retry()      → force a queue drain + pull
  window.openLoopsDebug = {
    queue() {
      try {
        const key = scopedKey(OFFLINE_QUEUE_KEY_BASE);
        return key ? JSON.parse(localStorage.getItem(key) || '[]') : [];
      }
      catch(_) { return []; }
    },
    dead() {
      try {
        const key = scopedKey(DEAD_QUEUE_KEY_BASE);
        return key ? JSON.parse(localStorage.getItem(key) || '[]') : [];
      }
      catch(_) { return []; }
    },
    legacy() {
      try {
        return {
          data: localStorage.getItem(LEGACY_STORAGE_QUARANTINE_KEY),
          queue: JSON.parse(localStorage.getItem(LEGACY_OFFLINE_QUEUE_QUARANTINE_KEY) || '[]'),
          dead: JSON.parse(localStorage.getItem(LEGACY_DEAD_QUEUE_QUARANTINE_KEY) || '[]')
        };
      } catch(_) { return {}; }
    },
    clearDead() {
      const key = scopedKey(DEAD_QUEUE_KEY_BASE);
      if (key) localStorage.removeItem(key);
      return 'cleared';
    },
    async retry() {
      if (!Sync.isLoggedIn()) return 'not signed in';
      return await Sync.retry();
    }
  };

  // ── SERVICE WORKER ──
  // open-loops-sw.js calls skipWaiting() and clients.claim(), so a new version
  // takes over this page as soon as it installs. When that happens we reload
  // so the page itself is the new version too, but never while a sheet is
  // open or someone is typing: that waits until they’re done.
  //
  // Phones pause timers while an installed app sits in the background and
  // don’t re-check for updates when it comes back, so we also check every
  // time the app returns to the foreground, not just once a minute.
  if ('serviceWorker' in navigator && !IS_FILE) {
    let hadController = !!navigator.serviceWorker.controller;
    let reloadPending = false;

    const isBusy = () => {
      if (view.overlay) return true;
      const a = document.activeElement;
      return !!(a && a.matches && a.matches('input, textarea, select, [contenteditable="true"]'));
    };
    const reloadWhenSafe = () => {
      if (isBusy()) { setTimeout(reloadWhenSafe, 1000); return; }
      if (document.hidden) { window.location.reload(); return; }
      toast('Updated. Reloading…', { duration: 1500 });
      setTimeout(() => (isBusy() ? reloadWhenSafe() : window.location.reload()), 1500);
    };

    // A tapped notification on a phone that already has the app open: the
    // service worker focuses this window and says where to go. After a
    // notification button (Done / Tomorrow) changed a loop, pull it in.
    // A nudge that arrives while the app is open and in front of you is said
    // here, not as a phone notification.
    navigator.serviceWorker.addEventListener('message', e => {
      const msg = e.data || {};
      if (msg.type === 'open' && msg.url) {
        try { takeDeepLink(new URL(msg.url, location.href).search); } catch (_) {}
      } else if (msg.type === 'loops-changed' && Sync.isLoggedIn()) {
        Sync.retry();
      } else if (msg.type === 'push-renewed') {
        resyncNudges();
      } else if (msg.type === 'nudge' && Sync.isLoggedIn()) {
        // A wake-up: wake it here too, which shows its own note.
        if (wakeDueLoops().length) return;
        let search = '';
        try { search = new URL(msg.url, location.href).search; } catch (_) {}
        const text = shortText(`${msg.title || ''} ${msg.body || ''}`, 120);
        toast(text, search && !view.overlay
          ? { action: 'Open', onAction: () => takeDeepLink(search), duration: 7000 }
          : { duration: 7000 });
      }
    });

    navigator.serviceWorker.addEventListener('controllerchange', () => {
      // First install: the page was already loaded from the network.
      if (!hadController) { hadController = true; return; }
      if (reloadPending) return;
      reloadPending = true;
      reloadWhenSafe();
    });

    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./open-loops-sw.js')
        .then(registration => {
          swRegistration = registration;
          swState = 'ready';
          if (nudgeUi.note && /getting ready/.test(nudgeUi.note.text)) nudgeUi.note = null;
          if (view.overlay && view.overlay.type === 'settings') renderOverlay();
          const checkForUpdate = () => { registration.update().catch(() => {}); };
          setInterval(checkForUpdate, 60000);
          document.addEventListener('visibilitychange', () => {
            if (!document.hidden) checkForUpdate();
          });
        })
        .catch(() => { swState = 'failed'; refreshNudgeSettings(); });
    });
  }
})();
</script>
</body>
</html>
