.why-stage { display: block; width: 100%; padding: 0; border: none; border-radius: 20px; background: var(--surface-2); aspect-ratio: 320 / 206; overflow: hidden; cursor: pointer; }
.why-stage svg { display: block; width: 100%; height: 100%; overflow: visible; }
.why-stage:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
.why-text { min-height: 124px; display: grid; gap: 8px; align-content: start; }
.why-h1 { margin: 0; font-family: var(--display); font-size: 26px; font-weight: 500; letter-spacing: -0.035em; line-height: 1.1; color: var(--text); }
.why-p { margin: 0; font-size: 15px; line-height: 1.5; color: var(--text-2); }
.why-cite { margin: 0; font-size: 12px; color: var(--text-3); }
.why-cite:empty { display: none; }
.why-nav { display: flex; gap: 8px; }
.why-nav .why-go { margin-left: auto; }
.why-nav .why-back[hidden] { display: none; }

.why-scene .w-mind { fill: var(--surface-3); }
.why-scene .w-ring { transform-box: view-box; }
.wk-ask { stroke: var(--ask); } .wk-decide { stroke: var(--decide); } .wk-do { stroke: var(--do); }
.wk-schedule { stroke: var(--schedule); } .wk-let_go { stroke: var(--let_go); } .wk-ask-on { stroke: #fffaf0; }
.why-scene .w-tag { opacity: 0; transform-box: fill-box; }
.why-scene .w-tag-bg { fill: var(--text); }
.why-scene .w-tag-text { fill: var(--bg); font: 600 10px var(--sans); }
.why-scene .w-tray { fill: var(--surface-3); }
.why-scene .w-label { fill: var(--text-3); font: 600 10px var(--sans); letter-spacing: .4px; }
.why-scene .w-now { opacity: 0; transform-box: fill-box; transform-origin: center; }
.why-scene .w-now-card { fill: var(--ask-dim); }
.why-scene .w-static { fill: var(--ask); }
.why-scene .w-now-label { fill: var(--text-3); font: 600 9px var(--sans); letter-spacing: 1.2px; }
.why-scene .w-now-step { fill: var(--text); font: 600 9.5px var(--sans); }
.why-scene .w-now-cap { opacity: 0; }
.why-scene .w-shelf { stroke: var(--border); stroke-width: 2; stroke-linecap: round; }
.why-scene .w-close { transform-box: view-box; transform-origin: 160px 72px; }

@keyframes w-jit {
  0%, 100% { transform: translate(0, 0) rotate(0deg); }
  25% { transform: translate(-3px, 2px) rotate(-8deg); }
  50% { transform: translate(2px, -3px) rotate(7deg); }
  75% { transform: translate(3px, 2px) rotate(-4deg); }
}
.why-scene.play .w-jit { animation: w-jit .9s ease-in-out infinite; }
.why-scene.play .j2 { animation-duration: .8s; animation-delay: -.2s; }
.why-scene.play .j3 { animation-duration: 1s; animation-delay: -.45s; }
.why-scene.play .j4 { animation-duration: .85s; animation-delay: -.1s; }
.why-scene.play .j5 { animation-duration: .95s; animation-delay: -.3s; }
.why-scene.play .w-settle { animation: w-jit .9s ease-in-out 0s 2; }
@keyframes w-tag { from { opacity: 0; transform: translateX(26px); } to { opacity: 1; transform: none; } }
.why-scene.play .w-tag { animation: w-tag .5s cubic-bezier(.2,.8,.2,1) 1.2s forwards; }

@keyframes w-drop { from { transform: translateY(-120px); opacity: 0; } 55% { opacity: 1; } to { transform: none; opacity: 1; } }
@keyframes w-rise { from { transform: none; } to { transform: translate(92px, -64px) scale(1.3); } }
.why-scene .w-drop { opacity: 0; }
.why-scene.play .d1 { animation: w-drop .55s cubic-bezier(.3,0,.3,1.25) .1s both; }
.why-scene.play .d2 { animation: w-drop .55s cubic-bezier(.3,0,.3,1.25) .35s both; }
.why-scene.play .d3 { animation: w-drop .55s cubic-bezier(.3,0,.3,1.25) .6s both, w-rise .75s cubic-bezier(.5,0,.25,1) 1.9s forwards; }
@keyframes w-pop { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
.why-scene.play .w-now { animation: w-pop .45s cubic-bezier(.2,.8,.2,1.2) 1.5s both; }
.why-scene.play .w-now-cap { animation: w-pop .4s ease-out 2.4s both; }

@keyframes w-seal { to { stroke-dasharray: 100.53 100.53; } }
@keyframes w-fly {
  0% { transform: none; }
  40% { transform: translate(4px, -20px) scale(.9) rotate(120deg); }
  100% { transform: translate(8px, 92px) scale(.56) rotate(300deg); }
}
@keyframes w-tint { to { stroke: var(--ask); } }
@keyframes w-dim { to { opacity: .2; } }
.why-scene.play .w-seal circle { animation: w-seal .45s cubic-bezier(.3,0,.2,1) .5s forwards, w-tint .5s ease 1.3s forwards; }
.why-scene.play .w-close { animation: w-fly .75s cubic-bezier(.5,0,.25,1) 1.15s forwards; }
.why-scene.play .w-static { animation: w-dim .4s ease 1.3s forwards; }

@keyframes w-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
.why-scene.play .w-breathe { animation: w-breathe 3.2s ease-in-out infinite; }

.why-voice-toggle { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px 0 10px; margin-left: auto; margin-right: 6px; border-radius: var(--r-pill); border: 1px solid var(--border); background: transparent; color: var(--text-2); font-size: 13px; font-weight: 600; }
.why-voice-toggle .wv-on { display: none; }
.why-voice-toggle.on { background: var(--text); color: var(--bg); border-color: var(--text); }
.why-voice-toggle.on .wv-on { display: inline; }
.why-voice-toggle.on .wv-off { display: none; }
.why-voice-toggle:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
</style>
</head>

<script>
(() => {
  const CFG = window.OL_CONFIG || {};
  const STORAGE_KEY_BASE   = CFG.STORAGE_KEY ? CFG.STORAGE_KEY + '_v2'          : 'open_loops_data_v2';
  const ONBOARDING_KEY_BASE = CFG.STORAGE_KEY ? CFG.STORAGE_KEY + '_onboarded'  : 'open_loops_onboarded';
  const THEME_KEY      = CFG.STORAGE_KEY ? CFG.STORAGE_KEY + '_theme'      : 'open_loops_theme';
  const LOOP_CAP_KEY_BASE   = CFG.STORAGE_KEY ? CFG.STORAGE_KEY + '_cap'        : 'open_loops_cap';
  const REENTRY_KEY_BASE    = CFG.STORAGE_KEY ? CFG.STORAGE_KEY + '_reentry_dismissed' : 'open_loops_reentry_dismissed';
  const LEGACY_STORAGE_KEY  = STORAGE_KEY_BASE;
  const LEGACY_STORAGE_QUARANTINE_KEY = `${STORAGE_KEY_BASE}_legacy_unscoped`;
  const IS_FILE = location.protocol === 'file:';

  // UX constraints
  const MAX_LOOP_TEXT_LEN = 500;
  const ALLOWED_LOOP_CAPS = [3, 5, 7];
  const DEFAULT_LOOP_CAP  = 5;
  const DEFAULT_TOAST_MS  = 4000;

  // Display labels — drive all user-visible copy from one map so they stay
  // consistent across tabs, empty states, and chips. Internal status keys
  // stay as 'inbox' / 'active' / 'waiting' / 'released' for backwards
  // compat with existing localStorage and the Supabase schema.
  const TAB_LABEL = {
    inbox:    'Inbox',
    active:   'Active',
    waiting:  'Parked',
    released: 'Closed',
  };

  function supabaseConfigIssue() {
    const url = String(CFG.SUPABASE_URL || '').trim();
    const key = String(CFG.SUPABASE_KEY || '').trim();
    const placeholders = ['YOUR_PROJECT', 'YOUR_PUBLISHABLE_KEY', 'YOUR_SUPABASE', 'YOUR_ANON_KEY'];

    if (!url || !key) return 'Supabase URL and publishable key are required before anyone can sign in.';
    if (placeholders.some(token => url.includes(token) || key.includes(token))) {
      return 'open-loops-config.js still contains placeholder Supabase values.';
    }

    try {
      const parsed = new URL(url);
      if (parsed.protocol !== 'https:' || !parsed.hostname.endsWith('.supabase.co')) {
        return 'Supabase URL should look like https://your-project.supabase.co.';
      }
    } catch (_) {
      return 'Supabase URL is not a valid URL.';
    }

    if (key.length < 20) return 'Supabase publishable key looks incomplete.';
    return null;
  }

  function hasSupabaseCfg() {
    return !supabaseConfigIssue();
  }

  function supabaseClientIssue() {
    if (!hasSupabaseCfg()) return supabaseConfigIssue();
    if (!window.supabase) return 'The Supabase sign-in library could not load. Check your connection and reload.';
    return null;
  }

  const VALID_KINDS = new Set(['do', 'decide', 'ask', 'schedule', 'let_go']);
  const VALID_STATUSES = new Set(['active', 'waiting', 'released', 'inbox']);

  const kindMeta = {
    do:       { label: 'Do',       action: 'Mark done',  question: 'What is the one next visible step?', helper: 'Concrete enough that you could start right now without planning.' },
    decide:   { label: 'Decide',   action: 'Decide',     question: 'What decision needs to be made?',    helper: 'Name the decision cleanly — stop holding the whole swirl.' },
    ask:      { label: 'Ask',      action: 'Reach out',  question: 'Who do you need something from?',    helper: 'One person, one ask. Nothing more.' },
    schedule: { label: 'Schedule', action: 'Add to cal', question: 'What needs time on a calendar?',     helper: 'Treat time as the missing ingredient.' },
    let_go:   { label: 'Let go',   action: 'Release',    question: 'What are you choosing to release?',  helper: 'The goal is relief, not proving the thought was silly.' },
    inbox:    { label: 'Inbox', action: 'Define',    question: '',                                   helper: '' }
  };

  function nowIso() { return new Date().toISOString(); }
  function uid(p) {
    if (window.crypto && typeof window.crypto.randomUUID === 'function') return `${p}-${window.crypto.randomUUID()}`;
    return `${p}-${Math.random().toString(36).slice(2,9)}-${Date.now().toString(36)}`;
  }
  // Position is a double precision ordering value: bigger = higher in the
  // list. New rows get the current epoch-seconds so they land at the top.
  // Reorder computes midpoints between neighbors, so we rarely need to
  // rebalance (at millisecond resolution, ~50 drops between the same two
  // items before we run out of float headroom — still fine in practice).
  function nowPosition() { return Date.now() / 1000; }

  function seedState() {
    return {
      version: 2,
      lastLoopId: null,
      activeTab: 'now',
      loops: []
    };
  }

  function mk(id, rawText, kind, status, promptAnswer) {
    const t = nowIso();
    return { id, rawText, kind, status, promptAnswer, position: nowPosition(), createdAt: t, updatedAt: t };
  }

  function sanitize(loop) {
    // Fall back to epoch-of-createdAt so existing localStorage data from
    // before the position column gets a deterministic order on first load.
    let pos = typeof loop.position === 'number' && isFinite(loop.position)
      ? loop.position
      : (loop.createdAt ? new Date(loop.createdAt).getTime() / 1000 : nowPosition());
    return {
      id: loop.id || uid('l'),
      rawText: (loop.rawText || 'Untitled').trim().slice(0, MAX_LOOP_TEXT_LEN),
      kind: VALID_KINDS.has(loop.kind) ? loop.kind : null,
      status: VALID_STATUSES.has(loop.status) ? loop.status : 'active',
      promptAnswer: (loop.promptAnswer || '').trim().slice(0, MAX_LOOP_TEXT_LEN),
      position: pos,
      createdAt: loop.createdAt || nowIso(),
      updatedAt: loop.updatedAt || nowIso(),
      completedAt: loop.completedAt || loop.completed_at || null
    };
  }

  // ── STATE ──
  let data = seedState();
  let view = {
    activeTab: 'now',
    overlay: null,
    highlightedId: null,
    reentryDismissedFor: null,
    expanded: false,
    syncStatus: 'idle',
    syncText: 'Sync',
    inlineEditId: null,
    draggingLoopId: null,
    // Auth gate state
    authGateSent: false,     // magic link sent confirmation
    authGateEmail: '',       // email being typed
    // Onboarding state
    onboardingStep: -1,      // -1 = hidden; 0-3 = active step
    // Theme: 'dark' | 'light'. Persisted in localStorage.
    theme: 'dark',
    // How many Active loops to show before "Show more". User-configurable.
    loopCap: DEFAULT_LOOP_CAP,
    // Element to restore focus to when current overlay closes.
    overlayOpenerEl: null,
  };
  let toastTimer = null;
  let deferredInstallPrompt = null; // set by 'beforeinstallprompt' event
  let currentLocalUserId = null;
  // Set to true once Sync.init() resolves so we don't flash the lock screen
  // during the async auth check on cold start.
  let authReady = false;
  // Magic-link cooldown: Supabase rate-limits magic link sends (3/hour/email
  // on free tier). A user tapping "Send link" repeatedly can lock themselves
  // out. Enforce a 60s client-side cooldown between sends.
  const MAGIC_LINK_COOLDOWN_MS = 60000;
  let lastMagicLinkAt = 0;

  // ── PERSIST ──
  function scopedKey(base, userId = currentLocalUserId) {
    return userId ? `${base}:${userId}` : null;
  }

  function setLocalUser(user) {
    currentLocalUserId = user && user.id ? user.id : null;
  }

  function resetLocalAppState() {
    data = seedState();
    view.activeTab = 'now';
    view.overlay = null;
    view.highlightedId = null;
    view.reentryDismissedFor = null;
    view.expanded = false;
    view.inlineEditId = null;
    view.draggingLoopId = null;
    view.overlayOpenerEl = null;
    view.onboardingStep = -1;
    view.loopCap = DEFAULT_LOOP_CAP;
  }

  function quarantineLegacyLocalData() {
    let moved = false;
    try {
      const raw = localStorage.getItem(LEGACY_STORAGE_KEY);
      if (!raw) return;
      const existing = localStorage.getItem(LEGACY_STORAGE_QUARANTINE_KEY);
      if (!existing) localStorage.setItem(LEGACY_STORAGE_QUARANTINE_KEY, raw);
      localStorage.removeItem(LEGACY_STORAGE_KEY);
      moved = true;
    } catch(e) {}
    return moved;
  }

  function hasLegacyQuarantinedData() {
    try {
      return !!(
        localStorage.getItem(LEGACY_STORAGE_QUARANTINE_KEY) ||
        localStorage.getItem(LEGACY_OFFLINE_QUEUE_QUARANTINE_KEY) ||
        localStorage.getItem(LEGACY_DEAD_QUEUE_QUARANTINE_KEY)
      );
    } catch(e) { return false; }
  }

  function load() {
    if (!currentLocalUserId) {
      resetLocalAppState();
      return;
    }
    resetLocalAppState();
    try {
      const raw = localStorage.getItem(scopedKey(STORAGE_KEY_BASE));
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.loops)) {
          data = { version: 2, lastLoopId: parsed.lastLoopId || null, activeTab: 'now', loops: parsed.loops.map(sanitize) };
          view.activeTab = parsed.activeTab || 'now';
        }
      }
    } catch(e) {}
    // Reentry dismissal (survives reload)
    try {
      const r = localStorage.getItem(scopedKey(REENTRY_KEY_BASE));
      if (r) view.reentryDismissedFor = r;
    } catch(e) {}
    // Loop cap
    try {
      const c = parseInt(localStorage.getItem(scopedKey(LOOP_CAP_KEY_BASE)) || '', 10);
      if (ALLOWED_LOOP_CAPS.includes(c)) view.loopCap = c;
    } catch(e) {}
  }

  function save() {
    const key = scopedKey(STORAGE_KEY_BASE);
    if (!key) return;
    try {
      localStorage.setItem(key, JSON.stringify({ version: 2, lastLoopId: data.lastLoopId, activeTab: view.activeTab, loops: data.loops }));
    } catch(e) {}
  }

  function saveReentryDismissed(id) {
    view.reentryDismissedFor = id || null;
    const key = scopedKey(REENTRY_KEY_BASE);
    if (!key) return;
    try {
      if (id) localStorage.setItem(key, id);
      else    localStorage.removeItem(key);
    } catch(e) {}
  }

  function saveLoopCap(n) {
    if (!ALLOWED_LOOP_CAPS.includes(n)) return;
    view.loopCap = n;
    const key = scopedKey(LOOP_CAP_KEY_BASE);
    if (!key) return;
    try { localStorage.setItem(key, String(n)); } catch(e) {}
  }

  // ── QUERIES ──
  // Display order is position desc (highest = top). Array order in
  // data.loops is kept roughly in sync but realtime updates and createLoop
  // can reorder it; byStatus sorts defensively on every call so render
  // functions always see the same order.
  function byStatus(s) {
    return data.loops
      .filter(l => l.status === s)
      .sort((a, b) => (b.position || 0) - (a.position || 0));
  }
  function getLoop(id) { return data.loops.find(l => l.id === id) || null; }
  function suggested() {
    if (data.lastLoopId) {
      const l = getLoop(data.lastLoopId);
      if (l && l.status === 'active') return l;
    }
    return byStatus('active')[0] || null;
  }

  // ── MUTATIONS ──
  // Return a position value strictly greater than every existing loop's
  // position — used when creating a new loop (it should land at the top).
  function topPosition() {
    if (!data.loops.length) return nowPosition();
    const max = data.loops.reduce((m, l) => (l.position > m ? l.position : m), -Infinity);
    // Step by 1s so newly-created loops within the same second don't tie.
    return Math.max(max, nowPosition()) + 1;
  }

  function createLoop({rawText, kind, promptAnswer, status}) {
    const l = sanitize({
      id: uid('l'),
      rawText, kind, promptAnswer, status,
      position: topPosition(),
      createdAt: nowIso(),
      updatedAt: nowIso()
    });
    data.loops.unshift(l);
    if (l.status === 'active') data.lastLoopId = l.id;
    return l;
  }

  function updateLoop(id, patch) {
    const l = getLoop(id);
    if (!l) return null;
    Object.assign(l, patch, { updatedAt: nowIso() });
    // Warn rather than silently coerce: a bad value here usually means a
    // schema drift, a future feature flag, or a corrupted sync payload.
    if (l.kind !== null && l.kind !== undefined && !VALID_KINDS.has(l.kind)) {
      console.warn(`[open-loops] Coercing invalid kind "${l.kind}" to null on loop ${l.id}`);
      l.kind = null;
    }
    if (!VALID_STATUSES.has(l.status)) {
      console.warn(`[open-loops] Coercing invalid status "${l.status}" to "active" on loop ${l.id}`);
      l.status = 'active';
    }
    if (typeof l.rawText === 'string' && l.rawText.length > MAX_LOOP_TEXT_LEN) {
      l.rawText = l.rawText.slice(0, MAX_LOOP_TEXT_LEN);
    }
    if (l.status === 'active') data.lastLoopId = l.id;
    return l;
  }

  function removeLoop(id) {
    data.loops = data.loops.filter(l => l.id !== id);
    if (data.lastLoopId === id) data.lastLoopId = suggested()?.id || null;
  }

  // Move dragId to the slot occupied by targetId (among active loops, in
  // display order = position desc). Computes a new `position` for dragId as
  // the midpoint between its new neighbours so no other row needs to change.
  //
  // Returns { ok: true, newPosition } on success so the caller can sync a
  // single-row UPDATE for the moved loop. Returns { ok: false } if the move
  // is a no-op (same spot, missing ids, etc).
  //
  // Float-space rebalancing note: double precision gives us ~15-17 decimal
  // digits. If a user drags the *same* pair of neighbours repeatedly (which
  // halves the gap each time), we lose precision after ~50 drops. Detected
  // via an MIN_GAP threshold — below that we trigger a per-user rebalance
  // that spreads all active positions out evenly. Cheap, local, rare.
  const POSITION_MIN_GAP = 1e-9;

  // Loops entering Active (defined, reopened, or brought back from Parked)
  // land in "Up next", right under the Now card. Only the person promotes a
  // loop to Now, by reordering; nothing new takes the focus slot on its own.
  function upNextPosition(loopId) {
    const others = data.loops
      .filter(l => l.status === 'active' && l.id !== loopId)
      .sort((a, b) => (b.position || 0) - (a.position || 0));
    if (!others.length) return { position: topPosition(), rebalance: false };
    if (others.length === 1) return { position: (others[0].position || 0) - 1, rebalance: false };
    const a = others[0].position || 0, b = others[1].position || 0;
    return { position: (a + b) / 2, rebalance: (a - b) < 1e-4 };
  }

  function rebalanceActivePositions() {
    // Reassign positions on active loops in their current display order,
    // spaced by 1.0. Returns a list of { id, position } for sync.
    const active = data.loops
      .filter(l => l.status === 'active')
      .sort((a, b) => (b.position || 0) - (a.position || 0));
    const base = nowPosition();
    const changes = [];
    active.forEach((l, i) => {
      // Largest position at the top of the list → descending by index.
      const p = base + (active.length - i);
      if (l.position !== p) {
        l.position = p;
        l.updatedAt = nowIso();
        changes.push({ id: l.id, position: p });
      }
    });
    return changes;
  }

  function moveActiveLoop(dragId, targetId) {
    if (!dragId || !targetId || dragId === targetId) return { ok: false };
    // Build the active list in display order (highest position first).
    const active = data.loops
      .filter(l => l.status === 'active')
      .sort((a, b) => (b.position || 0) - (a.position || 0));
    const fromIdx = active.findIndex(l => l.id === dragId);
    const toIdx   = active.findIndex(l => l.id === targetId);
    if (fromIdx < 0 || toIdx < 0) return { ok: false };

    // Simulate the move to figure out dragId's new neighbours.
    const reordered = active.slice();
    const [moved] = reordered.splice(fromIdx, 1);
    reordered.splice(toIdx, 0, moved);
    const newIdx = reordered.indexOf(moved);

    // Compute new position from neighbours (positions sort descending, so
    // "above" = higher position, "below" = lower position).
    const above = newIdx > 0 ? reordered[newIdx - 1].position : null;
    const below = newIdx < reordered.length - 1 ? reordered[newIdx + 1].position : null;

    let newPosition;
    if (above != null && below != null) {
      newPosition = (above + below) / 2;
    } else if (above != null) {
      // Dragged to the bottom (no neighbour below).
      newPosition = above - 1;
    } else if (below != null) {
      // Dragged to the top (no neighbour above).
      newPosition = below + 1;
    } else {
      newPosition = nowPosition();
    }

    // Detect float-precision exhaustion and rebalance if needed.
    const gapAbove = above != null ? Math.abs(above - newPosition) : Infinity;
    const gapBelow = below != null ? Math.abs(newPosition - below) : Infinity;
    if (gapAbove < POSITION_MIN_GAP || gapBelow < POSITION_MIN_GAP) {
      moved.position = newPosition; // apply the move first
      moved.updatedAt = nowIso();
      const changes = rebalanceActivePositions();
      data.lastLoopId = dragId;
      return { ok: true, rebalance: true, changes };
    }

    moved.position = newPosition;
    moved.updatedAt = nowIso();
    data.lastLoopId = dragId;
    return { ok: true, rebalance: false, changes: [{ id: dragId, position: newPosition }] };
  }

  function moveActiveLoopByOffset(loopId, offset) {
    if (!loopId || !offset) return { ok: false };
    const active = data.loops
      .filter(l => l.status === 'active')
      .sort((a, b) => (b.position || 0) - (a.position || 0));
    const idx = active.findIndex(l => l.id === loopId);
    const target = idx >= 0 ? active[idx + offset] : null;
    if (!target) return { ok: false };
    return moveActiveLoop(loopId, target.id);
  }

  function syncPositionChanges(result) {
    if (!result || !result.ok || !Array.isArray(result.changes)) return;
    for (const change of result.changes) {
      Sync.updateLoop(change.id, { position: change.position });
    }
  }

  // ── TOAST ──
  function toast(msg, opts) {
    const el = document.getElementById('toast');
    if (!el) return;
    el.textContent = '';
    el.classList.remove('has-action');
    const span = document.createElement('span');
    span.textContent = msg;
    el.appendChild(span);
    const dur = (opts && opts.duration) || DEFAULT_TOAST_MS;
    if (opts && opts.action && typeof opts.onAction === 'function') {
      el.classList.add('has-action');
      const btn = document.createElement('button');
      btn.className = 'toast-action';
      btn.type = 'button';
      btn.textContent = opts.action;
      btn.addEventListener('click', () => {
        clearTimeout(toastTimer);
        el.classList.remove('visible');
        el.classList.remove('has-action');
        try { opts.onAction(); } catch(e) {}
      });
      el.appendChild(btn);
    }
    el.classList.add('visible');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      el.classList.remove('visible');
      el.classList.remove('has-action');
    }, dur);
  }

  // Screen-reader-only announcement for changes the motion already shows.
  function announce(msg) {
    let el = document.getElementById('sr-announce');
    if (!el) {
      el = document.createElement('div');
      el.id = 'sr-announce';
      el.className = 'sr-only';
      el.setAttribute('role', 'status');
      el.setAttribute('aria-live', 'polite');
      document.body.appendChild(el);
    }
    el.textContent = '';
    setTimeout(() => { el.textContent = msg; }, 30);
  }

  // ── ESCAPE HTML ──
  // Escape all five XML special chars (incl. both quote types) for safe
  // interpolation into attributes or text. Defensive: current callers use
  // double-quoted attrs, but escaping ' too lets us relax that if we ever
  // switch to single-quoted attributes.
  function esc(s) {
    return String(s||'')
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#39;');
  }

  // ── KIND CHIP HTML ──
  function formatLoopDate(value) {
    if (!value) return '';
    const d = new Date(value);
    if (Number.isNaN(d.getTime())) return '';
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function loopMetaHtml(loop) {
    const captured = formatLoopDate(loop.createdAt);
    const closed = loop.status === 'released' ? formatLoopDate(loop.completedAt) : '';
    const parts = [];
    if (captured) parts.push(`<span>Captured ${esc(captured)}</span>`);
    if (closed) parts.push(`<span>Closed ${esc(closed)}</span>`);
    return parts.length ? `<div class="loop-meta">${parts.join('')}</div>` : '';
  }

  // ── CLAY ART ──
  // Soft 3D "plasticine" shapes drawn with an SVG lighting filter — no image
  // assets. variant 'open' = an open loop (C-ring); 'closed' = a complete ring.
  let clayArtSeq = 0;
  function clayArtHtml(variant) {
    const id = `clay-f-${++clayArtSeq}`;
    const ring = variant === 'closed'
      ? `<circle cx="150" cy="112" r="58" fill="none" stroke="#a4d4c5" stroke-width="32"/>`
      : `<path d="M 196 72 A 58 58 0 1 0 200 150" fill="none" stroke="#ffb084" stroke-width="32" stroke-linecap="round"/>`;
    const bits = variant === 'closed'
      ? `<circle cx="236" cy="170" r="15" fill="#e8b94a"/><rect x="42" y="150" width="40" height="20" rx="10" fill="#b8a4ed" transform="rotate(-20 62 160)"/><circle cx="238" cy="58" r="10" fill="#ff4d8b"/>`
      : `<circle cx="238" cy="170" r="15" fill="#e8b94a"/><rect x="40" y="150" width="40" height="20" rx="10" fill="#b8a4ed" transform="rotate(-20 60 160)"/><circle cx="236" cy="104" r="10" fill="#ff4d8b"/>`;
    return `<svg class="clay-art" viewBox="0 0 300 220" aria-hidden="true">
      <defs>
        <filter id="${id}" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="b"/>
          <feDiffuseLighting in="b" surfaceScale="5" diffuseConstant="1.05" lighting-color="#fff" result="d"><feDistantLight azimuth="235" elevation="48"/></feDiffuseLighting>
          <feComposite in="SourceGraphic" in2="d" operator="arithmetic" k1="1.05" result="lit"/>
          <feSpecularLighting in="b" surfaceScale="5" specularConstant="0.55" specularExponent="16" lighting-color="#fff" result="s"><feDistantLight azimuth="235" elevation="55"/></feSpecularLighting>
          <feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/>
          <feComposite in="lit" in2="s2" operator="arithmetic" k2="1" k3="0.6" result="o"/>
          <feComposite in="o" in2="SourceAlpha" operator="in"/>
        </filter>
        <filter id="${id}-sh" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
      </defs>
      <ellipse cx="150" cy="196" rx="96" ry="10" fill="#3a2a10" opacity=".13" filter="url(#${id}-sh)"/>
      <g filter="url(#${id})">${ring}${bits}</g>
    </svg>`;
  }

  function chipHtml(kind) {
    const m = kindMeta[kind] || kindMeta.inbox;
    const cls = kind || 'inbox';
    return `<span class="kind-chip ${cls}"><span class="kind-dot"></span>${m.label}</span>`;
  }

  // ── LOOP CARD ──
  function dragHandleHtml(enabled) {
    if (!enabled) return '';
    return `<span class="drag-handle" title="Drag to reorder" aria-hidden="true">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5 3.2h.1M9 3.2h.1M5 7h.1M9 7h.1M5 10.8h.1M9 10.8h.1" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </span>`;
  }

  // â”€â”€ LOOP CARD â”€â”€
  function cardHtml(loop, idx, opts = {}) {
    const m = kindMeta[loop.kind] || kindMeta.inbox;
    const hl = view.highlightedId === loop.id ? ' highlighted' : '';
    const delay = `animation-delay:${idx*0.04}s`;
    // Suppress drag while this card is in inline-edit mode. Otherwise a
    // mid-edit drag triggers re-render before save and the user's typed
    // (but not yet saved) text is silently discarded.
    const isEditing = view.inlineEditId === loop.id;
    const dragEnabled = opts.draggable && !isEditing;
    const draggable = dragEnabled ? ' draggable="true" data-draggable-loop="1"' : '';
    const handle = dragHandleHtml(dragEnabled);
    const canMoveUp = dragEnabled && idx > 0;
    const canMoveDown = dragEnabled && idx < (opts.total || 0) - 1;
    const reorderControls = dragEnabled ? `
      <span class="reorder-controls" aria-label="Reorder loop">
        <button class="reorder-btn" type="button" data-action="move-loop-up" data-loop-id="${esc(loop.id)}" title="Move up" aria-label="Move loop up" ${canMoveUp ? '' : 'disabled'}>
          <svg viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M7 3.2 3.8 6.4M7 3.2l3.2 3.2M7 3.2v7.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="reorder-btn" type="button" data-action="move-loop-down" data-loop-id="${esc(loop.id)}" title="Move down" aria-label="Move loop down" ${canMoveDown ? '' : 'disabled'}>
          <svg viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M7 10.8 3.8 7.6M7 10.8l3.2-3.2M7 10.8V3.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </span>` : '';

    if (isEditing) {
      const editLen = (loop.rawText || '').length;
      const editCounterClass = editLen >= MAX_LOOP_TEXT_LEN
        ? ' at-limit'
        : editLen >= MAX_LOOP_TEXT_LEN - 50 ? ' near-limit' : '';
      return `
        <article class="loop-card kind-${loop.kind || 'inbox'}${hl}" style="${delay}" data-loop-id="${esc(loop.id)}"${draggable}>
          <div class="loop-card-top">
            <div class="loop-card-top-left">${handle}${chipHtml(loop.kind)}</div>
            <div class="loop-card-tools">
              <button class="card-overflow" data-action="open-menu" data-loop-id="${esc(loop.id)}" title="More" aria-label="More options">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><circle cx="3" cy="7" r="1.2" fill="currentColor"/><circle cx="7" cy="7" r="1.2" fill="currentColor"/><circle cx="11" cy="7" r="1.2" fill="currentColor"/></svg>
              </button>
            </div>
          </div>
          <textarea class="inline-edit-input" id="inline-edit-${esc(loop.id)}" rows="2" maxlength="${MAX_LOOP_TEXT_LEN}">${esc(loop.rawText)}</textarea>
          <div class="inline-edit-meta">
            <span class="char-counter${editCounterClass}" id="inline-edit-counter-${esc(loop.id)}" aria-live="polite">${editLen}/${MAX_LOOP_TEXT_LEN}</span>
          </div>
          <div class="loop-card-bottom">
            <button class="btn-action btn btn-sm" data-action="inline-edit-save" data-loop-id="${esc(loop.id)}">Save</button>
            <button class="btn-ghost btn btn-sm" data-action="inline-edit-cancel">Cancel</button>
          </div>
        </article>`;
    }

    const focus = opts.focus ? ' is-focus' : '';
    return `
      <article class="loop-card kind-${loop.kind || 'inbox'}${hl}${focus}" style="${delay}" data-loop-id="${esc(loop.id)}"${draggable}>
        ${opts.focus ? `<div class="focus-eyebrow">Now</div>` : ''}
        <div class="loop-card-top">
          <div class="loop-card-top-left">${handle}${chipHtml(loop.kind)}</div>
          <div class="loop-card-tools">
            ${reorderControls}
            <button class="card-overflow" data-action="open-menu" data-loop-id="${esc(loop.id)}" title="More" aria-label="More options">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><circle cx="3" cy="7" r="1.2" fill="currentColor"/><circle cx="7" cy="7" r="1.2" fill="currentColor"/><circle cx="11" cy="7" r="1.2" fill="currentColor"/></svg>
            </button>
          </div>
        </div>
        <p class="loop-title" data-action="inline-edit-start" data-loop-id="${esc(loop.id)}" title="Click to edit" style="cursor:text">${esc(loop.rawText)}</p>
        <div class="loop-next">
          <span class="loop-next-label">Next</span>
          <span>${esc(loop.promptAnswer || 'No next step set.')}</span>
        </div>
        ${loopMetaHtml(loop)}
        <div class="loop-card-bottom">
          <button class="btn-action kind-${loop.kind || 'inbox'}" data-action="primary-action" data-loop-id="${esc(loop.id)}">${m.action}</button>
        </div>
      </article>`;
  }

  // ── HOME RENDER ──
  function renderHome() {
    const active = byStatus('active');
    const cap = view.loopCap || DEFAULT_LOOP_CAP;
    const visible = view.expanded ? active : active.slice(0, cap);
    const waiting = byStatus('waiting');
    const released = byStatus('released');
    const inbox = byStatus('inbox');
    const hidden = Math.max(0, active.length - visible.length);

    let html = '';

    const HEAD = {
      now:   { title: TAB_LABEL.active,   sub: 'Only a few things, on purpose.' },
      later: { title: TAB_LABEL.waiting,  sub: 'Set aside for later.' },
      inbox: { title: TAB_LABEL.inbox,    sub: 'New thoughts, not sorted yet.' },
      done:  { title: TAB_LABEL.released, sub: 'Done or let go.' }
    };
    const tabKey = view.activeTab === 'waiting' ? 'later' : view.activeTab === 'released' ? 'done' : view.activeTab;
    const head = HEAD[tabKey] || HEAD.now;
    let meter = '';
    if (tabKey === 'now') {
      const used = Math.min(active.length, cap);
      const dots = Array.from({ length: cap }, (_, i) => `<span class="cap-meter-dot${i < used ? ' on' : ''}"></span>`).join('');
      const over = active.length > cap ? ` · +${active.length - cap} waiting` : '';
      meter = `<div class="cap-meter" title="Focus cap"><div class="cap-meter-dots">${dots}</div><div class="cap-meter-label">${used} of ${cap} focus slots${over}</div></div>`;
    }
    if (tabKey === 'done') {
      const week = closedThisWeek();
      if (week.length) {
        const shown = week.slice(-21);
        meter = `<div class="cap-meter closed-shelf"><div class="ring-shelf" role="img" aria-label="${week.length} loops closed this week">${shown.map(l => clayRingHtml(l.kind)).join('')}</div><div class="cap-meter-label">${week.length} closed this week</div></div>`;
      }
    }
    html += `
      <header class="page-head">
        <div>
          <h1 class="page-title">${head.title}</h1>
          <p class="page-sub">${head.sub}</p>
        </div>
        ${meter}
      </header>`;

    html += `
      <div class="tabs">
        <button class="tab ${view.activeTab === 'now' ? 'active' : ''}" data-action="set-tab" data-tab="now">
          ${TAB_LABEL.active} <span class="tab-count">${active.length}</span>
        </button>
        <button class="tab ${view.activeTab === 'later' ? 'active' : ''}" data-action="set-tab" data-tab="later">
          ${TAB_LABEL.waiting} <span class="tab-count">${waiting.length}</span>
        </button>
        <button class="tab ${view.activeTab === 'inbox' ? 'active' : ''}" data-action="set-tab" data-tab="inbox">
          ${TAB_LABEL.inbox} <span class="tab-count">${inbox.length}</span>
        </button>
      </div>`;

    if (view.activeTab === 'now') {
      html += `<div class="tab-panel active" id="tab-now">`;
      if (visible.length) {
        html += `<div class="loop-stack" data-active-stack="1">${visible.map((l,i) => (i === 1 ? `<div class="up-next-label">Up next</div>` : '') + cardHtml(l,i, { draggable: true, total: visible.length, focus: i === 0 })).join('')}</div>`;
        if (hidden > 0 && !view.expanded) {
          html += `<button class="show-more" data-action="show-more">Show ${hidden} more loop${hidden > 1 ? 's' : ''}</button>`;
        }
      } else {
        html += `<div class="empty-state">${clayArtHtml('closed')}<strong>Your head is clear.</strong>Capture a loop, then define it when you're ready.</div>`;
      }
      html += `</div>`;
    }

    if (view.activeTab === 'later' || view.activeTab === 'waiting') {
      html += `<div class="tab-panel active" id="tab-later">`;
      if (waiting.length) {
        html += `<div class="loop-stack">`;
        waiting.forEach((loop, i) => {
          html += `
            <article class="loop-card kind-${loop.kind || 'inbox'}" data-loop-id="${esc(loop.id)}" style="animation-delay:${i*0.04}s">
              <div class="loop-card-top">${chipHtml(loop.kind)}<button class="card-overflow" data-action="open-menu" data-loop-id="${esc(loop.id)}" title="More" aria-label="More options"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><circle cx="3" cy="7" r="1.2" fill="currentColor"/><circle cx="7" cy="7" r="1.2" fill="currentColor"/><circle cx="11" cy="7" r="1.2" fill="currentColor"/></svg></button></div>
              <p class="loop-title">${esc(loop.rawText)}</p>
              <div class="loop-next"><span class="loop-next-label">Note</span><span>${esc(loop.promptAnswer || '-')}</span></div>
              ${loopMetaHtml(loop)}
              <div class="loop-card-bottom">
                <button class="btn-action" data-action="restore-active" data-loop-id="${esc(loop.id)}">Make active</button>
              </div>
            </article>`;
        });
        html += `</div>`;
      } else {
        html += `<div class="empty-state">${clayArtHtml('open')}<strong>Nothing parked.</strong>Park loops here when the next move isn't yours yet.</div>`;
      }
      html += `</div>`;
    }

    if (view.activeTab === 'done' || view.activeTab === 'released') {
      html += `<div class="tab-panel active" id="tab-done">`;
      if (released.length) {
        html += `<div class="loop-stack">`;
        released.forEach((loop, i) => {
          html += `
            <article class="loop-card kind-${loop.kind || 'inbox'}" data-loop-id="${esc(loop.id)}" style="animation-delay:${i*0.04}s;opacity:0.72">
              <div class="loop-card-top">${chipHtml(loop.kind)}<button class="card-overflow" data-action="open-menu" data-loop-id="${esc(loop.id)}" title="More" aria-label="More options"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><circle cx="3" cy="7" r="1.2" fill="currentColor"/><circle cx="7" cy="7" r="1.2" fill="currentColor"/><circle cx="11" cy="7" r="1.2" fill="currentColor"/></svg></button></div>
              <p class="loop-title" style="text-decoration:line-through;color:var(--text-2)">${esc(loop.rawText)}</p>
              <div class="loop-next"><span class="loop-next-label">Note</span><span>${esc(loop.promptAnswer || '-')}</span></div>
              ${loopMetaHtml(loop)}
              <div class="loop-card-bottom">
                <button class="btn-action" data-action="restore-active" data-loop-id="${esc(loop.id)}">Reopen</button>
              </div>
            </article>`;
        });
        html += `</div>`;
      } else {
        html += `<div class="empty-state">${clayArtHtml('closed')}<strong>Nothing closed yet.</strong>When a loop is done, close it here.</div>`;
      }
      html += `</div>`;
    }

    if (view.activeTab === 'inbox') {
      html += `<div class="tab-panel active" id="tab-inbox">`;
      if (inbox.length) {
        html += `<div class="loop-stack">`;
        inbox.forEach((loop, i) => {
          html += `
            <article class="loop-card kind-${loop.kind || 'inbox'}" data-loop-id="${esc(loop.id)}" style="animation-delay:${i*0.04}s">
              <div class="loop-card-top">${chipHtml(loop.kind || 'inbox')}<button class="card-overflow" data-action="open-menu" data-loop-id="${esc(loop.id)}" title="More" aria-label="More options"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><circle cx="3" cy="7" r="1.2" fill="currentColor"/><circle cx="7" cy="7" r="1.2" fill="currentColor"/><circle cx="11" cy="7" r="1.2" fill="currentColor"/></svg></button></div>
              <p class="loop-title">${esc(loop.rawText)}</p>
              ${loopMetaHtml(loop)}
              <div class="loop-card-bottom">
                <button class="btn-action btn-primary" data-action="define-raw" data-loop-id="${esc(loop.id)}">Define and route</button>
              </div>
            </article>`;
        });
        html += `</div>`;
      } else {
        html += `<div class="empty-state">${clayArtHtml('open')}<strong>Inbox zero.</strong>Captured loops land here before you define where they belong.</div>`;
      }
      html += `</div>`;
    }

    html += `
      <button class="fab" data-action="open-capture" type="button">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><line x1="7" y1="2" x2="7" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="2" y1="7" x2="12" y2="7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Capture
      </button>`;

    return html;
  }
  // ── CAPTURE ──
  // Capture is only about getting it out of your head. Kind is optional.
  // Enter adds and keeps the sheet open for the next one (brain-dump mode).
  function renderCapture(ov) {
    if (!ov) return '';
    const closeBtn = `<button class="overlay-close" data-action="close-overlay" title="Close" aria-label="Close"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><line x1="4" y1="4" x2="12" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="12" y1="4" x2="4" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>`;
    const len = (ov.rawText || '').length;
    const added = ov.added || 0;
    const chips = ['do','decide','ask','schedule','let_go'].map(k => `
      <button type="button" class="kind-pick ${k}${ov.kind === k ? ' on' : ''}" data-action="pick-raw-kind" data-kind="${k}" aria-pressed="${ov.kind === k}"><span class="kind-dot"></span>${kindMeta[k].label}</button>`).join('');
    const hasText = !!(ov.rawText || '').trim();
    return `
      <div class="overlay-card capture-card" role="dialog" aria-modal="true" aria-labelledby="capture-title">
        <div class="overlay-header">
          <div class="overlay-meta"><div class="overlay-eyebrow">New loop</div></div>
          ${closeBtn}
        </div>
        <h2 class="overlay-title" id="capture-title">Get it out of your head.</h2>
        <p class="overlay-subtitle">It lands in Inbox. Sort it later.</p>
        <textarea class="big-input capture-input" id="capture-input" rows="2" placeholder="One unfinished thing…" maxlength="${MAX_LOOP_TEXT_LEN}" aria-describedby="capture-hint" enterkeyhint="next">${esc(ov.rawText)}</textarea>
        <div class="input-hint-row">
          <p class="input-hint" id="capture-hint">${added ? `<b class="capture-added">${added} added.</b> ` : ''}Press Enter to add it and write the next one.</p>
          <span class="char-counter" id="capture-counter" aria-live="polite">${len}/${MAX_LOOP_TEXT_LEN}</span>
        </div>
        <div class="capture-kinds">
          <div class="capture-kinds-label">Already know the kind? <span>Optional</span></div>
          <div class="kind-picks" role="group" aria-label="Kind (optional)">${chips}</div>
        </div>
        <div class="overlay-actions">
          <button class="btn btn-ghost" data-action="close-overlay">${added ? 'Done' : 'Cancel'}</button>
          <button class="btn btn-primary" data-action="save-raw-loop" ${hasText ? '' : 'disabled'}>Add to Inbox</button>
        </div>
      </div>`;
  }

  // ── DEFINE AND ROUTE ──
  // Three short steps, one question each:
  //   1. What kind of attention?  (tap = next)
  //   2. The kind's own next-step question  (the part that quiets the loop)
  //   3. Where does it go?  (tap = done)
  const DEFINE_Q = {
    do:       { q: "What's the very next step you can see?", ph: 'e.g. Open the doc and write the first line' },
    decide:   { q: 'What exactly are you deciding?',          ph: 'e.g. Air 15 or X1, decide by Friday' },
    ask:      { q: 'Who do you need, and for what?',          ph: 'e.g. Bilal: can he start before the 15th?' },
    schedule: { q: 'When will it happen?',                    ph: 'e.g. Saturday 10am, book it on Thursday' },
    let_go:   { q: 'What are you letting go of?',             ph: 'Optional' }
  };
  const KIND_HINT = {
    do: 'A concrete action you can start now',
    decide: "A choice you're holding open",
    ask: 'Something you need from someone',
    schedule: 'Needs a real time on the calendar',
    let_go: 'Choose to release it'
  };

  function renderDefineRaw(loop) {
    if (!loop) return '';
    const ov = view.overlay || {};
    const step = ov.step || 1;
    const kind = ov.kind || null;
    const rawText = ov.rawText ?? loop.rawText;
    const close = `<button class="overlay-close" data-action="close-overlay" title="Close" aria-label="Close"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><line x1="4" y1="4" x2="12" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="12" y1="4" x2="4" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>`;
    const back = step > 1
      ? `<button class="overlay-close define-back" data-action="define-back" title="Back" aria-label="Back"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3.5 5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`
      : '';
    const bars = [1, 2, 3].map(i => `<span class="${i <= step ? 'on' : ''}"></span>`).join('');
    const kindChip = kind
      ? `<button type="button" class="kind-chip ${kind} define-kind-chip" data-action="define-change-kind" title="Change kind"><span class="kind-dot"></span>${kindMeta[kind].label}<span class="define-chip-edit">Change</span></button>`
      : '';

    let body = '';
    if (step === 1) {
      const tiles = ['do','decide','ask','schedule','let_go'].map(k => `
        <button type="button" class="kind-tile ${k}${kind === k ? ' on' : ''}" data-action="define-pick-kind" data-kind="${k}" aria-pressed="${kind === k}">
          <span class="kind-tile-dot"></span>
          <span class="kind-tile-label">${kindMeta[k].label}</span>
          <span class="kind-tile-hint">${KIND_HINT[k]}</span>
        </button>`).join('');
      body = `
        <h3 class="step-q" id="define-step-q">What kind of attention does this need?</h3>
        <div class="kind-tiles" role="group" aria-labelledby="define-step-q">${tiles}</div>`;
    } else if (step === 2) {
      const q = DEFINE_Q[kind] || DEFINE_Q.do;
      const ans = ov.promptAnswer || '';
      body = `
        <div class="step-kind">${kindChip}</div>
        <h3 class="step-q"><label for="define-detail-input">${q.q}</label></h3>
        <textarea class="big-input" id="define-detail-input" rows="2" placeholder="${esc(q.ph)}" maxlength="${MAX_LOOP_TEXT_LEN}" enterkeyhint="next" aria-describedby="define-detail-hint">${esc(ans)}</textarea>
        <div class="input-hint-row">
          <p class="input-hint" id="define-detail-hint">One sentence is enough. This is the part that quiets the loop.</p>
          <span class="char-counter" id="define-detail-counter" aria-live="polite">${ans.length}/${MAX_LOOP_TEXT_LEN}</span>
        </div>
        <div class="overlay-actions">
          <button class="btn btn-ghost" data-action="define-next" data-skip="1">Skip</button>
          <button class="btn btn-primary" data-action="define-next">Next</button>
        </div>`;
    } else {
      const active = data.loops.filter(l => l.status === 'active' && l.id !== loop.id).length;
      const cap = view.loopCap || DEFAULT_LOOP_CAP;
      const full = active >= cap;
      const wasActive = loop.status === 'active';
      const suggest = kind === 'let_go' ? 'released' : (full && !wasActive ? 'waiting' : 'active');
      const routes = [
        { key: 'active',   title: wasActive ? 'Keep in Active' : 'Up next', hint: wasActive ? 'Stays where it is in Active.' : 'Into Active, right under your Now card.' },
        { key: 'waiting',  title: 'Park',  hint: 'Not now. It waits in Parked.' },
        { key: 'released', title: 'Close', hint: kind === 'let_go' ? 'Let it go. It lands on your shelf.' : 'Already done. It lands on your shelf.' }
      ].map(r => `
        <button type="button" class="route-big ${r.key}${suggest === r.key ? ' suggested' : ''}" data-action="finish-define-raw" data-status="${r.key}" data-loop-id="${esc(loop.id)}">
          <span class="route-big-title">${r.title}${suggest === r.key ? '<span class="route-suggest">Suggested</span>' : ''}</span>
          <span class="route-big-hint">${r.hint}</span>
        </button>`).join('');
      body = `
        <div class="step-kind">${kindChip}</div>
        <h3 class="step-q" id="define-route-q">Where does it go?</h3>
        ${full && !wasActive && kind !== 'let_go' ? `<p class="step-note">Active is full (${active} of ${cap}). Parking keeps your focus clear.</p>` : ''}
        <div class="route-bigs" role="group" aria-labelledby="define-route-q">${routes}</div>`;
    }

    return `
      <div class="overlay-card define-card" role="dialog" aria-modal="true" aria-labelledby="define-title-label">
        <div class="define-top">
          ${back}
          <div class="define-progress" aria-hidden="true">${bars}</div>
          <span class="define-stepcount" id="define-title-label">Define · ${step} of 3</span>
          ${close}
        </div>
        <textarea class="define-title-input" id="define-raw-input" rows="1" maxlength="${MAX_LOOP_TEXT_LEN}" aria-label="Loop text" enterkeyhint="done">${esc(rawText)}</textarea>
        <div class="define-body" data-step="${step}">${body}</div>
      </div>`;
  }

  // Grow a textarea to fit its text (no inner scrollbar for short loops).
  function autoGrow(el) {
    if (!el) return;
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  }

  // Move the define sheet to another step: the body slides sideways and the
  // sheet eases to its new height instead of jumping.
  function goDefineStep(step, dir) {
    const ov = view.overlay;
    if (!ov || ov.type !== 'define-raw') return;
    const card = document.querySelector('#overlay-root .define-card');
    const h0 = card ? card.getBoundingClientRect().height : 0;
    ov.step = step;
    renderOverlay();
    const card2 = document.querySelector('#overlay-root .define-card');
    const body = card2 && card2.querySelector('.define-body');
    autoGrow(document.getElementById('define-raw-input'));
    const calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (card2 && h0 && !calm) {
      const h1 = card2.getBoundingClientRect().height;
      if (Math.abs(h1 - h0) > 2) card2.animate([{ height: h0 + 'px' }, { height: h1 + 'px' }], { duration: 260, easing: 'cubic-bezier(.2,.8,.2,1)' });
    }
    if (body && !calm) {
      body.animate([
        { transform: `translateX(${dir > 0 ? 28 : -28}px)`, opacity: 0 },
        { transform: 'none', opacity: 1 }
      ], { duration: 260, easing: 'cubic-bezier(.2,.8,.2,1)' });
    }
    if (step === 2) setTimeout(() => {
      const d = document.getElementById('define-detail-input');
      if (d) { d.focus(); d.selectionStart = d.selectionEnd = d.value.length; autoGrow(d); }
    }, 120);
    else {
      const first = card2 && (card2.querySelector('.kind-tile.on') || card2.querySelector('.kind-tile') || card2.querySelector('.route-big.suggested'));
      if (first) setTimeout(() => first.focus({ preventScroll: true }), 60);
    }
  }

  function renderMenu(loop) {
    if (!loop) return '';
    const m = kindMeta[loop.kind] || kindMeta.inbox;
    const waiting = loop.status === 'waiting';
    const active = loop.status === 'active';
    const released = loop.status === 'released';
    const inbox = loop.status === 'inbox';
    return `
      <div class="overlay-card" role="dialog" aria-modal="true" aria-label="Loop options">
        <div class="overlay-header">
          <div class="overlay-meta">
            <div class="overlay-eyebrow">Loop</div>
            ${chipHtml(loop.kind)}
          </div>
          <button class="overlay-close" data-action="close-overlay" title="Close"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><line x1="4" y1="4" x2="12" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="12" y1="4" x2="4" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
        </div>
        <p style="font-size:15px;font-weight:400;margin:0 0 20px;line-height:1.5;color:var(--text)">${esc(loop.rawText)}</p>
        <div class="menu-list">
          <button class="menu-item" data-action="inline-edit-open" data-loop-id="${esc(loop.id)}">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 10l1.5-1.5 7-7 1.5 1.5-7 7L2 10z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
            Edit text
          </button>
          ${inbox ? `<button class="menu-item menu-item-primary" data-action="define-raw" data-loop-id="${esc(loop.id)}">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 7h8M7 3v8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
            Define and route
          </button>` : ''}
          ${!inbox ? `<button class="menu-item" data-action="reclarify-kind" data-loop-id="${esc(loop.id)}">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 2a5 5 0 0 1 5 5M7 12a5 5 0 0 1-5-5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><path d="M12 4V7H9" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 10V7h3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Change kind
          </button>` : ''}
          ${active ? `<button class="menu-item" data-action="move-waiting" data-loop-id="${esc(loop.id)}">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.2"/><path d="M7 4v3l2 2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
            Move to Waiting
          </button>` : ''}
          ${waiting || released ? `<button class="menu-item" data-action="restore-active" data-loop-id="${esc(loop.id)}">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 7h8M8 4l3 3-3 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            ${released ? 'Reopen' : 'Make active'}
          </button>` : ''}
          ${active ? `<button class="menu-item" data-action="move-released" data-loop-id="${esc(loop.id)}">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 7h10M7 3l-4 4 4 4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Release
          </button>` : ''}
          <button class="menu-item danger" data-action="delete-loop" data-loop-id="${esc(loop.id)}">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 4h8M5 4V3h4v1M5.5 6.5v4M8.5 6.5v4M4 4l.5 7h5L10 4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Delete
          </button>
        </div>
        <div class="overlay-actions">
          <button class="btn btn-ghost" data-action="close-overlay">Close</button>
        </div>
      </div>`;
  }

  function renderChangekind(loop) {
    if (!loop) return '';
    const kinds = ['do','decide','ask','schedule','let_go'];
    const opts = kinds.map(k => {
      const m = kindMeta[k];
      const sel = loop.kind === k ? ` selected ${k}` : '';
      return `<button class="kind-option${sel}" data-action="set-kind-direct" data-kind="${k}" data-loop-id="${esc(loop.id)}" type="button">
        <div class="kind-option-dot"></div>
        <div><span class="kind-option-label">${m.label}</span><span class="kind-option-desc">${esc(m.helper)}</span></div>
      </button>`;
    }).join('');
    return `
      <div class="overlay-card" role="dialog" aria-modal="true" aria-label="Change kind">
        <div class="overlay-header">
          <div class="overlay-meta"><div class="overlay-eyebrow">Change kind</div></div>
          <button class="overlay-close" data-action="close-overlay" title="Close"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><line x1="4" y1="4" x2="12" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="12" y1="4" x2="4" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
        </div>
        <div class="kind-grid">${opts}</div>
        <div class="overlay-actions"><button class="btn btn-ghost" data-action="close-overlay">Cancel</button></div>
      </div>`;
  }

  function renderSync() {
    const loggedIn = Sync.isLoggedIn();
    const hasError = view.syncStatus === 'error';
    const isSyncing = view.syncStatus === 'syncing';
    const clientIssue = supabaseClientIssue();
    return `
      <div class="overlay-card" role="dialog" aria-modal="true" aria-labelledby="sync-title">
        <div class="overlay-header">
          <div class="overlay-meta"><div class="overlay-eyebrow">Sync</div><div class="overlay-step">Cross-device</div></div>
          <button class="overlay-close" data-action="close-overlay" title="Close" aria-label="Close"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><line x1="4" y1="4" x2="12" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="12" y1="4" x2="4" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
        </div>
        <h2 class="overlay-title" id="sync-title">Keep loops everywhere.</h2>
        <p class="overlay-subtitle">Sign in with your email. Your loops will sync automatically across devices.</p>
        ${clientIssue ? `
          <div class="sync-info">Sign-in is required before using Open Loops. ${esc(clientIssue)} Check <code>open-loops-config.js</code> and run <code>open-loops-supabase.sql</code> in Supabase.</div>
        ` : loggedIn ? `
          ${hasError ? `
            <div class="sync-info" style="color:#f88;border-color:rgba(255,68,119,0.15);background:rgba(255,68,119,0.06)">Last sync didn't go through. Your changes are safe on this device.</div>
            <div class="overlay-actions" style="margin-top:0;margin-bottom:12px">
              <button class="btn btn-primary" data-action="sync-retry" ${isSyncing ? 'disabled' : ''}>${isSyncing ? 'Retrying…' : 'Retry sync'}</button>
            </div>
          ` : `
            <div class="sync-info" style="color:var(--do)">Connected. Your loops sync automatically across devices.</div>
          `}
          <div class="overlay-actions" style="margin-top:0">
            <button class="btn btn-ghost" data-action="sign-out">Sign out</button>
            <button class="btn btn-ghost" data-action="close-overlay">Close</button>
          </div>
        ` : `
          <div class="sync-info">Enter your email — we'll send a magic link. No password needed.</div>
          <div class="email-row">
            <input type="email" class="email-input" id="sync-email" placeholder="you@example.com" autocomplete="email">
            <button class="btn btn-primary" data-action="send-magic-link">Send link</button>
          </div>
          <div class="overlay-actions"><button class="btn btn-ghost" data-action="close-overlay">Close</button></div>
        `}
      </div>`;
  }

  // ── AUTH GATE ──
  // Settings stay behind the sign-in gate because the app is sync-first.
  // ── WHY OPEN LOOPS ──
  // Opened from the header mark ("the mast") and from Settings.
  // ── WHY STORY ──
  // Five short animated scenes: half picture, half text. Auto-advances;
  // tap the picture or use Next/Back. Scenes are plain SVG with CSS motion.
  const WHY_SCENES = [
    { h: 'Your head is full of open loops.', p: 'Every unfinished thing keeps pulling at you.' },
    { h: 'One next step quiets a loop.', p: 'Studies show a plan calms the nagging, even before it’s done.', cite: 'Masicampo & Baumeister, 2011' },
    { h: 'Catch it. Shape it. Focus.', p: 'Drop it in Inbox, give it one next step, do one at a time.' },
    { h: 'Close it. Let it go.', p: 'Every closed loop lands on your shelf, and out of your head.' },
    { h: 'Made for crowded heads.', p: 'If your mind keeps saying “I still need to…”, this is for you.' }
  ];

  // Story soundtrack: one mood per scene, same instrument and scale as the
  // app's sounds. Plays when Sounds are on. The voice is opt-in per sheet.
  const StoryAudio = (() => {
    let ctx = null, master = null, group = null;
    const N = { A2: 110, D3: 146.83, A3: 220, D4: 293.66, E4: 329.63, Fs4: 369.99, A4: 440, B4: 493.88, D5: 587.33, E5: 659.25, Fs5: 739.99, A5: 880, B5: 987.77 };
    function ensure() {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC();
        const comp = ctx.createDynamicsCompressor();
        master = ctx.createGain(); master.gain.value = 0.26;
        master.connect(comp); comp.connect(ctx.destination);
      }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    }
    function newGroup() {
      const c = ensure(); if (!c) return null;
      if (group) {
        const old = group;
        old.gain.cancelScheduledValues(c.currentTime);
        old.gain.setValueAtTime(old.gain.value, c.currentTime);
        old.gain.linearRampToValueAtTime(0, c.currentTime + 0.35);
        setTimeout(() => { try { old.disconnect(); } catch (_) {} }, 500);
      }
      group = c.createGain(); group.gain.value = 1; group.connect(master);
      return group;
    }
    function env(g, t, peak, a, d) {
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + a);
      g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
    }
    function pluck(f, at, vel = 0.6, decay = 1.2, detune = 0) {
      const c = ctx, t = c.currentTime + at, out = group;
      const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = f; o.detune.value = detune;
      const o2 = c.createOscillator(); o2.type = 'sine'; o2.frequency.value = f * 5.4;
      const g = c.createGain(), g2 = c.createGain();
      env(g, t, 0.5 * vel, 0.006, decay); env(g2, t, 0.09 * vel, 0.003, 0.09);
      o.connect(g); o2.connect(g2); g.connect(out); g2.connect(out);
      o.start(t); o2.start(t); o.stop(t + decay + 0.1); o2.stop(t + 0.15);
    }
    function pad(freqs, at, dur, vel = 0.12) {
      const c = ctx, t = c.currentTime + at, out = group;
      const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1100; f.connect(out);
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vel, t + 1.2);
      g.gain.setValueAtTime(vel, t + Math.max(1.3, dur - 1.6));
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      g.connect(f);
      freqs.forEach(fr => [-6, 6].forEach(dt => {
        const o = c.createOscillator(); o.type = 'triangle'; o.frequency.value = fr; o.detune.value = dt;
        o.connect(g); o.start(t); o.stop(t + dur + 0.1);
      }));
    }
    function thud(at, vel = 0.4) {
      const c = ctx, t = c.currentTime + at;
      const o = c.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(55, t + 0.13);
      const g = c.createGain(); env(g, t, vel, 0.005, 0.16);
      o.connect(g); g.connect(group); o.start(t); o.stop(t + 0.25);
    }

    // ── voice clips ──
    const VOICE_URL = i => `./why-voice-${i + 1}.mp3`;
    const clipCache = {}, clipPending = {};
    let clipQueue = Promise.resolve(), clipSrc = null, clipEl = null, voiceOut = null, voiceTicket = 0;
    function decode(ab) {
      return new Promise((res, rej) => {
        try { const r = ctx.decodeAudioData(ab, res, rej); if (r && r.then) r.then(res, rej); } catch (e) { rej(e); }
      });
    }
    function loadClip(i) {
      if (clipCache[i]) return Promise.resolve(clipCache[i]);
      if (clipPending[i]) return clipPending[i];
      if (!ensure()) return Promise.resolve(null);
      clipPending[i] = clipQueue = clipQueue
        .then(() => clipCache[i] || fetch(VOICE_URL(i)).then(r => { if (!r.ok) throw new Error('clip'); return r.arrayBuffer(); }).then(decode))
        .then(b => { clipCache[i] = b; return b; })
        .catch(() => null)
        .finally(() => { delete clipPending[i]; });
      return clipPending[i];
    }
    function stopClip() {
      if (clipSrc) { try { clipSrc.onended = null; clipSrc.stop(); } catch (_) {} clipSrc = null; }
      if (clipEl) { try { clipEl.onended = null; clipEl.pause(); } catch (_) {} clipEl = null; }
    }
    function elementClip(i, onEnd) {
      clipEl = new Audio(VOICE_URL(i));
      let done = false; const fin = () => { if (!done) { done = true; clipEl = null; onEnd(); } };
      clipEl.onended = fin; clipEl.onerror = fin; setTimeout(fin, 12000);
      const pr = clipEl.play(); if (pr && pr.catch) pr.catch(fin);
    }
    function sayClip(i, onEnd) {
      const my = ++voiceTicket;
      stopClip();
      if (!ensure()) { onEnd(); return; }
      let settled = false;
      // Never stall: if the clip isn't decoded in 4s, play it the plain way.
      const fallback = setTimeout(() => { if (settled || my !== voiceTicket) return; settled = true; elementClip(i, onEnd); }, 4000);
      loadClip(i).then(buf => {
        if (settled || my !== voiceTicket) return;
        settled = true; clearTimeout(fallback);
        if (!buf) { elementClip(i, onEnd); return; }
        if (ctx.state === 'suspended') ctx.resume();
        if (!voiceOut) { voiceOut = ctx.createGain(); voiceOut.gain.value = 1; voiceOut.connect(ctx.destination); }
        clipSrc = ctx.createBufferSource(); clipSrc.buffer = buf; clipSrc.connect(voiceOut);
        clipSrc.onended = () => { clipSrc = null; if (my === voiceTicket) onEnd(); };
        clipSrc.start();
      });
    }
    const scenes = [
      // 1 · tugging: scattered, overlapping, never settling
      () => {
        const pool = [N.E4, N.A4, N.B4, N.E5, N.Fs4, N.B5];
        let t = 0.05;
        while (t < 5.0) {
          pluck(pool[Math.floor(Math.random() * pool.length)], t, 0.28 + Math.random() * 0.18, 0.6, (Math.random() - 0.5) * 24);
          t += 0.14 + Math.random() * 0.22;
        }
        pad([N.A2, N.E4], 0, 5.2, 0.05);
      },
      // 2 · a next step: scatter thins, chime with the tag, one note holds
      () => {
        const pool = [N.E4, N.A4, N.B4, N.E5];
        let t = 0.05, gap = 0.18;
        while (t < 1.5) { pluck(pool[Math.floor(Math.random() * pool.length)], t, 0.26, 0.6, (Math.random() - 0.5) * 20); t += gap; gap += 0.05; }
        pluck(N.D5, 1.62, 0.5, 2.2); pluck(N.A5, 1.68, 0.3, 2.4);
        pad([N.D3, N.A3, N.Fs4], 1.6, 3.6, 0.07);
        pluck(N.A4, 3.0, 0.3, 1.8); pluck(N.A4, 4.2, 0.22, 1.6);
      },
      // 3 · capture, define, focus: drops, a rising run, a steady pulse
      () => {
        pluck(N.D4, 0.62, 0.5, 0.9); pluck(N.Fs4, 0.88, 0.5, 0.9); pluck(N.A4, 1.13, 0.5, 0.9);
        pad([N.D3, N.A3], 1.5, 3.7, 0.06);
        pluck(N.A4, 1.95, 0.45, 0.7); pluck(N.D5, 2.12, 0.45, 0.7); pluck(N.Fs5, 2.3, 0.45, 1.4);
        [3.1, 3.9, 4.7].forEach(t => pluck(N.D4, t, 0.25, 0.9));
      },
      // 4 · close: the app's own closing sound, suspended then resolved
      () => {
        pluck(N.E4, 0.5, 0.55, 1.0); pluck(N.A4, 0.57, 0.55, 1.2);
        thud(1.9, 0.38); pluck(N.D4, 1.91, 0.65, 1.8); pluck(N.Fs4, 1.94, 0.5, 1.8); pluck(N.D5, 1.97, 0.55, 2.0);
        pad([N.D3, N.Fs4, N.A4], 1.9, 3.3, 0.08);
      },
      // 5 · crowded heads: warm chord and a slow lullaby
      () => {
        pad([N.D3, N.A3, N.D4, N.Fs4], 0, 7.5, 0.1);
        [[N.Fs5, 0.6], [N.E5, 1.5], [N.D5, 2.4], [N.A4, 3.6], [N.D5, 5.0]].forEach(([f, t]) => pluck(f, t, 0.38, 2.4));
      }
    ];
    function duck(on) {
      if (!ctx) return;
      const t = ctx.currentTime;
      master.gain.cancelScheduledValues(t);
      master.gain.setValueAtTime(master.gain.value, t);
      master.gain.linearRampToValueAtTime(on ? 0.1 : 0.26, t + (on ? 0.25 : 0.8));
    }
    return {
      duck,
      ctx: () => ensure(),
      start() { return !!ensure(); },
      music(i) { if (!ensure()) return; if (!newGroup()) return; try { scenes[i](); } catch (_) {} },
      stopMusic() { if (ctx) newGroup(); },
      // Voice-over: five short recorded clips (Kokoro "Heart" voice).
      say(i, onEnd) { sayClip(i, onEnd); },
      stopVoice() { voiceTicket++; stopClip(); },
      preloadVoice() { for (let i = 0; i < 5; i++) loadClip(i); },
      stopAll() { voiceTicket++; stopClip(); if (ctx) newGroup(); duck(false); }
    };
  })();

  // Open ring ("loop") at x,y. sealed = the gap is closed.
  function wRing(x, y, kind, cls = '', sealed = false, r = 13) {
    const c = 2 * Math.PI * r;
    return `<g class="w-ring ${cls}" style="transform-origin:${x}px ${y}px"><circle cx="${x}" cy="${y}" r="${r}" fill="none" class="wk-${kind}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${sealed ? `${c} ${c}` : `${c * 0.74} ${c}`}" transform="rotate(14 ${x} ${y})" filter="url(#ol-clay-sm)"/></g>`;
  }

    if (i === 0) return `

    if (i === 1) return `
      ${mind}
      ${wRing(118, 70, 'ask', 'w-settle')}
      ${wRing(200, 64, 'decide', 'w-jit j2')}
      ${wRing(126, 132, 'do', 'w-jit j3')}
      ${wRing(204, 128, 'schedule', 'w-jit j4')}
      ${wRing(162, 100, 'let_go', 'w-jit j5')}
      <g class="w-tag"><rect x="30" y="24" width="104" height="22" rx="11" class="w-tag-bg"/><text x="82" y="39" text-anchor="middle" class="w-tag-text">Next: email Bilal</text></g>`;
    if (i === 2) return `
      <g class="w-now"><rect class="w-now-card" x="176" y="44" width="118" height="92" rx="20"/><text class="w-now-label" x="192" y="66">NOW</text><text class="w-now-step" x="192" y="122">Next: email Bilal</text></g>
      <rect class="w-tray" x="30" y="128" width="120" height="44" rx="14"/>

      ${wRing(60, 150, 'decide', 'w-drop d1', false, 11)}
      ${wRing(90, 150, 'do', 'w-drop d2', false, 11)}
      ${wRing(120, 150, 'ask', 'w-drop d3 w-rise', false, 11)}

    if (i === 3) return `
      <rect class="w-now-card w-static" x="101" y="26" width="118" height="92" rx="20"/>

      <line class="w-shelf" x1="60" y1="178" x2="260" y2="178"/>
      ${wRing(84, 164, 'do', 'w-shelved', true, 9)}
      ${wRing(112, 164, 'decide', 'w-shelved', true, 9)}
      ${wRing(140, 164, 'schedule', 'w-shelved', true, 9)}`;
    return `
      ${mind}
      ${wRing(160, 96, 'ask', 'w-breathe', false, 15)}
      <line class="w-shelf" x1="70" y1="196" x2="250" y2="196"/>
      ${wRing(96, 182, 'do', '', true, 9)}${wRing(124, 182, 'decide', '', true, 9)}${wRing(152, 182, 'schedule', '', true, 9)}${wRing(180, 182, 'ask', '', true, 9)}${wRing(208, 182, 'let_go', '', true, 9)}`;
  }

  function whyStoryHtml() {
    const bars = WHY_SCENES.map((_, i) => `<span data-i="${i}"><i></i></span>`).join('');
    return `
      <div class="why-story" data-scene="0">
        <div class="why-bars" aria-hidden="true">${bars}</div>
        <button type="button" class="why-stage" data-action="why-next" aria-label="Next">
          <svg viewBox="0 0 320 206" role="img" aria-hidden="true"><g class="why-scene play">${whySceneSvg(0)}</g></svg>
        </button>
        <div class="why-text" aria-live="polite">
          <h3 class="why-h1">${WHY_SCENES[0].h}</h3>
          <p class="why-p">${WHY_SCENES[0].p}</p>
          <p class="why-cite"></p>
        </div>
        <div class="why-nav">
          <button type="button" class="btn btn-ghost why-back" data-action="why-back" hidden>Back</button>
          <button type="button" class="btn btn-primary why-go" data-action="why-next">Next</button>
        </div>
      </div>`;
  }

  let whyTimer = null;
  let whyToken = 0;
  const WHY_MS = 5200;
  // Read lazily: SOUND_KEY is defined further down the file.
  const whyVoiceKey = () => SOUND_KEY + '_why_voice';
  function whyVoiceOn() { try { return localStorage.getItem(whyVoiceKey()) === 'on'; } catch (_) { return false; } }
  function setWhyVoice(on) { try { localStorage.setItem(whyVoiceKey(), on ? 'on' : 'off'); } catch (_) {} }

  function whyShow(i, dir = 1) {
    const story = document.querySelector('#overlay-root .why-story');
    if (!story) { clearTimeout(whyTimer); StoryAudio.stopAll(); return; }
    const n = WHY_SCENES.length;
    i = Math.max(0, Math.min(n - 1, i));
    story.dataset.scene = String(i);
    const scene = story.querySelector('.why-scene');
    scene.innerHTML = whySceneSvg(i);
    scene.classList.remove('play'); void scene.getBoundingClientRect(); scene.classList.add('play');
    const s = WHY_SCENES[i];
    const text = story.querySelector('.why-text');
    text.querySelector('.why-h1').textContent = s.h;
    text.querySelector('.why-p').textContent = s.p;
    text.querySelector('.why-cite').textContent = s.cite || '';
    const calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!calm && dir) text.animate([{ opacity: 0, transform: `translateX(${dir * 16}px)` }, { opacity: 1, transform: 'none' }], { duration: 280, easing: 'cubic-bezier(.2,.8,.2,1)' });
    const voice = whyVoiceOn();
    story.querySelectorAll('.why-bars span').forEach((b, k) => {
      b.classList.toggle('done', k < i);
      b.classList.toggle('now', k === i);
      const fill = b.querySelector('i');
      fill.getAnimations().forEach(a => a.cancel());
      if (k === i && !calm && i < n - 1) fill.animate([{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { duration: voice ? WHY_MS + 1800 : WHY_MS, easing: 'linear', fill: 'forwards' });
    });
    story.querySelector('.why-back').hidden = i === 0;
    const go = story.querySelector('.why-go');
    const last = i === n - 1;
    go.textContent = last ? 'Got it' : 'Next';
    go.dataset.action = last ? 'close-overlay' : 'why-next';

    // Sound: music follows the Sounds setting; the voice is opt-in.
    if (Sound.enabled) StoryAudio.music(i); else StoryAudio.stopMusic();
    clearTimeout(whyTimer);
    const token = ++whyToken;
    let minDone = false, voiceDone = !voice;
    const advance = () => {
      if (token !== whyToken || !minDone || !voiceDone || calm || last) return;
      whyTimer = setTimeout(() => { if (token === whyToken) whyShow(i + 1, 1); }, voice ? 700 : 0);
    };
    whyTimer = setTimeout(() => { minDone = true; advance(); }, voice ? WHY_MS - 700 : WHY_MS);
    if (voice) {
      StoryAudio.stopVoice();
      StoryAudio.duck(true);
      setTimeout(() => {
        if (token !== whyToken) return;
        StoryAudio.say(i, () => { if (token !== whyToken) return; StoryAudio.duck(false); voiceDone = true; advance(); });
      }, 450);
    } else { StoryAudio.stopVoice(); StoryAudio.duck(false); }
  }
  function whyStep(delta) {
    const story = document.querySelector('#overlay-root .why-story');
    if (!story) return;
    whyShow(Number(story.dataset.scene || 0) + delta, delta);
  }

  function renderWhy() {

  function renderOnboarding() {
    const root = document.getElementById('onboarding-root');
    if (!root) return;

    const step = view.onboardingStep;
    if (step < 0 || step >= ONBOARDING_STEPS.length) {
      root.innerHTML = '';
      return;
    }

    const s = ONBOARDING_STEPS[step];
    const dots = ONBOARDING_STEPS.map((_, i) => {
      const cls = i < step ? 'done' : i === step ? 'active' : '';
      return `<div class="onboarding-dot ${cls}"></div>`;
    }).join('');

    const isLast = step === ONBOARDING_STEPS.length - 1;

    const content = `
          <div class="onboarding-step-indicator">${dots}</div>
          <div class="onboarding-eyebrow">${s.eyebrow}</div>
          <h2 class="onboarding-title">${s.title}</h2>
          <p class="onboarding-body">${s.body}</p>
          ${s.visual}
          <div class="onboarding-actions">
            <button class="onboarding-btn-primary" data-action="onboarding-next">${s.next}</button>
            ${step > 0 ? `<button class="onboarding-btn-ghost" data-action="onboarding-prev">Back</button>` : ''}
          </div>
          ${!isLast ? `<div class="onboarding-skip"><button type="button" class="inline-link" data-action="onboarding-skip">Skip tutorial</button></div>` : ''}`;
    const existing = root.querySelector('.onboarding-card');
    if (existing) {
      // Already open: never replay the card's entrance. A new step slides in.
      const prevStep = Number(existing.dataset.step);
      existing.style.animation = 'none';
      if (prevStep === step) return;
      existing.dataset.step = String(step);
      existing.innerHTML = content;
      const calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!calm) {
        const dir = step > prevStep ? 1 : -1;
        Array.from(existing.children).slice(1).forEach(c => c.animate([
          { transform: `translateX(${dir * 24}px)`, opacity: 0 },
          { transform: 'none', opacity: 1 }
        ], { duration: 240, easing: 'cubic-bezier(.2,.8,.2,1)' }));
      }
      return;
    }

    root.innerHTML = `
      <div class="onboarding-overlay">
        <div class="onboarding-card" data-step="${step}">
          <div class="onboarding-step-indicator">${dots}</div>
          <div class="onboarding-eyebrow">${s.eyebrow}</div>
          <h2 class="onboarding-title">${s.title}</h2>
          <p class="onboarding-body">${s.body}</p>
          ${s.visual}
          <div class="onboarding-actions">
            <button class="onboarding-btn-primary" data-action="onboarding-next">${s.next}</button>
            ${step > 0 ? `<button class="onboarding-btn-ghost" data-action="onboarding-prev">Back</button>` : ''}
          </div>
          ${!isLast ? `<div class="onboarding-skip"><button type="button" class="inline-link" data-action="onboarding-skip">Skip tutorial</button></div>` : ''}
        </div>
      </div>`;
  }

  // ── SOUND ──
  // Tiny synthesized sounds (Web Audio), no audio files. One soft kalimba-like
  // instrument, every note from D major pentatonic so all cues sit together.
  // An open loop is an unresolved chord; closing it resolves to D major.
  const SOUND_KEY = CFG.STORAGE_KEY ? CFG.STORAGE_KEY + '_sound' : 'open_loops_sound';
  const SOUND_HINT_KEY = SOUND_KEY + '_hinted';

  const Sound = (() => {
    let ctx = null;
    let out = null;
    let enabled = true;
    let hinted = false;
    try {
      enabled = localStorage.getItem(SOUND_KEY) !== 'off';
      hinted = localStorage.getItem(SOUND_HINT_KEY) === '1';
    } catch (_) {}

    const N = { A3: 220, D4: 293.66, E4: 329.63, Fs4: 369.99, A4: 440, B4: 493.88, D5: 587.33, E5: 659.25, Fs5: 739.99 };

    // Create/resume the audio context. Called synchronously inside a click so
