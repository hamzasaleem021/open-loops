        const picked = fromLocalInputs(document.getElementById('when-date')?.value, document.getElementById('when-time')?.value);
        if (!picked || picked.getTime() <= Date.now()) { toast('Pick a time that is still ahead.'); return; }
        wakeAt = picked.toISOString();
      } else if (el.dataset.when) {
        wakeAt = validIso(el.dataset.when);
      }
      const patch = { status: 'waiting', wakeAt };
      if (ov.define) {
        Object.assign(patch, { rawText: ov.define.rawText, kind: ov.define.kind, promptAnswer: ov.define.promptAnswer, completedAt: null, details: ov.define.details });
      }
      updateLoop(target.id, patch);
      if (ov.define) { view.activeTab = 'later'; saveReentryDismissed(null); }
      closeOverlay();
      await persistAndRender();
      Sync.updateLoop(target.id, patch);
      announce(wakeAt ? `Parked until ${formatWake(wakeAt)}.` : 'Parked.');
      return;
    }
    if (action === 'complete-progress') {
      closeOverlay();
      announce('Still in progress.');
      return;
    }
    if (action === 'complete-update') {
      closeOverlay();
      const l = getLoop(loopId);
      if (l) {
        view.overlay = { type: 'define-raw', loopId, rawText: l.rawText, kind: l.kind, promptAnswer: l.promptAnswer, status: l.status, step: l.kind ? 2 : 1 };
        renderOverlay();
      }
      return;
    }

    // Status changes (parking goes through "when?" above)
    if (action === 'move-released') {
      if (requireLogin()) return;
      const target = getLoop(loopId);
      if (!target) { closeOverlay(); return; }
      // The menu’s "Let go": a release, not a finish, whatever the kind.
      const patch = { status: 'released', completedAt: nowIso(), details: cleanDetails({ ...target.details, outcome: 'let_go' }) };
      updateLoop(loopId, patch);
      closeOverlay();
      view.activeTab = 'now';
      await persistAndRender();
      Sync.updateLoop(loopId, patch);
      announce('Let go.');
      return;
    }
    if (action === 'restore-active') {
      if (requireLogin()) return;
      // Snapshot the previous state BEFORE updateLoop mutates the same
      // object reference (getLoop returns the live row, not a copy).
      const prevLoop = getLoop(loopId);
      const prevStatus = prevLoop?.status;
      // Restoring from waiting/released lands the loop in "Up next", right
      // under the Now card: not at its stale old position, and not over the
      // loop the person is currently focused on.
      const upNext = upNextPosition(loopId);
      const details = { ...((prevLoop && prevLoop.details) || {}) };
      delete details.outcome;
      const patch = { status: 'active', position: upNext.position, completedAt: null, details: cleanDetails(details) };
      // Brought back early: drop the wake time it no longer needs. A Schedule
      // loop’s heads-up stays: you still want the nudge before it happens.
      if (prevLoop && prevLoop.wakeAt && new Date(prevLoop.wakeAt).getTime() > Date.now() && !wakeIsScheduleNudge(prevLoop)) patch.wakeAt = null;
      updateLoop(loopId, patch);
      const positionChanges = upNext.rebalance ? rebalanceActivePositions() : null;
      closeOverlay();
      view.activeTab = 'now';
      await persistAndRender();
      Sync.updateLoop(loopId, patch);
      if (positionChanges) syncPositionChanges({ ok: true, changes: positionChanges });
      announce(prevStatus === 'released' ? 'Reopened. Now in Up next.' : 'Made active. Now in Up next.');
      return;
    }
    if (action === 'delete-loop') {
      if (!loopId) return;
      if (!getLoop(loopId)) { closeOverlay(); return; }
      // Don’t require login here — the confirm-delete handler re-checks.
      // Open the confirm dialog with the current opener preserved so focus
      // returns properly when the user hits Cancel.
      view.overlay = { type: 'confirm-delete', loopId };
      renderOverlay();
      return;
    }
    if (action === 'confirm-delete') {
      if (requireLogin()) return;
      const target = getLoop(loopId);
      if (!target) { closeOverlay(); return; }
      const snapshot = JSON.parse(JSON.stringify(target));
      const originalIndex = data.loops.findIndex(l => l.id === loopId);
      const wasLast = data.lastLoopId === loopId;
      removeLoop(loopId);
      closeOverlay();
      await persistAndRender();
      Sync.deleteLoop(loopId);
      toast('Loop deleted.', {
        action: 'Undo',
        duration: 8000,
        onAction: async () => {
          if (requireLogin()) return;
          if (getLoop(snapshot.id)) return;
          const insertAt = Math.min(Math.max(originalIndex, 0), data.loops.length);
          data.loops.splice(insertAt, 0, snapshot);
          if (wasLast) data.lastLoopId = snapshot.id;
          await persistAndRender();
          // Undo soft-delete on the server so the row reappears everywhere.
          Sync.undeleteLoop(snapshot.id);
          toast('Restored.');
        }
      });
      return;
    }

    // Change kind
    if (action === 'reclarify-kind') {
      view.overlay = { type: 'change-kind', loopId };
      renderOverlay();
      return;
    }
    if (action === 'define-schedule') {
      if (requireLogin()) return;
      const target = getLoop(loopId);
      if (!target) { closeOverlay(); return; }
      view.overlay = {
        type: 'define-raw', loopId, rawText: target.rawText, kind: 'schedule',
        promptAnswer: target.promptAnswer || '', status: target.status === 'inbox' ? 'active' : target.status, step: 2
      };
      renderOverlay();
      return;
    }
    if (action === 'set-kind-direct') {
      if (requireLogin()) return;
      const newKind = el.dataset.kind;
      const patch = { kind: newKind };
      // Leaving Schedule: its time goes, and so does the heads-up it set.
      const before = getLoop(loopId);
      if (before && before.kind === 'schedule' && newKind !== 'schedule') {
        const d = { ...(before.details || {}) };
        delete d.at;
        delete d.calAt;
        patch.details = cleanDetails(d);
        if (wakeIsScheduleNudge(before)) patch.wakeAt = null;
      }
      // Match capture-flow behavior: choosing "Let go" releases the loop.
      if (newKind === 'let_go') {
        patch.status = 'released';
        patch.completedAt = nowIso();
        patch.details = cleanDetails({ ...(patch.details || getLoop(loopId)?.details || {}), outcome: 'let_go' });
      }
      updateLoop(loopId, patch);
      closeOverlay();
      if (newKind === 'let_go') view.activeTab = 'now';
      await persistAndRender();
      Sync.updateLoop(loopId, patch);
      announce(newKind === 'let_go' ? 'Released.' : 'Kind updated.');
      return;
    }

    // Inline edit
    if (action === 'inline-edit-start') {
      view.inlineEditId = loopId;
      renderMain();
      return;
    }
    if (action === 'inline-edit-open') {
      view.inlineEditId = loopId;
      closeOverlay();
      renderMain();
      return;
    }
    if (action === 'inline-edit-save') {
      if (requireLogin()) return;
      const inp = document.getElementById(`inline-edit-${loopId}`);
      const val = inp ? inp.value.trim() : null;
      if (val) {
        const patch = { rawText: val };
        updateLoop(loopId, patch);
        await persistAndRender();
        Sync.updateLoop(loopId, patch);
        announce('Updated.');
      }
      view.inlineEditId = null;
      renderMain();
      return;
    }
    if (action === 'inline-edit-cancel') {
      view.inlineEditId = null;
      renderMain();
      return;
    }

    // Sync
    if (action === 'open-sync') {
      rememberOverlayOpener(el);
      // Signed in, the account (email, sync, sign out) is part of Your head.
      view.overlay = { type: Sync.isLoggedIn() ? 'profile' : 'sync' };
      renderOverlay();
      return;
    }
    if (action === 'send-magic-link') {
      const input = document.getElementById('sync-email');
      const email = input ? input.value.trim() : '';
      if (!email) { toast('Enter your email first.'); return; }
      const sinceLast = Date.now() - lastMagicLinkAt;
      if (sinceLast < MAGIC_LINK_COOLDOWN_MS) {
        const wait = Math.ceil((MAGIC_LINK_COOLDOWN_MS - sinceLast) / 1000);
        toast(`Please wait ${wait}s before requesting another link.`);
        return;
      }
      try {
        setSyncStatus('syncing', 'Sending…');
        await Sync.sendMagicLink(email);
        lastMagicLinkAt = Date.now();
        setSyncStatus('idle', 'Check email');
        toast('Sign-in link sent. Check your email.');
      } catch(e) {
        setSyncStatus('error', 'Error');
        toast(linkErrorText(e));
      }
      return;
    }
    if (action === 'sign-out') {
      // This phone shouldn’t keep getting nudges for an account that left it.
      await Push.disable().catch(() => {});
      await Sync.signOut();
      closeOverlay();
      return;
    }
    if (action === 'sync-retry') {
      const fromBanner = !!el.closest('.sync-error-banner');
      if (!fromBanner) renderOverlay();
      const result = await Sync.retry();
      if (result?.ok) toast('Back in sync.');
      else toast('Still can’t reach your other devices. Your changes are safe here.');
      if (!fromBanner && (view.overlay?.type === 'sync' || view.overlay?.type === 'profile')) renderOverlay();
      return;
    }

    if (action === 'move-loop-up' || action === 'move-loop-down' || action === 'make-now') {
      if (requireLogin()) return;
      const order = data.loops.filter(l => l.status === 'active').sort((a, b) => (b.position || 0) - (a.position || 0));
      const offset = action === 'make-now' ? -order.findIndex(l => l.id === loopId) : action === 'move-loop-up' ? -1 : 1;
      if (view.overlay && view.overlay.type === 'menu') closeOverlay();
      const result = moveActiveLoopByOffset(loopId, offset);
      if (!result.ok) return;
      await persistAndRender();
      syncPositionChanges(result);
      announce(action === 'make-now' ? 'Now it’s your Now.' : action === 'move-loop-up' ? 'Moved up.' : 'Moved down.');
      return;
    }

    // Theme toggle
    if (action === 'toggle-theme') {
      setTheme(view.theme === 'dark' ? 'light' : 'dark');
      // If the Settings overlay is currently open, re-render it so the
      // "Dark/Light" label updates in place.
      if (view.overlay && view.overlay.type === 'settings') renderOverlay();
      return;
    }

    // PWA install
    if (action === 'install-app') {
      if (!deferredInstallPrompt) return;
      const promptEvent = deferredInstallPrompt;
      deferredInstallPrompt = null;
      try {
        await promptEvent.prompt();
        const choice = await promptEvent.userChoice;
        if (choice && choice.outcome === 'accepted') {
          toast('Installing Open Loops…');
        }
      } catch (err) {
        /* ignore — some browsers throw on re-prompt */
      }
      const btn = document.getElementById('install-btn');
      if (btn) btn.hidden = true;
      if (view.overlay && view.overlay.type === 'settings') renderOverlay();
      return;
    }

    if (action === 'check-update') {
      const reg = swRegistration;
      if (!reg || el.disabled) return;
      el.disabled = true;
      el.textContent = 'Checking…';
      let found = false;
      try {
        await reg.update();
        found = !!(reg.installing || reg.waiting);
      } catch (_) {
        el.disabled = false;
        el.textContent = 'Check for update';
        toast("Couldn’t check for an update. Are you online?");
        return;
      }
      if (found) {
        // The new version takes over in a moment; the page reloads itself
        // (see SERVICE WORKER below). Close Settings so nothing holds it up.
        closeOverlay();
        toast('Getting the new version…');
      } else {
        el.disabled = false;
        el.textContent = 'Check for update';
        toast("You’re on the latest version.");
      }
      return;
    }

    // ── Still yours? ──
    if (action === 'open-still-yours') {
      if (!getLoop(loopId)) return;
      rememberOverlayOpener(el);
      view.overlay = { type: 'still', loopId };
      renderOverlay();
      Sound.play('ask');
      return;
    }
    if (action === 'still-keep') {
      if (requireLogin()) return;
      const target = getLoop(loopId);
      if (!target) { closeOverlay(); return; }
      // Touching it is the point: the write makes it fresh clay again.
      const patch = { position: target.position };
      updateLoop(loopId, patch);
      closeOverlay();
      await persistAndRender();
      Sync.updateLoop(loopId, patch);
      Sound.play('fresh');
      toast('Fresh again. It counts as touched today.');
      return;
    }
    if (action === 'still-let-go') {
      if (requireLogin()) return;
      const target = getLoop(loopId);
      if (!target) { closeOverlay(); return; }
      const patch = { status: 'released', completedAt: nowIso(), details: cleanDetails({ ...target.details, outcome: 'let_go' }) };
      updateLoop(loopId, patch);
      closeOverlay();
      await persistAndRender();
      Sync.updateLoop(loopId, patch);
      toast('Let go. One less thing drying out on you.');
      return;
    }

    // ── Sweep ──
    if (action === 'open-sweep') {
      if (requireLogin()) return;
      const items = sweepItems();
      if (!items.length) { toast('Nothing to sweep right now.'); renderMain(); return; }
      rememberOverlayOpener(el);
      view.overlay = { type: 'sweep', step: 'card', items, idx: 0, picks: [] };
      renderOverlay();
      return;
    }
    if (action === 'sweep-start' || action === 'sweep-back') {
      const ov = view.overlay;
      if (!ov || ov.type !== 'sweep') return;
      ov.step = 'card';
      renderOverlay();
      return;
    }
    if (action === 'sweep-later') {
      saveSweepState({ laterOn: localDateValue(new Date()), laterIds: sweepItems().map(i => i.id) });
      if (view.overlay && view.overlay.type === 'sweep') closeOverlay();
      renderMain();
      return;
    }
    if (action === 'sweep-pick' || action === 'sweep-park') {
      if (requireLogin()) return;
      const ov = view.overlay;
      if (!ov || ov.type !== 'sweep') return;
      const it = ov.items[ov.idx];
      const loop = it && getLoop(it.id);
      const pick = action === 'sweep-park' ? 'park' : el.dataset.pick;
      if (loop && action === 'sweep-pick' && pick === 'park') { ov.step = 'park'; renderOverlay(); return; }
      let schedIso = null;
      if (loop && action === 'sweep-park' && loop.kind === 'schedule' && el.dataset.when === 'schedule') {
        schedIso = readSchedulePick('sweep-sched');
        if (!schedIso) return;
      }
      let result = null;
      if (loop && sweepable(it)) {
        const wakeAt = action === 'sweep-park' && el.dataset.when && el.dataset.when !== 'schedule' ? validIso(el.dataset.when) : null;
        result = sweepApply(loop, pick, wakeAt, schedIso);
        if (pick === 'now') ov.nowId = loop.id;
      }
      ov.picks.push(pick);
      Sound.play('sweepNote', ov.picks.length - 1);
      ov.idx += 1;
      while (ov.idx < ov.items.length && !sweepable(ov.items[ov.idx])) ov.idx += 1;
      if (ov.idx >= ov.items.length) {
        ov.step = 'done';
        saveSweepState({ sweptAt: nowIso(), laterOn: null, laterIds: [] });
        setTimeout(() => Sound.play('sweepDone'), 420);
      } else {
        ov.step = 'card';
      }
      Motion.forget();
      persistAndRender();
      if (result) {
        Sync.updateLoop(loop.id, result.patch);
        if (result.positionChanges) syncPositionChanges({ ok: true, changes: result.positionChanges });
      }
      return;
    }
    if (action === 'sweep-finish') {
      view.activeTab = 'now';
      closeOverlay();
      renderAll();
      return;
    }

    // ── Your head, share card ──
    if (action === 'open-profile') {
      if (requireLogin()) return;
      rememberOverlayOpener(el);
      view.overlay = { type: 'profile' };
      renderOverlay();
      return;
    }
    if (action === 'share-app' || action === 'share-app-later') {
      try { localStorage.setItem(SHARE_PROMPT_KEY, '1'); } catch (_) {}
      if (action === 'share-app') {
        const r = await shareApp();
        if (r === 'copied') toast('Link copied. Paste it wherever you like.');
        else if (r === 'failed') toast(`Share this link: ${APP_LINK}`);
      }
      if (!view.overlay) renderMain();
      return;
    }
    if (action === 'open-share') {
      const month = new Date().toLocaleDateString(undefined, { month: 'long' });
      shareBlob = null;
      view.overlay = { type: 'share', month, count: monthCloses().length };
      renderOverlay();
      try {
        const canvas = await drawShareCard();
        shareBlob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        const ov = view.overlay;
        if (!ov || ov.type !== 'share') return;
        ov.img = canvas.toDataURL('image/png');
        renderOverlay();
      } catch (err) {
        console.warn('[open-loops] share card failed', err);
        toast('Couldn’t draw the card. Try again.');
      }
      return;
    }
    if (action === 'share-send' || action === 'share-save') {
      if (!shareBlob) return;
      const ov = view.overlay || {};
      const name = `open-loops-${fileSlug(ov.month || 'month')}-${new Date().getFullYear()}.png`;
      if (action === 'share-send') {
        const file = new File([shareBlob], name, { type: 'image/png' });
        try {
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], title: 'My month in Open Loops', text: 'My month in Open Loops · openloops.auxila.cc' });
            return;
          }
        } catch (err) {
          if (err && err.name === 'AbortError') return;
        }
      }
      saveShareImage(name);
      toast('Saved the image.');
      return;
    }

    // ── Nudges ──
    if (action === 'push-master') {
      if (requireLogin()) return;
      if (nudgeUi.busy || el.disabled) return;
      const state = nudgeState();
      if (state === 'on') {
        // Off at once on this device; the server catches up behind it.
        nudgeUi.note = null;
        const done = Push.disable();
        nudgeUi.disabling = done;
        refreshNudgeSettings();
        announce('Nudges are off for this device.');
        const r = await done;
        if (nudgeUi.disabling === done) nudgeUi.disabling = null;
        if (r && r.serverOk === false) showNudgeNote({ kind: 'info', text: 'Nudges are off on this device.' });
        return;
      }
      if (state === 'blocked') { nudgeRecheck(); return; }
      if (state !== 'off') return;
      // Just switched off and back on: let the off finish first (no prompt
      // is waiting on this tap, permission is already granted).
      if (nudgeUi.disabling && Push.permission() === 'granted') await nudgeUi.disabling;
      await turnNudgesOn();
      return;
    }
    if (action === 'push-recheck') {
      if (requireLogin()) return;
      if (nudgeUi.busy) return;
      nudgeRecheck();
      return;
    }
    if (action === 'push-reload') {
      window.location.reload();
      return;
    }
    if (action === 'push-toggle') {
      const k = el.dataset.key;
      if (!['wakeups', 'stale', 'recap'].includes(k)) return;
      await savePushPrefs({ [k]: !Push.prefs()[k] });
      return;
    }
    if (action === 'push-test') {
      if (requireLogin()) return;
      if (nudgeUi.testing) return;
      nudgeUi.testing = true;
      nudgeUi.note = null;
      refreshNudgeSettings();
      const r = await Push.test();
      nudgeUi.testing = false;
      if (r.ok) {
        const from = isStandaloneApp() || isIOS() ? 'Open Loops' : browserWord();
        showNudgeNote({
          kind: 'ok',
          text: `${r.repaired ? 'This device’s nudge address had expired, so it was renewed. ' : ''}Sent. It should arrive within a few seconds. Nothing? Check that your ${deviceWord()} allows notifications from ${esc(from)} and that Do Not Disturb is off.`
        });
      } else if (r.reason === 'blocked') {
        refreshNudgeSettings();
      } else {
        showNudgeNote(nudgeNote(r.reason, 'push-test'));
      }
      return;
    }

    // Settings overlay
    if (action === 'open-why') {
      rememberOverlayOpener(el);
      view.overlay = { type: 'why' };
      renderOverlay();
      StoryAudio.start();
      if (whyVoiceOn()) StoryAudio.preloadVoice();
      whyShow(0);
      return;
    }
    if (action === 'why-next') {
      const story = document.querySelector('#overlay-root .why-story');
      if (story && Number(story.dataset.scene) >= WHY_SCENES.length - 1) return;
      whyStep(1);
      return;
    }
    if (action === 'why-back') { whyStep(-1); return; }
    if (action === 'why-voice') {
      const on = !whyVoiceOn();
      setWhyVoice(on);
      el.classList.toggle('on', on);
      el.setAttribute('aria-pressed', String(on));
      if (on) StoryAudio.preloadVoice();
      const story = document.querySelector('#overlay-root .why-story');
      if (story) whyShow(Number(story.dataset.scene || 0), 0);
      return;
    }
    if (action === 'open-settings') {
      rememberOverlayOpener(el);
      nudgeUi.note = null;
      nudgeUi.waiting = false;   // a prompt left unanswered earlier isn’t on screen now
      view.overlay = { type: 'settings' };
      renderOverlay();
      return;
    }
    if (action === 'set-sound') {
      Sound.set(el.dataset.sound === 'on');
      if (Sound.enabled) { Sound.unlock(); Sound.play('land'); }
      if (view.overlay && view.overlay.type === 'settings') renderOverlay();
      return;
    }
    if (action === 'set-theme') {
      setTheme(el.dataset.theme);
      if (view.overlay && view.overlay.type === 'settings') renderOverlay();
      return;
    }
    if (action === 'set-loop-cap') {
      const n = parseInt(el.dataset.cap, 10);
      saveLoopCap(n);
      // Re-render the settings overlay (to update selected button) and the
      // main view (visible loop count may change immediately).
      if (view.overlay && view.overlay.type === 'settings') renderOverlay();
      renderMain();
      return;
    }
    if (action === 'reset-onboarding') {
      try {
        const key = scopedKey(ONBOARDING_KEY_BASE);
        if (key) localStorage.removeItem(key);
      } catch(e) {}
      closeOverlay();
      startOnboarding();
      return;
    }

    // Dismiss sync error banner
    if (action === 'dismiss-sync-banner') {
      const banner = document.getElementById('sync-error-banner');
      if (banner) banner.style.display = 'none';
      return;
    }
  });

  document.addEventListener('dragstart', e => {
    const card = e.target.closest('[data-draggable-loop="1"]');
    if (!card) return;
    view.draggingLoopId = card.dataset.loopId;
    card.classList.add('dragging');
    if (e.dataTransfer) {
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', view.draggingLoopId);
    }
  });

  document.addEventListener('dragover', e => {
    const card = e.target.closest('[data-draggable-loop="1"]');
    if (!card || !view.draggingLoopId || card.dataset.loopId === view.draggingLoopId) return;
    e.preventDefault();
    card.classList.add('drag-over');
    if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
  });

  document.addEventListener('dragleave', e => {
    const card = e.target.closest('[data-draggable-loop="1"]');
    if (card) card.classList.remove('drag-over');
  });

  document.addEventListener('drop', async e => {
    const card = e.target.closest('[data-draggable-loop="1"]');
    if (!card || !view.draggingLoopId) return;
    e.preventDefault();
    // Mutation guard: if the user isn’t signed in, don’t reorder (matches
    // how every other mutation path behaves).
    if (requireLogin()) { view.draggingLoopId = null; return; }
    const result = moveActiveLoop(view.draggingLoopId, card.dataset.loopId);
    view.draggingLoopId = null;
    if (!result.ok) return;
    await persistAndRender();
    // Sync the position change(s). Common case: one row updated. Rare case
    // (rebalance fired): many rows. Either way we enqueue a position-only
    // patch per changed row — the queue’s coalescing means consecutive
    // drags of the same loop merge into a single update.
    syncPositionChanges(result);
  });

  document.addEventListener('dragend', () => {
    view.draggingLoopId = null;
    document.querySelectorAll('.loop-card.dragging, .loop-card.drag-over').forEach(el => el.classList.remove('dragging', 'drag-over'));
  });

  // Live char-counter helper. Tints the counter yellow near the limit,
  // red at exactly the limit, and falls back to default otherwise.
  function updateCounter(counterId, len) {
    const c = document.getElementById(counterId);
    if (!c) return;
    c.textContent = `${len}/${MAX_LOOP_TEXT_LEN}`;
    c.classList.toggle('near-limit', len >= MAX_LOOP_TEXT_LEN - 50 && len < MAX_LOOP_TEXT_LEN);
    c.classList.toggle('at-limit', len >= MAX_LOOP_TEXT_LEN);
  }

  // Input binding for capture + auth gate email tracking
  // Schedule pickers: keep the "what will happen" line true as you pick.
  // Phones' native pickers fire 'change' rather than 'input', so both.
  document.addEventListener('change', e => {
    if (e.target.classList && e.target.classList.contains('sched-input')) refreshScheduleNote(e.target);
  });
  document.addEventListener('input', e => {
    if (e.target.classList && e.target.classList.contains('sched-input')) refreshScheduleNote(e.target);
    // Track auth gate email typing in view state
    if (e.target.id === 'auth-gate-email') {
      view.authGateEmail = e.target.value;
      return;
    }
    if (e.target.classList.contains('inline-edit-input')) {
      const counterId = e.target.id.replace('inline-edit-', 'inline-edit-counter-');
      updateCounter(counterId, e.target.value.length);
      return;
    }
    const ov = view.overlay;
    if (ov && ov.type === 'define-raw') {
      if (e.target.id === 'define-raw-input') {
        ov.rawText = e.target.value;
        autoGrow(e.target);
        return;
      }
      if (e.target.id === 'define-detail-input') {
        ov.promptAnswer = e.target.value;
        updateCounter('define-detail-counter', e.target.value.length);
        autoGrow(e.target);
        return;
      }
    }
    if (ov && ov.type === 'primary-action' && e.target.classList.contains('act-input')) {
      readActInputs(ov);
      if (e.target.tagName === 'TEXTAREA') autoGrow(e.target);
      if (e.target.id === 'act-decision') syncChoiceChips(ov);
      updateActButtons(ov);
      return;
    }
    if (!ov || ov.type !== 'capture') return;
    if (e.target.id === 'capture-input') {
      ov.rawText = e.target.value;
      updateCounter('capture-counter', e.target.value.length);
      const btn = document.querySelector('[data-action="save-raw-loop"]');
      if (btn) btn.disabled = !e.target.value.trim();
      autoGrow(e.target);
      refreshCaptureWhen(ov);
    }
  });

  // Enter inside the capture and define sheets (Shift+Enter = newline):
  //   capture text → add and keep going · next-step answer → Next
  //   loop title  → done editing
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.shiftKey || e.isComposing) return;
    const id = e.target && e.target.id;
    if (id === 'capture-input') {
      e.preventDefault();
      if (!e.target.value.trim()) return;
      const b = document.createElement('button');
      b.dataset.action = 'save-raw-loop-more';
      b.hidden = true;
      document.getElementById('overlay-root').appendChild(b);
      b.click();
      b.remove();
    } else if (id === 'define-detail-input') {
      e.preventDefault();
      document.querySelector('#overlay-root [data-action="define-next"]:not([data-skip])')?.click();
    } else if (id === 'define-raw-input') {
      e.preventDefault();
      e.target.blur();
    } else if (id === 'act-next') {
      e.preventDefault();
      document.querySelector('#overlay-root [data-action="do-save-step"]:not([disabled])')?.click();
    } else if (id === 'act-decision') {
      e.preventDefault();
      document.querySelector('#overlay-root [data-action="decide-confirm"]')?.click();
    } else if (id === 'act-spawn') {
      e.preventDefault();
      document.querySelector('#overlay-root [data-action="decide-close"][data-spawn]:not([disabled])')?.click();
    }
  }, true);

  // Check-in time: any minute of the day, kept exactly as picked. The toast
  // says what was saved and when the next check-in can come.
  document.addEventListener('change', async e => {
    if (!e.target || e.target.id !== 'nudge-time') return;
    const m = /^(\d{1,2}):(\d{2})/.exec(e.target.value || '');
    if (!m) return;
    const time = `${m[1].padStart(2, '0')}:${m[2]}`;
    if (!(await savePushPrefs({ time }))) return;
    const p = Push.prefs();
    const at = nextCheckIn(p);
    const clock = esc(clockText(at));
    const has = checkInHas(p, at);
    showNudgeNote({ kind: 'ok', text: !isSameDay(at, new Date())
      ? `Saved. Next check-in tomorrow at ${clock}.`
      : has ? `Saved. Check-in today at ${clock}.` : `Saved for ${clock}. Nothing to say today, so it stays quiet.` });
  });

  // Enter key on auth gate email → submit
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.id === 'auth-gate-email') {
      e.preventDefault();
      const btn = document.getElementById('auth-gate-btn');
      if (btn && !btn.disabled) btn.click();
    }
  }, true); // capture phase so it fires before the main keydown handler

  // The Capture button floats over the list. Scrolling down tucks it away so
  // it never sits on a card’s buttons; scrolling up, or reaching the end of
  // the list, brings it back.
  let lastScrollY = window.scrollY || 0;
  window.addEventListener('scroll', () => {
    const y = window.scrollY || 0;
    const atEnd = window.innerHeight + y >= document.documentElement.scrollHeight - 40;
    const tuck = !atEnd && y > 80 && y > lastScrollY + 4 ? true : (y < lastScrollY - 4 || atEnd || y <= 80 ? false : fabTucked);
    lastScrollY = y;
    if (tuck === fabTucked) return;
    fabTucked = tuck;
    document.querySelectorAll('.fab').forEach(b => b.classList.toggle('tucked', tuck));
  }, { passive: true });

  // Tab stays inside whatever is on top (the first-run tour, a sheet, the
  // sign-in screen): the page behind it can’t be reached until it closes.
  const FOCUSABLE = 'a[href], button:not([disabled]), input:not([disabled]):not([type="hidden"]), textarea:not([disabled]), select:not([disabled]), [tabindex]:not([tabindex="-1"])';
  function topLayer() {
    const shown = el => el && el.firstElementChild && el.getClientRects().length && getComputedStyle(el).display !== 'none';
    const tour = document.getElementById('onboarding-root');
    if (view.onboardingStep >= 0 && shown(tour)) return tour;
    const sheet = document.getElementById('overlay-root');
    if (view.overlay && shown(sheet)) return sheet;
    const gate = document.getElementById('auth-gate-root');
    return shown(gate) ? gate : null;
  }
  document.addEventListener('keydown', e => {
    if (e.key !== 'Tab') return;
    const layer = topLayer();
    if (!layer) return;
    const items = [...layer.querySelectorAll(FOCUSABLE)].filter(el => el.getClientRects().length && !el.closest('[hidden],[inert]'));
    if (!items.length) { e.preventDefault(); return; }
    const first = items[0], last = items[items.length - 1];
    const inside = layer.contains(document.activeElement);
    if (!inside || (e.shiftKey && document.activeElement === first)) { e.preventDefault(); (e.shiftKey ? last : first).focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });

  // Minimal keyboard handling:
  //   Escape               → exit inline edit or close overlay
  //   Enter in inline edit → save (Shift+Enter inserts a newline)
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (view.inlineEditId) { view.inlineEditId = null; renderMain(); }
      else closeOverlay();
      return;
    }

    if (e.key === 'Enter' && e.target.classList.contains('inline-edit-input') && !e.shiftKey) {
      e.preventDefault();
      const loopId = e.target.id.replace('inline-edit-', '');
      const val = e.target.value.trim();
      if (val) {
        if (requireLogin()) return;
        const patch = { rawText: val };
        updateLoop(loopId, patch);
        persistAndRender();
        Sync.updateLoop(loopId, patch);
        announce('Updated.');
      }
      view.inlineEditId = null;
      renderMain();
    }
  });

  // ── AUTO-RETRY ON NETWORK / VISIBILITY EVENTS ──
  // ── BACK FROM THE CALENDAR ──
  // A loop just sent to a calendar asks, as soon as you’re back in the app,
  // whether it made it. Once per loop; the card keeps asking quietly.
  const askedCal = new Set();
  function askCalendarBack() {
    if (!Sync.isLoggedIn() || view.overlay || view.onboardingStep >= 0) return;
    const since = Date.now() - 30 * 60000;
    const loop = data.loops.find(l => l.status === 'active' && l.kind === 'schedule' && !askedCal.has(l.id) &&
      l.details && l.details.calAt && new Date(l.details.calAt).getTime() > since);
    if (!loop) return;
    askedCal.add(loop.id);
    view.overlay = { type: 'primary-action', loopId: loop.id, step: 'confirm' };
    renderOverlay();
  }

  // When we come back online or refocus the tab, drain any queued offline
  // operations. Individual edits already sync immediately when online.
  window.addEventListener('online', async () => {
    if (Sync.isLoggedIn()) {
      await Sync.processQueue();
      // Network just came back — the realtime channel may have died during
      // the outage. Ask Sync to verify/repair it.
      Sync.ensureRealtime();
      resyncNudges();
    }
  });

  // Nudges follow the browser’s permission: allowed in site settings → on by
  // themselves (when they’d asked for them); blocked → off, and Settings says
  // why. Another tab flipping the switch shows here too.
  Push.watchPermission(() => { resyncNudges(); });
  window.addEventListener('storage', e => {
    if (e.key && e.key.indexOf(Push.KEY_BASE) === 0) refreshNudgeSettings();
  });

  // Fix 3: 'focus' is unreliable on mobile PWAs — returning from background
  // often fires visibilitychange without firing focus. Use visibilitychange
  // as the primary trigger and keep 'focus' as a belt-and-suspenders fallback
  // for desktop. When the tab becomes visible again, drain the queue and
  // verify the realtime channel is still alive.
  document.addEventListener('visibilitychange', async () => {
    if (document.hidden) return;
    if (!Sync.isLoggedIn()) return;
    askCalendarBack();
    await Sync.processQueue();
    Sync.ensureRealtime();
    wakeDueLoops();
    resyncNudges();
  });

  // While the app stays open, parked loops still come back on time.
  setInterval(() => {
    if (!document.hidden && Sync.isLoggedIn()) wakeDueLoops();
  }, 60000);

  window.addEventListener('focus', async () => {
    if (Sync.isLoggedIn()) {
      await Sync.processQueue();
      Sync.ensureRealtime();
    }
  });

  // ── SUPABASE SYNC (atomic, one-row-per-loop) ──
  // Every edit is a single-row INSERT/UPDATE. PostgreSQL serializes concurrent
  // writes to the same row, so two devices editing different loops never
  // conflict, and two devices editing the same loop serialize rather than
  // overwriting each other’s whole state.
  //
  // Reliability features:
  //   - Offline edits queue in localStorage; drained on reconnect.
  //   - Queue uses exponential backoff (4s → 60s cap) and moves poison-pill
  //     entries to a dead-letter queue after MAX_QUEUE_ATTEMPTS so one bad
  //     write can’t block every subsequent edit.
  //   - Realtime subscription monitors its own connection status; on drop it
  //     tears down and re-subscribes, then does a pullAll() to catch up.
  //   - visibilitychange / online handlers verify the channel and drain the
  //     queue whenever the user returns to the tab or comes back online.
  //   - TOKEN_REFRESHED updates realtime’s JWT so the channel doesn’t silently
  //     die after token rotation.
  //   - Incoming realtime updates compare updated_at vs local; a remote row
  //     older than our local copy doesn’t clobber (prevents late echoes from
  //     overwriting newer state).
  const OFFLINE_QUEUE_KEY_BASE = 'open_loops_offline_queue';
  const DEAD_QUEUE_KEY_BASE = 'open_loops_dead_queue';
  const LEGACY_OFFLINE_QUEUE_KEY = OFFLINE_QUEUE_KEY_BASE;
  const LEGACY_DEAD_QUEUE_KEY = DEAD_QUEUE_KEY_BASE;
  const LEGACY_OFFLINE_QUEUE_QUARANTINE_KEY = `${OFFLINE_QUEUE_KEY_BASE}_legacy_unscoped`;
  const LEGACY_DEAD_QUEUE_QUARANTINE_KEY = `${DEAD_QUEUE_KEY_BASE}_legacy_unscoped`;

  const Sync = (() => {
    if (!window.supabase || !hasSupabaseCfg()) {
      return {
        init:          async () => { authReady = true; renderAuthGate(); },
        createLoop:    () => {},
        updateLoop:    () => {},
        deleteLoop:    () => {},
        undeleteLoop:  () => {},
        processQueue:  async () => ({ ok: true, pending: true }),
        retry:         async () => ({ ok: true, pending: true }),
        ensureRealtime: () => {},
        sendMagicLink: async () => { throw new Error(supabaseClientIssue() || 'Sign-in isn’t ready yet. Try again in a moment.'); },
        signOut:       async () => {},
        savePush:      async () => { throw new Error('Sign in first.'); },
        deletePush:    async () => {},
        testPush:      async () => { throw new Error('Sign in first.'); },
        pushRowExists: async () => null,
        userEmail:     () => '',
        isLoggedIn:    () => false
      };
    }

    const db = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });

    let currentUser = null;
    let channel     = null;
    let channelHealthy = false;
    let channelConnecting = false;
    let channelSeq = 0;
    let retryTimer  = null;
    let draining    = false;
    // True while a full pull is in flight. Edits made meanwhile wait in the
    // queue (the pull keeps queued edits on top of what it downloads), then
    // go out the moment it lands. Sent earlier, the pull’s older snapshot
    // would paint over them.
    let pulling     = false;
    let deadQueueDirty = false;
    let memQueue = null;  // the queue, when this browser has no room left to store it

    // Echo suppression: when we write a row, the realtime subscription will
    // echo it back. We don’t want that echo to clobber a newer in-flight
    // local edit, so we track recently-written ids for a few seconds.
    const recentEchoes = new Map(); // id -> expiry timestamp (ms)
    function markEcho(id) { recentEchoes.set(id, Date.now() + 3000); }
    function isEcho(id) {
      const exp = recentEchoes.get(id);
      if (!exp) return false;
      if (Date.now() > exp) { recentEchoes.delete(id); return false; }
      return true;
    }

    function cleanUrl() {
      // Strip the magic-link auth fragments / query params after Supabase
      // has consumed them. URLSearchParams.has('code') is exact — substring
      // matching would also strip benign params like ?qrcode= or
      // ?discount_code=.
      let hasAuthParam = false;
      try { hasAuthParam = new URLSearchParams(location.search).has('code'); } catch(_) {}
      if (location.hash || hasAuthParam)
        history.replaceState({}, document.title, location.pathname);
    }

    function showSyncErrorBanner() {
      const banner = document.getElementById('sync-error-banner');
      if (banner) banner.style.display = 'flex';
    }
    function hideSyncErrorBanner() {
      const banner = document.getElementById('sync-error-banner');
      if (banner) banner.style.display = 'none';
    }

    function queueKey() {
      return scopedKey(OFFLINE_QUEUE_KEY_BASE);
    }

    function deadQueueKey() {
      return scopedKey(DEAD_QUEUE_KEY_BASE);
    }

    function quarantineLegacyQueueData() {
      let moved = false;
      try {
        const raw = localStorage.getItem(LEGACY_OFFLINE_QUEUE_KEY);
        if (raw && !localStorage.getItem(LEGACY_OFFLINE_QUEUE_QUARANTINE_KEY)) {
          localStorage.setItem(LEGACY_OFFLINE_QUEUE_QUARANTINE_KEY, raw);
        }
        if (raw) {
          localStorage.removeItem(LEGACY_OFFLINE_QUEUE_KEY);
          moved = true;
        }

        const dead = localStorage.getItem(LEGACY_DEAD_QUEUE_KEY);
        if (dead && !localStorage.getItem(LEGACY_DEAD_QUEUE_QUARANTINE_KEY)) {
          localStorage.setItem(LEGACY_DEAD_QUEUE_QUARANTINE_KEY, dead);
        }
        if (dead) {
          localStorage.removeItem(LEGACY_DEAD_QUEUE_KEY);
          moved = true;
        }
      } catch(e) {}
      return moved;
    }

    // ── Offline queue (localStorage) ──
    // Entry shape: { op: 'create'|'update'|'delete'|'undelete', id, payload?, ts }
    function loadQueue() {
      const key = queueKey();
      if (!key || !currentUser) return [];
      if (memQueue) return memQueue.filter(entry => !entry.ownerUserId || entry.ownerUserId === currentUser.id);
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) return [];
        return parsed.filter(entry => !entry.ownerUserId || entry.ownerUserId === currentUser.id);
      } catch(e) { return []; }
    }
    function saveQueue(q) {
      const key = queueKey();
      if (!key) return;
      try {
        if (!q.length) localStorage.removeItem(key);
        else           localStorage.setItem(key, JSON.stringify(q));
        memQueue = null;
      } catch(e) {
        // No room to keep the queue: hold it in memory so the writes still
        // go out while the app is open.
        memQueue = q.slice();
        noteStorageFull();
      }
    }
    function loadDeadQueue() {
      const key = deadQueueKey();
      if (!key || !currentUser) return [];
      try {
        const parsed = JSON.parse(localStorage.getItem(key) || '[]');
        if (!Array.isArray(parsed)) return [];
        return parsed.filter(entry => !entry.ownerUserId || entry.ownerUserId === currentUser.id);
      } catch(e) { return []; }
    }
    function keptDeadQueue() {
      const dead = loadDeadQueue().filter(e => e.keep);
      // A loop that was created and then deleted without ever reaching the
      // server has nothing left to save.
      const deletedIds = new Set(dead.filter(e => e.op === 'delete').map(e => e.id));
      const createdIds = new Set(dead.filter(e => e.op === 'create').map(e => e.id));
      return dead.filter(e => !(deletedIds.has(e.id) && createdIds.has(e.id)));
    }
    // Retry: put this device’s unsaved changes back at the front of the queue.
    function requeueDead() {
      const key = deadQueueKey();
      if (!key || !currentUser) return 0;
      const kept = keptDeadQueue();
      try {
        const all = JSON.parse(localStorage.getItem(key) || '[]');
        const rest = Array.isArray(all) ? all.filter(e => !e.keep) : [];
        if (rest.length) localStorage.setItem(key, JSON.stringify(rest));
        else localStorage.removeItem(key);
      } catch(_) {}
      if (kept.length) {
        saveQueue([...kept.map(({ keep, lastError, droppedAt, attempts, ...entry }) => entry), ...loadQueue()]);
      }
      deadQueueDirty = false;
      return kept.length;
    }
    function settleSyncStatus() {
      if ((deadQueueDirty && loadDeadQueue().length) || keptDeadQueue().length) {
        setSyncStatus('error', 'Still saving');
        showSyncErrorBanner();
        return { ok: false, dead: true };
      }
      if (loadQueue().length) {
        setSyncStatus(navigator.onLine ? 'syncing' : 'offline', navigator.onLine ? 'Saving…' : 'Saved offline');
        return { ok: true, pending: true };
      }
      setSyncStatus('synced', 'Synced');
      hideSyncErrorBanner();
      return { ok: true };
    }
    function enqueue(entry) {
      if (!currentUser) return;
      entry.ownerUserId = currentUser.id;
      const q = loadQueue();
      // Coalesce back-to-back updates to the same id so we don’t pile up
      // hundreds of small UPDATEs from typing into an inline edit field.
      // During a drain, q[0] may already be in flight. Only coalesce into a
      // tail entry that is not the active network write.
      if (entry.op === 'update' && q.length && (!draining || q.length > 1)) {
        const last = q[q.length - 1];
        if (last.op === 'update' && last.id === entry.id) {
          last.payload = { ...last.payload, ...entry.payload };
          last.ts = entry.ts;
          saveQueue(q);
          setSyncStatus(navigator.onLine ? 'syncing' : 'offline', navigator.onLine ? 'Saving…' : 'Saved offline');
          return;
        }
      }
      q.push(entry);
      saveQueue(q);
      setSyncStatus(navigator.onLine ? 'syncing' : 'offline', navigator.onLine ? 'Saving…' : 'Saved offline');
    }

    // ── Map between local loop shape and DB row shape ──
    function loopToRow(loop) {
      return {
        id:            loop.id,
        user_id:       currentUser.id,
        raw_text:      loop.rawText || '',
        kind:          VALID_KINDS.has(loop.kind) ? loop.kind : null,
        status:        loop.status || 'active',
        prompt_answer: loop.promptAnswer || '',
        position:      typeof loop.position === 'number' ? loop.position : nowPosition(),
        created_at:    loop.createdAt || nowIso(),
        completed_at:  loop.completedAt || null,
        wake_at:       loop.wakeAt || null,
        details:       cleanDetails(loop.details)
        // updated_at is set by the DB trigger.
      };
    }
    function rowToLoop(row) {
      return sanitize({
        id:           row.id,
        rawText:      row.raw_text || '',
        kind:         row.kind,
        status:       row.status,
        promptAnswer: row.prompt_answer || '',
        position:     row.position,
        createdAt:    row.created_at,
        updatedAt:    row.updated_at,
        completedAt:  row.completed_at,
        wakeAt:       row.wake_at || null,
        details:      row.details || {}
      });
    }
    function patchToRow(patch) {
      const out = {};
      if ('rawText'      in patch) out.raw_text      = patch.rawText;
      if ('kind'         in patch) out.kind          = VALID_KINDS.has(patch.kind) ? patch.kind : null;
      if ('status'       in patch) out.status        = patch.status;
      if ('promptAnswer' in patch) out.prompt_answer = patch.promptAnswer;
      if ('position'     in patch) out.position      = patch.position;
      if ('deleted_at'   in patch) out.deleted_at    = patch.deleted_at;
      if ('completedAt'  in patch) out.completed_at  = patch.completedAt;
      if ('completed_at' in patch) out.completed_at  = patch.completed_at;
      if ('wakeAt'       in patch) out.wake_at       = patch.wakeAt || null;
      if ('details'      in patch) out.details       = cleanDetails(patch.details);
      return out;
    }

    // ── Columns added after launch ──
    // wake_at and details arrived with wake-ups. If a database hasn’t run the
    // newer SQL yet, writes would fail on the unknown columns and pile up in
    // the dead queue. Instead: notice once, keep syncing everything else, and
    // keep those two fields on this device until the columns exist.
    const NEW_COLUMNS = ['wake_at', 'details'];
    let missingNewColumns = false;
    function isMissingNewColumn(error) {
      if (!error) return false;
      const text = [error.message, error.details, error.hint].filter(Boolean).join(' ');
      return NEW_COLUMNS.some(c => text.includes(`'${c}'`) || text.includes(`"${c}"`)) &&
        (error.code === 'PGRST204' || error.code === '42703' || /column/i.test(text));
    }
    function noteMissingColumns() {
      if (missingNewColumns) return;
      missingNewColumns = true;
      console.warn('[open-loops] The loops table has no wake_at/details columns yet. Run the latest open-loops-supabase.sql. Until then, wake times and details stay on this device.');
    }
    function withoutNewColumns(row) {
      const out = { ...row };
      NEW_COLUMNS.forEach(c => { delete out[c]; });
      return out;
    }

    // ── Single-row network ops ──
    async function netCreate(loop) {
      markEcho(loop.id);
      let row = loopToRow(loop);
      if (missingNewColumns) row = withoutNewColumns(row);
      let { error } = await db.from('loops').upsert(row, { onConflict: 'id' });
      if (error && !missingNewColumns && isMissingNewColumn(error)) {
        noteMissingColumns();
        ({ error } = await db.from('loops').upsert(withoutNewColumns(row), { onConflict: 'id' }));
      }
      if (error) throw error;
    }
    async function netUpdate(id, patch) {
      let row = patchToRow(patch);
      if (missingNewColumns) row = withoutNewColumns(row);
      if (!Object.keys(row).length) return;
      markEcho(id);
      let { data: updated, error } = await db.from('loops').update(row).eq('id', id).select('id').maybeSingle();
      if (error && !missingNewColumns && isMissingNewColumn(error)) {
        noteMissingColumns();
        row = withoutNewColumns(row);
        if (!Object.keys(row).length) return;
        ({ data: updated, error } = await db.from('loops').update(row).eq('id', id).select('id').maybeSingle());
      }
      if (error) throw error;
      if (!updated) throw gone('No matching loop was updated for this signed-in user.');
    }

    // Server rows from a database without the new columns carry no wake time
    // or details. Keep this device’s copy of those two fields instead of
    // wiping them on every pull.
    function keepLocalNewFields(remoteLoops, rows) {
      const serverHasThem = rows.some(r => 'wake_at' in r || 'details' in r);
      if (serverHasThem) return remoteLoops;
      noteMissingColumns();
      const localById = new Map(data.loops.map(l => [l.id, l]));
      return remoteLoops.map(l => {
        const local = localById.get(l.id);
        return local ? { ...l, wakeAt: local.wakeAt, details: local.details } : l;
      });
    }
    async function netDelete(id) {
      markEcho(id);
      const { data: updated, error } = await db.from('loops')
        .update({ deleted_at: nowIso() })
        .eq('id', id)
        .select('id')
        .maybeSingle();
      if (error) throw error;
      if (!updated) throw gone('No matching loop was deleted for this signed-in user.');
    }
    async function netUndelete(id) {
      markEcho(id);
      const { data: updated, error } = await db.from('loops')
        .update({ deleted_at: null })
        .eq('id', id)
        .select('id')
        .maybeSingle();
      if (error) throw error;
      if (!updated) throw gone('No matching loop was restored for this signed-in user.');
    }

    // Max attempts per queue entry before moving it to a dead-letter queue.
    // Prevents a single poison-pill entry from blocking every edit behind it.
    // Only a write the server understood and refused can end up there: one
    // that never got an answer is retried for as long as it takes.
    const MAX_QUEUE_ATTEMPTS = 5;

    // The row this write needs isn’t on the server, so retrying won’t help.
    function gone(message) {
      const e = new Error(message);
      e.permanent = true;
      return e;
    }
    // Worth trying again: no answer at all (offline, server down, a paused
    // project, a Wi-Fi login page), a timeout, a busy database or an expired
    // sign-in. Anything the server understood and refused is not.
    function isRetryableError(e) {
      if (!e) return true;
      if (e.permanent) return false;
      const code = String(e.code || '');
      if (!code) return true;
      if (/^PGRST(0\d\d|3\d\d)$/.test(code)) return true;
      return /^(08|40|53|57|58)/.test(code);
    }

    function moveToDeadQueue(entry, error) {
      const key = deadQueueKey();
      if (!key) return;
      try {
        const dead = JSON.parse(localStorage.getItem(key) || '[]');
        // keep: still this device’s change. Pulls keep showing it and Retry
        // sends it again; older entries without it are history only.
        dead.push({
          ...entry,
          keep: true,
          lastError: String(error && error.message ? error.message : error),
          droppedAt: Date.now()
        });
        // Keep the last 50 dead entries — enough for debugging, not enough to
        // bloat localStorage if something is spamming failures.
        localStorage.setItem(key, JSON.stringify(dead.slice(-50)));
      } catch(_) {}
    }

    async function processQueue() {
      if (!currentUser) return { ok: true, pending: true };
      if (draining) return { ok: true, pending: loadQueue().length > 0 };
      if (pulling) return { ok: true, pending: loadQueue().length > 0 };
      if (!loadQueue().length) return settleSyncStatus();
      draining = true;
      let chainAfterRun = true;
      setSyncStatus(navigator.onLine ? 'syncing' : 'offline', navigator.onLine ? 'Saving…' : 'Saved offline');
      try {
        while (true) {
          if (!navigator.onLine) {
            setSyncStatus('offline', 'Saved offline');
            scheduleRetry(1);
            chainAfterRun = false;
            return { ok: true, pending: true };
          }
          const q = loadQueue();
          if (!q.length) {
            return settleSyncStatus();
          }
          const entry = q[0];
          if (entry.ownerUserId && entry.ownerUserId !== currentUser.id) {
            chainAfterRun = false;
            throw new Error('Queued write belongs to a different signed-in user.');
          }
          entry.attempts = (entry.attempts || 0) + 1;
          try {
            if      (entry.op === 'create')   await netCreate(entry.payload);
            else if (entry.op === 'update')   await netUpdate(entry.id, entry.payload);
            else if (entry.op === 'delete')   await netDelete(entry.id);
            else if (entry.op === 'undelete') await netUndelete(entry.id);
            // Success — pop the head.
            const latest = loadQueue();
            latest.shift();
            saveQueue(latest);
          } catch(e) {
            console.error(`Queue drain error (attempt ${entry.attempts}):`, e, entry);
            chainAfterRun = false;

            // Poison-pill: after MAX_QUEUE_ATTEMPTS, move this entry to the
            // dead-letter queue so it stops blocking everything behind it.
            // A write that never got an answer stays at the head and keeps
            // retrying; dropping it would lose it at the next pull.
            if (entry.attempts >= MAX_QUEUE_ATTEMPTS && !isRetryableError(e)) {
              const latest = loadQueue();
              const skipped = latest.shift();
              saveQueue(latest);
              moveToDeadQueue(skipped, e);
              deadQueueDirty = true;
              console.warn('[open-loops] Moved poison-pill entry to dead queue:', skipped);
              // Keep draining — the next entry might succeed.
              continue;
            }

            // Persist the bumped attempt counter so it survives a reload.
            const latest = loadQueue();
            if (latest[0] && latest[0].id === entry.id && latest[0].op === entry.op) {
              latest[0] = entry;
              saveQueue(latest);
            }
            setSyncStatus('error', 'Still saving');
            showSyncErrorBanner();
            scheduleRetry(entry.attempts);
            return { ok: false, error: e };
          }
        }
      } finally {
        const shouldChain = chainAfterRun && currentUser && navigator.onLine && loadQueue().length;
        draining = false;
        if (shouldChain) {
          // More work showed up while we were draining — chain another pass
          // without awaiting so we don’t deepen the call stack.
          Promise.resolve().then(processQueue);
        }
      }
    }

    // Exponential backoff: 4s, 8s, 16s, 32s, capped at 60s. Prevents
    // hammering Supabase when the server is flaky or rate-limiting us.
    function scheduleRetry(attempts) {
      if (retryTimer) return;
      const n = Math.max(1, attempts || 1);
      const delay = Math.min(60000, 4000 * Math.pow(2, n - 1));
      retryTimer = setTimeout(async () => {
        retryTimer = null;
        if (currentUser && navigator.onLine && loadQueue().length) {
          await processQueue();
        }
      }, delay);
    }

    function applyPendingQueueOverlay(remoteLoops) {
      const pending = [...keptDeadQueue(), ...loadQueue()];
      if (!pending.length) return remoteLoops;

      const byId = new Map(remoteLoops.map(loop => [loop.id, loop]));
      const localById = new Map(data.loops.map(loop => [loop.id, loop]));

      for (const entry of pending) {
        if (entry.ownerUserId && entry.ownerUserId !== currentUser.id) continue;

        if (entry.op === 'create') {
          const source = localById.get(entry.id) || entry.payload;
          if (source) byId.set(entry.id, sanitize(source));
        } else if (entry.op === 'update') {
          const base = byId.get(entry.id) || localById.get(entry.id);
          if (base) {
            const local = localById.get(entry.id);
            byId.set(entry.id, sanitize({
              ...base,
              ...entry.payload,
              updatedAt: (local && local.updatedAt) || base.updatedAt || nowIso()
            }));
          }
        } else if (entry.op === 'delete') {
          byId.delete(entry.id);
        } else if (entry.op === 'undelete') {
          const local = localById.get(entry.id);
          if (local) byId.set(entry.id, sanitize(local));
        }
      }

      return Array.from(byId.values()).sort((a, b) => (b.position || 0) - (a.position || 0));
    }

    // ── Full pull (on login / init) ──
    async function pullAll() {
      // Capture the user we’re pulling for. If the user signs out (or signs in
      // as a different account) while any of these awaits are in flight, we
      // must abort — otherwise we’d overwrite the new user’s data with the
      // previous user’s server rows.
      const pullForUser = currentUser;
      if (!pullForUser) return;
      setSyncStatus('syncing', 'Syncing…');
      pulling = true;
      try {
        const { data: rows, error } = await db
          .from('loops')
          .select('*')
          .is('deleted_at', null)
          .order('position', { ascending: false });
        if (currentUser !== pullForUser) return;   // user switched mid-pull
        if (error) throw error;

        if (!rows || !rows.length) {
          // Empty visible server. But don’t blindly re-seed — the server
          // might just have everything soft-deleted. If there are ANY rows
          // (including deleted) we treat the server as "initialized" and
          // trust it. Only seed if the server has genuinely never seen
          // this user’s data.
          const { count, error: countErr } = await db
            .from('loops')
            .select('id', { count: 'exact', head: true });
          if (currentUser !== pullForUser) return; // user switched mid-pull
          if (countErr) throw countErr;

          const serverTrulyEmpty = (count || 0) === 0;
          const protectedLocalLoops = applyPendingQueueOverlay([]);

          if (serverTrulyEmpty && data.loops && data.loops.length) {
            const payload = data.loops.map(l => ({
              id:           l.id,
              rawText:      l.rawText,
              kind:         l.kind,
              status:       l.status,
              promptAnswer: l.promptAnswer,
              position:     l.position,
              createdAt:    l.createdAt,
              completedAt:  l.completedAt || null,
              wakeAt:       l.wakeAt || null,
              details:      l.details || {}
            }));
            const { error: upErr } = await db.rpc('batch_upsert_loops', { p_loops: payload });
            if (currentUser !== pullForUser) return; // user switched mid-seed
            if (upErr) throw upErr;
          } else if (protectedLocalLoops.length) {
            // A server pull should not erase local edits that are still queued.
            data = {
              version:    2,
              lastLoopId: data.lastLoopId && protectedLocalLoops.some(l => l.id === data.lastLoopId)
                ? data.lastLoopId
                : (protectedLocalLoops.find(l => l.status === 'active')?.id || null),
              activeTab:  view.activeTab || 'now',
              loops:      protectedLocalLoops
            };
            save();
            renderMain();
          } else if (!serverTrulyEmpty) {
            // Server has data, but it’s all soft-deleted. Trust the server:
            // clear local state so we don’t silently resurrect rows the
            // user deleted on another device.
            data = {
              version:    2,
              lastLoopId: null,
              activeTab:  view.activeTab || 'now',
              loops:      []
            };
            save();
            renderMain();
          }
          setBoot('ready');
          settleSyncStatus();
          return;
        }

        // Server has data — server is truth on pull. Replace local state.
        const remoteLoops = applyPendingQueueOverlay(keepLocalNewFields(rows.map(rowToLoop), rows));
        const keepLast = data.lastLoopId && remoteLoops.some(l => l.id === data.lastLoopId);
        data = {
          version:    2,
          lastLoopId: keepLast ? data.lastLoopId : (remoteLoops.find(l => l.status === 'active')?.id || null),
          activeTab:  view.activeTab || 'now',
          loops:      remoteLoops
        };
        save();
        bootState === 'ready' ? renderMain() : setBoot('ready');
        settleSyncStatus();
      } catch(e) {
        if (currentUser !== pullForUser) return;   // ignore errors from a stale pull
        console.error('Pull error:', e);
        // Nothing saved here to show instead: the page says it can’t reach
        // your loops, rather than "empty". The "Still saving" banner is about
        // queued edits, so it stays out of that screen unless edits are queued.
        if (bootState === 'loading' || bootState === 'unreachable') {
          setSyncStatus('error', 'Offline');
          if (loadQueue().length) showSyncErrorBanner();
          setBoot('unreachable');
        } else {
          setSyncStatus('error', 'Still saving');
          showSyncErrorBanner();
        }
      } finally {
        pulling = false;
        if (currentUser && currentUser === pullForUser && navigator.onLine && loadQueue().length) processQueue();
      }
    }

    // ── Realtime: apply per-row changes from other devices ──
    // Tracks state for reconnection logic. Supabase realtime channels can drop
    // for many reasons (network blip, sleep, JWT expiry, free-tier idle cuts),
    // and without a status callback we’d never notice. When a channel drops we
    // tear it down, re-subscribe, and do a pullAll() to catch up on anything
    // we missed while disconnected.
    let realtimeReconnectTimer = null;
    // When setupRealtime is called right after an explicit pullAll (during
    // init or SIGNED_IN), we don’t need to pull again on the first SUBSCRIBED
    // event. Subsequent SUBSCRIBEDs (from reconnects) still pull to catch up.
    let skipNextSubscribePull = false;

    function scheduleRealtimeReconnect() {
      if (realtimeReconnectTimer) return;
      realtimeReconnectTimer = setTimeout(() => {
        realtimeReconnectTimer = null;
        if (currentUser && navigator.onLine && !document.hidden) {
          setupRealtime();
        }
      }, 3000);
    }

    function setupRealtime(opts) {
      if (!currentUser) return;
      skipNextSubscribePull = !!(opts && opts.skipInitialPull);
      const seq = ++channelSeq;
      channelHealthy = false;
      channelConnecting = true;
      // Tear down any existing channel before creating a new one. Re-using a
      // dead channel is how we end up silently missing events.
      if (channel) {
        try { db.removeChannel(channel); } catch(_) {}
        channel = null;
      }
      const nextChannel = db.channel(`loops:${currentUser.id}`);
      channel = nextChannel;
      nextChannel
        .on('postgres_changes',
          { event: '*', schema: 'public', table: 'loops', filter: `user_id=eq.${currentUser.id}` },
          payload => {
            if (seq !== channelSeq || channel !== nextChannel) return;
            const eventType = payload.eventType || payload.event;
            const row = payload.new || payload.old;
            if (!row || !row.id) return;

            // Ignore echoes of our own recent writes.
            if (isEcho(row.id)) return;

            if (eventType === 'DELETE') {
              // Hard delete (rare — we soft-delete).
              data.loops = data.loops.filter(l => l.id !== row.id);
              if (data.lastLoopId === row.id) data.lastLoopId = null;
              save();
              renderAll();
              return;
            }

            const incoming = payload.new;
            if (!incoming) return;

            // Soft delete: drop from local list.
            if (incoming.deleted_at) {
              data.loops = data.loops.filter(l => l.id !== incoming.id);
              if (data.lastLoopId === incoming.id) data.lastLoopId = null;
              save();
              renderAll();
              return;
            }

            const mapped = rowToLoop(incoming);
            const idx = data.loops.findIndex(l => l.id === mapped.id);
            if (idx === -1) {
              // New row from another device — insert at top (matches createLoop).
              data.loops.unshift(mapped);
            } else {
              // Fix 5: if our local copy is newer than what realtime is
              // sending us, don’t clobber. This handles the case where we
              // just wrote locally and haven’t gotten our own echo yet, or
              // the case where a stale queued write from another device
              // arrives late.
              const existing = data.loops[idx];
              const localTs  = existing && existing.updatedAt ? new Date(existing.updatedAt).getTime() : 0;
              const remoteTs = mapped.updatedAt ? new Date(mapped.updatedAt).getTime() : 0;
              if (localTs && remoteTs && localTs > remoteTs) return;
              if (existing && !('wake_at' in incoming) && !('details' in incoming)) {
                mapped.wakeAt = existing.wakeAt;
                mapped.details = existing.details;
              }
              data.loops[idx] = mapped;
            }
            save();
            renderAll();
          })
        .subscribe(async (status, err) => {
          if (seq !== channelSeq || channel !== nextChannel) return;
          if (status === 'SUBSCRIBED') {
            channelHealthy = true;
            channelConnecting = false;
            // Fresh subscription — we may have missed events while we were
            // disconnected (or during initial setup). Pull to catch up —
            // unless the caller told us a pullAll just ran.
            if (skipNextSubscribePull) {
              skipNextSubscribePull = false;
              return;
            }
            try { await pullAll(); } catch(_) {}
          } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
            console.warn('[open-loops] Realtime channel dropped:', status, err);
            channelHealthy = false;
            channelConnecting = false;
            skipNextSubscribePull = false;
            try { db.removeChannel(nextChannel); } catch(_) {}
            if (channel === nextChannel) channel = null;
            scheduleRealtimeReconnect();
          }
        });
    }

    async function handleAuthStateChange(event, session) {
      if (event === 'SIGNED_IN' && session) {
        currentUser = session.user;
        setLocalUser(currentUser);
        const foundLegacyData = quarantineLegacyLocalData();
        const foundLegacyQueue = quarantineLegacyQueueData();
        const foundLegacy = foundLegacyData || foundLegacyQueue;
        load();
        rememberAccount(currentUser.id);
        // Draw this phone’s saved loops now; the pull below corrects them.
        bootFromSavedCopy();
        cleanUrl();
        setSyncStatus('syncing', 'Syncing…');
        // Drain only this user’s offline queue, then pull server truth.
        if (loadQueue().length) await processQueue();
        await pullAll();
        setupRealtime({ skipInitialPull: true });
        // Auth gate → hide; reveal app
        authReady = true;
        hideAuthGate();
        view.authGateSent = false;
        // Trigger onboarding on first sign-in
        if (!hasCompletedOnboarding()) {
          startOnboarding();
        }
        renderAll();
        if (foundLegacy) toast('An older copy of your loops is kept on this device, just in case.');
        else wakeDueLoops();
      } else if (event === 'TOKEN_REFRESHED' && session) {
        // Fix 4: the JWT was refreshed. Realtime uses this token — if we
        // don’t tell it about the new one, the channel will die the next
        // time the old token expires at the server. Also re-subscribe so
        // any silently-dropped channel gets rebuilt.
        currentUser = session.user;
        setLocalUser(currentUser);
        try {
          if (db.realtime && typeof db.realtime.setAuth === 'function') {
            db.realtime.setAuth(session.access_token);
          }
        } catch(_) {}
        setupRealtime();
      } else if (event === 'SIGNED_OUT') {
        currentUser = null;
        setLocalUser(null);
        channelHealthy = false;
        channelConnecting = false;
        channelSeq++;
        if (channel) { db.removeChannel(channel); channel = null; }
        // Clean up any pending retry timers so they don’t fire stale.
        if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
        if (realtimeReconnectTimer) { clearTimeout(realtimeReconnectTimer); realtimeReconnectTimer = null; }
        resetLocalAppState();
        // A signed-out phone must never paint the previous person’s loops.
        forgetAccount();
        bootState = 'ready';
        setSyncStatus('idle', 'Sync');
        hideSyncErrorBanner();
        renderAll();
      }
    }

    db.auth.onAuthStateChange((event, session) => {
      setTimeout(() => {
        handleAuthStateChange(event, session).catch(e => {
          console.error('Auth state change error:', e);
          setSyncStatus('error', 'Still saving');
          showSyncErrorBanner();
        });
      }, 0);
    });

    return {
      async init() {
        try {
          const { data: { session }, error: sessionError } = await db.auth.getSession();
          if (session) {
            currentUser = session.user;
            const sameAsShown = currentLocalUserId === currentUser.id && bootState !== 'starting';
            setLocalUser(currentUser);
            const foundLegacyData = quarantineLegacyLocalData();
            const foundLegacyQueue = quarantineLegacyQueueData();
            const foundLegacy = foundLegacyData || foundLegacyQueue;
            // Already showing this account’s saved copy from the first frame:
            // keep it (and whatever tab or sheet you’ve touched since). Otherwise
            // load it now and draw it before going to the network.
            if (!sameAsShown) { load(); bootFromSavedCopy(); }
            rememberAccount(currentUser.id);
            cleanUrl();
            setSyncStatus('syncing', 'Syncing…');
            if (loadQueue().length) await processQueue();
            await pullAll();
            setupRealtime({ skipInitialPull: true });
            if (foundLegacy) toast('An older copy of your loops is kept on this device, just in case.');
            else wakeDueLoops({ quiet: /[?&](sweep|loop)=/.test(location.search) });
            resyncNudges();
          } else if (!sessionError) {
            // Signed out for real (not just a failed check): forget the account.
            forgetAccount();
          }
        } catch(e) {
          console.error('Sync init error:', e);
          setSyncStatus('error', 'Still saving');
          showSyncErrorBanner();
        }
        // Auth check complete. The app remains locked until a user signs in.
        authReady = true;
        if (!currentUser) {
          // The first frame may have shown a remembered account’s saved loops;
          // take them down before the sign-in screen goes up.
          if (currentLocalUserId) { setLocalUser(null); resetLocalAppState(); renderAll(); }
          bootState = 'ready';
          renderAuthGate();
        } else if (!hasCompletedOnboarding()) {
          startOnboarding();
        } else {
          takeDeepLink(location.search);
          askCalendarBack();
        }
      },

      // Mutations: enqueue + drain. If offline, the queue persists and drains
      // on the 'online'/'focus' event or on next init.
      createLoop(loop) {
        if (!loop || !loop.id) return;
        enqueue({ op: 'create', id: loop.id, payload: loop, ts: Date.now() });
        if (currentUser && navigator.onLine) processQueue();
        else if (!navigator.onLine) { setSyncStatus('offline', 'Saved offline'); scheduleRetry(); }
      },
      updateLoop(loopId, changes) {
        if (!loopId || !changes) return;
        enqueue({ op: 'update', id: loopId, payload: { ...changes }, ts: Date.now() });
        if (currentUser && navigator.onLine) processQueue();
        else if (!navigator.onLine) { setSyncStatus('offline', 'Saved offline'); scheduleRetry(); }
      },
      deleteLoop(loopId) {
        if (!loopId) return;
        enqueue({ op: 'delete', id: loopId, ts: Date.now() });
        if (currentUser && navigator.onLine) processQueue();
        else if (!navigator.onLine) { setSyncStatus('offline', 'Saved offline'); scheduleRetry(); }
      },
      undeleteLoop(loopId) {
        if (!loopId) return;
        enqueue({ op: 'undelete', id: loopId, ts: Date.now() });
        if (currentUser && navigator.onLine) processQueue();
        else if (!navigator.onLine) { setSyncStatus('offline', 'Saved offline'); scheduleRetry(); }
      },

      async processQueue() {
        if (!currentUser) return { ok: true, pending: true };
        return await processQueue();
      },

      async retry() {
        if (!currentUser) return { ok: true, pending: true };
        setSyncStatus('syncing', 'Syncing…');
        requeueDead();
        try {
          const r = await processQueue();
          if (!r.ok) return r;
          await pullAll();
          setupRealtime({ skipInitialPull: true });
          return { ok: true };
        } catch(e) {
          setSyncStatus('error', 'Still saving');
          return { ok: false, error: e };
        }
      },

      // Called from visibilitychange / focus / online handlers. Verifies the
      // realtime channel is still alive — if not, rebuilds it (which does a
      // pullAll on SUBSCRIBED to catch up on missed events).
      ensureRealtime() {
        if (!currentUser) return;
        if (!channel || (!channelHealthy && !channelConnecting)) setupRealtime();
      },

      async sendMagicLink(email) {
        const redirect = CFG.EMAIL_REDIRECT_TO || (IS_FILE ? null : `${location.origin}${location.pathname}`);
        if (!redirect) throw new Error('Set EMAIL_REDIRECT_TO in open-loops-config.js (required when running from file://).');
        const { error } = await db.auth.signInWithOtp({ email, options: { emailRedirectTo: redirect } });
        if (error) throw error;
      },

      async signOut() { await db.auth.signOut(); },
      isLoggedIn() { return !!currentUser; },
      userEmail() { return (currentUser && currentUser.email) || ''; },

      // Nudges: this device’s push subscription and its settings.
      async savePush(sub, p) {
        if (!currentUser) throw new Error('Sign in first.');
        const keys = (sub && sub.keys) || {};
        const row = {
          endpoint: sub.endpoint,
          user_id: currentUser.id,
          p256dh: keys.p256dh,
          auth: keys.auth,
          tz: (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC'; } catch (_) { return 'UTC'; } })(),
          nudge_time: p.time || '09:00',
          wakeups: !!p.wakeups,
          stale: !!p.stale,
          recap: !!p.recap
        };
        // A check-in time that has already passed today starts tomorrow, so
        // changing the time never fires a surprise check-in right away. A
        // time still ahead today can come today (unless one already did).
        const now = new Date();
        const t = /^(\d{1,2}):(\d{2})/.exec(row.nudge_time);
        row.quiet_on = t && atTime(now, +t[1], +t[2]) <= now ? localDateValue(now) : null;
        const { data: saved, error } = await db.from('push_subscriptions')
          .upsert(row, { onConflict: 'endpoint' })
          .select('last_run_on, last_stale_at')
          .maybeSingle();
        if (error) throw error;
        return saved ? { lastRunOn: saved.last_run_on || null, lastStaleAt: saved.last_stale_at || null } : null;
      },
      async deletePush(endpoint) {
        if (!currentUser || !endpoint) return;
        const { error } = await db.from('push_subscriptions').delete().eq('endpoint', endpoint);
        if (error) throw error;
      },
      async testPush(endpoint) {
        const { data, error } = await db.functions.invoke('push', { body: { job: 'test', endpoint } });
        if (error) throw error;
        return data;
      },
      // Whether the server still has this device. null when it can’t tell.
      async pushRowExists(endpoint) {
        if (!currentUser || !endpoint) return null;
        try {
          const { data, error } = await db.from('push_subscriptions').select('endpoint').eq('endpoint', endpoint).maybeSingle();
          if (error) return null;
          return !!data;
        } catch (_) { return null; }
      }
    };
  })();

  function setSyncStatus(key, text) {
    view.syncStatus = key;
    view.syncText = text;
    renderHeader();
    refreshAccountCard();
  }

  // ── THEME ──
  function setTheme(theme) {
    if (theme !== 'light' && theme !== 'dark') theme = 'dark';
    view.theme = theme;
    document.documentElement.setAttribute('data-theme', theme);
    try { localStorage.setItem(THEME_KEY, theme); } catch(e) {}
    // Swap the theme-color meta so browser chrome (Android/iOS) follows along.
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', theme === 'light' ? '#fffaf0' : '#0a1a1a');
    renderThemeIcon();
  }

  function loadTheme() {
    let saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch(e) {}
    if (saved === 'light' || saved === 'dark') {
      setTheme(saved);
      return;
    }
    // Fall back to system preference on first run.
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    setTheme(prefersDark ? 'dark' : 'light');
  }

  function renderThemeIcon() {
    const btn = document.getElementById('theme-toggle');
    if (!btn) return;
    const isDark = view.theme === 'dark';
    // Dark mode → show moon (click to go light). Light mode → show sun.
    btn.innerHTML = isDark
