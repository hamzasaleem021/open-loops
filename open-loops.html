    // iOS Safari allows playback.
    function unlock() {
      if (!enabled) return null;
      try {
        if (!ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          ctx = new AC();
          const comp = ctx.createDynamicsCompressor();
          out = ctx.createGain();
          out.gain.value = 0.3;
          out.connect(comp);
          comp.connect(ctx.destination);
        }
        if (ctx.state === 'suspended') ctx.resume();
      } catch (_) { return null; }
      return ctx;
    }

    function env(g, t, peak, attack, decay) {
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + attack);
      g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
    }

    // Kalimba-ish pluck: sine body + short inharmonic "tine" overtone.
    function pluck(freq, at = 0, vel = 1, decay = 1.1) {
      const c = unlock(); if (!c) return;
      const t = c.currentTime + at;
      const body = c.createOscillator(); body.type = 'sine'; body.frequency.value = freq;
      const tine = c.createOscillator(); tine.type = 'sine'; tine.frequency.value = freq * 5.4;
      const gb = c.createGain(); const gt = c.createGain();
      env(gb, t, 0.5 * vel, 0.006, decay);
      env(gt, t, 0.1 * vel, 0.003, 0.09);
      body.connect(gb); tine.connect(gt); gb.connect(out); gt.connect(out);
      body.start(t); tine.start(t);
      body.stop(t + decay + 0.1); tine.stop(t + 0.15);
    }

    function noise(at, dur, opts = {}) {
      const c = unlock(); if (!c) return;
      const { type = 'lowpass', from = 400, to = 400, q = 0.8, vel = 0.2, attack = 0.004 } = opts;
      const t = c.currentTime + at;
      const len = Math.max(1, Math.ceil(c.sampleRate * dur));
      const buf = c.createBuffer(1, len, c.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = c.createBufferSource(); src.buffer = buf;
      const f = c.createBiquadFilter(); f.type = type; f.Q.value = q;
      f.frequency.setValueAtTime(from, t);
      f.frequency.exponentialRampToValueAtTime(to, t + dur);
      const g = c.createGain();
      env(g, t, vel, attack, Math.max(0.02, dur - attack));
      src.connect(f); f.connect(g); g.connect(out);
      src.start(t); src.stop(t + dur + 0.05);
    }

    // Soft clay "thunk": falling sine plus a puff of filtered noise.
    function thud(at = 0, vel = 0.5) {
      const c = unlock(); if (!c) return;
      const t = c.currentTime + at;
      const o = c.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(150, t);
      o.frequency.exponentialRampToValueAtTime(55, t + 0.13);
      const g = c.createGain();
      env(g, t, vel, 0.005, 0.16);
      o.connect(g); g.connect(out);
      o.start(t); o.stop(t + 0.25);
      noise(at, 0.06, { from: 900, to: 280, vel: vel * 0.22 });
    }

    const cues = {
      // pebble dropping into the Inbox jar
      capture:  () => { thud(0, 0.32); pluck(N.A3, 0.012, 0.75, 0.8); },
      // two notes up: into focus
      up:       () => { pluck(N.A4, 0, 0.65, 0.7); pluck(N.D5, 0.085, 0.65, 0.9); },
      // two notes down: set aside
      down:     () => { pluck(N.D5, 0, 0.5, 0.6); pluck(N.A4, 0.09, 0.45, 0.8); },
      // back from Parked
      wake:     () => { pluck(N.A4, 0, 0.55); pluck(N.D5, 0.08, 0.55); pluck(N.Fs5, 0.16, 0.4, 1.4); },
      // the loop seals: a suspended interval, still unresolved
      seal:     () => { pluck(N.E4, 0, 0.6, 1.0); pluck(N.A4, 0.075, 0.6, 1.2); },
      // it lands in Closed: resolves to D major
      land:     () => { thud(0, 0.42); pluck(N.D4, 0.01, 0.7, 1.6); pluck(N.Fs4, 0.035, 0.55, 1.6); pluck(N.D5, 0.06, 0.6, 1.9); },
      // let go: an exhale, no resolution
      release:  () => { noise(0, 0.75, { type: 'bandpass', from: 650, to: 2600, q: 1.1, vel: 0.07, attack: 0.28 }); pluck(N.E5, 0.14, 0.3, 1.4); },
      quickLand: () => { thud(0, 0.3); pluck(N.D5, 0.01, 0.45, 1.0); pluck(N.Fs4, 0.03, 0.3, 1.0); },
      softLand: () => { pluck(N.B4, 0, 0.32, 1.6); pluck(N.Fs5, 0.07, 0.22, 1.8); },
      // reopen: the closing chord, backwards
      reopen:   () => { pluck(N.D5, 0, 0.5, 0.6); pluck(N.A4, 0.07, 0.45, 0.6); pluck(N.E4, 0.14, 0.5, 1.0); },
    };

    function hint() {
      if (hinted) return;
      hinted = true;
      try { localStorage.setItem(SOUND_HINT_KEY, '1'); } catch (_) {}
      // Wait until no sheet is open, so the hint never covers a flow.
      let tries = 0;
      const show = () => {
        if (view.overlay && tries++ < 20) { setTimeout(show, 1000); return; }
        toast('Sound is on. You can turn it off in Settings.');
      };
      setTimeout(show, 1700);
    }

    return {
      get enabled() { return enabled; },
      set(on) {
        enabled = !!on;
        hinted = true;
        try {
          localStorage.setItem(SOUND_KEY, on ? 'on' : 'off');
          localStorage.setItem(SOUND_HINT_KEY, '1');
        } catch (_) {}
      },
      unlock,
      play(name) {
        if (!enabled) return;
        const fn = cues[name];
        if (!fn) return;
        try { fn(); } catch (_) {}
        hint();
      }
    };
  })();

  // ── MOTION ──
  // Every move shows where the loop went. Data is saved first; motion only
  // replays the change. Flights and sounds run only for this device's own
  // taps, never for realtime updates arriving from another device.
  const Motion = (() => {
    const EASE = 'cubic-bezier(.2,.8,.2,1)';
    const MUTATING = new Set([
      'save-raw-loop', 'finish-define-raw', 'complete-done', 'move-waiting',
      'move-released', 'restore-active', 'confirm-delete', 'set-kind-direct'
    ]);
    let layer = null;
    let gesture = null;
    let lastTab = null;
    let lastStatuses = null;

    const reduced = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    const isLocal = () => !!gesture && performance.now() - gesture.t < 1800;

    function ensureLayer() {
      if (layer && document.body.contains(layer)) return layer;
      layer = document.createElement('div');
      layer.className = 'motion-layer';
      layer.setAttribute('aria-hidden', 'true');
      document.body.appendChild(layer);
      return layer;
    }

    function kindColor(kind) {
      const v = getComputedStyle(document.documentElement).getPropertyValue(`--${kind || 'inbox'}`).trim();
      return v || '#ffb084';
    }

    function place(el, x, y, w, h) {
      Object.assign(el.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
    }

    function fadeOut(el, ms = 200) {
      const a = el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: ms, easing: 'ease-out', fill: 'forwards' });
      a.onfinish = () => el.remove();
    }

    function bump(el) {
      if (!el) return;
      el.animate([
        { transform: 'scale(1)' },
        { transform: 'scale(1.22, .84)', offset: 0.3 },
        { transform: 'scale(.94, 1.07)', offset: 0.62 },
        { transform: 'scale(1)' }
      ], { duration: 460, easing: 'ease-out' });
    }

    // Quadratic arc from (x0,y0) to (x1,y1), lifted above both ends.
    function arc(x0, y0, x1, y1, lift, steps, frame) {
      const cx = (x0 + x1) / 2;
      const cy = Math.min(y0, y1) - lift;
      const out = [];
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const x = (1 - t) * (1 - t) * x0 + 2 * (1 - t) * t * cx + t * t * x1;
        const y = (1 - t) * (1 - t) * y0 + 2 * (1 - t) * t * cy + t * t * y1;
        out.push(Object.assign({ offset: t }, frame(t, x, y)));
      }
      return out;
    }

    function tabTarget(tab) {
      if (tab === 'done') return document.getElementById('archive-btn');
      const els = Array.from(document.querySelectorAll(`[data-action="set-tab"][data-tab="${tab}"]`));
      return els.find(e => {
        const r = e.getBoundingClientRect();
        return r.width > 0 && r.height > 0 && getComputedStyle(e).visibility !== 'hidden';
      }) || null;
    }
    const tabFor = s => s === 'active' ? 'now' : s === 'waiting' ? 'later' : s === 'inbox' ? 'inbox' : 'done';

    // A ball of clay in the loop's kind color.
    function token(color, size) {
      const t = document.createElement('div');
      t.className = 'motion-token';
      t.style.setProperty('--tok', color);
      t.style.width = t.style.height = size + 'px';
      ensureLayer().appendChild(t);
      return t;
    }

    function ghostOf(b) {
      const g = b.el.cloneNode(true);
      g.querySelectorAll('[id]').forEach(n => n.removeAttribute('id'));
      g.removeAttribute('draggable');
      g.classList.add('motion-ghost');
      g.style.animation = 'none';
      g.style.opacity = '';
      place(g, b.rect.left, b.rect.top, b.rect.width, b.rect.height);
      ensureLayer().appendChild(g);
      return g;
    }

    function hideContents(g, ms = 150) {
      Array.from(g.children).forEach(c => c.animate([{ opacity: 1 }, { opacity: 0 }], { duration: ms, fill: 'forwards' }));
    }

    // Sheet leaves smoothly instead of vanishing; for Capture it shrinks
    // into the pellet that then drops into Inbox.
    let lastExitAt = 0;
    function exitSheet(ov, toPellet) {
      lastExitAt = performance.now();
      const r = ov.getBoundingClientRect();
      const L = ensureLayer();
      const g = ov.cloneNode(true);
      const srcFields = ov.querySelectorAll('textarea, input');
      g.querySelectorAll('textarea, input').forEach((f, i) => { if (srcFields[i]) f.value = srcFields[i].value; });
      g.querySelectorAll('[id]').forEach(n => n.removeAttribute('id'));
      g.removeAttribute('id');
      g.classList.add('motion-sheet');
      place(g, r.left, r.top, r.width, r.height);
      const bd = document.createElement('div');
      bd.className = 'motion-backdrop';
      L.append(bd, g);
      bd.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 280, easing: 'ease-out', fill: 'forwards' }).onfinish = () => bd.remove();
      if (reduced()) { fadeOut(g, 160); return; }
      const a = toPellet
        ? g.animate([
            { transform: 'none', opacity: 1, borderRadius: '24px' },
            { transform: 'scale(.06)', opacity: 0, borderRadius: '50%' }
          ], { duration: 340, easing: 'cubic-bezier(.55,0,.75,.1)', fill: 'forwards' })
        : g.animate([
            { transform: 'none', opacity: 1 },
            { transform: 'translateY(22px)', opacity: 0 }
          ], { duration: 220, easing: 'ease-in', fill: 'forwards' });
      a.onfinish = () => g.remove();
    }

    function onGesture(e) {
      const el = e.target.closest && e.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action;
      Sound.unlock();
      const ov = document.querySelector('#overlay-root .overlay-card');
      gesture = {
        t: performance.now(),
        action,
        loopId: el.dataset.loopId || (view.overlay && view.overlay.loopId) || null,
        overlayRect: ov ? ov.getBoundingClientRect() : null
      };
      if (ov && MUTATING.has(action)) exitSheet(ov, action === 'save-raw-loop');
    }

    // Which single loop changed because of this tap, and how.
    function pickCue(prev, now) {
      const ids = [];
      if (gesture && gesture.loopId) ids.push(gesture.loopId);
      now.forEach((v, id) => { if (!prev.has(id)) ids.push(id); });
      prev.forEach((v, id) => { if (!now.has(id) || now.get(id).status !== v.status) ids.push(id); });
      for (const id of ids) {
        const p = prev.get(id), n = now.get(id);
        if (p && !n) return { id, from: p.status, to: null, kind: p.kind };
        if (n && !p) return { id, from: null, to: n.status, kind: n.kind };
        if (n && p && n.status !== p.status) return { id, from: p.status, to: n.status, kind: n.kind };
      }
      return null;
    }

    function snapshot(main) {
      const cards = new Map();
      main.querySelectorAll('.loop-card[data-loop-id]').forEach(el => {
        const r = el.getBoundingClientRect();
        if (!r.width) return;
        const cs = getComputedStyle(el);
        cards.set(el.dataset.loopId, {
          el, rect: r, focus: el.classList.contains('is-focus'), bg: cs.backgroundColor, color: cs.color
        });
      });
      const label = main.querySelector('.up-next-label');
      return { tab: lastTab, statuses: lastStatuses, cards, labelRect: label ? label.getBoundingClientRect() : null };
    }

    // Focus card promotion: the kind color floods in.
    function flood(el, b, delay) {
      const cs = getComputedStyle(el);
      el.animate([
        { backgroundColor: b.bg, color: b.color },
        { backgroundColor: cs.backgroundColor, color: cs.color }
      ], { duration: 560, delay, easing: 'ease-out', fill: 'backwards' });
      const eb = el.querySelector('.focus-eyebrow');
      if (eb) eb.animate([{ opacity: 0, transform: 'translateY(4px)' }, { opacity: 0.75, transform: 'none' }], { duration: 320, delay: delay + 260, fill: 'backwards' });
    }

    function poof(g) {
      g.animate([
        { opacity: 1, transform: 'none', filter: 'blur(0)' },
        { opacity: 0, transform: 'scale(.94)', filter: 'blur(6px)' }
      ], { duration: 300, easing: 'ease-in', fill: 'forwards' }).onfinish = () => g.remove();
    }

    // Card condenses into a clay ball that arcs to the tab it now lives in.
    function flyToTab(g, rect, tab, kind, sound) {
      const target = tabTarget(tab);
      g.animate([{ transform: 'none', opacity: 1 }, { transform: 'scale(.9)', opacity: 0 }], { duration: 240, easing: 'ease-in', fill: 'forwards' }).onfinish = () => g.remove();
      if (!target) { if (sound) Sound.play(sound); return; }
      const tr = target.getBoundingClientRect();
      const S = 34;
      const x0 = rect.left + rect.width / 2 - S / 2, y0 = rect.top + rect.height / 2 - S / 2;
      const x1 = tr.left + tr.width / 2 - S / 2, y1 = tr.top + tr.height / 2 - S / 2;
      const t = token(kindColor(kind), S);
      place(t, 0, 0, S, S);
      const lift = Math.max(70, Math.min(150, Math.hypot(x1 - x0, y1 - y0) * 0.3));
      const kf = arc(x0, y0, x1, y1, lift, 14, (p, x, y) => {
        const s = p < 0.15 ? 0.3 + (p / 0.15) * 0.75 : 1.05 - 0.5 * ((p - 0.15) / 0.85);
        return { transform: `translate(${x}px, ${y}px) scale(${s})`, opacity: p > 0.92 ? 0.4 : 1 };
      });
      if (sound) Sound.play(sound);
      t.animate(kf, { duration: 640, easing: 'cubic-bezier(.45,0,.25,1)', fill: 'forwards' }).onfinish = () => {
        t.remove();
        bump(target);
      };
    }

    // Brain-dump capture: a pellet leaves the text box for the Inbox tab.
    function pelletToInbox(kind) {
      const src = document.getElementById('capture-input');
      const target = tabTarget('inbox');
      if (!src || reduced()) { Sound.play('capture'); return; }
      const r = src.getBoundingClientRect();
      const S = 22;
      const x0 = r.left + 28, y0 = r.top + 22;
      let x1, y1;
      if (target) { const tr = target.getBoundingClientRect(); x1 = tr.left + tr.width / 2 - S / 2; y1 = tr.top + tr.height / 2 - S / 2; }
      else { x1 = x0; y1 = y0 - 120; }
      const t = token(kindColor(kind), S);
      place(t, 0, 0, S, S);
      const kf = arc(x0, y0, x1, y1, 90, 12, (p, x, y) => ({
        transform: `translate(${x}px, ${y}px) scale(${p < 0.15 ? 0.3 + p * 4.6 : 1 - 0.35 * p})`,
        opacity: target ? 1 : 1 - p
      }));
      t.animate(kf, { duration: 560, easing: 'cubic-bezier(.45,0,.25,1)', fill: 'forwards' }).onfinish = () => {
        t.remove();
        Sound.play('capture');
        if (target) bump(target);
      };
    }

    // Capture: the sheet's pellet drops onto the new Inbox card.
    function landCapture(el, fromRect, kind) {
      el.style.animation = 'none';
      if (!fromRect || reduced()) { Sound.play('capture'); return; }
      const r = el.getBoundingClientRect();
      const S = 26;
      const x0 = fromRect.left + fromRect.width / 2 - S / 2, y0 = fromRect.top + fromRect.height / 2 - S / 2;
      const x1 = r.left + 34 - S / 2, y1 = r.top + 34 - S / 2;
      el.style.opacity = '0';
      const t = token(kindColor(kind), S);
      place(t, 0, 0, S, S);
      const kf = arc(x0, y0, x1, y1, 60, 12, (p, x, y) => ({
        transform: `translate(${x}px, ${y}px) scale(${p < 0.2 ? 0.2 + p * 4 : 1})`
      }));
      t.animate(kf, { duration: 520, delay: 180, easing: 'cubic-bezier(.5,0,.3,1)', fill: 'both' }).onfinish = () => {
        Sound.play('capture');
        t.animate([
          { transform: `translate(${x1}px, ${y1}px) scale(1.25, .7)`, opacity: 1 },
          { transform: `translate(${x1}px, ${y1}px) scale(.2)`, opacity: 0 }
        ], { duration: 200, easing: 'ease-out', fill: 'forwards' }).onfinish = () => t.remove();
        el.style.opacity = '';
        el.animate([
          { opacity: 0, transform: 'translateY(-8px) scale(.97)' },
          { opacity: 1, transform: 'none' }
        ], { duration: 300, easing: EASE });
      };
    }

    // Parked: the card tucks into the Parked tab like a note slid into a
    // pocket. Different gesture from the clay ball, because parking is
    // "set aside", not "raw thought".
    function tuckAway(g, rect, tab, sound) {
      const target = tabTarget(tab);
      if (sound) Sound.play(sound);
      if (!target) { fadeOut(g, 220); return; }
      const tr = target.getBoundingClientRect();
      const dx = (tr.left + tr.width / 2) - (rect.left + rect.width / 2);
      const dy = (tr.top + tr.height / 2) - (rect.top + rect.height / 2);
      const sx = Math.max(0.12, (tr.width * 0.9) / rect.width);
      const sy = Math.max(0.04, 10 / rect.height);
      hideContents(g, 180);
      g.animate([
        { transform: 'translate(0,0) scale(1)', opacity: 1, borderRadius: '16px' },
        { transform: 'translate(0,-6px) scale(1.01)', opacity: 1, offset: 0.18 },
        { transform: `translate(${dx * 0.55}px, ${dy * 0.55}px) scale(${0.5 + sx * 0.5}, 0.35)`, opacity: 1, borderRadius: '12px', offset: 0.6 },
        { transform: `translate(${dx}px, ${dy}px) scale(${sx}, ${sy})`, opacity: 0, borderRadius: '8px' }
      ], { duration: 560, easing: 'cubic-bezier(.5,0,.3,1)', fill: 'forwards' }).onfinish = () => {
        g.remove();
        // The tab takes it in: a short downward squash, like a pocket closing.
        target.animate([
          { transform: 'scale(1)' },
          { transform: 'scale(1.08, .86) translateY(2px)', offset: 0.35 },
          { transform: 'scale(1)' }
        ], { duration: 360, easing: 'ease-out' });
      };
    }

    // The signature moment: the card seals into a clay ring, which flies up
    // into the Closed archive in the header and resolves the chord.
    // quick = another loop was closed moments ago: same ring, half the time.
    let lastCloseAt = 0;
    function closeCeremony(g, rect, kind) {
      const nowT = performance.now();
      const quick = nowT - lastCloseAt < 3000;
      lastCloseAt = nowT;
      const letGo = kind === 'let_go';
      const color = kindColor(kind);
      const L = ensureLayer();
      const S = 72, R = 24;
      const C = 2 * Math.PI * R;
      const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
      const archive = document.getElementById('archive-btn');
      const count = archive && archive.querySelector('.archive-count');
      const finalCount = count ? count.textContent : '';
      if (count) {
        const n = parseInt(finalCount, 10) || 0;
        count.textContent = String(Math.max(0, n - 1));
        archive.classList.toggle('has-count', n - 1 > 0);
      }

      // Timeline (ms): condense, seal, fly, land.
      const T = quick
        ? { condense: 260, ringIn: 60, sealAt: 140, seal: 160, flyAt: 330, fly: 420 }
        : letGo
          ? { condense: 440, ringIn: 140, sealAt: 300, seal: 700, flyAt: 380, fly: 1000 }
          : { condense: 440, ringIn: 140, sealAt: 380, seal: 300, flyAt: 700, fly: 560 };

      const ring = document.createElement('div');
      ring.className = 'motion-ring';
      ring.innerHTML = `<svg viewBox="0 0 ${S} ${S}" width="${S}" height="${S}"><g filter="url(#ol-clay-sm)"><circle cx="${S / 2}" cy="${S / 2}" r="${R}" fill="none" stroke-width="13" stroke-linecap="round" transform="rotate(14 ${S / 2} ${S / 2})"/></g></svg>`;
      const stroke = ring.querySelector('circle');
      stroke.style.stroke = color;
      stroke.style.strokeDasharray = `${C * 0.76} ${C}`;
      place(ring, 0, 0, S, S);
      const at = `translate(${cx - S / 2}px, ${cy - S / 2}px)`;
      ring.style.transform = at;
      L.appendChild(ring);

      // 1 · the card condenses into the ring
      if (g) {
        hideContents(g, quick ? 100 : 160);
        g.animate([
          { transform: 'none', opacity: 1, borderRadius: '24px' },
          { transform: `scale(${S / rect.width}, ${S / rect.height})`, opacity: 0, borderRadius: '50%' }
        ], { duration: T.condense, easing: 'cubic-bezier(.6,0,.2,1)', fill: 'forwards' }).onfinish = () => g.remove();
      }
      ring.animate([
        { transform: `${at} scale(.3)`, opacity: 0 },
        { transform: `${at} scale(1.06)`, opacity: 1, offset: 0.7 },
        { transform: `${at} scale(1)`, opacity: 1 }
      ], { duration: quick ? 220 : 380, delay: T.ringIn, easing: 'ease-out', fill: 'backwards' });

      // 2 · seal the gap (Done) or let it quietly loosen (Let go)
      if (!letGo) {
        stroke.animate([{ strokeDasharray: `${C * 0.76} ${C}` }, { strokeDasharray: `${C} ${C}` }],
          { duration: T.seal, delay: T.sealAt, easing: 'cubic-bezier(.3,0,.2,1)', fill: 'forwards' });
        if (!quick) {
          ring.animate([
            { transform: `${at} scale(1)` }, { transform: `${at} scale(1.12)`, offset: 0.45 }, { transform: `${at} scale(1)` }
          ], { duration: 260, delay: T.sealAt + T.seal - 20, easing: 'ease-out' });
          setTimeout(() => Sound.play('seal'), T.sealAt);
        }
      } else {
        stroke.animate([{ strokeDasharray: `${C * 0.76} ${C}` }, { strokeDasharray: `${C * 0.5} ${C}` }],
          { duration: T.seal, delay: T.sealAt, easing: 'ease-out', fill: 'forwards' });
        if (!quick) setTimeout(() => Sound.play('release'), 240);
      }

      // 3 · home to the Closed archive, 4 · land
      setTimeout(() => {
        if (!archive) { fadeOut(ring, 200); return; }
        const tr = archive.getBoundingClientRect();
        const x0 = cx - S / 2, y0 = cy - S / 2;
        const x1 = tr.left + tr.width / 2 - S / 2, y1 = tr.top + tr.height / 2 - S / 2;
        let kf;
        if (letGo && !quick) {
          // Calm release: rise straight up first, then drift home, fading.
          const rise = Math.min(90, Math.max(40, (y0 - y1) * 0.25));
          const steps = 16;
          kf = [];
          for (let i = 0; i <= steps; i++) {
            const p = i / steps;
            const up = Math.min(1, p / 0.45);
            const home = p <= 0.45 ? 0 : (p - 0.45) / 0.55;
            const e = home * home * (3 - 2 * home);
            const x = x0 + (x1 - x0) * e;
            const y = (y0 - rise * (up * (2 - up))) + ((y1) - (y0 - rise)) * e;
            kf.push({ offset: p, transform: `translate(${x}px, ${y}px) scale(${1 - 0.7 * p}) rotate(${30 * p}deg)`, opacity: 1 - 0.8 * p });
          }
        } else {
          const lift = Math.min(160, Math.hypot(x1 - x0, y1 - y0) * (quick ? 0.18 : 0.28));
          kf = arc(x0, y0, x1, y1, lift, 18, (p, x, y) => ({
            transform: `translate(${x}px, ${y}px) scale(${1 - 0.72 * p}) rotate(${(quick ? 180 : 300) * p}deg)`,
            opacity: letGo ? 1 - 0.7 * p : (p > 0.94 ? 0.5 : 1)
          }));
        }
        ring.animate(kf, {
          duration: T.fly,
          easing: letGo && !quick ? 'cubic-bezier(.35,0,.45,1)' : 'cubic-bezier(.5,0,.25,1)',
          fill: 'forwards'
        }).onfinish = () => {
          ring.remove();
          Sound.play(letGo ? 'softLand' : quick ? 'quickLand' : 'land');
          if (letGo) {
            archive.animate([{ opacity: 1 }, { opacity: 0.55 }, { opacity: 1 }], { duration: 420, easing: 'ease-in-out' });
          } else {
            bump(archive);
            archive.animate([
              { boxShadow: `0 0 0 0 ${color}` },
              { boxShadow: `0 0 0 10px transparent` }
            ], { duration: 520, easing: 'ease-out' });
          }
          if (count) {
            count.textContent = finalCount;
            archive.classList.toggle('has-count', parseInt(finalCount, 10) > 0);
            count.animate([
              { transform: 'translateY(6px)', opacity: 0 }, { transform: 'none', opacity: 1 }
            ], { duration: 320, easing: 'cubic-bezier(.2,.8,.2,1)' });
          }
        };
      }, T.flyAt);
    }

    function soundFor(cue) {
      const { from, to } = cue;
      if (to === null || to === 'released') return null;       // delete is silent; closing scores itself
      if (from === null) return gesture && /^save-raw-loop/.test(gesture.action || '') ? null : 'up';
      if (from === 'released') return 'reopen';
      if (to === 'active') return from === 'waiting' ? 'wake' : 'up';
      return 'down';
    }

    function play(main, snap) {
      const now = new Map(data.loops.map(l => [l.id, { status: l.status, kind: l.kind }]));
      const prevTab = snap.tab;
      lastTab = view.activeTab;
      lastStatuses = now;
      if (!snap.statuses) return;

      const local = isLocal();
      const calm = reduced();
      const tabChanged = prevTab !== view.activeTab;
      const cue = local ? pickCue(snap.statuses, now) : null;
      const gAction = gesture && gesture.action;
      let sound = cue ? soundFor(cue) : null;
      if (cue) gesture = null;   // one gesture, one cue
      if (cue && cue.from === null && gAction === 'save-raw-loop-more') {
        pelletToInbox(cue.kind);
        sound = null;
      }
      let ceremony = false;

      // The panel's fade-in is for switching tabs only. Re-renders within the
      // same view (reorder, close, park) must not flash the whole list.
      if (!tabChanged) main.querySelectorAll('.tab-panel').forEach(el => { el.style.animation = 'none'; });

      const after = new Map();
      main.querySelectorAll('.loop-card[data-loop-id]').forEach(el => after.set(el.dataset.loopId, el));

      // Cards present before and after: glide from old spot to new.
      after.forEach((el, id) => {
        const b = snap.cards.get(id);
        if (!b) {
          if (cue && cue.id === id && cue.from === null && sound === null) {
            landCapture(el, snap.overlayRect, cue.kind);
          }
          return;
        }
        el.style.animation = 'none';
        if (calm) return;
        const a = el.getBoundingClientRect();
        const dx = b.rect.left - a.left, dy = b.rect.top - a.top;
        const moved = cue && cue.id === id && tabChanged;
        if (moved) {
          const sx = b.rect.width / a.width, sy = b.rect.height / a.height;
          el.style.transformOrigin = 'top left';
          el.animate([{ transform: `translate(${dx}px, ${dy}px) scale(${sx}, ${sy})` }, { transform: 'none' }], { duration: 560, easing: EASE });
          if (el.classList.contains('is-focus') && !b.focus) flood(el, b, 140);
          return;
        }
        if (tabChanged) return;
        // Same view: glide position, height and color together, so a card
        // that gains or loses the Now slot morphs instead of snapping.
        const cs = getComputedStyle(el);
        const shifted = Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5;
        const resized = Math.abs(b.rect.height - a.height) > 1;
        const recolored = b.bg !== cs.backgroundColor || b.color !== cs.color;
        if (!shifted && !resized && !recolored) return;
        const closing = cue && cue.to === 'released';
        const hold = closing ? (performance.now() - lastCloseAt < 3000 ? 300 : 650) : 0;
        const lifted = local && gesture && gesture.loopId === id && /^move-loop-/.test(gesture.action || '');
        const from = { transform: `translate(${dx}px, ${dy}px)` };
        const to = { transform: 'none' };
        if (resized) { from.height = b.rect.height + 'px'; to.height = a.height + 'px'; }
        if (recolored) { from.backgroundColor = b.bg; to.backgroundColor = cs.backgroundColor; from.color = b.color; to.color = cs.color; }
        if (lifted) { from.boxShadow = '0 16px 36px rgba(40,30,10,0.16)'; to.boxShadow = cs.boxShadow === 'none' ? '0 0 0 rgba(0,0,0,0)' : cs.boxShadow; el.style.zIndex = '2'; }
        if (resized) el.style.overflow = 'hidden';
        // While a closing ring is still on screen, hold the promotion so the
        // two moments don't compete.
        const anim = el.animate([from, to], { duration: closing ? 460 : 420, delay: hold, easing: EASE, fill: 'backwards' });
        anim.onfinish = anim.oncancel = () => { el.style.overflow = ''; el.style.zIndex = ''; };
        const eb = el.querySelector('.focus-eyebrow');
        if (eb && !b.focus) eb.animate([{ opacity: 0, transform: 'translateY(4px)' }, { opacity: 0.75, transform: 'none' }], { duration: 300, delay: hold + 180, fill: 'backwards' });
      });

      const label = main.querySelector('.up-next-label');
      if (label && snap.labelRect && !tabChanged && !calm) {
        const ly = snap.labelRect.top - label.getBoundingClientRect().top;
        if (Math.abs(ly) > 0.5) label.animate([{ transform: `translateY(${ly}px)` }, { transform: 'none' }], { duration: 420, delay: cue && cue.to === 'released' ? (performance.now() - lastCloseAt < 3000 ? 300 : 650) : 0, easing: EASE, fill: 'backwards' });
      }

      // Cards that left this view: follow them to where they went.
      snap.cards.forEach((b, id) => {
        if (after.has(id)) return;
        const isCue = cue && cue.id === id;
        if (tabChanged && !isCue) return;
        const g = ghostOf(b);
        if (!local || calm) {
          fadeOut(g, 180);
          if (isCue && cue.to === 'released') Sound.play(cue.kind === 'let_go' ? 'softLand' : 'land');
          return;
        }
        const n = now.get(id), p = snap.statuses.get(id);
        if (!n) { poof(g); return; }
        if (n.status === 'released' && p && p.status !== 'released') { ceremony = true; closeCeremony(g, b.rect, n.kind); return; }
        if (p && n.status !== p.status) {
          if (n.status === 'waiting') tuckAway(g, b.rect, 'later', isCue ? sound : null);
          else flyToTab(g, b.rect, tabFor(n.status), n.kind, isCue ? sound : null);
          if (isCue) sound = null;
          return;
        }
        fadeOut(g, 200);
      });

      // Closed without a visible card (e.g. from a hidden row): still land it.
      if (cue && cue.to === 'released' && !ceremony && !calm) {
        const vw = window.innerWidth, vh = window.innerHeight;
        closeCeremony(null, { left: vw / 2 - 1, top: vh / 2 - 1, width: 2, height: 2 }, cue.kind);
      } else if (cue && cue.to === 'released' && calm && !ceremony) {
        Sound.play(cue.kind === 'let_go' ? 'softLand' : 'land');
      }
      if (sound) Sound.play(sound);
    }

    return {
      // Any sheet that closes without its own exit (Cancel, ✕, backdrop,
      // Escape) slides away instead of vanishing in one frame.
      dismissSheet() {
        if (performance.now() - lastExitAt < 80) return;
        const ov = document.querySelector('#overlay-root .overlay-card');
        if (ov) exitSheet(ov, false);
      },
      init() {
        ensureLayer();
        document.addEventListener('click', onGesture, true);
      },
      snapshot(main) {
        const s = snapshot(main);
        s.overlayRect = gesture ? gesture.overlayRect : null;
        return s;
      },
      play
    };
  })();

  // Clay ring for the Closed shelf (one per loop closed this week).
  function clayRingHtml(kind) {
    return `<svg class="clay-ring" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7" fill="none" stroke-width="5" filter="url(#ol-clay-xs)" style="stroke:var(--${kind || 'inbox'})"/></svg>`;
  }

  function closedThisWeek() {
    const weekAgo = Date.now() - 7 * 86400000;
    return data.loops
      .filter(l => l.status === 'released' && l.completedAt && new Date(l.completedAt).getTime() >= weekAgo)
      .sort((a, b) => new Date(a.completedAt) - new Date(b.completedAt));
  }

  // ── RENDER MAIN ──
  function renderMain() {
    const main = document.getElementById('app-main');
    if (!main) return;
    const snap = Motion.snapshot(main);
    main.innerHTML = renderHome();
    Motion.play(main, snap);
    focusInlineEdit();
  }

  function focusInlineEdit() {
    if (view.inlineEditId) {
      const el = document.getElementById(`inline-edit-${view.inlineEditId}`);
      if (el) { el.focus(); el.selectionStart = el.selectionEnd = el.value.length; }
    }
  }

  function renderOverlay() {
    const root = document.getElementById('overlay-root');
    if (!root) return;
    const ov = view.overlay;
    if (!ov) { root.innerHTML = ''; delete root.dataset.sheet; return; }

    let inner = '';
    if      (ov.type === 'capture')        inner = renderCapture(ov);
    else if (ov.type === 'define-raw')     inner = renderDefineRaw(getLoop(ov.loopId));
    else if (ov.type === 'menu')           inner = renderMenu(getLoop(ov.loopId));
    else if (ov.type === 'change-kind')    inner = renderChangekind(getLoop(ov.loopId));
    else if (ov.type === 'sync')           inner = renderSync();
    else if (ov.type === 'settings')       inner = renderSettings();
    else if (ov.type === 'why')            inner = renderWhy();
    else if (ov.type === 'primary-action') inner = renderPrimaryAction(getLoop(ov.loopId));
    else if (ov.type === 'confirm-delete') inner = renderConfirmDelete(getLoop(ov.loopId));

    const key = `${ov.type}:${ov.loopId || ''}`;
    const panel = root.querySelector('.overlay-panel');
    if (panel && root.dataset.sheet === key) {
      // Same sheet, new state: swap contents in place. No replayed slide-up,
      // no focus jump, no keyboard popping back open.
      const scroller = panel.querySelector('.overlay-card');
      const scrollTop = scroller ? scroller.scrollTop : 0;
      panel.innerHTML = inner;
      const card = panel.querySelector('.overlay-card');
      if (card) { card.classList.add('no-enter'); card.scrollTop = scrollTop; }
      return;
    }
    const switching = !!(panel && root.querySelector('.overlay-backdrop'));
    root.dataset.sheet = key;
    if (switching) {
      // One sheet replacing another (menu → delete, action → define): keep
      // the backdrop as is and swap the card with a short crossfade instead
      // of flashing the backdrop and sliding up from scratch.
      panel.innerHTML = inner;
      const card = panel.querySelector('.overlay-card');
      if (card) card.classList.add('swap-enter');
    } else {
      root.innerHTML = `
        <div class="overlay-backdrop" data-action="close-overlay"></div>
        <div class="overlay-panel">${inner}</div>`;
    }
    autoGrow(document.getElementById('define-raw-input'));

    // Focus first input/button so keyboard users don't have to hunt.
    // Define's title is editable but not the first job, so skip it.
    const firstInput = root.querySelector('textarea:not(#define-raw-input), input[type="email"], input[type="text"]');
    if (firstInput) {
      setTimeout(() => firstInput.focus(), 50);
    } else {
      // No text input — focus the first actionable button instead.
      const firstBtn = root.querySelector('.overlay-card button:not([data-action="close-overlay"])');
      if (firstBtn) setTimeout(() => firstBtn.focus(), 50);
    }
  }

  function renderHeader() {
    const pill = document.getElementById('sync-pill');
    const label = document.getElementById('sync-label');
    if (pill && label) {
      pill.className = `pill-btn ${view.syncStatus}`;
      label.textContent = view.syncText;
      pill.title = view.syncText;
      pill.setAttribute('aria-label', `Sync: ${view.syncText}`);
    }
    const archive = document.getElementById('archive-btn');
    if (archive) {
      archive.classList.toggle('active', view.activeTab === 'done' || view.activeTab === 'released');
      let badge = archive.querySelector('.archive-count');
      if (!badge) {
        badge = document.createElement('span');
        badge.className = 'archive-count';
        archive.appendChild(badge);
      }
      const n = closedThisWeek().length;
      badge.textContent = String(n);
      archive.classList.toggle('has-count', n > 0);
      archive.setAttribute('aria-label', n ? `Closed loops, ${n} this week` : 'Closed loops');
      archive.title = n ? `${n} closed this week` : 'Closed';
    }
  }

  function renderAll() {
    renderHeader();
    renderSidebar();
    renderBottomNav();
    renderMain();
    renderContextPanel();
    renderOverlay();
    if (authReady && !Sync.isLoggedIn()) {
      renderAuthGate();
    } else if (authReady) {
      hideAuthGate();
    }
    if (view.onboardingStep >= 0) renderOnboarding();
  }

  // ── ACTIONS ──
  // Signed-in local cache + re-render. Supabase remains the source of truth;
  // localStorage only keeps the UI fast and protects queued offline writes.
  function persistAndRender() {
    save();
    renderAll();
  }

  function closeOverlay() {
    const opener = view.overlayOpenerEl;
    if (view.overlay) Motion.dismissSheet();
    if (view.overlay && view.overlay.type === 'why') { clearTimeout(whyTimer); whyToken++; StoryAudio.stopAll(); }
    view.overlay = null;
    renderOverlay();
    view.overlayOpenerEl = null;
    if (opener && document.contains(opener)) {
      setTimeout(() => {
        if (document.contains(opener)) opener.focus();
      }, 0);
    }
  }

  function rememberOverlayOpener(el) {
    if (!view.overlay && el && typeof el.focus === 'function') {
      view.overlayOpenerEl = el;
    }
  }

  // ── MUTATION GUARD ──
  // Sign-in is required to capture or modify loops. Unauthenticated users
  // see the auth gate and cannot mutate state.
  function requireLogin() {
    if (Sync.isLoggedIn()) return false;
    toast('Sign in to save your loops.');
    if (authReady) renderAuthGate();
    return true;
  }

  // ── EVENT DELEGATION ──
  document.addEventListener('click', async e => {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const action = el.dataset.action;
    const loopId = el.dataset.loopId || null;

    // Overlay management
    if (action === 'close-overlay') { closeOverlay(); return; }

    // ── AUTH GATE ACTIONS ──
    if (action === 'auth-gate-send') {
      const input = document.getElementById('auth-gate-email');
      const email = input ? input.value.trim() : view.authGateEmail;
      if (!email) { toast('Enter your email.'); return; }
      const sinceLast = Date.now() - lastMagicLinkAt;
      if (sinceLast < MAGIC_LINK_COOLDOWN_MS) {
        const wait = Math.ceil((MAGIC_LINK_COOLDOWN_MS - sinceLast) / 1000);
        toast(`Please wait ${wait}s before requesting another link.`);
        return;
      }
      view.authGateEmail = email;
      const btn = document.getElementById('auth-gate-btn');
      if (btn) { btn.disabled = true; btn.textContent = 'Sending…'; }
      try {
        await Sync.sendMagicLink(email);
        lastMagicLinkAt = Date.now();
        view.authGateSent = true;
        renderAuthGate();
      } catch(err) {
        // Keep label consistent with initial state ("Send link") so repeated
        // attempts don't look like a different button.
        if (btn) { btn.disabled = false; btn.textContent = 'Send link'; }
        toast(err.message || 'Could not send link. Try again.');
      }
      return;
    }
    if (action === 'auth-gate-reset') {
      view.authGateSent = false;
      view.authGateEmail = '';
      renderAuthGate();
      return;
    }

    // ── ONBOARDING ACTIONS ──
    if (action === 'onboarding-next') {
      const isLast = view.onboardingStep === ONBOARDING_STEPS.length - 1;
      if (isLast) { markOnboardingComplete(); }
      else { view.onboardingStep++; renderOnboarding(); }
      return;
    }
    if (action === 'onboarding-prev') {
      if (view.onboardingStep > 0) { view.onboardingStep--; renderOnboarding(); }
      return;
    }
    if (action === 'onboarding-skip') {
      markOnboardingComplete();
      return;
    }

    // Overlay management

    // Tabs
    if (action === 'set-tab') {
      view.activeTab = el.dataset.tab;
      if (view.activeTab === 'done') view.expanded = false;
      save();
      renderHeader();
      renderMain();
      renderSidebar();
      renderBottomNav();
      return;
    }

    // FAB
    if (action === 'open-capture') {
      if (requireLogin()) return;
      rememberOverlayOpener(el);
      view.overlay = { type: 'capture', step: 'capture', rawText: '', kind: null, promptAnswer: '', sourceId: null };
      renderOverlay();
      return;
    }

    if (action === 'define-raw') {
      const target = getLoop(loopId);
      if (target) {
        rememberOverlayOpener(el);
        const status = target.status === 'inbox'
          ? (target.kind === 'let_go' ? 'released' : 'active')
          : target.status;
        view.overlay = { type: 'define-raw', loopId, rawText: target.rawText, kind: target.kind || null, promptAnswer: target.promptAnswer || '', status, step: target.kind ? 2 : 1 };
        renderOverlay();
      }
      return;
    }

    // Capture flow
    if (action === 'pick-raw-kind') {
      const ov = view.overlay;
      if (ov?.type === 'capture') {
        // Optional: tap again to clear. Update the chips in place only.
        ov.kind = ov.kind === el.dataset.kind ? null : el.dataset.kind;
        document.querySelectorAll('#overlay-root .kind-pick').forEach(b => {
          const on = b.dataset.kind === ov.kind;
          b.classList.toggle('on', on);
          b.setAttribute('aria-pressed', String(on));
        });
      }
      return;
    }
    if (action === 'save-raw-loop' || action === 'save-raw-loop-more') {
      if (requireLogin()) return;
      const ov = view.overlay;
      if (!ov || ov.type !== 'capture') return;
      const input = document.getElementById('capture-input');
      const raw = (input ? input.value : ov.rawText || '').trim();
      if (!raw) return;
      const l = createLoop({ rawText: raw, kind: ov.kind || null, promptAnswer: '', status: 'inbox' });
      if (action === 'save-raw-loop-more') {
        // Brain-dump mode: keep the sheet, clear the text, count it.
        ov.rawText = '';
        ov.kind = null;
        ov.added = (ov.added || 0) + 1;
        persistAndRender();
        Sync.createLoop(l);
        const again = document.getElementById('capture-input');
        if (again) again.focus();
        return;
      }
      view.activeTab = 'inbox';
      const n = (ov.added || 0) + 1;
      closeOverlay();
      await persistAndRender();
      Sync.createLoop(l);
      announce(n > 1 ? `${n} loops added to Inbox.` : 'Added to Inbox.');
      return;
    }
    if (action === 'define-pick-kind') {
      const ov = view.overlay;
      if (ov?.type === 'define-raw') {
        ov.kind = el.dataset.kind;
        // Let go skips the next-step question: releasing is the whole move.
        goDefineStep(ov.kind === 'let_go' ? 3 : 2, 1);
      }
      return;
    }
    if (action === 'define-next') {
      const ov = view.overlay;
      if (ov?.type === 'define-raw') {
        const d = document.getElementById('define-detail-input');
        if (el.dataset.skip) ov.promptAnswer = ov.promptAnswer || '';
        else if (d) ov.promptAnswer = d.value;
        goDefineStep(3, 1);
      }
      return;
    }
    if (action === 'define-back') {
      const ov = view.overlay;
      if (ov?.type === 'define-raw') {
        const prev = ov.step === 3 && ov.kind !== 'let_go' ? 2 : 1;
        goDefineStep(prev, -1);
      }
      return;
    }
    if (action === 'define-change-kind') {
      if (view.overlay?.type === 'define-raw') goDefineStep(1, -1);
      return;
    }
    if (action === 'finish-define-raw') {
      if (requireLogin()) return;
      const ov = view.overlay;
      if (!ov || ov.type !== 'define-raw' || !ov.kind) return;
      const raw = (document.getElementById('define-raw-input')?.value || ov.rawText || '').trim() || getLoop(ov.loopId)?.rawText || '';
      const ans = (ov.promptAnswer || '').trim();
      const status = el.dataset.status || ov.status || (ov.kind === 'let_go' ? 'released' : 'active');
      const patch = { rawText: raw, kind: ov.kind, promptAnswer: ans, status, completedAt: status === 'released' ? nowIso() : null };
      const prevStatus = getLoop(ov.loopId)?.status;
      const upNext = status === 'active' && prevStatus !== 'active' ? upNextPosition(ov.loopId) : null;
      if (upNext) patch.position = upNext.position;
      updateLoop(ov.loopId, patch);
      const positionChanges = upNext && upNext.rebalance ? rebalanceActivePositions() : null;
      view.highlightedId = status === 'active' ? ov.loopId : null;
      // Closing stays on the current view so the loop visibly lands in the
      // Closed archive in the header instead of jumping tabs.
      if (status !== 'released') view.activeTab = status === 'waiting' ? 'later' : 'now';
      saveReentryDismissed(null);
      closeOverlay();
      await persistAndRender();
      Sync.updateLoop(ov.loopId, patch);
      if (positionChanges) syncPositionChanges({ ok: true, changes: positionChanges });
      announce(status === 'active' ? 'Defined. Now in Up next.' : status === 'waiting' ? 'Defined and parked.' : 'Defined and closed.');
      return;
    }

    // Show more
    if (action === 'show-more') { view.expanded = true; renderMain(); return; }

    // Menu open
    if (action === 'open-menu') {
      rememberOverlayOpener(el);
      view.overlay = { type: 'menu', loopId };
      renderOverlay();
      return;
    }

    // Primary action
    if (action === 'primary-action') {
      rememberOverlayOpener(el);
      view.overlay = { type: 'primary-action', loopId };
      renderOverlay();
      return;
    }

    // Primary action outcomes
    if (action === 'complete-done') {
      if (requireLogin()) return;
      const patch = { status: 'released', completedAt: nowIso() };
      updateLoop(loopId, patch);
      closeOverlay();
      view.activeTab = 'now';
      await persistAndRender();
      Sync.updateLoop(loopId, patch);
      announce('Closed.');
      return;
    }
    if (action === 'complete-progress') {
      closeOverlay();
      announce('Still in progress.');
      return;
    }
    if (action === 'complete-update') {
      closeOverlay();
      const l = getLoop(loopId);
      if (l) {
        view.overlay = { type: 'define-raw', loopId, rawText: l.rawText, kind: l.kind, promptAnswer: l.promptAnswer, status: l.status, step: l.kind ? 2 : 1 };
        renderOverlay();
      }
      return;
    }

    // Status changes
    if (action === 'move-waiting') {
      if (requireLogin()) return;
      const patch = { status: 'waiting' };
      updateLoop(loopId, patch);
      closeOverlay();
      await persistAndRender();
      Sync.updateLoop(loopId, patch);
      announce('Parked.');
      return;
    }
    if (action === 'move-released') {
      if (requireLogin()) return;
      const patch = { status: 'released', completedAt: nowIso() };
      updateLoop(loopId, patch);
      closeOverlay();
      view.activeTab = 'now';
      await persistAndRender();
      Sync.updateLoop(loopId, patch);
      announce('Released.');
      return;
    }
    if (action === 'restore-active') {
      if (requireLogin()) return;
      // Snapshot the previous status BEFORE updateLoop mutates the same
      // object reference (getLoop returns the live row, not a copy).
      const prevStatus = getLoop(loopId)?.status;
      // Restoring from waiting/released lands the loop in "Up next", right
      // under the Now card: not at its stale old position, and not over the
      // loop the person is currently focused on.
      const upNext = upNextPosition(loopId);
      const patch = { status: 'active', position: upNext.position, completedAt: null };
      updateLoop(loopId, patch);
      const positionChanges = upNext.rebalance ? rebalanceActivePositions() : null;
      closeOverlay();
      view.activeTab = 'now';
      await persistAndRender();
      Sync.updateLoop(loopId, patch);
      if (positionChanges) syncPositionChanges({ ok: true, changes: positionChanges });
      announce(prevStatus === 'released' ? 'Reopened. Now in Up next.' : 'Made active. Now in Up next.');
      return;
    }
    if (action === 'delete-loop') {
      if (!loopId) return;
      if (!getLoop(loopId)) { closeOverlay(); return; }
      // Don't require login here — the confirm-delete handler re-checks.
      // Open the confirm dialog with the current opener preserved so focus
      // returns properly when the user hits Cancel.
      view.overlay = { type: 'confirm-delete', loopId };
      renderOverlay();
      return;
    }
    if (action === 'confirm-delete') {
      if (requireLogin()) return;
      const target = getLoop(loopId);
      if (!target) { closeOverlay(); return; }
      const snapshot = JSON.parse(JSON.stringify(target));
      const originalIndex = data.loops.findIndex(l => l.id === loopId);
      const wasLast = data.lastLoopId === loopId;
      removeLoop(loopId);
      closeOverlay();
      await persistAndRender();
      Sync.deleteLoop(loopId);
      toast('Loop deleted.', {
        action: 'Undo',
        duration: 8000,
        onAction: async () => {
          if (requireLogin()) return;
          if (getLoop(snapshot.id)) return;
          const insertAt = Math.min(Math.max(originalIndex, 0), data.loops.length);
          data.loops.splice(insertAt, 0, snapshot);
          if (wasLast) data.lastLoopId = snapshot.id;
          await persistAndRender();
          // Undo soft-delete on the server so the row reappears everywhere.
          Sync.undeleteLoop(snapshot.id);
          toast('Restored.');
        }
      });
      return;
    }

    // Change kind
    if (action === 'reclarify-kind') {
      view.overlay = { type: 'change-kind', loopId };
      renderOverlay();
      return;
    }
    if (action === 'set-kind-direct') {
      if (requireLogin()) return;
      const newKind = el.dataset.kind;
      const patch = { kind: newKind };
      // Match capture-flow behavior: choosing "Let go" releases the loop.
      if (newKind === 'let_go') patch.status = 'released';
      if (newKind === 'let_go') patch.completedAt = nowIso();
      updateLoop(loopId, patch);
      closeOverlay();
      if (newKind === 'let_go') view.activeTab = 'now';
      await persistAndRender();
      Sync.updateLoop(loopId, patch);
      announce(newKind === 'let_go' ? 'Released.' : 'Kind updated.');
      return;
    }

    // Inline edit
    if (action === 'inline-edit-start') {
      view.inlineEditId = loopId;
      renderMain();
      return;
    }
    if (action === 'inline-edit-open') {
      view.inlineEditId = loopId;
      closeOverlay();
      renderMain();
      return;
    }
    if (action === 'inline-edit-save') {
      if (requireLogin()) return;
      const inp = document.getElementById(`inline-edit-${loopId}`);
      const val = inp ? inp.value.trim() : null;
      if (val) {
        const patch = { rawText: val };
        updateLoop(loopId, patch);
        await persistAndRender();
        Sync.updateLoop(loopId, patch);
        announce('Updated.');
      }
      view.inlineEditId = null;
      renderMain();
      return;
    }
    if (action === 'inline-edit-cancel') {
      view.inlineEditId = null;
      renderMain();
      return;
    }

    // Sync
    if (action === 'open-sync') {
      rememberOverlayOpener(el);
      view.overlay = { type: 'sync' };
      renderOverlay();
      return;
    }
    if (action === 'send-magic-link') {
      const input = document.getElementById('sync-email');
      const email = input ? input.value.trim() : '';
      if (!email) { toast('Enter your email first.'); return; }
      const sinceLast = Date.now() - lastMagicLinkAt;
      if (sinceLast < MAGIC_LINK_COOLDOWN_MS) {
        const wait = Math.ceil((MAGIC_LINK_COOLDOWN_MS - sinceLast) / 1000);
        toast(`Please wait ${wait}s before requesting another link.`);
        return;
      }
      try {
        setSyncStatus('syncing', 'Sending…');
        await Sync.sendMagicLink(email);
        lastMagicLinkAt = Date.now();
        setSyncStatus('idle', 'Check email');
        toast('Magic link sent — check your email.');
      } catch(e) {
        setSyncStatus('error', 'Error');
        toast(e.message || 'Could not send link.');
      }
      return;
    }
    if (action === 'sign-out') {
      await Sync.signOut();
      closeOverlay();
      return;
    }
    if (action === 'sync-retry') {
      const fromBanner = !!el.closest('.sync-error-banner');
      if (!fromBanner) renderOverlay();
      const result = await Sync.retry();
      if (result?.ok) toast('Sync restored.');
      else toast('Still having trouble syncing.');
      if (!fromBanner && view.overlay?.type === 'sync') renderOverlay();
      return;
    }

    if (action === 'move-loop-up' || action === 'move-loop-down') {
      if (requireLogin()) return;
      const offset = action === 'move-loop-up' ? -1 : 1;
      const result = moveActiveLoopByOffset(loopId, offset);
      if (!result.ok) return;
      await persistAndRender();
      syncPositionChanges(result);
      announce(action === 'move-loop-up' ? 'Moved up.' : 'Moved down.');
      return;
    }

    // Theme toggle
    if (action === 'toggle-theme') {
      setTheme(view.theme === 'dark' ? 'light' : 'dark');
      // If the Settings overlay is currently open, re-render it so the
      // "Dark/Light" label updates in place.
      if (view.overlay && view.overlay.type === 'settings') renderOverlay();
      return;
    }

    // PWA install
    if (action === 'install-app') {
      if (!deferredInstallPrompt) return;
      const promptEvent = deferredInstallPrompt;
      deferredInstallPrompt = null;
      try {
        await promptEvent.prompt();
        const choice = await promptEvent.userChoice;
        if (choice && choice.outcome === 'accepted') {
          toast('Installing Open Loops…');
        }
      } catch (err) {
        /* ignore — some browsers throw on re-prompt */
      }
      const btn = document.getElementById('install-btn');
      if (btn) btn.hidden = true;
      if (view.overlay && view.overlay.type === 'settings') renderOverlay();
      return;
    }

    // Settings overlay
    if (action === 'open-why') {
      rememberOverlayOpener(el);
      view.overlay = { type: 'why' };
      renderOverlay();
      StoryAudio.start();
      if (whyVoiceOn()) StoryAudio.preloadVoice();
      whyShow(0);
      return;
    }
    if (action === 'why-next') {
      const story = document.querySelector('#overlay-root .why-story');
      if (story && Number(story.dataset.scene) >= WHY_SCENES.length - 1) return;
      whyStep(1);
      return;
    }
    if (action === 'why-back') { whyStep(-1); return; }
    if (action === 'why-voice') {
      const on = !whyVoiceOn();
      setWhyVoice(on);
      el.classList.toggle('on', on);
      el.setAttribute('aria-pressed', String(on));
      if (on) StoryAudio.preloadVoice();
      const story = document.querySelector('#overlay-root .why-story');
      if (story) whyShow(Number(story.dataset.scene || 0), 0);
      return;
    }
    if (action === 'open-settings') {
      rememberOverlayOpener(el);
      view.overlay = { type: 'settings' };
      renderOverlay();
      return;
    }
    if (action === 'set-sound') {
      Sound.set(el.dataset.sound === 'on');
      if (Sound.enabled) { Sound.unlock(); Sound.play('land'); }
      if (view.overlay && view.overlay.type === 'settings') renderOverlay();
      return;
    }
    if (action === 'set-theme') {
      setTheme(el.dataset.theme);
      if (view.overlay && view.overlay.type === 'settings') renderOverlay();
      return;
    }
    if (action === 'set-loop-cap') {
      const n = parseInt(el.dataset.cap, 10);
      saveLoopCap(n);
      // Re-render the settings overlay (to update selected button) and the
      // main view (visible loop count may change immediately).
      if (view.overlay && view.overlay.type === 'settings') renderOverlay();
      renderMain();
      return;
    }
    if (action === 'reset-onboarding') {
      try {
        const key = scopedKey(ONBOARDING_KEY_BASE);
        if (key) localStorage.removeItem(key);
      } catch(e) {}
      closeOverlay();
      startOnboarding();
      return;
    }

    // Dismiss sync error banner
    if (action === 'dismiss-sync-banner') {
      const banner = document.getElementById('sync-error-banner');
      if (banner) banner.style.display = 'none';
      return;
    }
  });

  document.addEventListener('dragstart', e => {
    const card = e.target.closest('[data-draggable-loop="1"]');
    if (!card) return;
    view.draggingLoopId = card.dataset.loopId;
    card.classList.add('dragging');
    if (e.dataTransfer) {
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', view.draggingLoopId);
    }
  });

  document.addEventListener('dragover', e => {
    const card = e.target.closest('[data-draggable-loop="1"]');
    if (!card || !view.draggingLoopId || card.dataset.loopId === view.draggingLoopId) return;
    e.preventDefault();
    card.classList.add('drag-over');
    if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
  });

  document.addEventListener('dragleave', e => {
    const card = e.target.closest('[data-draggable-loop="1"]');
    if (card) card.classList.remove('drag-over');
  });

  document.addEventListener('drop', async e => {
    const card = e.target.closest('[data-draggable-loop="1"]');
    if (!card || !view.draggingLoopId) return;
    e.preventDefault();
    // Mutation guard: if the user isn't signed in, don't reorder (matches
    // how every other mutation path behaves).
    if (requireLogin()) { view.draggingLoopId = null; return; }
    const result = moveActiveLoop(view.draggingLoopId, card.dataset.loopId);
    view.draggingLoopId = null;
    if (!result.ok) return;
    await persistAndRender();
    // Sync the position change(s). Common case: one row updated. Rare case
    // (rebalance fired): many rows. Either way we enqueue a position-only
    // patch per changed row — the queue's coalescing means consecutive
    // drags of the same loop merge into a single update.
    syncPositionChanges(result);
  });

  document.addEventListener('dragend', () => {
    view.draggingLoopId = null;
    document.querySelectorAll('.loop-card.dragging, .loop-card.drag-over').forEach(el => el.classList.remove('dragging', 'drag-over'));
  });

  // Live char-counter helper. Tints the counter yellow near the limit,
  // red at exactly the limit, and falls back to default otherwise.
  function updateCounter(counterId, len) {
    const c = document.getElementById(counterId);
    if (!c) return;
    c.textContent = `${len}/${MAX_LOOP_TEXT_LEN}`;
    c.classList.toggle('near-limit', len >= MAX_LOOP_TEXT_LEN - 50 && len < MAX_LOOP_TEXT_LEN);
    c.classList.toggle('at-limit', len >= MAX_LOOP_TEXT_LEN);
  }

  // Input binding for capture + auth gate email tracking
  document.addEventListener('input', e => {
    // Track auth gate email typing in view state
    if (e.target.id === 'auth-gate-email') {
      view.authGateEmail = e.target.value;
      return;
    }
    if (e.target.classList.contains('inline-edit-input')) {
      const counterId = e.target.id.replace('inline-edit-', 'inline-edit-counter-');
      updateCounter(counterId, e.target.value.length);
      return;
    }
    const ov = view.overlay;
    if (ov && ov.type === 'define-raw') {
      if (e.target.id === 'define-raw-input') {
        ov.rawText = e.target.value;
        autoGrow(e.target);
        return;
      }
      if (e.target.id === 'define-detail-input') {
        ov.promptAnswer = e.target.value;
        updateCounter('define-detail-counter', e.target.value.length);
        autoGrow(e.target);
        return;
      }
    }
    if (!ov || ov.type !== 'capture') return;
    if (e.target.id === 'capture-input') {
      ov.rawText = e.target.value;
      updateCounter('capture-counter', e.target.value.length);
      const btn = document.querySelector('[data-action="save-raw-loop"]');
      if (btn) btn.disabled = !e.target.value.trim();
      autoGrow(e.target);
    }
  });

  // Enter inside the capture and define sheets (Shift+Enter = newline):
  //   capture text → add and keep going · next-step answer → Next
  //   loop title  → done editing
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.shiftKey || e.isComposing) return;
    const id = e.target && e.target.id;
    if (id === 'capture-input') {
      e.preventDefault();
      if (!e.target.value.trim()) return;
      const b = document.createElement('button');
      b.dataset.action = 'save-raw-loop-more';
      b.hidden = true;
      document.getElementById('overlay-root').appendChild(b);
      b.click();
      b.remove();
    } else if (id === 'define-detail-input') {
      e.preventDefault();
      document.querySelector('#overlay-root [data-action="define-next"]:not([data-skip])')?.click();
    } else if (id === 'define-raw-input') {
      e.preventDefault();
      e.target.blur();
    }
  }, true);

  // Enter key on auth gate email → submit
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.id === 'auth-gate-email') {
      e.preventDefault();
      const btn = document.getElementById('auth-gate-btn');
      if (btn && !btn.disabled) btn.click();
    }
  }, true); // capture phase so it fires before the main keydown handler

  // Minimal keyboard handling:
  //   Escape               → exit inline edit or close overlay
  //   Enter in inline edit → save (Shift+Enter inserts a newline)
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (view.inlineEditId) { view.inlineEditId = null; renderMain(); }
      else closeOverlay();
      return;
    }

    if (e.key === 'Enter' && e.target.classList.contains('inline-edit-input') && !e.shiftKey) {
      e.preventDefault();
      const loopId = e.target.id.replace('inline-edit-', '');
      const val = e.target.value.trim();
      if (val) {
        if (requireLogin()) return;
        const patch = { rawText: val };
        updateLoop(loopId, patch);
        persistAndRender();
        Sync.updateLoop(loopId, patch);
        announce('Updated.');
      }
      view.inlineEditId = null;
      renderMain();
    }
  });

  // ── AUTO-RETRY ON NETWORK / VISIBILITY EVENTS ──
  // When we come back online or refocus the tab, drain any queued offline
  // operations. Individual edits already sync immediately when online.
  window.addEventListener('online', async () => {
    if (Sync.isLoggedIn()) {
      await Sync.processQueue();
      // Network just came back — the realtime channel may have died during
      // the outage. Ask Sync to verify/repair it.
      Sync.ensureRealtime();
    }
  });

  // Fix 3: 'focus' is unreliable on mobile PWAs — returning from background
  // often fires visibilitychange without firing focus. Use visibilitychange
  // as the primary trigger and keep 'focus' as a belt-and-suspenders fallback
  // for desktop. When the tab becomes visible again, drain the queue and
  // verify the realtime channel is still alive.
  document.addEventListener('visibilitychange', async () => {
    if (document.hidden) return;
    if (!Sync.isLoggedIn()) return;
    await Sync.processQueue();
    Sync.ensureRealtime();
  });

  window.addEventListener('focus', async () => {
    if (Sync.isLoggedIn()) {
      await Sync.processQueue();
      Sync.ensureRealtime();
    }
  });

  // ── SUPABASE SYNC (atomic, one-row-per-loop) ──
  // Every edit is a single-row INSERT/UPDATE. PostgreSQL serializes concurrent
  // writes to the same row, so two devices editing different loops never
  // conflict, and two devices editing the same loop serialize rather than
  // overwriting each other's whole state.
  //
  // Reliability features:
  //   - Offline edits queue in localStorage; drained on reconnect.
  //   - Queue uses exponential backoff (4s → 60s cap) and moves poison-pill
  //     entries to a dead-letter queue after MAX_QUEUE_ATTEMPTS so one bad
  //     write can't block every subsequent edit.
  //   - Realtime subscription monitors its own connection status; on drop it
  //     tears down and re-subscribes, then does a pullAll() to catch up.
  //   - visibilitychange / online handlers verify the channel and drain the
  //     queue whenever the user returns to the tab or comes back online.
  //   - TOKEN_REFRESHED updates realtime's JWT so the channel doesn't silently
  //     die after token rotation.
  //   - Incoming realtime updates compare updated_at vs local; a remote row
  //     older than our local copy doesn't clobber (prevents late echoes from
  //     overwriting newer state).
  const OFFLINE_QUEUE_KEY_BASE = 'open_loops_offline_queue';
  const DEAD_QUEUE_KEY_BASE = 'open_loops_dead_queue';
  const LEGACY_OFFLINE_QUEUE_KEY = OFFLINE_QUEUE_KEY_BASE;
  const LEGACY_DEAD_QUEUE_KEY = DEAD_QUEUE_KEY_BASE;
  const LEGACY_OFFLINE_QUEUE_QUARANTINE_KEY = `${OFFLINE_QUEUE_KEY_BASE}_legacy_unscoped`;
  const LEGACY_DEAD_QUEUE_QUARANTINE_KEY = `${DEAD_QUEUE_KEY_BASE}_legacy_unscoped`;

  const Sync = (() => {
    if (!window.supabase || !hasSupabaseCfg()) {
      return {
        init:          async () => { authReady = true; renderAuthGate(); },
        createLoop:    () => {},
        updateLoop:    () => {},
        deleteLoop:    () => {},
        undeleteLoop:  () => {},
        processQueue:  async () => ({ ok: true, pending: true }),
        retry:         async () => ({ ok: true, pending: true }),
        ensureRealtime: () => {},
        sendMagicLink: async () => { throw new Error(supabaseClientIssue() || 'Supabase sign-in is not ready.'); },
        signOut:       async () => {},
        isLoggedIn:    () => false
      };
    }

    const db = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });

    let currentUser = null;
    let channel     = null;
    let channelHealthy = false;
    let channelConnecting = false;
    let channelSeq = 0;
    let retryTimer  = null;
    let draining    = false;
    let deadQueueDirty = false;

    // Echo suppression: when we write a row, the realtime subscription will
    // echo it back. We don't want that echo to clobber a newer in-flight
    // local edit, so we track recently-written ids for a few seconds.
    const recentEchoes = new Map(); // id -> expiry timestamp (ms)
    function markEcho(id) { recentEchoes.set(id, Date.now() + 3000); }
    function isEcho(id) {
      const exp = recentEchoes.get(id);
      if (!exp) return false;
      if (Date.now() > exp) { recentEchoes.delete(id); return false; }
      return true;
    }

    function cleanUrl() {
      // Strip the magic-link auth fragments / query params after Supabase
      // has consumed them. URLSearchParams.has('code') is exact — substring
      // matching would also strip benign params like ?qrcode= or
      // ?discount_code=.
      let hasAuthParam = false;
      try { hasAuthParam = new URLSearchParams(location.search).has('code'); } catch(_) {}
      if (location.hash || hasAuthParam)
        history.replaceState({}, document.title, location.pathname);
    }

    function showSyncErrorBanner() {
      const banner = document.getElementById('sync-error-banner');
      if (banner) banner.style.display = 'flex';
    }
    function hideSyncErrorBanner() {
      const banner = document.getElementById('sync-error-banner');
      if (banner) banner.style.display = 'none';
    }

    function queueKey() {
      return scopedKey(OFFLINE_QUEUE_KEY_BASE);
    }

    function deadQueueKey() {
      return scopedKey(DEAD_QUEUE_KEY_BASE);
    }

    function quarantineLegacyQueueData() {
      let moved = false;
      try {
        const raw = localStorage.getItem(LEGACY_OFFLINE_QUEUE_KEY);
        if (raw && !localStorage.getItem(LEGACY_OFFLINE_QUEUE_QUARANTINE_KEY)) {
          localStorage.setItem(LEGACY_OFFLINE_QUEUE_QUARANTINE_KEY, raw);
        }
        if (raw) {
          localStorage.removeItem(LEGACY_OFFLINE_QUEUE_KEY);
          moved = true;
        }

        const dead = localStorage.getItem(LEGACY_DEAD_QUEUE_KEY);
        if (dead && !localStorage.getItem(LEGACY_DEAD_QUEUE_QUARANTINE_KEY)) {
          localStorage.setItem(LEGACY_DEAD_QUEUE_QUARANTINE_KEY, dead);
        }
        if (dead) {
          localStorage.removeItem(LEGACY_DEAD_QUEUE_KEY);
          moved = true;
        }
      } catch(e) {}
      return moved;
    }

    // ── Offline queue (localStorage) ──
    // Entry shape: { op: 'create'|'update'|'delete'|'undelete', id, payload?, ts }
    function loadQueue() {
      const key = queueKey();
      if (!key || !currentUser) return [];
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) return [];
        return parsed.filter(entry => !entry.ownerUserId || entry.ownerUserId === currentUser.id);
      } catch(e) { return []; }
    }
    function saveQueue(q) {
      const key = queueKey();
      if (!key) return;
      try {
        if (!q.length) localStorage.removeItem(key);
        else           localStorage.setItem(key, JSON.stringify(q));
      } catch(e) {}
    }
    function loadDeadQueue() {
      const key = deadQueueKey();
      if (!key || !currentUser) return [];
      try {
        const parsed = JSON.parse(localStorage.getItem(key) || '[]');
        if (!Array.isArray(parsed)) return [];
        return parsed.filter(entry => !entry.ownerUserId || entry.ownerUserId === currentUser.id);
      } catch(e) { return []; }
    }
    function settleSyncStatus() {
      if (deadQueueDirty && loadDeadQueue().length) {
        setSyncStatus('error', 'Still saving');
        showSyncErrorBanner();
        return { ok: false, dead: true };
      }
      if (loadQueue().length) {
        setSyncStatus(navigator.onLine ? 'syncing' : 'offline', navigator.onLine ? 'Saving…' : 'Saved offline');
        return { ok: true, pending: true };
      }
      setSyncStatus('synced', 'Synced');
      hideSyncErrorBanner();
      return { ok: true };
    }
    function enqueue(entry) {
      if (!currentUser) return;
      entry.ownerUserId = currentUser.id;
      const q = loadQueue();
      // Coalesce back-to-back updates to the same id so we don't pile up
      // hundreds of small UPDATEs from typing into an inline edit field.
      // During a drain, q[0] may already be in flight. Only coalesce into a
      // tail entry that is not the active network write.
      if (entry.op === 'update' && q.length && (!draining || q.length > 1)) {
        const last = q[q.length - 1];
        if (last.op === 'update' && last.id === entry.id) {
          last.payload = { ...last.payload, ...entry.payload };
          last.ts = entry.ts;
          saveQueue(q);
          setSyncStatus(navigator.onLine ? 'syncing' : 'offline', navigator.onLine ? 'Saving…' : 'Saved offline');
          return;
        }
      }
      q.push(entry);
      saveQueue(q);
      setSyncStatus(navigator.onLine ? 'syncing' : 'offline', navigator.onLine ? 'Saving…' : 'Saved offline');
    }

    // ── Map between local loop shape and DB row shape ──
    function loopToRow(loop) {
      return {
        id:            loop.id,
        user_id:       currentUser.id,
        raw_text:      loop.rawText || '',
        kind:          VALID_KINDS.has(loop.kind) ? loop.kind : null,
        status:        loop.status || 'active',
        prompt_answer: loop.promptAnswer || '',
        position:      typeof loop.position === 'number' ? loop.position : nowPosition(),
        created_at:    loop.createdAt || nowIso()
        // updated_at is set by the DB trigger.
      };
    }
    function rowToLoop(row) {
      return sanitize({
        id:           row.id,
        rawText:      row.raw_text || '',
        kind:         row.kind,
        status:       row.status,
        promptAnswer: row.prompt_answer || '',
        position:     row.position,
        createdAt:    row.created_at,
        updatedAt:    row.updated_at,
        completedAt:  row.completed_at
      });
    }
    function patchToRow(patch) {
      const out = {};
      if ('rawText'      in patch) out.raw_text      = patch.rawText;
      if ('kind'         in patch) out.kind          = VALID_KINDS.has(patch.kind) ? patch.kind : null;
      if ('status'       in patch) out.status        = patch.status;
      if ('promptAnswer' in patch) out.prompt_answer = patch.promptAnswer;
      if ('position'     in patch) out.position      = patch.position;
      if ('deleted_at'   in patch) out.deleted_at    = patch.deleted_at;
      if ('completedAt'  in patch) out.completed_at  = patch.completedAt;
      if ('completed_at' in patch) out.completed_at  = patch.completed_at;
      return out;
    }

    // ── Single-row network ops ──
    async function netCreate(loop) {
      markEcho(loop.id);
      const { error } = await db.from('loops').upsert(loopToRow(loop), { onConflict: 'id' });
      if (error) throw error;
    }
    async function netUpdate(id, patch) {
      const row = patchToRow(patch);
      if (!Object.keys(row).length) return;
      markEcho(id);
      const { data: updated, error } = await db.from('loops').update(row).eq('id', id).select('id').maybeSingle();
      if (error) throw error;
      if (!updated) throw new Error('No matching loop was updated for this signed-in user.');
    }
    async function netDelete(id) {
      markEcho(id);
      const { data: updated, error } = await db.from('loops')
        .update({ deleted_at: nowIso() })
        .eq('id', id)
        .select('id')
        .maybeSingle();
      if (error) throw error;
      if (!updated) throw new Error('No matching loop was deleted for this signed-in user.');
    }
    async function netUndelete(id) {
      markEcho(id);
      const { data: updated, error } = await db.from('loops')
        .update({ deleted_at: null })
        .eq('id', id)
        .select('id')
        .maybeSingle();
      if (error) throw error;
      if (!updated) throw new Error('No matching loop was restored for this signed-in user.');
    }

    // Max attempts per queue entry before moving it to a dead-letter queue.
    // Prevents a single poison-pill entry from blocking every edit behind it.
    const MAX_QUEUE_ATTEMPTS = 5;

    function moveToDeadQueue(entry, error) {
      const key = deadQueueKey();
      if (!key) return;
      try {
        const dead = JSON.parse(localStorage.getItem(key) || '[]');
        dead.push({
          ...entry,
          lastError: String(error && error.message ? error.message : error),
          droppedAt: Date.now()
        });
        // Keep the last 50 dead entries — enough for debugging, not enough to
        // bloat localStorage if something is spamming failures.
        localStorage.setItem(key, JSON.stringify(dead.slice(-50)));
      } catch(_) {}
    }

    async function processQueue() {
      if (!currentUser) return { ok: true, pending: true };
      if (draining) return { ok: true, pending: loadQueue().length > 0 };
      if (!loadQueue().length) return settleSyncStatus();
      draining = true;
      let chainAfterRun = true;
      setSyncStatus(navigator.onLine ? 'syncing' : 'offline', navigator.onLine ? 'Saving…' : 'Saved offline');
      try {
        while (true) {
          if (!navigator.onLine) {
            setSyncStatus('offline', 'Saved offline');
            scheduleRetry(1);
            chainAfterRun = false;
            return { ok: true, pending: true };
          }
          const q = loadQueue();
          if (!q.length) {
            return settleSyncStatus();
          }
          const entry = q[0];
          if (entry.ownerUserId && entry.ownerUserId !== currentUser.id) {
            chainAfterRun = false;
            throw new Error('Queued write belongs to a different signed-in user.');
          }
          entry.attempts = (entry.attempts || 0) + 1;
          try {
            if      (entry.op === 'create')   await netCreate(entry.payload);
            else if (entry.op === 'update')   await netUpdate(entry.id, entry.payload);
            else if (entry.op === 'delete')   await netDelete(entry.id);
            else if (entry.op === 'undelete') await netUndelete(entry.id);
            // Success — pop the head.
            const latest = loadQueue();
            latest.shift();
            saveQueue(latest);
          } catch(e) {
            console.error(`Queue drain error (attempt ${entry.attempts}):`, e, entry);
            chainAfterRun = false;

            // Poison-pill: after MAX_QUEUE_ATTEMPTS, move this entry to the
            // dead-letter queue so it stops blocking everything behind it.
            if (entry.attempts >= MAX_QUEUE_ATTEMPTS) {
              const latest = loadQueue();
              const skipped = latest.shift();
              saveQueue(latest);
              moveToDeadQueue(skipped, e);
              deadQueueDirty = true;
              console.warn('[open-loops] Moved poison-pill entry to dead queue:', skipped);
              // Keep draining — the next entry might succeed.
              continue;
            }

            // Persist the bumped attempt counter so it survives a reload.
            const latest = loadQueue();
            if (latest[0] && latest[0].id === entry.id && latest[0].op === entry.op) {
              latest[0] = entry;
              saveQueue(latest);
            }
            setSyncStatus('error', 'Still saving');
            showSyncErrorBanner();
            scheduleRetry(entry.attempts);
            return { ok: false, error: e };
          }
        }
      } finally {
        const shouldChain = chainAfterRun && currentUser && navigator.onLine && loadQueue().length;
        draining = false;
        if (shouldChain) {
          // More work showed up while we were draining — chain another pass
          // without awaiting so we don't deepen the call stack.
          Promise.resolve().then(processQueue);
        }
      }
    }

    // Exponential backoff: 4s, 8s, 16s, 32s, capped at 60s. Prevents
    // hammering Supabase when the server is flaky or rate-limiting us.
    function scheduleRetry(attempts) {
      if (retryTimer) return;
      const n = Math.max(1, attempts || 1);
      const delay = Math.min(60000, 4000 * Math.pow(2, n - 1));
      retryTimer = setTimeout(async () => {
        retryTimer = null;
        if (currentUser && navigator.onLine && loadQueue().length) {
          await processQueue();
        }
      }, delay);
    }

    function applyPendingQueueOverlay(remoteLoops) {
      const pending = loadQueue();
      if (!pending.length) return remoteLoops;

      const byId = new Map(remoteLoops.map(loop => [loop.id, loop]));
      const localById = new Map(data.loops.map(loop => [loop.id, loop]));

      for (const entry of pending) {
        if (entry.ownerUserId && entry.ownerUserId !== currentUser.id) continue;

        if (entry.op === 'create') {
          const source = localById.get(entry.id) || entry.payload;
          if (source) byId.set(entry.id, sanitize(source));
        } else if (entry.op === 'update') {
          const base = byId.get(entry.id) || localById.get(entry.id);
          if (base) {
